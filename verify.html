<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Debug - GSSS Shilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 20px;
            color: #0a1628;
            margin-bottom: 10px;
        }
        .sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .scan-area {
            border: 2px dashed #c9972b;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fef8ed;
        }
        .scan-area:hover {
            background: #fdf0d5;
        }
        .scan-area .icon {
            font-size: 48px;
            color: #c9972b;
            margin-bottom: 10px;
        }
        .scan-area p {
            color: #666;
            font-size: 14px;
        }
        #fileInput {
            display: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            background: #f8f6f0;
            border: 1px solid #e8e4dc;
            display: none;
        }
        .result-box .label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-box .value {
            font-size: 16px;
            font-weight: 600;
            color: #0a1628;
            word-break: break-all;
            margin-top: 4px;
            padding: 8px;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #e8e4dc;
        }
        .result-box .value.extracted {
            color: #c9972b;
            border-color: #c9972b;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }
        .badge.success {
            background: #e6f4ea;
            color: #0f9d58;
        }
        .badge.error {
            background: #fce8e6;
            color: #d93025;
        }
        .badge.info {
            background: #e6f0fa;
            color: #1a5a8a;
        }
        .debug-info {
            margin-top: 12px;
            font-size: 12px;
            color: #999;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: #c9972b;
            color: #fff;
        }
        .btn-primary:hover {
            background: #b8860b;
        }
        .btn-secondary {
            background: #e8e4dc;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d5d0c8;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .flex {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e8e4dc;
            border-top-color: #c9972b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 QR Code Debug Tool</h1>
        <div class="sub">Scan a QR code to see what data is actually being read</div>

        <div class="scan-area" onclick="document.getElementById('fileInput').click()">
            <div class="icon"><i class="fas fa-qrcode"></i></div>
            <p>Click to upload an image with QR code</p>
            <p style="font-size:12px;color:#999;margin-top:4px;">JPG, PNG, etc.</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="scanQR(event)">

        <div class="flex mt-10">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-upload"></i> Upload Image
            </button>
            <button class="btn btn-secondary" onclick="openCamera()">
                <i class="fas fa-camera"></i> Open Camera
            </button>
            <button class="btn btn-secondary" onclick="clearResult()">
                <i class="fas fa-eraser"></i> Clear
            </button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="label">📋 Raw QR Data</div>
            <div class="value" id="rawData">-</div>
            
            <div style="margin-top:12px;">
                <div class="label">🎯 Extracted Code</div>
                <div class="value extracted" id="extractedData">-</div>
            </div>

            <div id="statusBadge"></div>

            <div class="debug-info" id="debugInfo">
                <strong>Debug Info:</strong><br>
                <span id="debugText">Waiting for scan...</span>
            </div>
        </div>
    </div>

    <!-- Camera Modal -->
    <div class="camera-modal" id="cameraModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:99999;align-items:center;justify-content:center;flex-direction:column;padding:20px;">
        <video id="cameraVideo" autoplay playsinline style="max-width:100%;max-height:60vh;border-radius:16px;border:2px solid #c9972b;background:#000;"></video>
        <div style="display:flex;gap:12px;margin-top:18px;">
            <button class="btn btn-primary" onclick="captureAndScan()"><i class="fas fa-camera"></i> Scan QR</button>
            <button class="btn btn-secondary" onclick="closeCamera()"><i class="fas fa-times"></i> Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        let cameraStream = null;

        function clearResult() {
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('rawData').textContent = '-';
            document.getElementById('extractedData').textContent = '-';
            document.getElementById('statusBadge').innerHTML = '';
            document.getElementById('debugText').textContent = 'Waiting for scan...';
        }

        function showResult(raw, extracted, status) {
            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            
            document.getElementById('rawData').textContent = raw || 'No data';
            document.getElementById('extractedData').textContent = extracted || 'No data';
            
            let badgeHtml = '';
            if (status === 'bonafide') {
                badgeHtml = '<span class="badge success">✅ Bonafide Code Detected</span>';
            } else if (status === 'marksheet') {
                badgeHtml = '<span class="badge success">✅ Marksheet ID Detected</span>';
            } else if (status === 'error') {
                badgeHtml = '<span class="badge error">❌ Invalid Data</span>';
            } else {
                badgeHtml = '<span class="badge info">⚠️ Unknown Format</span>';
            }
            document.getElementById('statusBadge').innerHTML = badgeHtml;
            
            document.getElementById('debugText').textContent = 
                `Raw length: ${raw ? raw.length : 0} characters | ` +
                `Extracted: ${extracted || 'None'} | ` +
                `Timestamp: ${new Date().toLocaleTimeString()}`;
        }

        function isValidBonafideCode(code) {
            return /^[A-Za-z0-9]{12}$/.test(String(code).trim());
        }

        function isValidStudentId(id) {
            return /^[A-Z]{2}[0-9]{2}[A-Z][0-9]{3}$/.test(String(id).toUpperCase().trim());
        }

        function extractCodeFromQR(qrData) {
            if (!qrData) return { extracted: null, type: 'error' };
            
            let str = String(qrData).trim();
            console.log('Raw QR Data:', str);
            
            // Try URL parameters
            try {
                const url = new URL(str);
                const codeParam = url.searchParams.get('code');
                if (codeParam) {
                    const decoded = decodeURIComponent(codeParam).trim();
                    if (isValidBonafideCode(decoded)) {
                        return { extracted: decoded.toUpperCase(), type: 'bonafide' };
                    }
                }
                const dataParam = url.searchParams.get('data') || url.searchParams.get('id');
                if (dataParam) {
                    const decoded = decodeURIComponent(dataParam).trim();
                    if (isValidStudentId(decoded)) {
                        return { extracted: decoded.toUpperCase(), type: 'marksheet' };
                    }
                }
            } catch(e) {
                console.log('Not a valid URL');
            }

            // Try manual query string
            const codeMatch = str.match(/[?&](code|data|id)=([^&]+)/);
            if (codeMatch) {
                const value = decodeURIComponent(codeMatch[2]).trim();
                if (isValidBonafideCode(value)) {
                    return { extracted: value.toUpperCase(), type: 'bonafide' };
                }
                if (isValidStudentId(value)) {
                    return { extracted: value.toUpperCase(), type: 'marksheet' };
                }
            }

            // Try 12-character code
            const codeMatches = str.match(/\b[A-Za-z0-9]{12}\b/g);
            if (codeMatches) {
                for (const match of codeMatches) {
                    const code = match.toUpperCase();
                    if (isValidBonafideCode(code)) {
                        return { extracted: code, type: 'bonafide' };
                    }
                }
            }

            // Try Student ID pattern
            const studentMatches = str.match(/\b[A-Z]{2}[0-9]{2}[A-Z][0-9]{3}\b/i);
            if (studentMatches) {
                const id = studentMatches[0].toUpperCase();
                if (isValidStudentId(id)) {
                    return { extracted: id, type: 'marksheet' };
                }
            }

            // Try any 12 characters
            const anyCode = str.match(/[A-Za-z0-9]{12}/);
            if (anyCode) {
                const code = anyCode[0].toUpperCase();
                if (isValidBonafideCode(code)) {
                    return { extracted: code, type: 'bonafide' };
                }
            }

            return { extracted: null, type: 'error' };
        }

        function processQRData(qrData) {
            const result = extractCodeFromQR(qrData);
            showResult(qrData, result.extracted || 'Not found', result.type);
            
            if (result.extracted) {
                console.log('✅ Extracted:', result.extracted, 'Type:', result.type);
            } else {
                console.log('❌ Could not extract valid code');
            }
        }

        // ================================================================
        // IMAGE SCAN
        // ================================================================
        function scanQR(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please upload a valid image file.');
                return;
            }

            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('debugText').textContent = 'Scanning image...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Try multiple resolutions
                    const resolutions = [
                        { scale: 1, label: 'Original' },
                        { scale: 0.5, label: 'Half' },
                        { scale: 2, label: 'Double' }
                    ];
                    
                    let found = false;
                    
                    for (const res of resolutions) {
                        if (found) break;
                        
                        let width = Math.round(img.width * res.scale);
                        let height = Math.round(img.height * res.scale);
                        
                        const maxDim = 2000;
                        if (width > maxDim || height > maxDim) {
                            const ratio = Math.min(maxDim / width, maxDim / height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }
                        
                        if (width < 100 || height < 100) continue;
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        try {
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            
                            let code = jsQR(imageData.data, imageData.width, imageData.height, {
                                inversionAttempts: "dontInvert",
                            });
                            
                            if (!code || !code.data) {
                                code = jsQR(imageData.data, imageData.width, imageData.height, {
                                    inversionAttempts: "attemptBoth",
                                });
                            }
                            
                            if (code && code.data) {
                                console.log(`✅ QR found at ${res.label} resolution:`, code.data);
                                found = true;
                                processQRData(code.data);
                                break;
                            }
                        } catch (err) {
                            console.log(`Error at ${res.label}:`, err);
                        }
                    }
                    
                    if (!found) {
                        document.getElementById('resultBox').style.display = 'block';
                        showResult('No QR found', 'Not detected', 'error');
                        document.getElementById('debugText').textContent = 'No QR code found. Try a clearer image.';
                    }
                };
                img.onerror = function() {
                    alert('Could not load image.');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                alert('Could not read file.');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // ================================================================
        // CAMERA
        // ================================================================
        async function openCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                document.getElementById('cameraVideo').srcObject = cameraStream;
                document.getElementById('cameraModal').style.display = 'flex';
            } catch(e) {
                alert('Camera access denied. Please use image upload.');
            }
        }

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            document.getElementById('cameraModal').style.display = 'none';
        }

        function captureAndScan() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });
                
                if (!code || !code.data) {
                    code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                }
                
                if (code && code.data) {
                    closeCamera();
                    processQRData(code.data);
                } else {
                    alert('QR code not detected. Try better lighting.');
                }
            } catch(err) {
                alert('Error scanning. Try again.');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeCamera();
        });
    </script>

</body>
</html>
