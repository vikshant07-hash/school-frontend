<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Result - GSSS Shilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #0d1b2a;
            --primary-light: #1b3a5c;
            --secondary: #2d5a8a;
            --accent: #e8b84b;
            --accent-light: #f5d78a;
            --accent-dark: #c9972b;
            --white: #ffffff;
            --off-white: #f0f4f8;
            --gray-light: #e2e8f0;
            --gray: #94a3b8;
            --text: #1a2332;
            --text-light: #5a6a7e;
            --success: #16a34a;
            --success-light: #dcfce7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --shadow-sm: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 40px rgba(0,0,0,0.10);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #fef8ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verification-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-width: 520px;
            width: 100%;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--gray-light);
        }

        /* HEADER */
        .verify-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        .school-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            padding: 3px;
            background: var(--white);
            margin: 0 auto 10px;
            display: block;
            object-fit: contain;
        }
        .school-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .school-tagline {
            color: rgba(255,255,255,0.6);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* BODY */
        .verify-body {
            padding: 25px;
        }

        /* SCANNER OPTIONS */
        .scanner-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        .scan-option {
            background: var(--off-white);
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            padding: 15px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .scan-option:hover {
            border-color: var(--accent);
            background: #fef8ed;
            transform: translateY(-3px);
            box-shadow: var(--shadow-sm);
        }
        .scan-icon {
            font-size: 28px;
            color: var(--accent-dark);
            margin-bottom: 8px;
        }
        .scan-option h4 {
            font-size: 12px;
            color: var(--text);
            margin-bottom: 2px;
        }
        .scan-option p {
            font-size: 9px;
            color: var(--gray);
        }

        /* CAMERA MODAL */
        .camera-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .camera-modal.active { display: flex; }
        .camera-modal video {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 10px;
            border: 3px solid var(--accent);
        }
        .camera-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .camera-controls button {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .btn-scan { background: var(--accent); color: var(--white); }
        .btn-close-camera { background: var(--danger); color: var(--white); }

        /* ICON */
        .verify-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            animation: pulse 2s infinite;
        }
        .verify-icon.verified { background: var(--success-light); color: var(--success); border: 2px solid #bbf7d0; }
        .verify-icon.invalid { background: var(--danger-light); color: var(--danger); border: 2px solid #fecaca; animation: shake 0.5s ease; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

        .verify-title { font-size: 20px; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 5px; }
        .verify-subtitle { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 20px; }

        /* TABLE */
        .student-details-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            border: 2px solid var(--primary);
            border-radius: 10px;
            overflow: hidden;
        }
        .student-details-table td {
            padding: 10px 12px;
            border: 1px solid var(--gray-light);
            font-size: 12px;
            text-align: left;
        }
        .student-details-table td:first-child {
            font-weight: 700;
            background: #fef8ed;
            color: var(--primary);
            width: 35%;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        .student-details-table td:last-child {
            font-weight: 500;
            color: var(--text);
        }

        .confirmation-box {
            background: var(--success-light);
            border: 1px solid #bbf7d0;
            border-left: 4px solid var(--success);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12px;
            color: var(--success);
        }
        .confirmation-box i { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
        .confirmation-box strong { display: block; font-size: 13px; margin-bottom: 2px; }
        .confirmation-box p { font-size: 11px; color: #166534; line-height: 1.5; }

        .invalid-box {
            background: var(--danger-light);
            border: 1px solid #fecaca;
            border-left: 4px solid var(--danger);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12px;
            color: var(--danger);
        }
        .invalid-box i { font-size: 20px; flex-shrink: 0; margin-top: 2px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: var(--white); }
        .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,151,43,0.3); }
        .btn-secondary { background: var(--off-white); color: var(--text-light); border: 1px solid var(--gray-light); }
        .btn-secondary:hover { background: var(--gray-light); color: var(--text); }

        .verify-footer {
            padding: 15px 25px;
            text-align: center;
            border-top: 1px solid var(--gray-light);
            background: var(--off-white);
            font-size: 9px;
            color: var(--gray);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .verification-container { margin: 0 5px; }
            .verify-body { padding: 20px 15px; }
            .scanner-options { grid-template-columns: 1fr; }
            .student-details-table td { padding: 8px; font-size: 11px; }
            .student-details-table td:first-child { font-size: 9px; }
        }

        /* PRINT STYLES */
        @media print {
            body { background: #fff; padding: 0; }
            .verification-container { box-shadow: none; border: none; max-width: 100%; }
            .scanner-options, .camera-modal, .btn, .verify-footer { display: none !important; }
            .verify-header { background: #fff; border-bottom: 3px solid var(--accent); }
            .school-name { color: var(--primary); }
            .school-tagline { color: var(--gray); }
            .verify-body { padding: 0; }
            .student-details-table { border: 2px solid var(--primary); }
            .confirmation-box { border: 1px solid #bbf7d0; }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <!-- HEADER -->
        <div class="verify-header">
            <img src="logo.png" alt="School Logo" class="school-logo" onerror="this.style.display='none'">
            <div class="school-name">Govt. Sr. Sec. School Shilla</div>
            <div class="school-tagline">Shilla • District Solan • Himachal Pradesh</div>
        </div>

        <!-- BODY -->
        <div class="verify-body">
            <!-- SCANNER OPTIONS -->
            <div class="scanner-options" id="scannerOptions">
                <div class="scan-option" onclick="openCamera()">
                    <div class="scan-icon"><i class="fas fa-camera"></i></div>
                    <h4>Camera</h4>
                    <p>Scan QR live</p>
                </div>
                <div class="scan-option" onclick="document.getElementById('imageInput').click()">
                    <div class="scan-icon"><i class="fas fa-image"></i></div>
                    <h4>Image</h4>
                    <p>Upload QR photo</p>
                </div>
                <div class="scan-option" onclick="document.getElementById('pdfInput').click()">
                    <div class="scan-icon"><i class="fas fa-file-pdf"></i></div>
                    <h4>PDF</h4>
                    <p>Upload document</p>
                </div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="scanImage(event)">
            <input type="file" id="pdfInput" accept=".pdf" style="display:none" onchange="scanPDF(event)">

            <!-- VERIFICATION RESULT -->
            <div id="verificationResult">
                <div style="text-align:center;padding:30px;">
                    <i class="fas fa-qrcode" style="font-size:40px;color:var(--accent);"></i>
                    <p style="margin-top:10px;color:var(--text-light);">Scan QR code to verify document</p>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="verify-footer">
            GSSS Shilla - Official Document Verification System
        </div>
    </div>

    <!-- CAMERA MODAL -->
    <div class="camera-modal" id="cameraModal">
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="btn-scan" onclick="captureAndScan()"><i class="fas fa-camera"></i> Scan QR</button>
            <button class="btn-close-camera" onclick="closeCamera()"><i class="fas fa-times"></i> Close</button>
        </div>
    </div>

    <script>
        let cameraStream = null;
        
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.addEventListener('DOMContentLoaded', function() {
            // Check URL for data (mobile scanner)
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (dataParam) {
                processVerification(dataParam);
            }
        });

        // ============ CAMERA ============
        async function openCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('cameraVideo');
                video.srcObject = cameraStream;
                document.getElementById('cameraModal').classList.add('active');
            } catch(e) {
                alert('Camera access denied. Please use Image or PDF upload option.');
            }
        }

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            document.getElementById('cameraModal').classList.remove('active');
        }

        function captureAndScan() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code && code.data) {
                closeCamera();
                extractAndVerify(code.data);
            } else {
                alert('QR code not detected. Please try again.');
            }
        }

        // ============ IMAGE UPLOAD ============
        function scanImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code && code.data) {
                        extractAndVerify(code.data);
                    } else {
                        showInvalid('Could not detect QR code in the image. Please try a clearer photo.');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============ PDF UPLOAD ============
        async function scanPDF(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code && code.data) {
                        extractAndVerify(code.data);
                        return;
                    }
                }
                
                showInvalid('No QR code found in the PDF document.');
            } catch(e) {
                showInvalid('Could not read PDF file. Please try again.');
            }
        }

        // ============ EXTRACT & VERIFY ============
        function extractAndVerify(qrData) {
            try {
                if (qrData.includes('data=')) {
                    const url = new URL(qrData);
                    const dataParam = url.searchParams.get('data');
                    if (dataParam) {
                        processVerification(dataParam);
                        return;
                    }
                }
                const data = JSON.parse(qrData);
                if (data.student_id && data.name) {
                    showVerified(data);
                    return;
                }
                showInvalid('QR code does not contain valid verification data.');
            } catch(e) {
                showInvalid('Could not read QR code data.');
            }
        }

        function processVerification(dataParam) {
            try {
                const data = JSON.parse(decodeURIComponent(dataParam));
                if (!data.student_id || !data.name) {
                    showInvalid('Invalid verification data. This document may be tampered.');
                    return;
                }
                showVerified(data);
            } catch(e) {
                showInvalid('Invalid verification data format.');
            }
        }

        // ============ SHOW VERIFIED ============
        function showVerified(data) {
            const resultDiv = document.getElementById('verificationResult');
            document.getElementById('scannerOptions').style.display = 'none';
            
            resultDiv.innerHTML = `
                <div class="verify-icon verified"><i class="fas fa-check-circle"></i></div>
                <h2 class="verify-title">Document Verified</h2>
                <p class="verify-subtitle">This is an authentic document issued by GSSS Shilla</p>
                
                <table class="student-details-table">
                    <tr><td>Student ID</td><td>${esc(data.student_id)}</td></tr>
                    <tr><td>Student Name</td><td>${esc(data.name)}</td></tr>
                    ${data.apaar_id ? `<tr><td>APAAR ID</td><td>${esc(data.apaar_id)}</td></tr>` : ''}
                    ${data.father_name ? `<tr><td>Father's Name</td><td>${esc(data.father_name)}</td></tr>` : ''}
                    ${data.mother_name ? `<tr><td>Mother's Name</td><td>${esc(data.mother_name)}</td></tr>` : ''}
                    ${data.dob ? `<tr><td>Date of Birth</td><td>${fmtDate(data.dob)}</td></tr>` : ''}
                    ${data.session ? `<tr><td>Session</td><td>${esc(data.session)}</td></tr>` : ''}
                    ${data.class ? `<tr><td>Class</td><td>${esc(data.class)}${data.section ? ' - ' + esc(data.section) : ''}</td></tr>` : ''}
                    ${data.exam_roll_no ? `<tr><td>Exam Roll No</td><td>${esc(data.exam_roll_no)}</td></tr>` : ''}
                </table>
                
                <div class="confirmation-box">
                    <i class="fas fa-shield-alt"></i>
                    <div>
                        <strong>Confirmation</strong>
                        <p>This marksheet belongs to the student mentioned above. The details have been verified from the school's official records.</p>
                    </div>
                </div>
                
                <div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print Verification</button>
                    <button class="btn btn-secondary" onclick="resetVerification()"><i class="fas fa-redo"></i> Verify Another</button>
                </div>
            `;
        }

        // ============ SHOW INVALID ============
        function showInvalid(msg) {
            const resultDiv = document.getElementById('verificationResult');
            resultDiv.innerHTML = `
                <div class="verify-icon invalid"><i class="fas fa-times-circle"></i></div>
                <h2 class="verify-title" style="color:#dc2626;">Verification Failed</h2>
                <p class="verify-subtitle">This document could not be verified</p>
                <div class="invalid-box"><i class="fas fa-exclamation-triangle"></i><div>${msg}</div></div>
                <p style="font-size:11px;color:var(--gray);text-align:center;margin-top:10px;">If you believe this is an error, please contact the school administration.</p>
                <div style="text-align:center;"><button class="btn btn-secondary" onclick="resetVerification()"><i class="fas fa-redo"></i> Try Again</button></div>
            `;
        }

        function resetVerification() {
            document.getElementById('verificationResult').innerHTML = `
                <div style="text-align:center;padding:30px;"><i class="fas fa-qrcode" style="font-size:40px;color:var(--accent);"></i><p style="margin-top:10px;color:var(--text-light);">Scan QR code to verify document</p></div>`;
            document.getElementById('scannerOptions').style.display = 'grid';
            document.getElementById('imageInput').value = '';
            document.getElementById('pdfInput').value = '';
        }

        function esc(t) { if(!t) return ''; const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }
        function fmtDate(d) { if(!d) return '-'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric'}); }
    </script>
</body>
</html>
