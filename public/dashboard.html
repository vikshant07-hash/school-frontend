<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Result Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0a1628;
            --primary-light: #1a3a6b;
            --gold: #d4a843;
            --gold-hover: #c49a38;
            --bg: #f0f4f8;
            --white: #ffffff;
            --text: #1a2332;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            flex-shrink: 0;
        }
        .navbar .brand img { height: 36px; width: auto; border-radius: 6px; background: white; padding: 3px; }
        .navbar .brand .name { font-size: 16px; font-weight: 800; color: white; }
        .navbar .brand .name span { color: var(--gold); }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .navbar .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .navbar .nav-links a.active { background: var(--gold); color: var(--primary); }
        .navbar .nav-links a i { margin-right: 4px; }
        .navbar .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header h1 i { color: var(--gold); }
        .page-header .date {
            color: var(--text-light);
            font-size: 13px;
            background: var(--white);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            padding: 18px 20px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .stat-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .stat-card .icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-card .icon.green { background: #d1fae5; color: #059669; }
        .stat-card .icon.orange { background: #fef3c7; color: #d97706; }
        .stat-card .icon.purple { background: #ede9fe; color: #7c3aed; }
        .stat-card .info h3 { font-size: 24px; font-weight: 700; }
        .stat-card .info p { font-size: 12px; color: var(--text-light); font-weight: 500; }

        .quick-actions {
            background: var(--white);
            padding: 20px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .quick-actions .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quick-actions .section-title i { color: var(--gold); }
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .action-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .action-card:hover {
            background: #fef9e7;
            border-color: var(--gold);
            transform: translateX(3px);
        }
        .action-card i { font-size: 20px; color: var(--gold); width: 28px; text-align: center; }
        .action-card span { font-weight: 600; font-size: 13px; }

        .recent-activity {
            background: var(--white);
            padding: 20px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .recent-activity .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .recent-activity .section-title i { color: var(--gold); }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fef9e7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 16px;
            flex-shrink: 0;
        }
        .activity-item .info .name { font-weight: 600; font-size: 14px; }
        .activity-item .info .meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.pending { background: #fef3c7; color: #d97706; }
        .status-badge.uploaded { background: #dbeafe; color: #2563eb; }
        .status-badge.published { background: #d1fae5; color: #059669; }
        .class-badge {
            display: inline-block;
            background: #f1f5f9;
            padding: 1px 8px;
            border-radius: 50px;
            font-size: 11px;
            color: #475569;
        }
        .no-activity {
            color: var(--text-light);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .no-activity i { display: block; font-size: 32px; margin-bottom: 8px; color: #d1d5db; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: #ef4444; }
        .toast.success { background: #10b981; }

        @media (max-width: 768px) {
            .navbar { padding: 0 12px; height: 54px; }
            .navbar .brand .name { font-size: 14px; }
            .navbar .brand img { height: 30px; }
            .navbar .nav-links {
                display: none;
                position: absolute;
                top: 54px;
                left: 0;
                right: 0;
                background: var(--primary);
                flex-direction: column;
                padding: 12px 16px;
                gap: 2px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                border-radius: 0 0 var(--radius) var(--radius);
            }
            .navbar .nav-links.open { display: flex; }
            .navbar .nav-links a { padding: 10px 14px; width: 100%; }
            .navbar .menu-toggle { display: block; }
            .container { padding: 12px 12px; }
            .page-header { flex-direction: column; align-items: stretch; gap: 8px; }
            .page-header h1 { font-size: 18px; }
            .page-header .date { text-align: center; font-size: 12px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 14px 16px; gap: 10px; }
            .stat-card .icon { width: 36px; height: 36px; font-size: 14px; }
            .stat-card .info h3 { font-size: 18px; }
            .stat-card .info p { font-size: 11px; }
            .quick-actions { padding: 16px; }
            .action-grid { grid-template-columns: 1fr; }
            .action-card { padding: 10px 14px; }
            .recent-activity { padding: 16px; }
            .toast { bottom: 12px; right: 12px; left: 12px; max-width: 100%; }
        }
        @media (max-width: 480px) {
            .navbar .brand .name { font-size: 12px; }
            .navbar .brand img { height: 26px; }
            .page-header h1 { font-size: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 12px; gap: 8px; }
            .stat-card .icon { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; }
            .stat-card .info h3 { font-size: 16px; }
            .stat-card .info p { font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="../index.html" class="brand">
            <img src="../logo(1).png" alt="Logo" />
            <div class="name">GSSS<span> SHILLA</span></div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="upload-result.html"><i class="fas fa-upload"></i> Upload</a></li>
            <li><a href="publish-results.html"><i class="fas fa-check-double"></i> Publish</a></li>
        </ul>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
            <span class="date" id="currentDate"></span>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="icon blue"><i class="fas fa-users"></i></div>
                <div class="info">
                    <h3 id="totalStudents">0</h3>
                    <p>Total Students</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon green"><i class="fas fa-check-circle"></i></div>
                <div class="info">
                    <h3 id="publishedResults">0</h3>
                    <p>Published Results</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon orange"><i class="fas fa-clock"></i></div>
                <div class="info">
                    <h3 id="uploadedResults">0</h3>
                    <p>Uploaded (Pending)</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon purple"><i class="fas fa-hourglass-half"></i></div>
                <div class="info">
                    <h3 id="pendingStudents">0</h3>
                    <p>Pending Results</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <div class="section-title">
                <i class="fas fa-bolt"></i> Quick Actions
            </div>
            <div class="action-grid">
                <a href="students.html" class="action-card">
                    <i class="fas fa-user-plus"></i>
                    <span>Add Student</span>
                </a>
                <a href="upload-result.html" class="action-card">
                    <i class="fas fa-file-pdf"></i>
                    <span>Upload Marksheet</span>
                </a>
                <a href="publish-results.html" class="action-card">
                    <i class="fas fa-check-double"></i>
                    <span>Publish Results</span>
                </a>
            </div>
        </div>

        <!-- Recent Students -->
        <div class="recent-activity">
            <div class="section-title">
                <i class="fas fa-history"></i> Recent Students
            </div>
            <div id="activityList">
                <p class="no-activity"><i class="fas fa-spinner fa-spin"></i> Loading...</p>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://gsssshilla.onrender.com/api/result';

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }
        document.querySelectorAll('#navLinks a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('open');
            });
        });

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        async function fetchStats() {
            try {
                const response = await fetch(`${API_URL}/students`);
                const result = await response.json();
                if (result.success) {
                    const students = result.data || [];
                    let published = 0, uploaded = 0, pending = 0;
                    students.forEach(s => {
                        if (s.result_status === 'published') published++;
                        else if (s.result_status === 'uploaded') uploaded++;
                        else pending++;
                    });
                    document.getElementById('totalStudents').textContent = students.length;
                    document.getElementById('publishedResults').textContent = published;
                    document.getElementById('uploadedResults').textContent = uploaded;
                    document.getElementById('pendingStudents').textContent = pending;

                    const list = document.getElementById('activityList');
                    if (students.length > 0) {
                        const recent = students.slice(0, 5);
                        list.innerHTML = recent.map(s => `
                            <div class="activity-item">
                                <div class="avatar"><i class="fas fa-user"></i></div>
                                <div class="info">
                                    <div class="name">${s.student_name}</div>
                                    <div class="meta">
                                        <span class="status-badge ${s.result_status || 'pending'}">${s.result_status || 'pending'}</span>
                                        <span class="class-badge">Class ${s.class}</span>
                                        <span>ID: ${s.student_id}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        list.innerHTML = `<p class="no-activity"><i class="fas fa-inbox"></i> No students added yet</p>`;
                    }
                }
            } catch (error) {
                console.error('Error fetching stats:', error);
                document.getElementById('activityList').innerHTML = `<p class="no-activity"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> Error loading data</p>`;
                showToast('Failed to load dashboard data', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchStats);
        setInterval(fetchStats, 60000);
    </script>
</body>
</html>
