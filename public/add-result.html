<!DOCTYPE html>
<html>
<head>
    <title>Result Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: #1a3a6b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .card h2 {
            margin-bottom: 16px;
            color: #1a3a6b;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat .num {
            font-size: 2rem;
            font-weight: 700;
            color: #1a3a6b;
        }
        .stat .label {
            color: #64748b;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 10px;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success {
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-warning {
            background: #fef3c7;
            color: #d97706;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            display: none;
            z-index: 999;
        }
        .toast-success {
            background: #22c55e;
        }
        .toast-error {
            background: #ef4444;
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>📊 Result Management</h1>
            <span>🟢 No Auth Required</span>
        </div>

        <!-- Stats -->
        <div class="stats" id="stats">
            <div class="stat">
                <div class="num" id="totalStudents">0</div>
                <div class="label">Total Students</div>
            </div>
            <div class="stat">
                <div class="num" id="publishedResults">0</div>
                <div class="label">Published Results</div>
            </div>
            <div class="stat">
                <div class="num" id="unpublishedResults">0</div>
                <div class="label">Unpublished Results</div>
            </div>
            <div class="stat">
                <div class="num" id="totalResults">0</div>
                <div class="label">Total Results</div>
            </div>
        </div>

        <!-- Add Student -->
        <div class="card">
            <h2>👨‍🎓 Add Student</h2>
            <form id="studentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Student ID *</label>
                        <input type="text" id="sId" placeholder="S001" required>
                    </div>
                    <div class="form-group">
                        <label>APAAR ID *</label>
                        <input type="text" id="sApaar" placeholder="APAAR001" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" id="sDob" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Student Name *</label>
                        <input type="text" id="sName" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <label>Father Name *</label>
                        <input type="text" id="sFather" placeholder="Father's Name" required>
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <select id="sClass" required>
                            <option value="">Select</option>
                            <option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option>
                            <option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option>
                            <option value="9">9</option><option value="10">10</option>
                            <option value="11">11</option><option value="12">12</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Session *</label>
                    <select id="sSession" required>
                        <option value="">Select</option>
                        <option value="2025-26">2025-26</option>
                        <option value="2024-25">2024-25</option>
                        <option value="2023-24">2023-24</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">➕ Add Student</button>
            </form>
        </div>

        <!-- Upload Result -->
        <div class="card">
            <h2>📤 Upload Result</h2>
            <form id="resultForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label>Student ID *</label>
                        <input type="text" id="rId" placeholder="S001" required>
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <select id="rClass" required>
                            <option value="">Select</option>
                            <option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option>
                            <option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option>
                            <option value="9">9</option><option value="10">10</option>
                            <option value="11">11</option><option value="12">12</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Session *</label>
                        <select id="rSession" required>
                            <option value="">Select</option>
                            <option value="2025-26">2025-26</option>
                            <option value="2024-25">2024-25</option>
                            <option value="2023-24">2023-24</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Marksheet (PDF) *</label>
                    <input type="file" id="rFile" accept=".pdf" required>
                </div>
                <button type="submit" class="btn btn-primary">📤 Upload</button>
            </form>
        </div>

        <!-- Results List -->
        <div class="card">
            <h2>📋 Results</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Session</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr><td colspan="7" style="text-align:center;padding:30px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API = 'https://gsssshilla.onrender.com/api/result';

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type}`;
            t.style.display = 'block';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.style.display = 'none', 4000);
        }

        // Load Stats
        async function loadStats() {
            try {
                const res = await fetch(API + '/stats');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalStudents').textContent = data.data.totalStudents || 0;
                    document.getElementById('publishedResults').textContent = data.data.publishedResults || 0;
                    document.getElementById('unpublishedResults').textContent = data.data.unpublishedResults || 0;
                    document.getElementById('totalResults').textContent = data.data.totalResults || 0;
                }
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        // Load Results
        async function loadResults() {
            const tbody = document.getElementById('resultsBody');
            try {
                const res = await fetch(API + '/results');
                const data = await res.json();
                if (data.success && data.data) {
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b;">No results found</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.data.map((r, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><strong>${r.student_id}</strong></td>
                            <td>${r.student_name}</td>
                            <td><span class="badge badge-primary">${r.class}</span></td>
                            <td>${r.session_year}</td>
                            <td>
                                <span class="badge ${r.status === 'published' ? 'badge-success' : 'badge-warning'}">
                                    ${r.status}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-success" style="padding:4px 12px;font-size:12px;" onclick="publishResult(${r.id})" ${r.status === 'published' ? 'disabled' : ''}>
                                    ✅ Publish
                                </button>
                                <button class="btn btn-warning" style="padding:4px 12px;font-size:12px;color:white;" onclick="unpublishResult(${r.id})" ${r.status === 'unpublished' ? 'disabled' : ''}>
                                    📌 Unpublish
                                </button>
                                <button class="btn btn-danger" style="padding:4px 12px;font-size:12px;" onclick="deleteResult(${r.id})">
                                    🗑️ Delete
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error('Results error:', err);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:red;">Failed to load</td></tr>';
            }
        }

        // Add Student
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                studentId: document.getElementById('sId').value.trim(),
                studentName: document.getElementById('sName').value.trim(),
                fatherName: document.getElementById('sFather').value.trim(),
                apaarId: document.getElementById('sApaar').value.trim(),
                dob: document.getElementById('sDob').value,
                class: document.getElementById('sClass').value,
                session: document.getElementById('sSession').value
            };

            try {
                const res = await fetch(API + '/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    showToast('✅ Student added!', 'success');
                    e.target.reset();
                    loadStats();
                    loadResults();
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (err) {
                showToast('❌ Error: ' + err.message, 'error');
            }
        });

        // Upload Result
        document.getElementById('resultForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('rFile').files[0];
            if (!file) {
                showToast('Please select a PDF file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('studentId', document.getElementById('rId').value.trim());
            formData.append('class', document.getElementById('rClass').value);
            formData.append('session', document.getElementById('rSession').value);
            formData.append('marksheet', file);

            try {
                const res = await fetch(API + '/results/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    showToast('✅ Result uploaded!', 'success');
                    e.target.reset();
                    loadStats();
                    loadResults();
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (err) {
                showToast('❌ Error: ' + err.message, 'error');
            }
        });

        // Publish Result
        async function publishResult(id) {
            if (!confirm('Publish this result?')) return;
            try {
                const res = await fetch(API + '/results/' + id + '/publish', { method: 'PUT' });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Published!', 'success');
                    loadStats();
                    loadResults();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Error', 'error');
            }
        }

        // Unpublish Result
        async function unpublishResult(id) {
            if (!confirm('Unpublish this result?')) return;
            try {
                const res = await fetch(API + '/results/' + id + '/unpublish', { method: 'PUT' });
                const data = await res.json();
                if (data.success) {
                    showToast('📌 Unpublished!', 'success');
                    loadStats();
                    loadResults();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Error', 'error');
            }
        }

        // Delete Result
        async function deleteResult(id) {
            if (!confirm('Delete this result permanently?')) return;
            try {
                const res = await fetch(API + '/results/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('🗑️ Deleted!', 'success');
                    loadStats();
                    loadResults();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Error', 'error');
            }
        }

        // Init
        loadStats();
        loadResults();
    </script>

</body>
</html>
