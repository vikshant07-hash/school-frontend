<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1a2332; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0a1628, #1a3a6b);
            padding: 20px 28px;
            border-radius: 12px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            border-bottom: 4px solid #d4a843;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header h1 span { color: #d4a843; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .card h2 { font-size: 18px; font-weight: 700; color: #1a3a6b; margin-bottom: 16px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: #f8fafc; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        tr:hover { background: #f8fafc; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-primary { background: #dbeafe; color: #3b82f6; }
        .badge-warning { background: #fef3c7; color: #d97706; }

        .toast {
            position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: 12px;
            color: white; font-weight: 600; font-size: 14px; z-index: 99999;
            display: none; animation: slideIn 0.3s ease;
        }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #1a3a6b; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div>
            <h1>📥 <span>Downloads</span> Admin</h1>
            <div style="font-size:13px;opacity:0.7;">Manage study materials & papers</div>
        </div>
        <button class="btn btn-outline" onclick="window.open('downloads.html', '_blank')">
            <i class="fas fa-eye"></i> View Public Page
        </button>
    </header>

    <!-- Add Form -->
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> <span id="formTitle">Add New Download</span></h2>
        <form id="downloadForm" enctype="multipart/form-data">
            <input type="hidden" id="editId" value="">
            <div class="form-row">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., Math Model Paper Set-A" required>
                </div>
                <div class="form-group">
                    <label>Class *</label>
                    <select id="class" class="form-control" required>
                        <option value="">Select Class</option>
                        <option value="1">Class 1</option><option value="2">Class 2</option><option value="3">Class 3</option>
                        <option value="4">Class 4</option><option value="5">Class 5</option><option value="6">Class 6</option>
                        <option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option>
                        <option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Session/Year *</label>
                    <select id="session" class="form-control" required>
                        <option value="">Select Session</option>
                        <option value="2024-2025">2024-2025</option>
                        <option value="2025-2026">2025-2026</option>
                        <option value="2026-2027">2026-2027</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Category *</label>
                    <select id="category" class="form-control" required>
                        <option value="">Select Category</option>
                        <option value="model-paper">Model Paper</option>
                        <option value="previous-year">Previous Year Question Paper</option>
                        <option value="syllabus">Syllabus</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Series (Optional)</label>
                    <select id="series" class="form-control">
                        <option value="">None</option>
                        <option value="A">Set A</option>
                        <option value="B">Set B</option>
                        <option value="C">Set C</option>
                        <option value="D">Set D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject (Optional)</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g., Mathematics">
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" class="form-control" rows="2" placeholder="Short description..."></textarea>
            </div>
            <div class="form-group">
                <label>File (PDF/Image - Max 15MB) *</label>
                <input type="file" id="file" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp">
            </div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-success" id="submitBtn">
                    <i class="fas fa-upload"></i> Upload
                </button>
                <button type="button" class="btn btn-warning" id="cancelBtn" style="display:none;" onclick="cancelEdit()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="card">
        <h2>📋 All Downloads (<span id="totalCount">0</span>)</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>Title</th><th>Class</th><th>Session</th><th>Category</th>
                        <th>Series</th><th>Subject</th><th>Downloads</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9" style="text-align:center;padding:30px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = 'https://gsssshilla.onrender.com';

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type}`;
        t.style.display = 'block';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => t.style.display = 'none', 4000);
    }

    async function loadDownloads() {
        const tbody = document.getElementById('tableBody');
        try {
            const res = await fetch(`${API_BASE}/admin/downloads`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('totalCount').textContent = data.data.length;
                tbody.innerHTML = data.data.map((item, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${item.title}</strong></td>
                        <td><span class="badge badge-primary">Class ${item.class}</span></td>
                        <td>${item.session_year}</td>
                        <td><span class="badge badge-success">${item.category}</span></td>
                        <td>${item.series || '-'}</td>
                        <td>${item.subject || '-'}</td>
                        <td>${item.download_count || 0}</td>
                        <td style="display:flex;gap:6px;">
                            <button class="btn btn-primary btn-sm" onclick="editDownload(${item.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDownload(${item.id})"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (err) {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:red;">Failed to load</td></tr>';
        }
    }

    document.getElementById('downloadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const editId = document.getElementById('editId').value;
        const fileInput = document.getElementById('file');
        
        if (!editId && !fileInput.files.length) {
            return showToast('Please select a file', 'error');
        }

        const formData = new FormData();
        formData.append('title', document.getElementById('title').value);
        formData.append('class', document.getElementById('class').value);
        formData.append('session_year', document.getElementById('session').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('series', document.getElementById('series').value);
        formData.append('subject', document.getElementById('subject').value);
        formData.append('description', document.getElementById('description').value);
        
        if (fileInput.files.length) {
            formData.append('file', fileInput.files[0]);
        }

        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        try {
            const url = editId ? `${API_BASE}/admin/downloads/update/${editId}` : `${API_BASE}/admin/downloads/add`;
            const method = editId ? 'PUT' : 'POST';
            
            const res = await fetch(url, { method, body: formData });
            const data = await res.json();

            if (data.success) {
                showToast(editId ? '✅ Updated!' : '✅ Uploaded!', 'success');
                cancelEdit();
                loadDownloads();
            } else {
                showToast(data.message || 'Failed', 'error');
            }
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        } finally {
            btn.innerHTML = '<i class="fas fa-upload"></i> Upload';
            btn.disabled = false;
        }
    });

    async function editDownload(id) {
        try {
            const res = await fetch(`${API_BASE}/api/downloads/${id}`);
            const data = await res.json();
            if (data.success) {
                const item = data.data;
                document.getElementById('editId').value = item.id;
                document.getElementById('title').value = item.title;
                document.getElementById('class').value = item.class;
                document.getElementById('session').value = item.session_year;
                document.getElementById('category').value = item.category;
                document.getElementById('series').value = item.series || '';
                document.getElementById('subject').value = item.subject || '';
                document.getElementById('description').value = item.description || '';
                
                document.getElementById('formTitle').textContent = 'Edit Download';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update';
                document.getElementById('cancelBtn').style.display = 'inline-flex';
                document.getElementById('file').required = false;
            }
        } catch (err) {
            console.error(err);
        }
    }

    function cancelEdit() {
        document.getElementById('editId').value = '';
        document.getElementById('downloadForm').reset();
        document.getElementById('formTitle').textContent = 'Add New Download';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-upload"></i> Upload';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('file').required = true;
    }

    async function deleteDownload(id) {
        if (!confirm('Delete this download?')) return;
        try {
            const res = await fetch(`${API_BASE}/admin/downloads/delete/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) { showToast('✅ Deleted!'); loadDownloads(); }
            else showToast(data.message || 'Failed', 'error');
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
    }

    window.addEventListener('DOMContentLoaded', loadDownloads);
</script>
</body>
</html>
