<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>School Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            color: #1a2332;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0a1628, #1a3a6b);
            padding: 30px 40px;
            border-radius: 16px;
            color: white;
            margin-bottom: 30px;
            border-bottom: 4px solid #d4a843;
        }
        .header h1 { font-size: 28px; font-weight: 700; }
        .header h1 span { color: #d4a843; }
        .header p { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 4px; }

        /* Hero Slider */
        .hero-slider {
            margin-bottom: 40px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
            position: relative;
            height: 400px;
            background: #1a3a6b;
        }
        .hero-slider .slide { width: 100%; height: 100%; display: none; position: relative; }
        .hero-slider .slide.active { display: block; }
        .hero-slider .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-slider .slide .slide-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
        }
        .hero-slider .slide .slide-overlay h2 { font-size: 24px; font-weight: 700; }
        .hero-slider .slide .slide-overlay p { font-size: 14px; opacity: 0.8; }
        .hero-slider .slider-controls {
            position: absolute;
            bottom: 20px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .hero-slider .slider-controls button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }
        .hero-slider .slider-controls button:hover { background: rgba(255,255,255,0.4); }
        .hero-slider .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 30px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .hero-slider .slider-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.3s;
        }
        .hero-slider .slider-dots span.active { background: #d4a843; transform: scale(1.2); }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .categories button {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            background: white;
            color: #1a3a6b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .categories button:hover { background: #dbeafe; transform: translateY(-2px); }
        .categories button.active { background: #1a3a6b; color: white; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .gallery-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }
        .gallery-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .gallery-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .gallery-card .info {
            padding: 16px 18px;
        }
        .gallery-card .info .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 4px;
        }
        .gallery-card .info .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .gallery-card .info .meta .category {
            background: #dbeafe;
            color: #3b82f6;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }

        .featured-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }

        .gallery-card { position: relative; }

        /* Load More */
        .load-more {
            text-align: center;
            margin-top: 20px;
        }
        .load-more button {
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            background: #1a3a6b;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .load-more button:hover { background: #0a1628; transform: translateY(-2px); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 16px; max-width: 600px; width: 100%;
            padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-height: 90vh; overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; font-weight: 700; color: #1a3a6b; }
        .modal-close { width: 36px; height: 36px; border: none; background: #f1f5f9; border-radius: 50%; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .modal-close:hover { background: #fee2e2; color: #ef4444; }
        .modal img { max-width: 100%; border-radius: 8px; }
        .modal .download-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #1a3a6b;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .modal .download-btn:hover { background: #0a1628; }

        @media (max-width: 768px) {
            .header { padding: 20px; }
            .header h1 { font-size: 20px; }
            .hero-slider { height: 250px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .gallery-card img { height: 140px; }
            .hero-slider .slide .slide-overlay h2 { font-size: 16px; }
            .hero-slider .slider-controls { bottom: 10px; right: 15px; }
            .hero-slider .slider-controls button { width: 30px; height: 30px; font-size: 14px; }
            .hero-slider .slider-dots { bottom: 10px; left: 15px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>📸 <span>School</span> Gallery</h1>
        <p>Memories from our school events & activities</p>
    </div>

    <!-- Hero Slider -->
    <div class="hero-slider" id="heroSlider">
        <div id="sliderContainer">
            <div class="slide active">
                <img src="https://res.cloudinary.com/demo/image/upload/v1/school/slider-1.jpg" alt="Welcome" />
                <div class="slide-overlay">
                    <h2>Welcome to Our School</h2>
                    <p>Explore our beautiful campus</p>
                </div>
            </div>
        </div>
        <div class="slider-dots" id="sliderDots"></div>
        <div class="slider-controls">
            <button onclick="prevSlide()"><i class="fas fa-chevron-left"></i></button>
            <button onclick="nextSlide()"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- Categories -->
    <div class="categories" id="categories"></div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- Load More -->
    <div class="load-more" id="loadMoreContainer">
        <button onclick="loadMore()">Load More</button>
    </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Image</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_BASE = 'https://gsssshilla.onrender.com';
    let currentPage = 1;
    let totalPages = 1;
    let currentCategory = 'all';
    let sliderInterval = null;

    // ============================================================
    // LOAD HERO SLIDER
    // ============================================================
    async function loadSlider() {
        try {
            const res = await fetch(`${API_BASE}/api/gallery/slider`);
            const data = await res.json();

            if (data && data.length > 0) {
                const container = document.getElementById('sliderContainer');
                const dots = document.getElementById('sliderDots');

                container.innerHTML = data.map((item, index) => `
                    <div class="slide ${index === 0 ? 'active' : ''}">
                        <img src="${item.image_url}" alt="${item.title || 'Slider'}" />
                        <div class="slide-overlay">
                            <h2>${item.title || ''}</h2>
                            <p>${item.description || ''}</p>
                        </div>
                    </div>
                `).join('');

                dots.innerHTML = data.map((_, index) => `
                    <span class="${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>
                `).join('');

                startAutoSlide();
            }
        } catch (error) {
            console.error('Slider error:', error);
        }
    }

    // ============================================================
    // SLIDER CONTROLS
    // ============================================================
    let currentSlide = 0;
    let totalSlides = 0;

    function updateSlider() {
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.slider-dots span');
        slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
        dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    function nextSlide() {
        const slides = document.querySelectorAll('.slide');
        totalSlides = slides.length;
        currentSlide = (currentSlide + 1) % totalSlides;
        updateSlider();
        resetAutoSlide();
    }

    function prevSlide() {
        const slides = document.querySelectorAll('.slide');
        totalSlides = slides.length;
        currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
        updateSlider();
        resetAutoSlide();
    }

    function goToSlide(index) {
        currentSlide = index;
        updateSlider();
        resetAutoSlide();
    }

    function startAutoSlide() {
        const slides = document.querySelectorAll('.slide');
        totalSlides = slides.length;
        if (totalSlides > 1) {
            sliderInterval = setInterval(nextSlide, 5000);
        }
    }

    function resetAutoSlide() {
        if (sliderInterval) {
            clearInterval(sliderInterval);
            startAutoSlide();
        }
    }

    // ============================================================
    // LOAD CATEGORIES
    // ============================================================
    async function loadCategories() {
        try {
            const res = await fetch(`${API_BASE}/api/gallery/categories`);
            const data = await res.json();

            if (data.success && data.data) {
                const container = document.getElementById('categories');
                container.innerHTML = `
                    <button class="active" data-category="all" onclick="filterCategory('all')">All</button>
                    ${data.data.map(cat => `
                        <button data-category="${cat.slug}" onclick="filterCategory('${cat.slug}')">${cat.name}</button>
                    `).join('')}
                `;
            }
        } catch (error) {
            console.error('Categories error:', error);
        }
    }

    // ============================================================
    // FILTER CATEGORY
    // ============================================================
    function filterCategory(category) {
        currentCategory = category;
        currentPage = 1;
        document.querySelectorAll('.categories button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.category === category);
        });
        loadGallery();
    }

    // ============================================================
    // LOAD GALLERY
    // ============================================================
    async function loadGallery() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;grid-column:1/-1;">
            <i class="fas fa-spinner fa-spin"></i> Loading...
        </div>`;

        try {
            let url = `${API_BASE}/api/gallery/images?page=${currentPage}&limit=12`;
            if (currentCategory !== 'all') {
                url += `&category=${currentCategory}`;
            }

            const res = await fetch(url);
            const data = await res.json();

            if (data.success && data.data && data.data.length > 0) {
                grid.innerHTML = data.data.map(item => `
                    <div class="gallery-card" onclick="openImage('${item.image_url || item.file_path}', '${item.title || 'Image'}', '${item.description || ''}')">
                        ${item.is_featured ? '<span class="featured-badge">⭐ Featured</span>' : ''}
                        <img src="${item.image_url || item.file_path}" alt="${item.title || 'Image'}" loading="lazy" />
                        <div class="info">
                            <div class="title">${item.title || 'Untitled'}</div>
                            <div class="meta">
                                <span>${item.album_title || ''}</span>
                                <span class="category">${item.category || 'general'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                totalPages = data.pagination?.totalPages || 1;
                document.getElementById('loadMoreContainer').style.display = currentPage < totalPages ? 'block' : 'none';
            } else {
                grid.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;grid-column:1/-1;">
                    <i class="fas fa-images"></i> No images found
                </div>`;
                document.getElementById('loadMoreContainer').style.display = 'none';
            }
        } catch (error) {
            console.error('Gallery error:', error);
            grid.innerHTML = `<div style="text-align:center;padding:40px;color:#ef4444;grid-column:1/-1;">
                ❌ Failed to load gallery
            </div>`;
        }
    }

    // ============================================================
    // LOAD MORE
    // ============================================================
    function loadMore() {
        currentPage++;
        loadGallery();
    }

    // ============================================================
    // OPEN IMAGE MODAL
    // ============================================================
    function openImage(url, title, description) {
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        document.getElementById('modalTitle').textContent = title || 'Image';

        body.innerHTML = `
            <img src="${url}" alt="${title}" />
            ${description ? `<p style="margin-top:12px;color:#475569;">${description}</p>` : ''}
            <a href="${url}" download class="download-btn"><i class="fas fa-download"></i> Download</a>
        `;
        modal.classList.add('active');
    }

    // ============================================================
    // CLOSE MODAL
    // ============================================================
    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 Public Gallery Loaded');
        console.log('📡 API:', API_BASE);
        loadSlider();
        loadCategories();
        loadGallery();
    });
</script>

</body>
</html>
