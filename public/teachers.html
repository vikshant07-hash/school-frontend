<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #0a1628, #1a3a6b);
            padding: 20px 28px;
            border-radius: 12px;
            color: white;
            margin-bottom: 24px;
            border-bottom: 4px solid #d4a843;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header h1 span { color: #d4a843; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .card h2 { font-size: 18px; color: #1a3a6b; margin-bottom: 16px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: #f8fafc; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        tr:hover { background: #f8fafc; }
        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-principal { background: #fef3c7; color: #d97706; }
        .badge-teaching { background: #dbeafe; color: #3b82f6; }
        .badge-nonteaching { background: #dcfce7; color: #16a34a; }
        .badge-admin { background: #ede9fe; color: #8b5cf6; }
        .thumb { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }

        .toast {
            position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: 12px;
            color: white; font-weight: 600; z-index: 99999; display: none;
        }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1>👨‍🏫 <span>Faculty</span> Admin</h1>
            <div style="font-size:13px;opacity:0.7;">Manage Staff Members</div>
        </div>
        <button class="btn btn-outline" onclick="window.open('faculty.html','_blank')">
            <i class="fas fa-eye"></i> View Public Page
        </button>
    </header>

    <!-- Form -->
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> <span id="formTitle">Add Faculty Member</span></h2>
        <form id="facultyForm" enctype="multipart/form-data">
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Designation *</label>
                    <select id="designation" class="form-control" required>
                        <option value="">Select</option>
                        <option value="Principal">Principal</option>
                        <option value="Vice Principal">Vice Principal</option>
                        <option value="PGT">PGT</option>
                        <option value="TGT">TGT</option>
                        <option value="PRT">PRT</option>
                        <option value="Librarian">Librarian</option>
                        <option value="Clerk">Clerk</option>
                        <option value="Peon">Peon</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Staff Type</label>
                    <select id="staffType" class="form-control">
                        <option value="teaching">Teaching</option>
                        <option value="non-teaching">Non-Teaching</option>
                        <option value="administrative">Administrative</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <select id="department" class="form-control">
                        <option value="">Select</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Social Science">Social Science</option>
                        <option value="Computer">Computer</option>
                        <option value="Library">Library</option>
                        <option value="Office">Office</option>
                        <option value="Administration">Administration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g., Physics">
                </div>
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" id="qualification" class="form-control" placeholder="e.g., M.Sc., B.Ed.">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="experience" class="form-control" placeholder="e.g., 15 Years">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="email@school.edu.in">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control" placeholder="+91 9876543210">
                </div>
            </div>
            <div class="form-group">
                <label>Message/Quote</label>
                <input type="text" id="message" class="form-control" placeholder="A short message or quote...">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Photo (Square, max 3MB)</label>
                    <input type="file" id="photo" class="form-control" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="joiningDate" class="form-control">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:20px;padding-top:20px;">
                    <label><input type="checkbox" id="isPrincipal"> Is Principal</label>
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn btn-success" id="submitBtn"><i class="fas fa-save"></i> Save</button>
                <button type="button" class="btn btn-warning" id="cancelBtn" style="display:none;" onclick="cancelEdit()"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="card">
        <h2>📋 All Faculty (<span id="totalCount">0</span>)</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>Photo</th><th>Name</th><th>Designation</th><th>Department</th>
                        <th>Type</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="8" style="text-align:center;padding:30px;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_BASE = 'https://gsssshilla.onrender.com';

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast toast-${type}`;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    async function loadFaculty() {
        const res = await fetch(`${API_BASE}/admin/faculty`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('totalCount').textContent = data.data.length;
            document.getElementById('tableBody').innerHTML = data.data.map((f, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><img src="${f.photo_url || 'https://via.placeholder.com/50/1a3a6b/fff?text=👤'}" class="thumb" onerror="this.src='https://via.placeholder.com/50/1a3a6b/fff?text=👤'"></td>
                    <td><strong>${f.name}</strong> ${f.is_principal == 1 ? '<span class="badge badge-principal">👑 Principal</span>' : ''}</td>
                    <td>${f.designation}</td>
                    <td>${f.department || '-'}</td>
                    <td><span class="badge ${f.staff_type === 'teaching' ? 'badge-teaching' : f.staff_type === 'administrative' ? 'badge-admin' : 'badge-nonteaching'}">${f.staff_type}</span></td>
                    <td>${f.is_active == 1 ? '✅' : '❌'}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="editFaculty(${f.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="deleteFaculty(${f.id})"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `).join('');
        }
    }

    document.getElementById('facultyForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const formData = new FormData();
        
        formData.append('name', document.getElementById('name').value);
        formData.append('designation', document.getElementById('designation').value);
        formData.append('staff_type', document.getElementById('staffType').value);
        formData.append('department', document.getElementById('department').value);
        formData.append('subject', document.getElementById('subject').value);
        formData.append('qualification', document.getElementById('qualification').value);
        formData.append('experience', document.getElementById('experience').value);
        formData.append('email', document.getElementById('email').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('message', document.getElementById('message').value);
        formData.append('is_principal', document.getElementById('isPrincipal').checked ? 1 : 0);
        formData.append('joining_date', document.getElementById('joiningDate').value);
        
        const photo = document.getElementById('photo').files[0];
        if (photo) formData.append('photo', photo);

        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        try {
            const url = editId ? `${API_BASE}/admin/faculty/update/${editId}` : `${API_BASE}/admin/faculty/add`;
            const method = editId ? 'PUT' : 'POST';
            const res = await fetch(url, { method, body: formData });
            const data = await res.json();
            
            if (data.success) { showToast('✅ Saved!'); cancelEdit(); loadFaculty(); }
            else showToast(data.message || 'Failed', 'error');
        } catch (err) { showToast('Error', 'error'); }
        finally { btn.innerHTML = '<i class="fas fa-save"></i> Save'; btn.disabled = false; }
    });

    async function editFaculty(id) {
        const res = await fetch(`${API_BASE}/admin/faculty/${id}`);
        const data = await res.json();
        if (data.success) {
            const f = data.data;
            document.getElementById('editId').value = f.id;
            document.getElementById('name').value = f.name;
            document.getElementById('designation').value = f.designation;
            document.getElementById('staffType').value = f.staff_type;
            document.getElementById('department').value = f.department || '';
            document.getElementById('subject').value = f.subject || '';
            document.getElementById('qualification').value = f.qualification || '';
            document.getElementById('experience').value = f.experience || '';
            document.getElementById('email').value = f.email || '';
            document.getElementById('phone').value = f.phone || '';
            document.getElementById('message').value = f.message || '';
            document.getElementById('isPrincipal').checked = f.is_principal == 1;
            document.getElementById('joiningDate').value = f.joining_date || '';
            document.getElementById('formTitle').textContent = 'Edit Faculty Member';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update';
            document.getElementById('cancelBtn').style.display = 'inline-flex';
        }
    }

    function cancelEdit() {
        document.getElementById('editId').value = '';
        document.getElementById('facultyForm').reset();
        document.getElementById('formTitle').textContent = 'Add Faculty Member';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Save';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function deleteFaculty(id) {
        if (!confirm('Delete this faculty member?')) return;
        const res = await fetch(`${API_BASE}/admin/faculty/delete/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) { showToast('✅ Deleted!'); loadFaculty(); }
        else showToast('Failed', 'error');
    }

    window.addEventListener('DOMContentLoaded', loadFaculty);
</script>
</body>
</html>
