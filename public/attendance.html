<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Teachers - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --bg: #f5f7fb; --white: #fff; --text: #1a2332; --text-sec: #5a6a7e;
  --muted: #94a3b8; --gold: #c9972b; --gold-light: #e8b84b;
  --gold-bg: #fef8ed; --green: #10b981; --green-bg: #ecfdf5;
  --red: #ef4444; --red-bg: #fef2f2; --blue: #4a8af4; --blue-bg: #eef4ff;
  --orange: #f59e0b; --border: #e8edf8;
  --shadow: 0 2px 12px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAVBAR */
.navbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 64px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow);
}
.navbar .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.navbar .logo {
  width: 40px; height: 40px; border-radius: 10px; background: var(--gold-bg);
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--gold); overflow: hidden;
}
.navbar .logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.navbar .name { font-size: 15px; font-weight: 800; color: var(--text); }
.navbar .name span { color: var(--gold); }
.nav-links { display: flex; gap: 4px; list-style: none; }
.nav-links a {
  text-decoration: none; color: var(--text-sec); padding: 8px 14px;
  border-radius: 8px; font-size: 13px; font-weight: 600; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.nav-links a:hover { background: var(--bg); color: var(--text); }
.nav-links a.active { background: var(--gold-bg); color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.admin-badge {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  background: var(--bg); border-radius: 50px; font-size: 12px;
  font-weight: 600; color: var(--text-sec);
}
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.logout-btn {
  padding: 8px 14px; background: var(--red-bg); color: var(--red);
  border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.logout-btn:hover { background: var(--red); color: #fff; }

/* CONTAINER */
.container { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }

/* PAGE HEADER */
.page-head {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 22px 26px;
  margin-bottom: 20px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 14px;
}
.page-head h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.page-head h1 i { color: var(--gold); }
.page-head .sub { font-size: 12px; color: var(--text-sec); margin-top: 4px; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border: none; border-radius: 10px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.btn-primary { background: var(--gold); color: #fff; }
.btn-primary:hover { background: var(--gold-light); }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: var(--bg); color: var(--text-sec); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--border); }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }
.btn-xs { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* SEARCH BAR */
.toolbar {
  display: flex; gap: 12px; flex-wrap: wrap;
  margin-bottom: 18px; align-items: center;
}
.toolbar input, .toolbar select {
  padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 13px; font-family: inherit;
  background: var(--white); outline: none; transition: all 0.2s;
}
.toolbar input:focus, .toolbar select:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,151,43,0.1);
}
.toolbar input[type="text"] { flex: 1 1 280px; min-width: 200px; }

/* TEACHER GRID */
.teachers-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 16px;
}
.teacher-card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  overflow: hidden; transition: all 0.25s;
}
.teacher-card:hover { box-shadow: var(--shadow-lg); border-color: var(--gold); }
.teacher-card.inactive { opacity: 0.6; }

.tc-header {
  padding: 18px 20px;
  background: linear-gradient(135deg, #fef8ed, #ffffff);
  display: flex; gap: 14px; align-items: center;
  border-bottom: 1px solid var(--border);
}
.tc-avatar {
  width: 52px; height: 52px; border-radius: 14px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
  flex-shrink: 0; overflow: hidden; border: 2px solid var(--gold);
}
.tc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.tc-info { flex: 1; min-width: 0; }
.tc-name { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
.tc-email { font-size: 12px; color: var(--text-sec); word-break: break-all; }
.tc-id {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px; background: var(--gold-bg);
  color: var(--gold); margin-top: 4px; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tc-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 10px;
  font-weight: 800; text-transform: uppercase;
  position: absolute; top: 14px; right: 14px;
}
.tc-header { position: relative; }
.status-active { background: var(--green-bg); color: var(--green); }
.status-active::before { content: '●'; animation: pulse 1.5s infinite; }
.status-inactive { background: var(--red-bg); color: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.tc-body { padding: 16px 20px; }
.tc-section-label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 8px; display: flex; justify-content: space-between;
}
.tc-section-label .add {
  color: var(--gold); cursor: pointer; font-weight: 700;
  text-transform: none; letter-spacing: 0;
}
.tc-section-label .add:hover { text-decoration: underline; }

.assignments-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.assignment-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--bg);
  border-radius: 9px; border-left: 3px solid var(--gold);
  font-size: 12px; transition: all 0.2s;
}
.assignment-item:hover { background: var(--gold-bg); }
.assignment-item .asgn-info { flex: 1; min-width: 0; }
.assignment-item .asgn-line1 { font-weight: 700; color: var(--text); }
.assignment-item .asgn-line2 { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
.assignment-item .remove {
  width: 24px; height: 24px; border-radius: 50%; background: var(--red-bg);
  color: var(--red); border: none; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.assignment-item .remove:hover { background: var(--red); color: #fff; }

.empty-assign {
  padding: 14px; text-align: center; color: var(--muted);
  font-size: 12px; background: var(--bg); border-radius: 9px;
  border: 1px dashed var(--border); margin-bottom: 14px;
}

.tc-actions {
  display: flex; gap: 8px; padding: 12px 20px;
  border-top: 1px solid var(--border); flex-wrap: wrap;
  background: #fafbfd;
}

/* MODAL */
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px); z-index: 9999;
  padding: 20px; overflow-y: auto;
}
.modal.active { display: flex; align-items: flex-start; justify-content: center; }
.modal-content {
  background: var(--white); border-radius: 20px;
  max-width: 560px; width: 100%; margin: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.3s ease;
  max-height: 95vh; overflow-y: auto;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-head {
  padding: 22px 26px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: var(--white); z-index: 2;
  border-radius: 20px 20px 0 0;
}
.modal-head h2 { font-size: 18px; font-weight: 800; }
.modal-head .close {
  width: 34px; height: 34px; border-radius: 50%; background: var(--bg);
  border: none; cursor: pointer; font-size: 16px; color: var(--text-sec);
  display: flex; align-items: center; justify-content: center;
}
.modal-head .close:hover { background: var(--red-bg); color: var(--red); }
.modal-body { padding: 22px 26px; }

/* FORM */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-row.full { grid-template-columns: 1fr; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-sec); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.field label .req { color: var(--red); }
.field input, .field select {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; background: #fafbfd;
  outline: none; transition: all 0.2s;
}
.field input:focus, .field select:focus {
  border-color: var(--gold); background: #fff;
  box-shadow: 0 0 0 3px rgba(201,151,43,0.1);
}
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

.days-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.day-chip {
  padding: 7px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--white); font-size: 12px; font-weight: 700;
  cursor: pointer; color: var(--text-sec); transition: all 0.2s;
  font-family: inherit; user-select: none;
}
.day-chip.active { background: var(--gold); color: #fff; border-color: var(--gold); }
.day-chip:hover { border-color: var(--gold); }

.form-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  padding-top: 16px; border-top: 1px solid var(--border);
  margin-top: 8px;
}

/* TOAST */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 99999;
  display: flex; flex-direction: column; gap: 10px; max-width: 360px;
}
.toast {
  padding: 14px 18px; border-radius: 12px; color: #fff;
  font-weight: 600; font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  animation: slideIn 0.3s ease;
  display: flex; align-items: center; gap: 10px; line-height: 1.4;
}
.toast i { font-size: 18px; flex-shrink: 0; }
.toast-success { background: linear-gradient(135deg, var(--green), #059669); }
.toast-error { background: linear-gradient(135deg, var(--red), #dc2626); }
.toast-warning { background: linear-gradient(135deg, var(--orange), #d97706); }
.toast-info { background: linear-gradient(135deg, var(--blue), #3b82f6); }
@keyframes slideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }

/* LOADING */
.loading-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border);
}
.loading-state i { font-size: 42px; color: var(--gold); opacity: 0.5; display: block; margin-bottom: 12px; }

@media (max-width: 768px) {
  .container { padding: 16px; }
  .navbar { padding: 0 14px; }
  .nav-links { display: none; }
  .teachers-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="container">
  <div class="page-head">
    <div>
      <h1><i class="fas fa-chalkboard-teacher"></i> Manage Teachers</h1>
      <div class="sub">Add teachers, assign subjects/classes/periods and time windows</div>
    </div>
    <button class="btn btn-primary" onclick="openTeacherModal()">
      <i class="fas fa-plus"></i> Add Teacher
    </button>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search teacher by name, email, ID...">
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="1">Active Only</option>
      <option value="0">Inactive Only</option>
    </select>
    <button class="btn btn-outline" onclick="loadTeachers()">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
    <button class="btn btn-outline" onclick="generateAllQR()">
      <i class="fas fa-qrcode"></i> Generate All Student QRs
    </button>
  </div>

  <div id="loadingState" class="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    Loading teachers...
  </div>

  <div class="teachers-grid" id="teachersGrid"></div>
</div>

<!-- TEACHER MODAL -->
<div class="modal" id="teacherModal">
  <div class="modal-content">
    <div class="modal-head">
      <h2 id="teacherModalTitle">Add Teacher</h2>
      <button class="close" onclick="closeModal('teacherModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form id="teacherForm" onsubmit="saveTeacher(event)">
        <input type="hidden" id="teacherId" value="">
        <div class="form-row">
          <div class="field">
            <label>Teacher ID <span class="req">*</span></label>
            <input type="text" id="t_teacher_id" required placeholder="TCH001">
          </div>
          <div class="field">
            <label>Phone</label>
            <input type="tel" id="t_phone" placeholder="9876543210" maxlength="10">
          </div>
        </div>
        <div class="form-row full">
          <div class="field">
            <label>Full Name <span class="req">*</span></label>
            <input type="text" id="t_name" required placeholder="Ramesh Kumar">
          </div>
        </div>
        <div class="form-row full">
          <div class="field">
            <label>Email <span class="req">*</span></label>
            <input type="email" id="t_email" required placeholder="ramesh@gssshilla.in">
          </div>
        </div>
        <div class="form-row full">
          <div class="field" id="passwordField">
            <label>Password <span class="req">*</span></label>
            <input type="password" id="t_password" placeholder="Min 6 characters" minlength="6">
            <div class="hint">Teacher will use this to login</div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('teacherModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveTeacherBtn">
            <i class="fas fa-save"></i> Save Teacher
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ASSIGN MODAL -->
<div class="modal" id="assignModal">
  <div class="modal-content">
    <div class="modal-head">
      <h2 id="assignModalTitle">Assign Subject/Period</h2>
      <button class="close" onclick="closeModal('assignModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <form id="assignForm" onsubmit="saveAssignment(event)">
        <input type="hidden" id="a_teacher_id" value="">
        <div class="form-row">
          <div class="field">
            <label>Class <span class="req">*</span></label>
            <select id="a_class" required>
              <option value="">Select Class</option>
              <option>Nursery</option><option>LKG</option><option>UKG</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
            </select>
          </div>
          <div class="field">
            <label>Section</label>
            <input type="text" id="a_section" placeholder="A" maxlength="5">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Subject <span class="req">*</span></label>
            <select id="a_subject" required>
              <option value="">Select Subject</option>
            </select>
          </div>
          <div class="field">
            <label>Period No. <span class="req">*</span></label>
            <select id="a_period" required>
              <option value="">Select</option>
              <option value="1">Period 1</option>
              <option value="2">Period 2</option>
              <option value="3">Period 3</option>
              <option value="4">Period 4</option>
              <option value="5">Period 5</option>
              <option value="6">Period 6</option>
              <option value="7">Period 7</option>
              <option value="8">Period 8</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Start Time <span class="req">*</span></label>
            <input type="time" id="a_start" required value="10:00">
          </div>
          <div class="field">
            <label>End Time <span class="req">*</span></label>
            <input type="time" id="a_end" required value="10:45">
          </div>
        </div>

        <div class="form-row full">
          <div class="field">
            <label>Late After (Optional)</label>
            <input type="time" id="a_late">
            <div class="hint">Iske baad scan = LATE mark hoga</div>
          </div>
        </div>

        <div class="field">
          <label>Days</label>
          <div class="days-grid" id="daysGrid">
            <button type="button" class="day-chip active" data-day="Mon">Mon</button>
            <button type="button" class="day-chip active" data-day="Tue">Tue</button>
            <button type="button" class="day-chip active" data-day="Wed">Wed</button>
            <button type="button" class="day-chip active" data-day="Thu">Thu</button>
            <button type="button" class="day-chip active" data-day="Fri">Fri</button>
            <button type="button" class="day-chip active" data-day="Sat">Sat</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('assignModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveAssignBtn">
            <i class="fas fa-save"></i> Assign
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API = 'https://gsssshilla.onrender.com/api/attendance';
const STUDENT_API = 'https://gsssshilla.onrender.com/api/students';

const state = {
  token: localStorage.getItem('adminToken'),
  admin: JSON.parse(localStorage.getItem('adminData') || '{}'),
  teachers: [],
  subjects: [],
  search: '',
  statusFilter: ''
};

if (!state.token) window.location.replace('login.html');

function authHeaders() {
  return { 'Authorization': `Bearer ${state.token}`, 'Content-Type': 'application/json' };
}

function logout() {
  if (!confirm('Logout?')) return;
  localStorage.removeItem('adminToken');
  localStorage.removeItem('adminData');
  window.location.replace('login.html');
}

// ══════════════════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  const icons = {
    success: 'fa-check-circle', error: 'fa-exclamation-circle',
    warning: 'fa-exclamation-triangle', info: 'fa-info-circle'
  };
  t.className = `toast toast-${type}`;
  t.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3500);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ══════════════════════════════════════════════════════════
// LOAD DATA
// ══════════════════════════════════════════════════════════
async function loadTeachers() {
  try {
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('teachersGrid').innerHTML = '';

    const res = await fetch(`${API}/admin/teachers`, { headers: authHeaders() });
    if (res.status === 401) { toast('Session expired', 'error'); setTimeout(logout, 1200); return; }
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    state.teachers = data.data || [];
    renderTeachers();
    document.getElementById('loadingState').style.display = 'none';
  } catch (err) {
    document.getElementById('loadingState').innerHTML =
      `<i class="fas fa-exclamation-triangle"></i> ${esc(err.message)}`;
  }
}

async function loadSubjects() {
  try {
    const res = await fetch(`${API}/admin/subjects`, { headers: authHeaders() });
    const data = await res.json();
    if (data.success) state.subjects = data.data || [];
  } catch (err) { console.error(err); }
}

function renderTeachers() {
  const grid = document.getElementById('teachersGrid');
  let list = state.teachers;

  // Search filter
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(t =>
      (t.name || '').toLowerCase().includes(q) ||
      (t.email || '').toLowerCase().includes(q) ||
      (t.teacher_id || '').toLowerCase().includes(q)
    );
  }
  // Status filter
  if (state.statusFilter !== '') {
    list = list.filter(t => String(t.is_active ? 1 : 0) === state.statusFilter);
  }

  if (!list.length) {
    grid.innerHTML = `
      <div style="grid-column: 1/-1; text-align:center; padding:40px; background:white; border-radius:14px; border:1px solid var(--border); color:var(--muted);">
        <i class="fas fa-user-slash" style="font-size:42px; opacity:0.4; display:block; margin-bottom:12px;"></i>
        No teachers found
      </div>`;
    return;
  }

  grid.innerHTML = list.map(t => {
    const initial = (t.name || 'T').charAt(0).toUpperCase();
    const assignments = t.assignments || [];

    return `
      <div class="teacher-card ${t.is_active ? '' : 'inactive'}">
        <div class="tc-header">
          <div class="tc-avatar">
            ${t.photo_url ? `<img src="${esc(t.photo_url)}" onerror="this.outerHTML='${initial}'">` : initial}
          </div>
          <div class="tc-info">
            <div class="tc-name">${esc(t.name)}</div>
            <div class="tc-email"><i class="fas fa-envelope" style="font-size:10px;"></i> ${esc(t.email)}</div>
            <span class="tc-id">${esc(t.teacher_id)}</span>
          </div>
          <span class="tc-status status-${t.is_active ? 'active' : 'inactive'}">
            ${t.is_active ? 'Active' : 'Inactive'}
          </span>
        </div>

        <div class="tc-body">
          <div class="tc-section-label">
            <span><i class="fas fa-book"></i> Assigned Subjects (${assignments.length})</span>
            <span class="add" onclick='openAssignModal(${t.id})'>
              <i class="fas fa-plus-circle"></i> Add Assignment
            </span>
          </div>

          ${assignments.length ? `
            <div class="assignments-list">
              ${assignments.map(a => `
                <div class="assignment-item">
                  <div class="asgn-info">
                    <div class="asgn-line1">
                      ${esc(a.subject_name || a.subject_code || 'Subject')} — Class ${esc(a.class)}${a.section ? ' · ' + esc(a.section) : ''}
                    </div>
                    <div class="asgn-line2">
                      <i class="fas fa-clock"></i> ${esc(a.start_time)}-${esc(a.end_time)} ·
                      Period ${a.period} ·
                      <i class="fas fa-calendar"></i> ${esc(a.days || 'All')}
                    </div>
                  </div>
                  <button class="remove" title="Remove" onclick="removeAssignment(${a.id})">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="empty-assign">
              <i class="fas fa-info-circle"></i> No assignments yet. Click "Add Assignment".
            </div>
          `}
        </div>

        <div class="tc-actions">
          <button class="btn btn-sm btn-outline" onclick='editTeacher(${t.id})'>
            <i class="fas fa-edit"></i> Edit
          </button>
          <button class="btn btn-sm btn-outline" onclick='resetPassword(${t.id}, "${esc(t.name)}")'>
            <i class="fas fa-key"></i> Reset Pwd
          </button>
          <button class="btn btn-sm ${t.is_active ? 'btn-danger' : 'btn-success'}" onclick='toggleTeacher(${t.id})'>
            <i class="fas fa-${t.is_active ? 'ban' : 'check'}"></i>
            ${t.is_active ? 'Disable' : 'Enable'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════════════════════
// TEACHER CRUD
// ══════════════════════════════════════════════════════════
function openTeacherModal() {
  document.getElementById('teacherModalTitle').textContent = 'Add Teacher';
  document.getElementById('teacherForm').reset();
  document.getElementById('teacherId').value = '';
  document.getElementById('t_teacher_id').readOnly = false;
  document.getElementById('passwordField').style.display = 'block';
  document.getElementById('t_password').required = true;
  openModal('teacherModal');
}

function editTeacher(id) {
  const t = state.teachers.find(x => x.id === id);
  if (!t) return;
  document.getElementById('teacherModalTitle').textContent = 'Edit Teacher';
  document.getElementById('teacherId').value = t.id;
  document.getElementById('t_teacher_id').value = t.teacher_id || '';
  document.getElementById('t_teacher_id').readOnly = true;
  document.getElementById('t_name').value = t.name || '';
  document.getElementById('t_email').value = t.email || '';
  document.getElementById('t_phone').value = t.phone || '';
  document.getElementById('passwordField').style.display = 'none';
  document.getElementById('t_password').required = false;
  openModal('teacherModal');
}

async function saveTeacher(e) {
  e.preventDefault();
  const id = document.getElementById('teacherId').value;
  const btn = document.getElementById('saveTeacherBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

  const payload = {
    teacher_id: document.getElementById('t_teacher_id').value.trim(),
    name: document.getElementById('t_name').value.trim(),
    email: document.getElementById('t_email').value.trim().toLowerCase(),
    phone: document.getElementById('t_phone').value.trim() || null
  };

  if (!id) {
    payload.password = document.getElementById('t_password').value;
  }

  try {
    const url = id ? `${API}/admin/teachers/${id}` : `${API}/admin/teachers`;
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.success) {
      toast(data.message || '✅ Saved', 'success');
      closeModal('teacherModal');
      loadTeachers();
    } else {
      toast(data.message || 'Failed', 'error');
    }
  } catch (err) {
    toast('Network error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Save Teacher';
  }
}

async function toggleTeacher(id) {
  if (!confirm('Change teacher status?')) return;
  try {
    const res = await fetch(`${API}/admin/teachers/${id}/toggle`, {
      method: 'PATCH',
      headers: authHeaders()
    });
    const data = await res.json();
    if (data.success) {
      toast(data.message || 'Updated', 'success');
      loadTeachers();
    } else toast(data.message, 'error');
  } catch (err) { toast(err.message, 'error'); }
}

async function resetPassword(id, name) {
  const pwd = prompt(`New password for ${name} (min 6 chars):`);
  if (!pwd || pwd.length < 6) return;
  try {
    const res = await fetch(`${API}/admin/teachers/${id}/password`, {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ password: pwd })
    });
    const data = await res.json();
    toast(data.message || (data.success ? 'Password reset ✅' : 'Failed'),
      data.success ? 'success' : 'error');
  } catch (err) { toast(err.message, 'error'); }
}

// ══════════════════════════════════════════════════════════
// ASSIGNMENT
// ══════════════════════════════════════════════════════════
async function openAssignModal(teacherId) {
  document.getElementById('a_teacher_id').value = teacherId;
  const t = state.teachers.find(x => x.id === teacherId);
  document.getElementById('assignModalTitle').textContent =
    `Assign Subject · ${t ? t.name : ''}`;

  // Fill subjects
  const sel = document.getElementById('a_subject');
  sel.innerHTML = '<option value="">Select Subject</option>';
  state.subjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.name} (${s.code}) — Class ${s.class}`;
    opt.dataset.class = s.class;
    sel.appendChild(opt);
  });

  // Reset days
  document.querySelectorAll('#daysGrid .day-chip').forEach(c => c.classList.add('active'));

  document.getElementById('assignForm').reset();
  document.getElementById('a_teacher_id').value = teacherId;

  openModal('assignModal');
}

// Day chip toggle
document.querySelectorAll('#daysGrid .day-chip').forEach(chip => {
  chip.addEventListener('click', () => chip.classList.toggle('active'));
});

async function saveAssignment(e) {
  e.preventDefault();
  const teacherId = document.getElementById('a_teacher_id').value;
  const btn = document.getElementById('saveAssignBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Assigning...';

  const days = Array.from(document.querySelectorAll('#daysGrid .day-chip.active'))
    .map(c => c.dataset.day);

  const payload = {
    subjectId: document.getElementById('a_subject').value,
    class: document.getElementById('a_class').value,
    section: document.getElementById('a_section').value.trim() || null,
    period: Number(document.getElementById('a_period').value),
    startTime: document.getElementById('a_start').value,
    endTime: document.getElementById('a_end').value,
    lateAfter: document.getElementById('a_late').value || null,
    days
  };

  try {
    const res = await fetch(`${API}/admin/teachers/${teacherId}/assign`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      toast(data.message || '✅ Assigned', 'success');
      closeModal('assignModal');
      loadTeachers();
    } else toast(data.message || 'Failed', 'error');
  } catch (err) { toast(err.message, 'error'); }
  finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Assign';
  }
}

async function removeAssignment(id) {
  if (!confirm('Remove this assignment?')) return;
  try {
    const res = await fetch(`${API}/admin/assignments/${id}`, {
      method: 'DELETE',
      headers: authHeaders()
    });
    const data = await res.json();
    if (data.success) { toast('✅ Removed', 'success'); loadTeachers(); }
    else toast(data.message, 'error');
  } catch (err) { toast(err.message, 'error'); }
}

// ══════════════════════════════════════════════════════════
// BULK QR GENERATION
// ══════════════════════════════════════════════════════════
async function generateAllQR() {
  const cls = prompt('Enter class (e.g., 9, 10, 11):');
  if (!cls) return;
  if (!confirm(`Generate QR for all Class ${cls} students?`)) return;

  toast('Generating QRs...', 'info');
  try {
    const res = await fetch(`${API}/qr/generate-class/${cls}`, {
      method: 'POST',
      headers: authHeaders()
    });
    const data = await res.json();
    toast(data.message || '✅ Done', data.success ? 'success' : 'error');
  } catch (err) { toast(err.message, 'error'); }
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderTeachers();
});

document.getElementById('statusFilter').addEventListener('change', (e) => {
  state.statusFilter = e.target.value;
  renderTeachers();
});

document.getElementById('adminName').textContent = state.admin.name || 'Admin';
document.getElementById('adminAvatar').textContent = (state.admin.name || 'A').charAt(0).toUpperCase();

(async () => {
  await loadSubjects();
  await loadTeachers();
})();
</script>
</body>
</html>
