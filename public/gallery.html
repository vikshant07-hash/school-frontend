<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - GSSS Shilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f0f4f8; 
            color: #1a2332;
            min-height: 100vh;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: linear-gradient(135deg, #0a1628, #1a3a6b);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand img {
            height: 44px;
            width: auto;
            border-radius: 8px;
            background: white;
            padding: 4px;
        }
        .navbar .brand .name {
            font-size: 18px;
            font-weight: 800;
            color: white;
        }
        .navbar .brand .name span { color: #d4a843; }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .navbar .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .navbar .nav-links a.active { background: #d4a843; color: #0a1628; }

        /* ===== CONTAINER ===== */
        .container { max-width: 1300px; margin: 0 auto; padding: 24px 32px; }

        /* ===== HERO SLIDER ===== */
        .hero-slider {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 32px;
            background: #0a1628;
            height: 420px;
        }
        .hero-slider .slides {
            display: flex;
            transition: transform 0.6s ease;
            height: 100%;
        }
        .hero-slider .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
        }
        .hero-slider .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-slider .slide .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 60px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
        }
        .hero-slider .slide .overlay h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .hero-slider .slide .overlay p {
            font-size: 16px;
            opacity: 0.9;
        }
        .hero-slider .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-slider .nav-btn:hover { background: rgba(255,255,255,0.4); }
        .hero-slider .nav-btn.prev { left: 16px; }
        .hero-slider .nav-btn.next { right: 16px; }
        .hero-slider .dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .hero-slider .dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: 0.3s;
        }
        .hero-slider .dots .dot.active { background: #d4a843; width: 24px; border-radius: 6px; }

        /* ===== YEAR SELECTOR ===== */
        .year-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .year-selector .year-btn {
            padding: 8px 20px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .year-selector .year-btn:hover { background: #e2e8f0; }
        .year-selector .year-btn.active {
            background: #0a1628;
            color: white;
            border-color: #d4a843;
        }

        /* ===== GALLERY GRID ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }

        .gallery-item .media-wrapper {
            position: relative;
            width: 100%;
            padding-top: 75%;
            overflow: hidden;
            background: #0a1628;
        }
        .gallery-item .media-wrapper img,
        .gallery-item .media-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-item .media-wrapper video {
            object-fit: contain;
            background: #0a1628;
        }

        /* Video Play Button - New Style */
        .gallery-item .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(212, 168, 67, 0.92);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(212, 168, 67, 0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .gallery-item:hover .play-overlay {
            transform: translate(-50%, -50%) scale(1.12);
            background: #d4a843;
            box-shadow: 0 6px 30px rgba(212, 168, 67, 0.6);
        }
        .gallery-item .play-overlay .pause-icon {
            display: none;
        }
        .gallery-item .play-overlay .play-icon {
            display: block;
        }
        .gallery-item .play-overlay.playing .play-icon {
            display: none;
        }
        .gallery-item .play-overlay.playing .pause-icon {
            display: block;
        }

        .gallery-item .info {
            padding: 14px 16px;
        }
        .gallery-item .info .title {
            font-weight: 700;
            font-size: 15px;
            color: #1a2332;
            margin-bottom: 4px;
        }
        .gallery-item .info .desc {
            font-size: 13px;
            color: #64748b;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .gallery-item .info .date {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .gallery-item .media-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== LIGHTBOX - FIXED ===== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lightbox.active { display: flex; }
        
        .lightbox .close-btn {
            position: absolute;
            top: 24px;
            right: 30px;
            color: white;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .lightbox .close-btn:hover { 
            background: rgba(255,255,255,0.2); 
            transform: rotate(90deg); 
        }
        .lightbox .close-btn i { font-size: 28px; }
        
        .lightbox .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            overflow: hidden;
            background: #0a1628;
            position: relative;
        }
        .lightbox .lightbox-content img,
        .lightbox .lightbox-content video {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            border-radius: 12px 12px 0 0;
        }
        .lightbox .lightbox-content video {
            width: 100%;
            max-height: 80vh;
            background: #0a1628;
        }
        .lightbox .lightbox-info {
            color: white;
            padding: 16px 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 0 0 12px 12px;
        }
        .lightbox .lightbox-info .title {
            font-size: 18px;
            font-weight: 700;
        }
        .lightbox .lightbox-info .desc {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }
        
        .lightbox .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 32px;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 16px 20px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 8px;
            z-index: 10;
        }
        .lightbox .nav-arrow:hover { background: rgba(255,255,255,0.2); }
        .lightbox .nav-arrow.prev { left: 20px; }
        .lightbox .nav-arrow.next { right: 20px; }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .loading i { font-size: 32px; margin-bottom: 10px; }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .empty-state i { font-size: 48px; color: #d4a843; margin-bottom: 12px; }
        .empty-state h3 { font-size: 20px; color: #1a3a6b; margin-bottom: 6px; }
        .empty-state p { color: #94a3b8; }

        /* ===== FOOTER ===== */
        .footer {
            background: #0a1628;
            color: rgba(255,255,255,0.6);
            padding: 24px 32px;
            text-align: center;
            font-size: 13px;
            margin-top: 20px;
        }
        .footer a { color: #d4a843; text-decoration: none; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .navbar { padding: 0 16px; }
            .navbar .nav-links { display: none; }
            .hero-slider { height: 250px; }
            .hero-slider .slide .overlay { padding: 20px 24px; }
            .hero-slider .slide .overlay h2 { font-size: 18px; }
            .hero-slider .slide .overlay p { font-size: 13px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .lightbox .nav-arrow { font-size: 20px; padding: 10px 14px; }
            .lightbox .close-btn { top: 12px; right: 12px; width: 44px; height: 44px; }
            .lightbox .close-btn i { font-size: 20px; }
            .year-selector { padding: 12px 16px; }
            .year-selector .year-btn { padding: 6px 14px; font-size: 12px; }
            .gallery-item .info { padding: 10px 12px; }
            .gallery-item .info .title { font-size: 13px; }
            .gallery-item .media-wrapper { padding-top: 100%; }
            .gallery-item .play-overlay { width: 48px; height: 48px; font-size: 20px; }
        }
        @media (max-width: 480px) {
            .hero-slider { height: 200px; }
            .hero-slider .nav-btn { width: 36px; height: 36px; font-size: 14px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
    <a href="#" class="brand">
        <img src="logo(1).png" alt="Logo">
        <div class="name">GSSS<span> SHILLA</span></div>
    </a>
    <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="#" class="active"><i class="fas fa-images"></i> Gallery</a></li>
    </ul>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<div class="container">

    <!-- ===== HERO SLIDER ===== -->
    <div class="hero-slider" id="heroSlider">
        <div class="slides" id="heroSlides">
            <div class="slide">
                <img src="https://via.placeholder.com/1200x420/1a3a6b/fff?text=Loading..." alt="Loading">
                <div class="overlay">
                    <h2>Welcome to Our Gallery</h2>
                    <p>Explore memories from GSSS Shilla</p>
                </div>
            </div>
        </div>
        <button class="nav-btn prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="nav-btn next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>
        <div class="dots" id="heroDots"></div>
    </div>

    <!-- ===== YEAR SELECTOR ===== -->
    <div class="year-selector" id="yearSelector">
        <button class="year-btn active" data-year="all" onclick="filterByYear('all')">📅 All Years</button>
    </div>

    <!-- ===== GALLERY GRID ===== -->
    <div id="galleryGrid" class="gallery-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i><br>Loading gallery...</div>
    </div>

</div>

<!-- ===== LIGHTBOX - FIXED ===== -->
<div class="lightbox" id="lightbox">
    <button class="close-btn" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
    <button class="nav-arrow prev" onclick="navigateLightbox(-1)"><i class="fas fa-chevron-left"></i></button>
    <button class="nav-arrow next" onclick="navigateLightbox(1)"><i class="fas fa-chevron-right"></i></button>
    <div class="lightbox-content" id="lightboxContent">
        <img src="" alt="" id="lightboxMedia">
        <div class="lightbox-info" id="lightboxInfo">
            <div class="title"></div>
            <div class="desc"></div>
        </div>
    </div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
    <div class="footer-content">
        <span>&copy; 2026 <a href="#">Govt. Sr. Sec. School Shilla</a>. All rights reserved.</span>
    </div>
</footer>

<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const API_BASE = 'https://gsssshilla.onrender.com';
    
    let allGalleryItems = [];
    let currentFilter = 'all';
    let currentSlideIndex = 0;
    let sliderItems = [];
    let lightboxItems = [];
    let lightboxIndex = 0;

    // ============================================================
    // LOAD HERO SLIDER
    // ============================================================
    async function loadHeroSlider() {
        try {
            const res = await fetch(`${API_BASE}/api/gallery/slider/admin/all`);
            const data = await res.json();
            
            if (data.success && data.data && data.data.length > 0) {
                sliderItems = data.data;
            } else {
                sliderItems = [
                    { file_path: 'https://via.placeholder.com/1200x420/1a3a6b/fff?text=GSSS+Shilla', title: 'GSSS Shilla', description: 'Welcome to our school gallery' }
                ];
            }
            
            renderSlider();
        } catch (error) {
            console.error('Slider load error:', error);
        }
    }

    function renderSlider() {
        const slidesContainer = document.getElementById('heroSlides');
        const dotsContainer = document.getElementById('heroDots');
        
        slidesContainer.innerHTML = sliderItems.map((item, index) => `
            <div class="slide" data-index="${index}">
                <img src="${item.file_path || 'https://via.placeholder.com/1200x420/1a3a6b/fff?text=No+Image'}" 
                     alt="${item.title || 'Gallery'}"
                     onerror="this.src='https://via.placeholder.com/1200x420/1a3a6b/fff?text=Image+Not+Found'">
                <div class="overlay">
                    <h2>${item.title || 'GSSS Shilla'}</h2>
                    <p>${item.description || 'Explore our school memories'}</p>
                </div>
            </div>
        `).join('');
        
        dotsContainer.innerHTML = sliderItems.map((_, index) => `
            <div class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>
        `).join('');
        
        currentSlideIndex = 0;
        updateSlider();
        
        if (sliderItems.length > 1) {
            clearInterval(window.sliderInterval);
            window.sliderInterval = setInterval(() => changeSlide(1), 5000);
        }
    }

    function updateSlider() {
        const slides = document.querySelector('#heroSlides');
        const dots = document.querySelectorAll('#heroDots .dot');
        
        if (slides) {
            slides.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
        }
        
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentSlideIndex);
        });
    }

    function changeSlide(direction) {
        if (!sliderItems.length) return;
        currentSlideIndex = (currentSlideIndex + direction + sliderItems.length) % sliderItems.length;
        updateSlider();
    }

    function goToSlide(index) {
        if (index < 0 || index >= sliderItems.length) return;
        currentSlideIndex = index;
        updateSlider();
    }

    // ============================================================
    // LOAD GALLERY ITEMS
    // ============================================================
    async function loadGalleryItems() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><br>Loading gallery...</div>';
        
        try {
            const year = currentFilter === 'all' ? new Date().getFullYear() : currentFilter;
            const res = await fetch(`${API_BASE}/api/gallery/images/public?year=${year}`);
            const data = await res.json();
            
            if (data.success && data.data && data.data.length > 0) {
                allGalleryItems = data.data;
                renderGallery(allGalleryItems);
            } else {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-images"></i>
                        <h3>No images found</h3>
                        <p>Check back later for new photos from ${year}</p>
                    </div>
                `;
            }
            
            loadYears();
            
        } catch (error) {
            console.error('Gallery load error:', error);
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                    <h3>Failed to load gallery</h3>
                    <p>Please refresh the page</p>
                </div>
            `;
        }
    }

    // ============================================================
    // RENDER GALLERY
    // ============================================================
    function renderGallery(items) {
        const grid = document.getElementById('galleryGrid');
        
        if (!items || items.length === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <i class="fas fa-images"></i>
                    <h3>No photos available</h3>
                    <p>Check back later for new memories</p>
                </div>
            `;
            return;
        }
        
        lightboxItems = items;
        
        grid.innerHTML = items.map((item, index) => {
            const isVideo = item.media_type === 'video';
            const mediaUrl = item.file_path || '';
            const thumbnailUrl = isVideo ? (item.video_thumbnail || mediaUrl.replace(/\.[^.]+$/, '.jpg')) : mediaUrl;
            const date = item.image_date ? new Date(item.image_date).toLocaleDateString('en-IN', { 
                day: 'numeric', month: 'short', year: 'numeric' 
            }) : '';
            
            return `
                <div class="gallery-item" onclick="openLightbox(${index})">
                    <div class="media-wrapper">
                        ${isVideo ? `
                            <video muted preload="metadata" poster="${thumbnailUrl}" id="video-${index}">
                                <source src="${mediaUrl}" type="${item.mime_type || 'video/mp4'}">
                            </video>
                            <div class="play-overlay" id="playOverlay-${index}">
                                <i class="fas fa-play play-icon"></i>
                                <i class="fas fa-pause pause-icon"></i>
                            </div>
                            <span class="media-type-badge"><i class="fas fa-video"></i> Video</span>
                        ` : `
                            <img src="${thumbnailUrl}" alt="${item.title || 'Gallery Image'}" 
                                 onerror="this.src='https://via.placeholder.com/400x300/1a3a6b/fff?text=No+Image'">
                            <span class="media-type-badge"><i class="fas fa-image"></i> Photo</span>
                        `}
                    </div>
                    <div class="info">
                        <div class="title">${item.title || 'Untitled'}</div>
                        ${item.description ? `<div class="desc">${item.description}</div>` : ''}
                        ${date ? `<div class="date"><i class="far fa-calendar-alt"></i> ${date}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // VIDEO HOVER CONTROLS
    // ============================================================
    document.addEventListener('mouseover', (e) => {
        const video = e.target.closest('video');
        if (video) {
            const overlay = video.parentElement.querySelector('.play-overlay');
            video.play().catch(() => {});
            if (overlay) overlay.classList.add('playing');
        }
    });

    document.addEventListener('mouseout', (e) => {
        const video = e.target.closest('video');
        if (video) {
            const overlay = video.parentElement.querySelector('.play-overlay');
            video.pause();
            video.currentTime = 0;
            if (overlay) overlay.classList.remove('playing');
        }
    });

    // ============================================================
    // LOAD YEARS
    // ============================================================
    async function loadYears() {
        try {
            const res = await fetch(`${API_BASE}/api/gallery/years`);
            const data = await res.json();
            
            const selector = document.getElementById('yearSelector');
            const allBtn = selector.querySelector('[data-year="all"]');
            selector.innerHTML = '';
            selector.appendChild(allBtn);
            
            if (data.success && data.years) {
                data.years.forEach(year => {
                    const btn = document.createElement('button');
                    btn.className = 'year-btn';
                    btn.dataset.year = year;
                    btn.textContent = `📅 ${year}`;
                    btn.onclick = () => filterByYear(year);
                    selector.appendChild(btn);
                });
            }
        } catch (error) {
            console.error('Years load error:', error);
        }
    }

    // ============================================================
    // FILTER BY YEAR
    // ============================================================
    function filterByYear(year) {
        currentFilter = year;
        
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.year == year);
        });
        
        loadGalleryItems();
    }

    // ============================================================
    // LIGHTBOX - FIXED
    // ============================================================
    function openLightbox(index) {
        lightboxIndex = index;
        const item = lightboxItems[index];
        if (!item) return;
        
        const lightbox = document.getElementById('lightbox');
        const media = document.getElementById('lightboxMedia');
        const info = document.getElementById('lightboxInfo');
        
        const isVideo = item.media_type === 'video';
        const mediaUrl = item.file_path || '';
        
        // Clear previous media
        media.style.display = 'block';
        media.innerHTML = '';
        
        if (isVideo) {
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.style.width = '100%';
            video.style.maxHeight = '80vh';
            video.style.background = '#0a1628';
            video.style.borderRadius = '12px 12px 0 0';
            
            const source = document.createElement('source');
            source.src = mediaUrl;
            source.type = item.mime_type || 'video/mp4';
            video.appendChild(source);
            
            // Fallback text
            const fallback = document.createElement('p');
            fallback.textContent = 'Your browser does not support the video tag.';
            fallback.style.color = 'white';
            fallback.style.padding = '20px';
            fallback.style.textAlign = 'center';
            video.appendChild(fallback);
            
            media.innerHTML = '';
            media.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = mediaUrl;
            img.alt = item.title || 'Gallery Image';
            img.style.width = '100%';
            img.style.maxHeight = '80vh';
            img.style.borderRadius = '12px 12px 0 0';
            img.onerror = function() {
                this.src = 'https://via.placeholder.com/800x600/1a3a6b/fff?text=Image+Not+Found';
            };
            media.innerHTML = '';
            media.appendChild(img);
        }
        
        info.innerHTML = `
            <div class="title">${item.title || 'Untitled'}</div>
            ${item.description ? `<div class="desc">${item.description}</div>` : ''}
        `;
        
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // Add click on lightbox background to close
        lightbox.onclick = function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        };
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
        
        // Pause any playing video
        const video = document.querySelector('#lightboxMedia video');
        if (video) video.pause();
    }

    function navigateLightbox(direction) {
        if (lightboxItems.length === 0) return;
        const newIndex = (lightboxIndex + direction + lightboxItems.length) % lightboxItems.length;
        openLightbox(newIndex);
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeLightbox();
        }
        if (e.key === 'ArrowLeft') {
            navigateLightbox(-1);
        }
        if (e.key === 'ArrowRight') {
            navigateLightbox(1);
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 Gallery Public Page Loaded');
        loadHeroSlider();
        loadGalleryItems();
    });
</script>

</body>
