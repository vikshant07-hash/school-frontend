<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Messages - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f0f4ff; color: #1a2332; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding: 20px 28px;
  background: linear-gradient(135deg, #0a1628, #142a5c);
  border-radius: 16px;
  color: white;
}
.header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
.header h1 i { color: #4a8af4; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  font-family: inherit;
}
.btn-primary { background: linear-gradient(135deg, #4a8af4, #1a3a7a); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(74, 138, 244, 0.35); }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
.btn-outline { background: rgba(255,255,255,0.06); color: white; border: 1px solid rgba(255,255,255,0.1); }
.btn-outline:hover { background: rgba(255,255,255,0.12); }

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.stat-box {
  background: white;
  padding: 18px 22px;
  border-radius: 16px;
  border: 1px solid #e8edf8;
  display: flex;
  align-items: center;
  gap: 14px;
}
.stat-box .icon-box { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.stat-box .icon-box.blue { background: #dbeafe; color: #3b82f6; }
.stat-box .icon-box.green { background: #dcfce7; color: #22c55e; }
.stat-box .icon-box.purple { background: #ede9fe; color: #8b5cf6; }
.stat-box .info .number { font-size: 22px; font-weight: 800; color: #0a1628; }
.stat-box .info .label { font-size: 12px; color: #94a3b8; font-weight: 500; }

.table-wrapper {
  background: white;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #e8edf8;
  overflow-x: auto;
}
.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.table-header h2 { font-size: 18px; font-weight: 700; color: #0a1628; }
.table-header h2 span { background: #dbeafe; color: #3b82f6; padding: 2px 12px; border-radius: 50px; font-size: 13px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
table thead { background: #f8faff; }
table th { padding: 12px 16px; text-align: left; font-weight: 600; color: #1a2332; border-bottom: 2px solid #e8edf8; }
table td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
table tr:hover { background: #f8faff; }
table .msg-cell { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table .date-cell { font-size: 12px; color: #64748b; white-space: nowrap; }

.action-btns { display: flex; gap: 6px; }

.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  z-index: 9998; display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white; border-radius: 16px; max-width: 500px; width: 100%;
  padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  animation: modalIn 0.3s ease; max-height: 90vh; overflow-y: auto;
}
@keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h3 { font-size: 18px; font-weight: 700; color: #0a1628; display: flex; align-items: center; gap: 10px; }
.modal-close { width: 36px; height: 36px; border: none; background: #f1f5f9; border-radius: 50%; font-size: 18px; cursor: pointer; transition: all 0.3s; }
.modal-close:hover { background: #fee2e2; color: #ef4444; }
.modal-body .msg-detail { background: #f8faff; padding: 16px; border-radius: 10px; margin-top: 10px; line-height: 1.7; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f1f5f9; }

.toast {
  position: fixed; bottom: 30px; right: 30px; background: #0a1628; color: white;
  padding: 16px 24px; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  display: flex; align-items: center; gap: 12px; transform: translateY(100px); opacity: 0;
  transition: all 0.5s ease; z-index: 9999; max-width: 400px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success i { color: #22c55e; }
.toast.error i { color: #ef4444; }

@media (max-width: 768px) {
  .header { flex-direction: column; align-items: stretch; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  table { font-size: 12px; }
  table th, table td { padding: 8px 10px; }
  .modal { padding: 20px; }
}
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <h1><i class="fas fa-envelope"></i> Contact Messages</h1>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="loadMessages()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-box">
      <div class="icon-box blue"><i class="fas fa-envelope"></i></div>
      <div class="info">
        <div class="number" id="totalCount">0</div>
        <div class="label">Total Messages</div>
      </div>
    </div>
    <div class="stat-box">
      <div class="icon-box green"><i class="fas fa-calendar-day"></i></div>
      <div class="info">
        <div class="number" id="todayCount">0</div>
        <div class="label">Today</div>
      </div>
    </div>
    <div class="stat-box">
      <div class="icon-box purple"><i class="fas fa-calendar-week"></i></div>
      <div class="info">
        <div class="number" id="weekCount">0</div>
        <div class="label">This Week</div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-header">
      <h2>All Messages <span id="msgCount">0</span></h2>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:50px;">#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th style="width:130px;">Date</th>
          <th style="width:120px;">Actions</th>
        </tr>
      </thead>
      <tbody id="messagesTableBody">
        <tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8;">
          <i class="fas fa-spinner fa-spin"></i> Loading messages...
        </td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- View Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i class="fas fa-envelope-open-text"></i> Message Details</h3>
      <button class="modal-close" onclick="closeViewModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p><strong>Name:</strong> <span id="viewName"></span></p>
      <p><strong>Email:</strong> <span id="viewEmail"></span></p>
      <p><strong>Date:</strong> <span id="viewDate"></span></p>
      <div class="msg-detail" id="viewMessage"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="deleteFromModal()"><i class="fas fa-trash-alt"></i> Delete</button>
      <button class="btn btn-primary" onclick="closeViewModal()">Close</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMessage">Success!</span>
</div>

<script>
const API_BASE = "https://gsssshilla.onrender.com";
let currentMessages = [];
let viewingId = null;

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.className = 'toast ' + type;
  document.getElementById('toastMessage').textContent = message;
  toast.classList.add('show');
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

async function loadMessages() {
  try {
    const response = await fetch(`${API_BASE}/admin/contact/messages`);
    const data = await response.json();
    if (data.success) {
      currentMessages = data.data || [];
      renderTable(currentMessages);
      updateStats(currentMessages);
      document.getElementById('msgCount').textContent = currentMessages.length;
    }
  } catch (error) {
    console.error('Error loading messages:', error);
    document.getElementById('messagesTableBody').innerHTML = `
      <tr><td colspan="6" style="text-align:center;padding:40px;color:#ef4444;">
        <i class="fas fa-exclamation-circle"></i> Failed to load messages
      </td></tr>
    `;
  }
}

function renderTable(messages) {
  if (!messages || messages.length === 0) {
    document.getElementById('messagesTableBody').innerHTML = `
      <tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8;">
        <i class="fas fa-inbox"></i> No messages found
      </td></tr>
    `;
    return;
  }

  document.getElementById('messagesTableBody').innerHTML = messages.map((item, index) => `
    <tr>
      <td>${index + 1}</td>
      <td><strong>${escapeHtml(item.name)}</strong></td>
      <td>${escapeHtml(item.email)}</td>
      <td class="msg-cell" title="${escapeHtml(item.message)}">${escapeHtml(item.message.substring(0, 80))}${item.message.length > 80 ? '...' : ''}</td>
      <td class="date-cell">${item.created_at_ist || item.created_at || 'N/A'}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-primary" onclick="viewMessage(${item.id})">
            <i class="fas fa-eye"></i>
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteMessage(${item.id})">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function updateStats(messages) {
  const total = messages.length;
  const today = messages.filter(m => {
    const date = new Date(m.created_at);
    const now = new Date();
    return date.toDateString() === now.toDateString();
  }).length;
  const week = messages.filter(m => {
    const date = new Date(m.created_at);
    const now = new Date();
    const weekAgo = new Date(now);
    weekAgo.setDate(weekAgo.getDate() - 7);
    return date >= weekAgo;
  }).length;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('todayCount').textContent = today;
  document.getElementById('weekCount').textContent = week;
}

function viewMessage(id) {
  const item = currentMessages.find(m => m.id === id);
  if (!item) return;
  viewingId = id;
  document.getElementById('viewName').textContent = item.name;
  document.getElementById('viewEmail').textContent = item.email;
  document.getElementById('viewDate').textContent = item.created_at_ist || item.created_at || 'N/A';
  document.getElementById('viewMessage').textContent = item.message;
  document.getElementById('viewModal').classList.add('active');
}

function closeViewModal() {
  document.getElementById('viewModal').classList.remove('active');
  viewingId = null;
}

function deleteFromModal() {
  if (viewingId) {
    deleteMessage(viewingId);
    closeViewModal();
  }
}

async function deleteMessage(id) {
  if (!confirm('Are you sure you want to delete this message?')) return;

  try {
    const response = await fetch(`${API_BASE}/admin/contact/messages/delete/${id}`, {
      method: 'DELETE'
    });
    const data = await response.json();
    if (data.success) {
      showToast('✅ Message deleted successfully!', 'success');
      loadMessages();
    } else {
      showToast(data.message || 'Failed to delete', 'error');
    }
  } catch (error) {
    showToast('Error deleting message', 'error');
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', () => {
  loadMessages();
  setInterval(loadMessages, 60000);
});

// Close modal on escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeViewModal();
});
</script>

</body>
</html>
