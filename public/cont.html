<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Info - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f0f4ff;
  color: #1a2332;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding: 20px 28px;
  background: linear-gradient(135deg, #0a1628, #142a5c);
  border-radius: 16px;
  color: white;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header h1 i {
  color: #4a8af4;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, #4a8af4, #1a3a7a);
  color: white;
  box-shadow: 0 4px 20px rgba(74, 138, 244, 0.25);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(74, 138, 244, 0.35);
}

.btn-success {
  background: #22c55e;
  color: white;
}

.btn-success:hover {
  background: #16a34a;
  transform: translateY(-2px);
}

.btn-outline {
  background: rgba(255, 255, 255, 0.06);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-outline:hover {
  background: rgba(255, 255, 255, 0.12);
  transform: translateY(-2px);
}

/* Form Card */
.form-card {
  background: white;
  border-radius: 16px;
  padding: 30px;
  border: 1px solid #e8edf8;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
}

.form-card h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  color: #0a1628;
  display: flex;
  align-items: center;
  gap: 10px;
}

.form-card h2 i {
  color: #4a8af4;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #1a2332;
  margin-bottom: 5px;
}

.form-group label .required {
  color: #ef4444;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #e8edf8;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s ease;
  background: #fafcff;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #4a8af4;
  box-shadow: 0 0 0 3px rgba(74, 138, 244, 0.08);
  background: white;
}

.form-group textarea {
  resize: vertical;
  min-height: 60px;
}

.form-group .helper-text {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 4px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  padding-top: 18px;
  border-top: 1px solid #f1f5f9;
}

/* Current Info Display */
.current-info {
  background: #f8faff;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 24px;
  border: 1px solid #e8edf8;
}

.current-info .info-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid #f1f5f9;
}

.current-info .info-row:last-child {
  border-bottom: none;
}

.current-info .info-row .label {
  color: #64748b;
  font-weight: 500;
}

.current-info .info-row .value {
  color: #0a1628;
  font-weight: 600;
  text-align: right;
  max-width: 60%;
  word-break: break-word;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: #0a1628;
  color: white;
  padding: 16px 24px;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.5s ease;
  z-index: 9999;
  max-width: 400px;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.success i {
  color: #22c55e;
}

.toast.error i {
  color: #ef4444;
}

.toast i {
  font-size: 20px;
  flex-shrink: 0;
}

.toast .toast-msg {
  font-size: 14px;
}

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: #94a3b8;
}

.loading i {
  font-size: 32px;
  margin-bottom: 12px;
  color: #4a8af4;
}

/* Responsive */
@media (max-width: 768px) {
  .header {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .header-actions {
    flex-wrap: wrap;
  }
  .header-actions .btn {
    flex: 1;
    justify-content: center;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
  .form-card {
    padding: 20px;
  }
  .current-info .info-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 0;
  }
  .current-info .info-row .value {
    text-align: left;
    max-width: 100%;
  }
}

@media (max-width: 480px) {
  .container {
    padding: 0 10px;
  }
  .form-card {
    padding: 16px;
  }
}
</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <h1><i class="fas fa-address-card"></i> Contact Info</h1>
    <div class="header-actions">
      <a href="/" target="_blank" class="btn btn-outline">
        <i class="fas fa-eye"></i> View Website
      </a>
      <button class="btn btn-primary" onclick="loadContactInfo()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
  </header>

  <!-- FORM CARD -->
  <div class="form-card">
    <h2><i class="fas fa-edit"></i> Update Contact Information</h2>

    <!-- Current Info Display -->
    <div class="current-info" id="currentInfo">
      <div class="info-row">
        <span class="label">🏫 School Name</span>
        <span class="value" id="currentSchool">Loading...</span>
      </div>
      <div class="info-row">
        <span class="label">📍 Address</span>
        <span class="value" id="currentAddress">Loading...</span>
      </div>
      <div class="info-row">
        <span class="label">📞 Phone</span>
        <span class="value" id="currentPhone">Loading...</span>
      </div>
      <div class="info-row">
        <span class="label">✉️ Email</span>
        <span class="value" id="currentEmail">Loading...</span>
      </div>
    </div>

    <!-- Update Form -->
    <form id="contactInfoForm">
      <div class="form-group">
        <label>School Name <span class="required">*</span></label>
        <input type="text" id="schoolName" placeholder="Enter school name..." required>
      </div>

      <div class="form-group">
        <label>Address <span class="required">*</span></label>
        <textarea id="address" placeholder="Enter full address..." rows="2" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="text" id="phone" placeholder="+91 98765 43210" required>
          <div class="helper-text">Include country code</div>
        </div>
        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" id="email" placeholder="info@school.edu.in" required>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success" id="submitBtn">
          <i class="fas fa-save"></i> Update Contact Info
        </button>
        <button type="button" class="btn btn-primary" onclick="loadContactInfo()">
          <i class="fas fa-undo"></i> Reset
        </button>
      </div>
    </form>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span class="toast-msg" id="toastMessage">Success!</span>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = "https://gsssshilla.onrender.com";

// ============================================================
// DOM ELEMENTS
// ============================================================
const form = document.getElementById('contactInfoForm');
const schoolName = document.getElementById('schoolName');
const address = document.getElementById('address');
const phone = document.getElementById('phone');
const email = document.getElementById('email');
const submitBtn = document.getElementById('submitBtn');

const currentSchool = document.getElementById('currentSchool');
const currentAddress = document.getElementById('currentAddress');
const currentPhone = document.getElementById('currentPhone');
const currentEmail = document.getElementById('currentEmail');

const toast = document.getElementById('toast');
const toastMessage = document.getElementById('toastMessage');

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = 'success') {
  toast.className = 'toast ' + type;
  toastMessage.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

// ============================================================
// LOAD CONTACT INFO
// ============================================================
async function loadContactInfo() {
  try {
    currentSchool.textContent = 'Loading...';
    currentAddress.textContent = 'Loading...';
    currentPhone.textContent = 'Loading...';
    currentEmail.textContent = 'Loading...';

    const response = await fetch(`${API_BASE}/admin/contact/info`);
    const data = await response.json();

    // Update current display
    currentSchool.textContent = data.school_name || 'GSS School Shilla';
    currentAddress.textContent = data.address || 'Shilla, Himachal Pradesh';
    currentPhone.textContent = data.phone || '+91 98765 43210';
    currentEmail.textContent = data.email || 'info@gssshilla.edu.in';

    // Update form fields
    schoolName.value = data.school_name || '';
    address.value = data.address || '';
    phone.value = data.phone || '';
    email.value = data.email || '';

  } catch (error) {
    console.error('Error loading contact info:', error);
    showToast('Failed to load contact info', 'error');
    
    // Set fallback values
    currentSchool.textContent = 'GSS School Shilla';
    currentAddress.textContent = 'Shilla, Himachal Pradesh';
    currentPhone.textContent = '+91 98765 43210';
    currentEmail.textContent = 'info@gssshilla.edu.in';
  }
}

// ============================================================
// UPDATE CONTACT INFO
// ============================================================
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    school_name: schoolName.value.trim(),
    address: address.value.trim(),
    phone: phone.value.trim(),
    email: email.value.trim()
  };

  // Validation
  if (!data.school_name || !data.address || !data.phone || !data.email) {
    showToast('❌ All fields are required!', 'error');
    return;
  }

  // Email validation
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(data.email)) {
    showToast('❌ Please enter a valid email address!', 'error');
    return;
  }

  try {
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
    submitBtn.disabled = true;

    const response = await fetch(`${API_BASE}/admin/contact/info/update`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.success) {
      showToast(result.message || '✅ Contact info updated successfully!', 'success');
      loadContactInfo(); // Reload data
    } else {
      showToast(result.message || '❌ Failed to update', 'error');
    }
  } catch (error) {
    console.error('Update error:', error);
    showToast('❌ Network error. Please try again.', 'error');
  } finally {
    submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Contact Info';
    submitBtn.disabled = false;
  }
});

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadContactInfo();
});
</script>

</body>
</html>
