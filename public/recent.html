<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recent Updates - School</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container { max-width: 880px; width: 100%; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            padding: 28px 32px;
            border-radius: 16px 16px 0 0;
            color: #fff;
            border-bottom: 4px solid #f59e0b;
        }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .header h1 span { color: #f59e0b; }
        .header p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: 4px; }

        .updates-box {
            background: #fff;
            border-radius: 0 0 16px 16px;
            border: 1px solid #e2e8f0;
            border-top: none;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .controls {
            padding: 12px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .controls .count {
            background: #0f172a;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .controls .status {
            font-size: 0.75rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
        }
        .controls .status .dot.paused { background: #ef4444; }
        .controls .btn {
            padding: 4px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .controls .btn:hover { background: #f1f5f9; border-color: #94a3b8; }
        .controls .btn-pause {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }
        .controls .btn-pause:hover { background: #fecaca; }
        .controls .btn-pause.active {
            background: #dcfce7;
            border-color: #86efac;
            color: #16a34a;
        }
        .controls .btn-pause.active:hover { background: #86efac; }

        .scrolling-wrapper {
            max-height: 520px;
            overflow-y: auto;
            padding: 12px 16px;
            scroll-behavior: smooth;
        }
        .scrolling-wrapper::-webkit-scrollbar { width: 5px; }
        .scrolling-wrapper::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .scrolling-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .scrolling-wrapper::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .update-card {
            padding: 14px 18px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
        }
        .update-card:last-child { border-bottom: none; }
        .update-card:hover { background: #f8fafc; }

        .update-card .date {
            font-size: 0.72rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .update-card .date .badge-new {
            background: #dcfce7;
            color: #16a34a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .update-card .title {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .update-card .title .file-icon { font-size: 0.9rem; }
        .update-card .description {
            font-size: 0.88rem;
            color: #475569;
            line-height: 1.6;
            margin: 4px 0 6px;
        }
        .update-card .description .read-more {
            color: #f59e0b;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .update-card .description .read-more:hover { text-decoration: underline; }
        .update-card .attachment {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 14px 2px 10px;
            background: #f1f5f9;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #475569;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-top: 4px;
        }
        .update-card .attachment:hover { background: #e2e8f0; color: #0f172a; }
        .update-card .attachment .size { color: #94a3b8; font-size: 0.65rem; }
        .update-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f1f5f9;
        }
        .update-card .meta .category {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .empty-state .icon { font-size: 2.6rem; margin-bottom: 8px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(6px);
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-content {
            background: #fff;
            margin: 6% auto;
            padding: 28px 32px;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 16px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            animation: scaleIn 0.3s ease;
        }
        .modal-content .close {
            float: right;
            font-size: 1.6rem;
            font-weight: 300;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-content .close:hover { color: #0f172a; }
        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        .modal-content .file-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
        }
        .modal-content .file-actions a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 500;
        }
        .modal-content .file-actions a:hover { text-decoration: underline; }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { padding: 20px; }
            .header h1 { font-size: 1.2rem; }
            .scrolling-wrapper { max-height: 400px; padding: 8px 12px; }
            .update-card { padding: 12px 14px; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .btn { padding: 4px 12px; font-size: 0.68rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>📢 <span>Recent</span> Updates</h1>
        <p>Stay updated with latest news & announcements</p>
    </div>

    <!-- UPDATES BOX -->
    <div class="updates-box">

        <!-- Controls -->
        <div class="controls">
            <div>
                <span class="count" id="updateCount">0</span>
                <span class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Loading...</span>
                </span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">
                    <span id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause</span>
                </button>
                <button class="btn" onclick="scrollTop()">⬆ Top</button>
                <button class="btn" onclick="scrollBottom()">⬇ Bottom</button>
            </div>
        </div>

        <!-- Scrolling Wrapper -->
        <div class="scrolling-wrapper" id="scrollingWrapper">
            <div id="updatesContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading updates...</p>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">© 2026 Govt. Sr. Sec. School, Shilla — All Rights Reserved</div>
</div>

<!-- MODAL -->
<div id="fileModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://gsssshilla.onrender.com';
    const SCROLL_STEP = 0.6;
    const SCROLL_INTERVAL = 40;

    let isPaused = false;
    let timer = null;
    let updates = [];
    let pos = 0;

    const wrapper = document.getElementById('scrollingWrapper');
    const container = document.getElementById('updatesContainer');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseLabel = document.getElementById('pauseLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const updateCount = document.getElementById('updateCount');

    // ============================================================
    // LOAD UPDATES
    // ============================================================
    async function loadUpdates() {
        try {
            const res = await fetch(`${API_URL}/recent/public`);
            const data = await res.json();

            if (data.success && data.data) {
                updates = data.data;
                updateCount.textContent = updates.length;
                render(updates);
                startScroll();
                statusText.textContent = 'Scrolling';
                statusDot.className = 'dot';
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
                statusText.textContent = 'No updates';
                statusDot.className = 'dot paused';
            }
        } catch (err) {
            console.error('Load error:', err);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠️</div>
                    <p>Failed to load updates</p>
                    <p style="font-size:0.85rem;">${err.message}</p>
                    <button onclick="loadUpdates()" style="margin-top:12px;padding:6px 20px;background:#0f172a;color:#fff;border:none;border-radius:8px;cursor:pointer;">Retry</button>
                </div>
            `;
            statusText.textContent = 'Error';
            statusDot.className = 'dot paused';
        }
    }

    // ============================================================
    // RENDER
    // ============================================================
    function render(items) {
        if (!items || items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No updates available</p>
                </div>
            `;
            return;
        }

        let html = '';
        items.forEach((item, i) => {
            const isNew = item.is_new === 1 || item.is_new_dynamic === 1;
            const date = formatDate(item.created_at);
            const hasFile = !!item.file_url;
            const size = item.file_size ? formatSize(item.file_size) : '';
            const icon = getFileIcon(item.file_type);
            const desc = item.description || '';
            const isLong = desc.length > 120;

            html += `
                <div class="update-card" style="animation-delay: ${i * 0.05}s">
                    <div class="date">
                        ${date}
                        ${isNew ? '<span class="badge-new">🆕 New</span>' : ''}
                    </div>
                    <div class="title">
                        ${hasFile ? `<span class="file-icon">${icon}</span>` : ''}
                        ${escapeHtml(item.title)}
                    </div>
                    ${desc ? `
                        <div class="description" id="desc-${item.id}">
                            ${escapeHtml(desc.substring(0, 120))}${isLong ? '...' : ''}
                            ${isLong ? `<span class="read-more" onclick="toggleReadMore(${item.id})">Read more</span>` : ''}
                        </div>
                    ` : ''}
                    ${hasFile ? `
                        <button class="attachment" onclick="openFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                            ${icon} Attachment ${size ? `<span class="size">(${size})</span>` : ''}
                        </button>
                    ` : ''}
                    <div class="meta">
                        <span>📅 ${date}</span>
                        <span class="category">${escapeHtml(item.category || 'general')}</span>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // ============================================================
    // READ MORE
    // ============================================================
    function toggleReadMore(id) {
        const el = document.getElementById(`desc-${id}`);
        if (!el) return;

        const full = updates.find(u => u.id === id)?.description || '';
        const isExpanded = el.classList.contains('expanded');

        if (isExpanded) {
            el.classList.remove('expanded');
            el.innerHTML = escapeHtml(full.substring(0, 120)) + '... <span class="read-more" onclick="toggleReadMore(' + id + ')">Read more</span>';
        } else {
            el.classList.add('expanded');
            el.innerHTML = escapeHtml(full) + ' <span class="read-more" onclick="toggleReadMore(' + id + ')">Read less</span>';
        }
    }

    // ============================================================
    // SCROLL
    // ============================================================
    function startScroll() {
        stopScroll();
        if (wrapper.scrollHeight <= wrapper.clientHeight) {
            statusText.textContent = 'All visible';
            return;
        }

        isPaused = false;
        updateUI();
        pos = 0;

        timer = setInterval(() => {
            if (!isPaused) {
                pos += SCROLL_STEP;
                if (pos >= wrapper.scrollHeight - wrapper.clientHeight) {
                    pos = 0;
                }
                wrapper.scrollTop = pos;
            }
        }, SCROLL_INTERVAL);
    }

    function stopScroll() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
    }

    // ============================================================
    // PAUSE
    // ============================================================
    function togglePause() {
        isPaused = !isPaused;
        updateUI();

        if (!isPaused && wrapper.scrollTop + wrapper.clientHeight >= wrapper.scrollHeight - 2) {
            pos = 0;
            wrapper.scrollTop = 0;
        }
    }

    function updateUI() {
        if (isPaused) {
            pauseIcon.textContent = '▶️';
            pauseLabel.textContent = 'Resume';
            pauseBtn.classList.add('active');
            statusText.textContent = 'Paused';
            statusDot.className = 'dot paused';
        } else {
            pauseIcon.textContent = '⏸️';
            pauseLabel.textContent = 'Pause';
            pauseBtn.classList.remove('active');
            statusText.textContent = 'Scrolling';
            statusDot.className = 'dot';
        }
    }

    function scrollTop() {
        wrapper.scrollTo({ top: 0, behavior: 'smooth' });
        pos = 0;
    }

    function scrollBottom() {
        wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
        pos = wrapper.scrollHeight - wrapper.clientHeight;
    }

    // ============================================================
    // MODAL
    // ============================================================
    function openFile(id, url, type, title) {
        const modal = document.getElementById('fileModal');
        const body = document.getElementById('modalBody');

        if (!url) {
            body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <h3>${title}</h3>
                    <p style="color:#94a3b8;">No attachment</p>
                </div>
            `;
            modal.style.display = 'block';
            return;
        }

        let preview = '';
        if (type?.startsWith('image/')) {
            preview = `<img src="${url}" style="max-width:100%;max-height:55vh;border-radius:8px;" />`;
        } else if (type?.startsWith('video/')) {
            preview = `<video controls style="max-width:100%;max-height:55vh;border-radius:8px;"><source src="${url}" type="${type}"></video>`;
        } else if (type?.startsWith('audio/')) {
            preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
        } else if (type === 'application/pdf') {
            preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;border-radius:8px;"></iframe>`;
        } else {
            preview = `
                <div style="text-align:center;padding:16px;">
                    <p style="margin-bottom:10px;">${type || 'File'}</p>
                    <a href="${url}" download style="padding:6px 20px;background:#0f172a;color:#fff;border-radius:8px;text-decoration:none;">Download</a>
                </div>
            `;
        }

        body.innerHTML = `
            <h3>${title}</h3>
            <div class="file-preview">${preview}</div>
            <div class="file-actions">
                <a href="${url}" target="_blank">🔗 Open</a>
                <a href="${url}" download>📥 Download</a>
            </div>
        `;

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

    // ============================================================
    // HELPERS
    // ============================================================
    function formatDate(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2);
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function formatSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getFileIcon(mime) {
        if (!mime) return '📄';
        if (mime.startsWith('image/')) return '🖼️';
        if (mime === 'application/pdf') return '📄';
        if (mime.startsWith('audio/')) return '🎵';
        if (mime.startsWith('video/')) return '🎬';
        return '📎';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // AUTO REFRESH
    // ============================================================
    setInterval(loadUpdates, 300000);

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🏛️ Public Page Loaded');
        console.log('📡 API:', API_URL);
        loadUpdates();
    });
</script>

</body>
</html>
