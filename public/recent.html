<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recent Updates - School</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 880px; width: 100%; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #1a3a6b, #2a5a9b);
            padding: 28px 32px;
            border-radius: 12px 12px 0 0;
            color: #fff;
            border-bottom: 3px solid #d4a843;
        }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .header h1 span { color: #d4a843; }
        .header p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: 4px; }

        .updates-box {
            background: #fff;
            border-radius: 0 0 12px 12px;
            border: 1px solid #e2e8f0;
            border-top: none;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .update-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: grid;
            grid-template-columns: 150px 1fr 140px;
            gap: 16px;
            align-items: center;
        }
        .update-item:last-child { border-bottom: none; }
        .update-item:hover { background: #f8fafc; }

        .update-item .col-date {
            font-size: 0.78rem;
            font-weight: 500;
            color: #64748b;
            white-space: nowrap;
        }
        .update-item .col-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
        }
        .update-item .col-file {
            text-align: right;
            white-space: nowrap;
        }
        .update-item .col-file .file-btn {
            background: #f1f5f9;
            border: none;
            border-radius: 6px;
            padding: 4px 14px;
            font-size: 0.75rem;
            color: #475569;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .update-item .col-file .file-btn:hover {
            background: #e2e8f0;
            color: #1a3a6b;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .empty-state .icon { font-size: 2.6rem; margin-bottom: 8px; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(4px);
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            margin: 6% auto;
            padding: 24px 28px;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 8px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
        .modal-content .close {
            float: right;
            font-size: 1.6rem;
            font-weight: 300;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-content .close:hover { color: #1e293b; }
        .modal-content img {
            max-width: 100%;
            border-radius: 6px;
        }
        .modal-content .file-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
        }
        .modal-content .file-actions a {
            color: #1a3a6b;
            text-decoration: none;
            font-weight: 500;
        }
        .modal-content .file-actions a:hover { text-decoration: underline; }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .header { padding: 20px; }
            .header h1 { font-size: 1.2rem; }
            .update-item {
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 12px 16px;
            }
            .update-item .col-date { font-size: 0.7rem; }
            .update-item .col-file { text-align: left; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>📢 <span>Recent</span> Updates</h1>
        <p>Stay updated with latest news & announcements</p>
    </div>

    <div class="updates-box">
        <div id="updatesContainer">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>No updates available</p>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 Govt. Sr. Sec. School, Shilla — All Rights Reserved</div>
</div>

<!-- MODAL -->
<div id="fileModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://gsssshilla.onrender.com';

    // ============================================================
    // LOAD UPDATES
    // ============================================================
    async function loadUpdates() {
        try {
            const res = await fetch(`${API_URL}/recent/public`);
            const data = await res.json();

            if (data.success && data.data && data.data.length > 0) {
                render(data.data);
            } else {
                document.getElementById('updatesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
            }
        } catch (err) {
            console.error('Load error:', err);
            document.getElementById('updatesContainer').innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠️</div>
                    <p>Failed to load updates</p>
                    <p style="font-size:0.85rem;color:#ef4444;">${err.message}</p>
                </div>
            `;
        }
    }

    // ============================================================
    // RENDER
    // ============================================================
    function render(items) {
        let html = '';
        items.forEach((item) => {
            const date = formatDate(item.created_at);
            const fileIcon = getFileIcon(item.file_type);
            const hasFile = !!item.file_url;

            html += `
                <div class="update-item">
                    <div class="col-date">${date}</div>
                    <div class="col-title">${escapeHtml(item.title)}</div>
                    <div class="col-file">
                        ${hasFile ? `
                            <button class="file-btn" onclick="viewFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                ${fileIcon} View
                            </button>
                        ` : '—'}
                    </div>
                </div>
            `;
        });

        document.getElementById('updatesContainer').innerHTML = html;
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function formatDate(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2);
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function getFileIcon(mime) {
        if (!mime) return '📄';
        if (mime.startsWith('image/')) return '🖼️';
        if (mime === 'application/pdf') return '📄';
        if (mime.startsWith('audio/')) return '🎵';
        if (mime.startsWith('video/')) return '🎬';
        return '📎';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // VIEW FILE
    // ============================================================
    function viewFile(id, url, type, title) {
        const modal = document.getElementById('fileModal');
        const body = document.getElementById('modalBody');

        if (!url) {
            body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <h3>${title}</h3>
                    <p style="color:#94a3b8;">No attachment</p>
                </div>
            `;
            modal.style.display = 'block';
            return;
        }

        let preview = '';
        if (type?.startsWith('image/')) {
            preview = `<img src="${url}" style="max-width:100%;max-height:55vh;border-radius:6px;" />`;
        } else if (type?.startsWith('video/')) {
            preview = `<video controls style="max-width:100%;max-height:55vh;"><source src="${url}" type="${type}"></video>`;
        } else if (type?.startsWith('audio/')) {
            preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
        } else if (type === 'application/pdf') {
            preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;"></iframe>`;
        } else {
            preview = `
                <div style="text-align:center;padding:16px;">
                    <p style="margin-bottom:10px;">${type || 'File'}</p>
                    <a href="${url}" download style="padding:6px 20px;background:#1a3a6b;color:#fff;border-radius:6px;text-decoration:none;">Download</a>
                </div>
            `;
        }

        body.innerHTML = `
            <h3>${title}</h3>
            <div class="file-preview">${preview}</div>
            <div class="file-actions">
                <a href="${url}" target="_blank">🔗 Open</a>
                <a href="${url}" download>📥 Download</a>
            </div>
        `;

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

    // ============================================================
    // AUTO REFRESH
    // ============================================================
    setInterval(loadUpdates, 300000);

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🏛️ Public Page Loaded');
        console.log('📡 API:', API_URL);
        loadUpdates();
    });
</script>

</body>
</html>
