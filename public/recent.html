<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recent Updates - School</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>

    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --primary: #1a3a6b;
            --primary-light: #2a5a9b;
            --primary-dark: #0f2a4b;
            --gold: #d4a843;
            --gold-light: #f0d68a;
            --bg: #f0f2f6;
            --card-bg: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #3d4a5c;
            --text-muted: #7a879a;
            --border: #dce1e8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 28px rgba(26, 58, 107, 0.10);
            --radius: 8px;
            --transition: 0.25s ease;
        }

        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           MAIN WRAPPER
           ============================================================ */
        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--primary);
            padding: 18px 24px;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 3px solid var(--gold);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--gold);
        }

        .header-text h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .header-text h1 span {
            color: var(--gold);
        }

        .header-text p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 1px;
        }

        .header-badge {
            background: var(--gold);
            color: var(--primary-dark);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 1.8s infinite;
        }

        /* ============================================================
           MAIN BOX
           ============================================================ */
        .updates-box {
            background: var(--card-bg);
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
            border-top: none;
            transition: box-shadow var(--transition);
        }

        .updates-box:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ============================================================
           CONTROLS BAR
           ============================================================ */
        .controls {
            padding: 10px 20px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls-left .count {
            background: var(--primary);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 12px;
            border-radius: 30px;
            min-width: 24px;
            text-align: center;
        }

        .controls-left .status {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-left .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            transition: background var(--transition);
        }

        .controls-left .status .dot.paused {
            background: #f87171;
        }

        .controls-right {
            display: flex;
            gap: 6px;
        }

        .btn {
            padding: 4px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            background: #fff;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover {
            background: var(--bg);
            border-color: #c0c8d4;
        }

        .btn-pause {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .btn-pause:hover {
            background: #fecaca;
        }

        .btn-pause.active {
            background: #dcfce7;
            border-color: #86efac;
            color: #16a34a;
        }

        .btn-pause.active:hover {
            background: #86efac;
        }

        .btn-icon {
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        /* ============================================================
           SCROLLING WRAPPER
           ============================================================ */
        .scrolling-wrapper {
            max-height: 520px;
            overflow-y: auto;
            padding: 6px 12px 12px 12px;
            scroll-behavior: smooth;
        }

        .scrolling-wrapper::-webkit-scrollbar {
            width: 5px;
        }

        .scrolling-wrapper::-webkit-scrollbar-track {
            background: #f1f3f6;
            border-radius: 10px;
        }

        .scrolling-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .scrolling-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .scrolling-wrapper {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f3f6;
        }

        /* ============================================================
           TABLE-LAYOUT — AS PER YOUR DESIGN
           ============================================================ */
        .update-item {
            display: grid;
            grid-template-columns: 140px 1fr 1fr 100px;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #f0f2f5;
            align-items: center;
            transition: background var(--transition);
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
            font-size: 0.88rem;
        }

        .update-item:last-child {
            border-bottom: none;
        }

        .update-item:hover {
            background: #fafbfc;
        }

        /* Date Column */
        .update-item .col-date {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .update-item .col-date .badge-new {
            display: inline-block;
            background: #dcfce7;
            color: #16a34a;
            font-size: 0.5rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* Title Column */
        .update-item .col-title {
            font-weight: 600;
            color: var(--text-primary);
            cursor: default;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .update-item .col-title .file-icon {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* Description Column */
        .update-item .col-desc {
            color: var(--text-secondary);
            font-size: 0.84rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            transition: all 0.3s;
            cursor: pointer;
        }

        .update-item .col-desc.expanded {
            -webkit-line-clamp: unset;
            display: block;
        }

        .update-item .col-desc .read-more {
            background: none;
            border: none;
            color: var(--primary-light);
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            margin-left: 4px;
            transition: color var(--transition);
        }

        .update-item .col-desc .read-more:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* File Column */
        .update-item .col-file {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .update-item .col-file .file-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fff;
        }

        .update-item .col-file .file-btn:hover {
            background: var(--bg);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .update-item .col-file .file-btn .size {
            color: var(--text-muted);
            font-size: 0.6rem;
        }

        /* ============================================================
           LOADING / EMPTY
           ============================================================ */
        .loading-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 2.6rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            margin: 6% auto;
            padding: 28px 32px;
            width: 100%;
            max-width: 640px;
            max-height: 90vh;
            border-radius: var(--radius);
            overflow-y: auto;
            animation: scaleIn 0.25s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }

        .modal-content .close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.6rem;
            font-weight: 300;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
            background: none;
            border: none;
            line-height: 1;
        }

        .modal-content .close:hover {
            color: var(--text-primary);
        }

        .modal-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text-primary);
            padding-right: 32px;
        }

        .modal-content .file-preview {
            text-align: center;
            padding: 8px 0;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 4px;
            object-fit: contain;
        }

        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: 4px;
        }

        .modal-content .file-actions {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .modal-content .file-actions a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color var(--transition);
        }

        .modal-content .file-actions a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .update-item {
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 12px 14px;
            }

            .update-item .col-date {
                font-size: 0.72rem;
                order: 1;
            }

            .update-item .col-title {
                font-size: 0.92rem;
                order: 2;
            }

            .update-item .col-desc {
                font-size: 0.84rem;
                -webkit-line-clamp: 2;
                order: 3;
            }

            .update-item .col-file {
                justify-content: flex-start;
                order: 4;
                margin-top: 2px;
            }

            .update-item .col-file .file-btn {
                font-size: 0.68rem;
                padding: 2px 10px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
            }

            .header-text h1 {
                font-size: 1rem;
            }

            .controls {
                padding: 8px 14px;
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left {
                justify-content: space-between;
            }

            .controls-right {
                justify-content: flex-start;
            }

            .scrolling-wrapper {
                max-height: 400px;
                padding: 4px 10px 10px 10px;
            }

            .modal-content {
                padding: 20px;
                margin: 10% auto;
            }
        }

        @media (max-width: 400px) {
            .controls-left {
                flex-wrap: wrap;
            }
            .btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .update-item .col-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon">🏛️</div>
                <div class="header-text">
                    <h1>📢 <span>Recent</span> Updates</h1>
                    <p>Govt. Sr. Sec. School, Shilla</p>
                </div>
            </div>
            <div class="header-badge">
                <span class="dot"></span>
                <span>Live</span>
            </div>
        </header>

        <!-- ===== UPDATES BOX ===== -->
        <section class="updates-box">

            <!-- Controls -->
            <div class="controls">
                <div class="controls-left">
                    <span class="count" id="updateCount">0</span>
                    <span class="status">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">Loading...</span>
                    </span>
                </div>
                <div class="controls-right">
                    <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">
                        <span id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause</span>
                    </button>
                    <button class="btn btn-icon" onclick="scrollTop()" title="Top">⬆</button>
                    <button class="btn btn-icon" onclick="scrollBottom()" title="Bottom">⬇</button>
                </div>
            </div>

            <!-- Scrolling Wrapper -->
            <div class="scrolling-wrapper" id="scrollingWrapper">
                <div id="updatesContainer">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading updates...</p>
                    </div>
                </div>
            </div>

        </section>

    </div>

    <!-- ===== FILE MODAL ===== -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const API_URL = 'https://gsssshilla.onrender.com';
        const SCROLL_STEP = 0.65;
        const SCROLL_INTERVAL = 40;

        // ============================================================
        // STATE
        // ============================================================
        let isPaused = false;
        let timer = null;
        let updates = [];
        let pos = 0;

        // ============================================================
        // DOM REFS
        // ============================================================
        const wrapper = document.getElementById('scrollingWrapper');
        const container = document.getElementById('updatesContainer');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const pauseLabel = document.getElementById('pauseLabel');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const updateCount = document.getElementById('updateCount');

        // ============================================================
        // FETCH UPDATES
        // ============================================================
        async function loadUpdates() {
            try {
                const res = await fetch(`${API_URL}/recent-public?t=${Date.now()}`);
                const data = await res.json();

                if (data.success && data.data) {
                    updates = data.data;
                    updateCount.textContent = updates.length;
                    render(updates);
                    startScroll();
                    statusText.textContent = 'Scrolling';
                    statusDot.className = 'dot';
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>No updates available</p>
                        </div>
                    `;
                    statusText.textContent = 'No updates';
                    statusDot.className = 'dot paused';
                }
            } catch (err) {
                console.error('Load error:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Failed to load updates</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${err.message}</p>
                        <button onclick="loadUpdates()" style="margin-top:12px;padding:6px 20px;background:var(--primary);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:500;cursor:pointer;">Retry</button>
                    </div>
                `;
                statusText.textContent = 'Error';
                statusDot.className = 'dot paused';
            }
        }

        // ============================================================
        // RENDER — TABLE LAYOUT AS PER YOUR DESIGN
        // ============================================================
        function render(items) {
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach((item, i) => {
                const isNew = item.is_new === 1 || item.is_new_dynamic === 1;
                const date = formatDate(item.created_at);
                const hasFile = !!item.file_url;
                const size = item.file_size ? formatSize(item.file_size) : '';
                const icon = getFileIcon(item.file_type);
                const desc = item.description || '';
                const isLong = desc.length > 100;

                html += `
                    <div class="update-item" style="animation-delay: ${i * 0.04}s">
                        <!-- DATE -->
                        <div class="col-date">
                            ${date}
                            ${isNew ? '<span class="badge-new">New</span>' : ''}
                        </div>

                        <!-- TITLE -->
                        <div class="col-title">
                            ${hasFile ? `<span class="file-icon">${icon}</span>` : ''}
                            ${escapeHtml(item.title)}
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="col-desc" id="desc-${item.id}" onclick="toggleReadMore(${item.id})">
                            ${escapeHtml(desc.substring(0, 100))}${isLong ? '...' : ''}
                            ${isLong ? `<span class="read-more">Read more</span>` : ''}
                        </div>

                        <!-- FILE -->
                        <div class="col-file">
                            ${hasFile ? `
                                <button class="file-btn" onclick="openFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                    ${icon} ${size ? `<span class="size">${size}</span>` : '📎'}
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // READ MORE
        // ============================================================
        function toggleReadMore(id) {
            const el = document.getElementById(`desc-${id}`);
            if (!el) return;

            const full = updates.find(u => u.id === id)?.description || '';
            const isExpanded = el.classList.contains('expanded');

            if (isExpanded) {
                el.classList.remove('expanded');
                el.innerHTML = escapeHtml(full.substring(0, 100)) + '... <span class="read-more">Read more</span>';
            } else {
                el.classList.add('expanded');
                el.innerHTML = escapeHtml(full) + ' <span class="read-more">Read less</span>';
            }
        }

        // ============================================================
        // SCROLL
        // ============================================================
        function startScroll() {
            stopScroll();
            if (wrapper.scrollHeight <= wrapper.clientHeight) {
                statusText.textContent = 'All visible';
                return;
            }

            isPaused = false;
            updateUI();
            pos = 0;

            timer = setInterval(() => {
                if (!isPaused) {
                    pos += SCROLL_STEP;
                    if (pos >= wrapper.scrollHeight - wrapper.clientHeight) {
                        pos = 0;
                    }
                    wrapper.scrollTop = pos;
                }
            }, SCROLL_INTERVAL);
        }

        function stopScroll() {
            if (timer) { clearInterval(timer);
                timer = null; }
        }

        // ============================================================
        // PAUSE
        // ============================================================
        function togglePause() {
            isPaused = !isPaused;
            updateUI();

            if (!isPaused && wrapper.scrollTop + wrapper.clientHeight >= wrapper.scrollHeight - 2) {
                pos = 0;
                wrapper.scrollTop = 0;
            }
        }

        function updateUI() {
            if (isPaused) {
                pauseIcon.textContent = '▶️';
                pauseLabel.textContent = 'Resume';
                pauseBtn.classList.add('active');
                statusText.textContent = 'Paused';
                statusDot.className = 'dot paused';
            } else {
                pauseIcon.textContent = '⏸️';
                pauseLabel.textContent = 'Pause';
                pauseBtn.classList.remove('active');
                statusText.textContent = 'Scrolling';
                statusDot.className = 'dot';
            }
        }

        // ============================================================
        // SCROLL CONTROLS
        // ============================================================
        function scrollTop() {
            wrapper.scrollTo({ top: 0, behavior: 'smooth' });
            pos = 0;
        }

        function scrollBottom() {
            wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
            pos = wrapper.scrollHeight - wrapper.clientHeight;
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openFile(id, url, type, title) {
            const modal = document.getElementById('fileModal');
            const body = document.getElementById('modalBody');

            if (!url) {
                body.innerHTML = `
                    <div style="text-align:center;padding:20px 0;">
                        <div style="font-size:2.8rem;margin-bottom:6px;">📄</div>
                        <h3>${title}</h3>
                        <p style="color:var(--text-muted);">No attachment</p>
                    </div>
                `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';
            if (type?.startsWith('image/')) {
                preview = `<img src="${url}" alt="${title}" style="max-width:100%;max-height:55vh;border-radius:4px;" />`;
            } else if (type?.startsWith('video/')) {
                preview = `<video controls style="max-width:100%;max-height:55vh;border-radius:4px;"><source src="${url}" type="${type}"></video>`;
            } else if (type?.startsWith('audio/')) {
                preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
            } else if (type === 'application/pdf') {
                preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;border-radius:4px;"></iframe>`;
            } else {
                preview = `
                    <div style="text-align:center;padding:16px 0;">
                        <div style="font-size:3rem;margin-bottom:6px;">📎</div>
                        <p style="color:var(--text-secondary);margin-bottom:8px;">${type || 'File'}</p>
                        <a href="${url}" download style="padding:6px 20px;background:var(--primary);color:#fff;border-radius:4px;text-decoration:none;font-weight:500;">Download</a>
                    </div>
                `;
            }

            body.innerHTML = `
                <h3>${title}</h3>
                <div class="file-preview">${preview}</div>
                <div class="file-actions">
                    <a href="${url}" target="_blank">🔗 Open</a>
                    <a href="${url}" download>📥 Download</a>
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

        // ============================================================
        // HELPERS
        // ============================================================
        function formatDate(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts);
            const now = Date.now();
            const diff = now - d.getTime();

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
            if (diff < 172800000) return 'Yesterday';
            return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit',
                minute: '2-digit', hour12: true });
        }

        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function getFileIcon(mime) {
            if (!mime) return '📄';
            if (mime.startsWith('image/')) return '🖼️';
            if (mime === 'application/pdf') return '📄';
            if (mime.startsWith('audio/')) return '🎵';
            if (mime.startsWith('video/')) return '🎬';
            return '📎';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // AUTO REFRESH (5 min)
        // ============================================================
        setInterval(loadUpdates, 300000);

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🏛️ Govt-Style Table Layout Loaded');
            console.log('📡 API:', API_URL);
            loadUpdates();
        });
    </script>

</body>
