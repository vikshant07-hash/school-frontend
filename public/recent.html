<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recent Updates - School</title>
    <style>
        /* ============================================================
           THEME: Navy Blue (#1a3a6b) + Gold (#d4a843) + White
           ABSOLUTE BOX - AUTO SLIDE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1a3a6b, #2a5a9b);
            padding: 20px 28px;
            border-radius: 10px 10px 0 0;
            color: #ffffff;
            border-bottom: 4px solid #d4a843;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .header h1 span { color: #d4a843; }
        .header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .header-badge {
            background: #d4a843;
            color: #1a3a6b;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* ============================================================
           ABSOLUTE UPDATE BOX
           ============================================================ */
        .updates-box {
            background: #ffffff;
            border-radius: 0 0 10px 10px;
            border: 1px solid #e2e8f0;
            border-top: none;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(26, 58, 107, 0.08);
            width: 100%;
            max-width: 420px;
            height: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== CONTROLS - Clean & Clear ===== */
        .controls {
            padding: 10px 18px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .controls .info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: #64748b;
        }
        .controls .info .count {
            background: #1a3a6b;
            color: #ffffff;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .controls .info .status {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .controls .info .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse-dot 1.8s infinite;
        }
        .controls .info .status .dot.paused {
            background: #ef4444;
            animation: none;
        }

        .controls .btn-group {
            display: flex;
            gap: 4px;
        }
        .controls .btn {
            padding: 4px 12px;
            border: 1px solid #dce1e8;
            border-radius: 4px;
            background: #ffffff;
            font-size: 0.65rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .controls .btn:hover {
            background: #f1f5f9;
            border-color: #1a3a6b;
        }
        .controls .btn-pause {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }
        .controls .btn-pause:hover {
            background: #fecaca;
        }
        .controls .btn-pause.active {
            background: #dcfce7;
            border-color: #86efac;
            color: #16a34a;
        }
        .controls .btn-pause.active:hover {
            background: #86efac;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ============================================================
           SLIDER WRAPPER
           ============================================================ */
        .slider-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            padding: 0 6px;
        }

        .slider-track {
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* ============================================================
           UPDATE ITEM
           ============================================================ */
        .update-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            min-height: 70px;
            transition: background 0.2s;
        }
        .update-item:last-child { border-bottom: none; }
        .update-item:hover {
            background: #f8fafc;
            border-left: 3px solid #d4a843;
        }

        /* Date - Left */
        .update-item .col-date {
            font-size: 0.68rem;
            font-weight: 600;
            color: #64748b;
            white-space: nowrap;
            min-width: 110px;
            letter-spacing: 0.02em;
        }

        /* Title - Center */
        .update-item .col-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #1a2332;
            flex: 1;
            cursor: default;
            transition: color 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .update-item .col-title:hover {
            color: #1a3a6b;
        }

        /* File Icon - Right */
        .update-item .col-file {
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .update-item .col-file .file-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
            color: #94a3b8;
        }
        .update-item .col-file .file-btn:hover {
            background: #f1f5f9;
            color: #1a3a6b;
            transform: scale(1.1);
        }

        /* ===== PROGRESS INDICATOR ===== */
        .progress-indicator {
            padding: 6px 0 10px 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dce1e8;
            transition: all 0.3s;
            cursor: pointer;
        }
        .progress-dot.active {
            background: #1a3a6b;
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(26, 58, 107, 0.3);
        }
        .progress-dot:hover {
            background: #d4a843;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loading-state .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #d4a843;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .empty-state .icon {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(26, 58, 107, 0.45);
            backdrop-filter: blur(6px);
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-content {
            background: #ffffff;
            margin: 6% auto;
            padding: 24px 28px;
            max-width: 560px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            animation: scaleIn 0.3s ease;
        }
        .modal-content .close {
            float: right;
            font-size: 1.8rem;
            font-weight: 300;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .modal-content .close:hover { color: #1a3a6b; }
        .modal-content h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a3a6b;
            margin-bottom: 14px;
        }
        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: 8px;
        }
        .modal-content .file-actions {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .modal-content .file-actions a {
            color: #1a3a6b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
        }
        .modal-content .file-actions a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.6rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }
        .footer strong { color: #1a3a6b; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { padding: 16px 18px; flex-direction: column; align-items: flex-start; }
            .header h1 { font-size: 1.1rem; }
            .updates-box {
                max-width: 100%;
                height: 380px;
            }
            .update-item {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 4px;
                min-height: 60px;
            }
            .update-item .col-date {
                font-size: 0.6rem;
                min-width: auto;
                width: 100%;
                order: 1;
            }
            .update-item .col-title {
                font-size: 0.82rem;
                order: 2;
                width: calc(100% - 40px);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .update-item .col-file {
                order: 3;
            }
            .controls {
                padding: 8px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .controls .info {
                justify-content: space-between;
            }
            .controls .btn-group {
                justify-content: flex-start;
            }
            .modal-content {
                padding: 16px 18px;
                margin: 10% auto;
            }
        }

        @media (max-width: 480px) {
            .updates-box {
                height: 340px;
            }
            .update-item .col-title {
                font-size: 0.78rem;
                width: calc(100% - 30px);
            }
            .update-item .col-file .file-btn {
                font-size: 0.85rem;
            }
            .controls .btn {
                font-size: 0.58rem;
                padding: 3px 10px;
            }
            .header h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div>
            <h1>📢 <span>Recent</span> Updates</h1>
            <p>Govt. Sr. Sec. School, Shilla</p>
        </div>
        <div class="header-badge">🔴 Live</div>
    </div>

    <!-- ============================================================
    ABSOLUTE UPDATES BOX
    ============================================================ -->
    <div class="updates-box">

        <!-- Controls -->
        <div class="controls">
            <div class="info">
                <span class="count" id="updateCount">0</span>
                <span class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Loading...</span>
                </span>
            </div>
            <div class="btn-group">
                <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">
                    <span id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause</span>
                </button>
                <button class="btn" onclick="goToPrev()" title="Previous">⬆</button>
                <button class="btn" onclick="goToNext()" title="Next">⬇</button>
            </div>
        </div>

        <!-- Slider -->
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">
                <div id="updatesContainer">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading updates...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Dots -->
        <div class="progress-indicator" id="progressDots"></div>

    </div>

    <div class="footer">© 2026 <strong>Govt. Sr. Sec. School, Shilla</strong> — All Rights Reserved</div>
</div>

<!-- ===== MODAL ===== -->
<div id="fileModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://gsssshilla.onrender.com';
    const ITEM_HEIGHT = 70; // Approximate height per item
    let currentIndex = 0;
    let totalItems = 0;
    let isPaused = false;
    let slideTimer = null;
    let updates = [];

    const sliderTrack = document.getElementById('sliderTrack');
    const container = document.getElementById('updatesContainer');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseLabel = document.getElementById('pauseLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const updateCount = document.getElementById('updateCount');
    const progressDots = document.getElementById('progressDots');

    // ============================================================
    // LOAD UPDATES
    // ============================================================
    async function loadUpdates() {
        try {
            const res = await fetch(`${API_URL}/recent/public`);
            const data = await res.json();

            if (data.success && data.data && data.data.length > 0) {
                updates = data.data;
                totalItems = updates.length;
                updateCount.textContent = totalItems;
                render(updates);
                updateProgressDots();
                startAutoSlide();
                statusText.textContent = 'Auto-slide';
                statusDot.className = 'dot';
            } else {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
                statusText.textContent = 'No updates';
                statusDot.className = 'dot paused';
                document.getElementById('progressDots').innerHTML = '';
            }
        } catch (err) {
            console.error('Load error:', err);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠️</div>
                    <p>Failed to load updates</p>
                    <p style="font-size:0.8rem;color:#ef4444;">${err.message}</p>
                    <button onclick="loadUpdates()" style="margin-top:10px;padding:6px 18px;background:#1a3a6b;color:#fff;border:none;border-radius:6px;cursor:pointer;">Retry</button>
                </div>
            `;
            statusText.textContent = 'Error';
            statusDot.className = 'dot paused';
        }
    }

    // ============================================================
    // RENDER - Government Style
    // ============================================================
    function render(items) {
        if (!items || items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>No updates available</p>
                </div>
            `;
            return;
        }

        let html = '';
        items.forEach((item) => {
            const date = item.created_at_ist || formatDate(item.created_at);
            const hasFile = !!item.file_url;

            html += `
                <div class="update-item">
                    <div class="col-date">${date}</div>
                    <div class="col-title">${escapeHtml(item.title)}</div>
                    <div class="col-file">
                        ${hasFile ? `
                            <button class="file-btn" onclick="viewFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')" title="View attachment">
                                📎
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // ============================================================
    // AUTO SLIDE - Fast & Smooth
    // ============================================================
    function startAutoSlide() {
        stopAutoSlide();
        if (totalItems <= 1) {
            statusText.textContent = 'Only 1 update';
            return;
        }

        isPaused = false;
        updateUI();
        currentIndex = 0;

        slideTimer = setInterval(() => {
            if (!isPaused) {
                goToNext();
            }
        }, 3000); // 3 seconds per slide (fast)
    }

    function stopAutoSlide() {
        if (slideTimer) {
            clearInterval(slideTimer);
            slideTimer = null;
        }
    }

    // ============================================================
    // SLIDE NAVIGATION
    // ============================================================
    function goToNext() {
        if (totalItems <= 1) return;
        currentIndex = (currentIndex + 1) % totalItems;
        updateSlide();
    }

    function goToPrev() {
        if (totalItems <= 1) return;
        currentIndex = (currentIndex - 1 + totalItems) % totalItems;
        updateSlide();
    }

    function goToIndex(index) {
        if (index < 0 || index >= totalItems) return;
        currentIndex = index;
        updateSlide();
    }

    function updateSlide() {
        const wrapper = document.querySelector('.slider-wrapper');
        const wrapperHeight = wrapper ? wrapper.clientHeight : 400;
        const offset = currentIndex * ITEM_HEIGHT;
        sliderTrack.style.transform = `translateY(-${offset}px)`;
        updateProgressDots();
    }

    // ============================================================
    // PROGRESS DOTS
    // ============================================================
    function updateProgressDots() {
        if (totalItems <= 1) {
            progressDots.innerHTML = '';
            return;
        }

        let html = '';
        for (let i = 0; i < totalItems; i++) {
            html += `
                <span class="progress-dot ${i === currentIndex ? 'active' : ''}" 
                      onclick="goToIndex(${i})" 
                      title="Go to update ${i + 1}">
                </span>
            `;
        }
        progressDots.innerHTML = html;
    }

    // ============================================================
    // PAUSE / RESUME
    // ============================================================
    function togglePause() {
        isPaused = !isPaused;
        updateUI();

        if (!isPaused && slideTimer === null) {
            startAutoSlide();
        }
    }

    function updateUI() {
        if (isPaused) {
            pauseIcon.textContent = '▶️';
            pauseLabel.textContent = 'Resume';
            pauseBtn.classList.add('active');
            statusText.textContent = 'Paused';
            statusDot.className = 'dot paused';
        } else {
            pauseIcon.textContent = '⏸️';
            pauseLabel.textContent = 'Pause';
            pauseBtn.classList.remove('active');
            statusText.textContent = 'Auto-slide';
            statusDot.className = 'dot';
        }
    }

    // ============================================================
    // VIEW FILE - MODAL
    // ============================================================
    function viewFile(id, url, type, title) {
        const modal = document.getElementById('fileModal');
        const body = document.getElementById('modalBody');

        if (!url) {
            body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <h3>${title}</h3>
                    <p style="color:#94a3b8;">No attachment available</p>
                </div>
            `;
            modal.style.display = 'block';
            return;
        }

        let preview = '';
        if (type?.startsWith('image/')) {
            preview = `<img src="${url}" style="max-width:100%;max-height:55vh;border-radius:8px;" />`;
        } else if (type?.startsWith('video/')) {
            preview = `<video controls style="max-width:100%;max-height:55vh;border-radius:8px;"><source src="${url}" type="${type}"></video>`;
        } else if (type?.startsWith('audio/')) {
            preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
        } else if (type === 'application/pdf') {
            preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;border-radius:8px;"></iframe>`;
        } else {
            preview = `
                <div style="text-align:center;padding:16px;">
                    <p style="margin-bottom:10px;color:#475569;">${type || 'File'}</p>
                    <a href="${url}" download style="padding:8px 24px;background:#1a3a6b;color:#fff;border-radius:6px;text-decoration:none;display:inline-block;">📥 Download</a>
                </div>
            `;
        }

        body.innerHTML = `
            <h3>${title}</h3>
            <div class="file-preview">${preview}</div>
            <div class="file-actions">
                <a href="${url}" target="_blank">🔗 Open in new tab</a>
                <a href="${url}" download>📥 Download</a>
            </div>
        `;

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

    // ============================================================
    // HELPERS
    // ============================================================
    function formatDate(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        d.setHours(d.getHours() + 5);
        d.setMinutes(d.getMinutes() + 30);

        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2);
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // AUTO REFRESH (5 min)
    // ============================================================
    setInterval(loadUpdates, 300000);

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🏛️ Government Auto-Slide Page Loaded');
        console.log('📡 API:', API_URL);
        loadUpdates();
    });
</script>

</body>
</html>
