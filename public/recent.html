<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Updates - Govt. Sr. Sec. School Shilla</title>
    
    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a2332;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 25px 0;
            border-bottom: 3px solid #facc15;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .school-badge {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-icon {
            font-size: 2.5rem;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 12px;
        }

        .school-badge h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .school-badge p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .header-title {
            text-align: right;
        }

        .header-title h2 {
            font-size: 1.3rem;
            color: #facc15;
        }

        .header-title p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        .main {
            padding: 30px 0 50px;
        }

        /* ============================================
           UPDATES SECTION
           ============================================ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-header h3 {
            font-size: 1.4rem;
            color: #1a2332;
        }

        .update-count {
            font-size: 0.85rem;
            color: #6b7280;
            background: white;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        /* ============================================
           UPDATES WRAPPER - SCROLLING
           ============================================ */
        .updates-wrapper {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-height: 600px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .updates-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .updates-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .updates-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .updates-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ============================================
           UPDATE CARD
           ============================================ */
        .update-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 4px solid #3b82f6;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .update-card:last-child {
            margin-bottom: 0;
        }

        .update-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .update-card .update-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .update-card .title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a2332;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-card .title:hover {
            color: #3b82f6;
        }

        .update-card .title .file-icon {
            font-size: 1.1rem;
        }

        .update-card .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            animation: pulse 2s infinite;
        }

        .update-card .badge.new {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fca5a5;
        }

        .update-card .badge.old {
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            animation: none;
        }

        .update-card .description {
            color: #4b5563;
            font-size: 0.9rem;
            margin: 8px 0 10px;
            line-height: 1.5;
        }

        .update-card .attachment-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3b82f6;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 6px;
            background: #eff6ff;
            transition: all 0.2s;
            border: none;
        }

        .update-card .attachment-link:hover {
            background: #dbeafe;
        }

        .update-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: #6b7280;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            margin-top: 10px;
        }

        .update-card .meta .date {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .update-card .meta .category {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            background: #eff6ff;
            color: #3b82f6;
            font-size: 0.65rem;
            text-transform: capitalize;
            font-weight: 500;
        }

        /* ============================================
           LOADING STATE
           ============================================ */
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ============================================
           LOAD MORE BUTTON
           ============================================ */
        .load-more {
            text-align: center;
            margin-top: 20px;
        }

        .btn-load-more {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-load-more:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            background: #1a2332;
            color: #94a3b8;
            padding: 20px 0;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #2a3a5a;
        }

        .footer .footer-powered {
            font-size: 0.75rem;
            color: #475569;
            margin-top: 4px;
        }

        /* ============================================
           MODAL
           ============================================ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            position: relative;
            background: white;
            margin: 5% auto;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }

        .modal-content .close {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 2rem;
            font-weight: bold;
            color: #6b7280;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-content .close:hover {
            color: #1a2332;
        }

        .modal-content img,
        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: 8px;
        }

        .modal-content .file-preview {
            text-align: center;
            padding: 20px;
        }

        .modal-content .file-preview .file-icon-big {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .modal-loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-title {
                text-align: center;
            }

            .school-badge {
                flex-direction: column;
                text-align: center;
            }

            .section-header {
                flex-direction: column;
                text-align: center;
            }

            .update-card {
                padding: 14px 16px;
            }

            .update-card .title {
                font-size: 0.95rem;
            }

            .update-card .description {
                font-size: 0.85rem;
            }

            .modal-content {
                padding: 20px;
                margin: 10% auto;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }

            .updates-wrapper {
                padding: 10px;
                max-height: 500px;
            }

            .update-card {
                padding: 12px 14px;
            }

            .update-card .title {
                font-size: 0.9rem;
            }

            .badge-icon {
                font-size: 2rem;
                padding: 8px;
            }

            .header-title h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="school-badge">
                    <span class="badge-icon">🏫</span>
                    <div>
                        <h1>Govt. Sr. Sec. School</h1>
                        <p>Shilla, Himachal Pradesh</p>
                    </div>
                </div>
                <div class="header-title">
                    <h2>📢 Recent Updates</h2>
                    <p>Stay updated with latest news & announcements</p>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">
        <div class="container">

            <!-- Updates Section -->
            <section class="updates-section">
                <div class="section-header">
                    <h3>📰 Latest Updates</h3>
                    <span class="update-count" id="updateCount">Loading...</span>
                </div>

                <!-- Updates Wrapper with Scroll -->
                <div class="updates-wrapper" id="updatesWrapper">
                    <div class="updates-container" id="updatesContainer">
                        <!-- Updates will be loaded here by JavaScript -->
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Loading updates...</p>
                        </div>
                    </div>
                </div>

                <!-- Load More Button -->
                <div class="load-more" id="loadMoreContainer" style="display:none;">
                    <button class="btn-load-more" onclick="loadMore()">Load More Updates</button>
                </div>
            </section>

        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Govt. Sr. Sec. School Shilla. All rights reserved.</p>
            <p class="footer-powered">Powered by School Management System</p>
        </div>
    </footer>

    <!-- ===== FILE PREVIEW MODAL ===== -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody">
                <div class="modal-loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_URL = 'https://gsssshilla.onrender.com'; // 🔴 CHANGE THIS
        let currentLimit = 10;
        let totalUpdates = 0;

        // ============================================
        // LOAD UPDATES
        // ============================================
        async function loadUpdates(loadMore = false) {
            const container = document.getElementById('updatesContainer');

            try {
                const response = await fetch(`${API_URL}/recent/public?limit=${currentLimit}`);
                const data = await response.json();

                if (data.success) {
                    totalUpdates = data.data.length;

                    if (loadMore) {
                        // Append new updates
                        const newCards = renderUpdateCards(data.data);
                        container.insertAdjacentHTML('beforeend', newCards);
                    } else {
                        // Replace all updates
                        container.innerHTML = renderUpdateCards(data.data);
                    }

                    // Update count
                    document.getElementById('updateCount').textContent = `${totalUpdates} updates`;

                    // Show/hide load more button
                    document.getElementById('loadMoreContainer').style.display =
                        totalUpdates >= currentLimit ? 'block' : 'none';

                    // Auto scroll after updates loaded
                    setTimeout(initAutoScroll, 500);

                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">❌</div>
                            <p>Failed to load updates</p>
                            <p style="font-size:0.85rem;color:#ef4444;">${data.message || 'Please try again'}</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error loading updates:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Network error. Please refresh the page.</p>
                        <p style="font-size:0.85rem;color:#6b7280;">${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER UPDATE CARDS
        // ============================================
        function renderUpdateCards(updates) {
            if (!updates || updates.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
            }

            let html = '';
            updates.forEach((update, index) => {
                const isNew = update.is_new === 1 || update.is_new_dynamic === 1;
                const fileIcon = update.file_icon || '📄';
                const formattedDate = formatDate(update.created_at);
                const hasFile = update.file_url ? true : false;

                html += `
                    <div class="update-card" style="animation-delay: ${index * 0.08}s">
                        <div class="update-header">
                            <div class="title" onclick="openFile('${update.id}', '${update.file_url || ''}', '${update.file_type || ''}', '${update.title}')">
                                <span class="file-icon">${fileIcon}</span>
                                ${escapeHtml(update.title)}
                            </div>
                            <span class="badge ${isNew ? 'new' : 'old'}">
                                ${isNew ? '🆕 NEW' : '📌'}
                            </span>
                        </div>

                        ${update.description ? `<div class="description">${escapeHtml(update.description)}</div>` : ''}

                        ${hasFile ? `
                            <div style="margin-top: 6px;">
                                <button class="attachment-link" onclick="openFile('${update.id}', '${update.file_url}', '${update.file_type}', '${update.title}')">
                                    📎 View Attachment
                                </button>
                            </div>
                        ` : ''}

                        <div class="meta">
                            <span class="date">📅 ${formattedDate}</span>
                            <span class="category">${escapeHtml(update.category || 'general')}</span>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        // ============================================
        // LOAD MORE
        // ============================================
        function loadMore() {
            currentLimit += 10;
            loadUpdates(true);
        }

        // ============================================
        // AUTO SCROLL
        // ============================================
        function initAutoScroll() {
            const wrapper = document.getElementById('updatesWrapper');
            if (!wrapper) return;

            // Check if content is taller than container
            if (wrapper.scrollHeight > wrapper.clientHeight) {
                let scrollAmount = 0;
                const scrollStep = 0.6;
                let scrollInterval;

                // Clear any existing interval
                if (window._scrollInterval) {
                    clearInterval(window._scrollInterval);
                }

                // Start auto scroll
                window._scrollInterval = setInterval(() => {
                    scrollAmount += scrollStep;
                    if (scrollAmount >= wrapper.scrollHeight - wrapper.clientHeight) {
                        scrollAmount = 0;
                    }
                    wrapper.scrollTop = scrollAmount;
                }, 40);

                // Stop scrolling on user interaction
                wrapper.addEventListener('mouseenter', () => {
                    clearInterval(window._scrollInterval);
                });

                wrapper.addEventListener('mouseleave', () => {
                    // Restart scrolling
                    window._scrollInterval = setInterval(() => {
                        scrollAmount += scrollStep;
                        if (scrollAmount >= wrapper.scrollHeight - wrapper.clientHeight) {
                            scrollAmount = 0;
                        }
                        wrapper.scrollTop = scrollAmount;
                    }, 40);
                });

                // For touch devices
                wrapper.addEventListener('touchstart', () => {
                    clearInterval(window._scrollInterval);
                });

                wrapper.addEventListener('touchend', () => {
                    window._scrollInterval = setInterval(() => {
                        scrollAmount += scrollStep;
                        if (scrollAmount >= wrapper.scrollHeight - wrapper.clientHeight) {
                            scrollAmount = 0;
                        }
                        wrapper.scrollTop = scrollAmount;
                    }, 40);
                });
            }
        }

        // ============================================
        // OPEN FILE - MODAL
        // ============================================
        function openFile(id, fileUrl, fileType, title) {
            const modal = document.getElementById('fileModal');
            const modalBody = document.getElementById('modalBody');

            if (!fileUrl) {
                modalBody.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <div style="font-size:4rem;margin-bottom:16px;">📄</div>
                        <h3>${escapeHtml(title)}</h3>
                        <p style="color:#6b7280;margin-top:8px;">No attachment available</p>
                    </div>
                `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';

            if (fileType && fileType.startsWith('image/')) {
                preview = `
                    <img src="${fileUrl}" alt="${escapeHtml(title)}" 
                         style="max-width:100%;border-radius:8px;max-height:60vh;"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23f3f4f6%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236b7280%22%3EImage%20not%20found%3C/text%3E%3C/svg%3E'">
                `;
            } else if (fileType && fileType.startsWith('video/')) {
                preview = `
                    <video controls style="max-width:100%;max-height:60vh;">
                        <source src="${fileUrl}" type="${fileType}">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else if (fileType && fileType.startsWith('audio/')) {
                preview = `
                    <audio controls style="width:100%;">
                        <source src="${fileUrl}" type="${fileType}">
                        Your browser does not support the audio tag.
                    </audio>
                `;
            } else if (fileType === 'application/pdf') {
                preview = `
                    <iframe src="${fileUrl}" style="width:100%;height:500px;border:none;" 
                            onerror="this.style.display='none';document.getElementById('pdfError').style.display='block';">
                    </iframe>
                    <div id="pdfError" style="display:none;text-align:center;padding:20px;color:#6b7280;">
                        <p>PDF viewer not available. <a href="${fileUrl}" target="_blank" style="color:#3b82f6;">Download PDF</a></p>
                    </div>
                `;
            } else {
                preview = `
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:4rem;">📎</div>
                        <p style="margin:12px 0;color:#4b5563;">${fileType || 'File'}</p>
                        <a href="${fileUrl}" download class="attachment-link" 
                           style="padding:8px 20px;background:#3b82f6;color:white;border-radius:6px;text-decoration:none;display:inline-block;">
                            📥 Download File
                        </a>
                    </div>
                `;
            }

            modalBody.innerHTML = `
                <h3 style="margin-bottom:16px;">${escapeHtml(title)}</h3>
                <div class="file-preview">${preview}</div>
                <div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;display:flex;gap:12px;flex-wrap:wrap;">
                    <a href="${fileUrl}" target="_blank" style="color:#3b82f6;text-decoration:none;">🔗 Open in new tab</a>
                    <a href="${fileUrl}" download style="color:#3b82f6;text-decoration:none;">📥 Download</a>
                </div>
            `;

            modal.style.display = 'block';
        }

        // ============================================
        // CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        // Click outside modal to close
        window.onclick = function(event) {
            const modal = document.getElementById('fileModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // ESC key to close
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // HELPER FUNCTIONS
        // ============================================

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} min ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} hours ago`;
            if (diff < 172800000) return 'Yesterday';

            return date.toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Check if API_URL is configured
            if (API_URL === 'https://your-backend-url.com') {
                document.getElementById('updatesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚙️</div>
                        <p>Please configure API_URL in the JavaScript</p>
                        <p style="font-size:0.85rem;color:#6b7280;">Set your backend URL at line ~200</p>
                    </div>
                `;
                return;
            }

            loadUpdates();
        });

        // Refresh every 5 minutes
        setInterval(function() {
            if (document.hidden) return;
            loadUpdates();
        }, 300000);

        console.log('🚀 Public Recent Updates Page Loaded');
        console.log(`📡 API_URL: ${API_URL}`);
    </script>

</body>
</html>
