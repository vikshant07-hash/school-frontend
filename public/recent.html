<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a2332, #2a3a5a); color: white; padding: 30px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 2rem; }
        .header h1 span { color: #facc15; }
        .header p { color: #94a3b8; margin-top: 8px; }
        .updates-wrapper { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-height: 600px; overflow-y: auto; }
        .update-card { background: #f8fafc; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; border-left: 4px solid #3b82f6; transition: all 0.3s; }
        .update-card:hover { transform: translateX(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .update-card .title { font-size: 1rem; font-weight: 600; color: #1a2332; cursor: pointer; }
        .update-card .title:hover { color: #3b82f6; }
        .update-card .badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
        .update-card .badge.new { background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; }
        .update-card .badge.old { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
        .update-card .description { color: #4b5563; font-size: 0.9rem; margin: 8px 0 10px; }
        .update-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #6b7280; padding-top: 10px; border-top: 1px solid #e5e7eb; margin-top: 10px; }
        .update-card .meta .category { display: inline-block; padding: 2px 10px; border-radius: 12px; background: #eff6ff; color: #3b82f6; font-size: 0.65rem; text-transform: capitalize; }
        .loading-state { text-align: center; padding: 40px; color: #6b7280; }
        .loading-state .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        .empty-state { text-align: center; padding: 40px; color: #6b7280; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .attachment-link { color: #3b82f6; cursor: pointer; font-size: 0.8rem; font-weight: 500; padding: 3px 12px; border-radius: 6px; background: #eff6ff; border: none; }
        .attachment-link:hover { background: #dbeafe; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { position: relative; background: white; margin: 5% auto; padding: 30px; width: 90%; max-width: 700px; max-height: 90vh; border-radius: 12px; overflow-y: auto; }
        .modal-content .close { position: absolute; top: 15px; right: 25px; font-size: 2rem; font-weight: bold; color: #6b7280; cursor: pointer; }
        .modal-content img { max-width: 100%; border-radius: 8px; }
        @media (max-width: 600px) { .header h1 { font-size: 1.3rem; } .update-card { padding: 12px 14px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📢 <span>Recent</span> Updates</h1>
            <p>Stay updated with latest news and announcements</p>
        </div>
        <div class="updates-wrapper" id="updatesWrapper">
            <div id="updatesContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading updates...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="fileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_URL = 'https://gsssshilla.onrender.com';

        // ============================================
        // LOAD UPDATES
        // ============================================
        async function loadUpdates() {
            const container = document.getElementById('updatesContainer');

            try {
                console.log('🔄 Fetching updates from:', `${API_URL}/recent/public?limit=20`);
                
                const response = await fetch(`${API_URL}/recent/public?limit=20`);
                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('📦 Data received:', data);

                if (data.success) {
                    if (data.data && data.data.length > 0) {
                        renderUpdates(data.data);
                        console.log('✅ Updates rendered successfully');
                    } else {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">📭</div>
                                <p>No updates available</p>
                                <p style="font-size:0.85rem;color:#6b7280;">Add updates from admin panel</p>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">❌</div>
                            <p>Failed to load updates</p>
                            <p style="font-size:0.85rem;color:#ef4444;">${data.message || 'Please try again'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Error loading updates:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Network error. Please refresh.</p>
                        <p style="font-size:0.85rem;color:#6b7280;">${error.message}</p>
                        <button onclick="loadUpdates()" style="margin-top:12px;padding:8px 20px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;">🔄 Retry</button>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER UPDATES
        // ============================================
        function renderUpdates(updates) {
            const container = document.getElementById('updatesContainer');
            
            let html = '';
            updates.forEach((update, index) => {
                const isNew = update.is_new === 1 || update.is_new_dynamic === 1;
                const formattedDate = formatDate(update.created_at);
                const hasFile = update.file_url ? true : false;
                
                html += `
                    <div class="update-card">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
                            <div class="title" onclick="openFile('${update.id}', '${update.file_url || ''}', '${update.file_type || ''}', '${escapeHtml(update.title)}')">
                                ${update.title}
                            </div>
                            <span class="badge ${isNew ? 'new' : 'old'}">
                                ${isNew ? '🆕 NEW' : '📌'}
                            </span>
                        </div>
                        
                        ${update.description ? `<div class="description">${escapeHtml(update.description)}</div>` : ''}
                        
                        ${hasFile ? `
                            <div style="margin-top: 6px;">
                                <button class="attachment-link" onclick="openFile('${update.id}', '${update.file_url}', '${update.file_type}', '${escapeHtml(update.title)}')">
                                    📎 View Attachment
                                </button>
                            </div>
                        ` : ''}
                        
                        <div class="meta">
                            <span>📅 ${formattedDate}</span>
                            <span class="category">${escapeHtml(update.category || 'general')}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // ============================================
        // OPEN FILE
        // ============================================
        function openFile(id, fileUrl, fileType, title) {
            const modal = document.getElementById('fileModal');
            const modalBody = document.getElementById('modalBody');

            if (!fileUrl) {
                modalBody.innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <div style="font-size:4rem;margin-bottom:16px;">📄</div>
                        <h3>${title}</h3>
                        <p style="color:#6b7280;margin-top:8px;">No attachment available</p>
                    </div>
                `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';
            if (fileType && fileType.startsWith('image/')) {
                preview = `<img src="${fileUrl}" style="max-width:100%;border-radius:8px;max-height:60vh;">`;
            } else if (fileType && fileType.startsWith('video/')) {
                preview = `<video controls style="max-width:100%;max-height:60vh;"><source src="${fileUrl}" type="${fileType}"></video>`;
            } else if (fileType && fileType.startsWith('audio/')) {
                preview = `<audio controls style="width:100%;"><source src="${fileUrl}" type="${fileType}"></audio>`;
            } else if (fileType === 'application/pdf') {
                preview = `<iframe src="${fileUrl}" style="width:100%;height:500px;border:none;"></iframe>`;
            } else {
                preview = `
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:4rem;">📎</div>
                        <p style="margin:12px 0;color:#4b5563;">${fileType || 'File'}</p>
                        <a href="${fileUrl}" download class="attachment-link" style="padding:8px 20px;background:#3b82f6;color:white;border-radius:6px;text-decoration:none;display:inline-block;">📥 Download</a>
                    </div>
                `;
            }

            modalBody.innerHTML = `
                <h3 style="margin-bottom:16px;">${title}</h3>
                <div class="file-preview">${preview}</div>
                <div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;">
                    <a href="${fileUrl}" target="_blank" style="color:#3b82f6;text-decoration:none;">🔗 Open in new tab</a>
                </div>
            `;
            modal.style.display = 'block';
        }

        function closeModal() { document.getElementById('fileModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target === document.getElementById('fileModal')) closeModal(); }

        // ============================================
        // HELPERS
        // ============================================
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} min ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} hours ago`;
            if (diff < 172800000) return 'Yesterday';
            return date.toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Public Page Loaded');
            console.log('📡 API_URL:', API_URL);
            loadUpdates();
        });

        setInterval(loadUpdates, 300000);
    </script>
</body>
</html>
