<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recent Updates - School</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>

    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --secondary: #0f172a;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(79, 70, 229, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--gradient);
            padding: 32px 40px;
            border-radius: var(--radius);
            margin-bottom: 28px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.25);
            animation: fadeDown 0.6s ease forwards;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-text h1 span {
            color: #fcd34d;
        }

        .header-text p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 2px;
            font-weight: 400;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-dot 1.8s infinite;
        }

        /* ============================================================
           UPDATES BOX
           ============================================================ */
        .updates-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeUp 0.6s ease 0.15s forwards;
            opacity: 0;
            border: 1px solid var(--border);
            transition: box-shadow var(--transition);
        }

        .updates-box:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ============================================================
           CONTROLS
           ============================================================ */
        .controls {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #fafbfc;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .controls-left .label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .controls-left .count {
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            min-width: 28px;
            text-align: center;
        }

        .controls-left .status {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-left .status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            display: inline-block;
            transition: background var(--transition);
        }

        .controls-left .status .status-dot.paused {
            background: #f87171;
        }

        .controls-right {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 7px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            color: var(--text-secondary);
        }

        .btn:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }

        .btn-pause {
            background: #fef2f2;
            color: #ef4444;
        }

        .btn-pause:hover {
            background: #fecaca;
        }

        .btn-pause.active {
            background: #dcfce7;
            color: #22c55e;
        }

        .btn-pause.active:hover {
            background: #bbf7d0;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* ============================================================
           SCROLLING WRAPPER
           ============================================================ */
        .scrolling-wrapper {
            max-height: 540px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px 16px 16px;
            scroll-behavior: smooth;
            transition: scrollbar-color 0.3s;
        }

        /* Custom Scrollbar */
        .scrolling-wrapper::-webkit-scrollbar {
            width: 5px;
        }

        .scrolling-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrolling-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
            transition: background 0.3s;
        }

        .scrolling-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Firefox Scrollbar */
        .scrolling-wrapper {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        /* ============================================================
           UPDATE CARD
           ============================================================ */
        .update-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(12px);
            position: relative;
        }

        .update-card:last-child {
            margin-bottom: 0;
        }

        .update-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.06);
            transform: translateX(4px);
        }

        .update-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .update-card .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color var(--transition);
            flex: 1;
        }

        .update-card .title:hover {
            color: var(--primary);
        }

        .update-card .title .icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .update-card .badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 12px;
            border-radius: 30px;
            flex-shrink: 0;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .update-card .badge.new {
            background: #fef2f2;
            color: #ef4444;
            border-color: #fca5a5;
            animation: pulse-badge 2s infinite;
        }

        .update-card .badge.old {
            background: #f1f5f9;
            color: var(--text-muted);
            border-color: var(--border);
        }

        .update-card .description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 8px 0 10px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            transition: all 0.3s;
        }

        .update-card .description.expanded {
            -webkit-line-clamp: unset;
            display: block;
        }

        .update-card .read-more {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            transition: color var(--transition);
        }

        .update-card .read-more:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .update-card .attachment {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px 4px 10px;
            background: #f1f5f9;
            border-radius: 30px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 4px;
            font-family: inherit;
        }

        .update-card .attachment:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .update-card .attachment .size {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .update-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .update-card .card-footer .date {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .update-card .card-footer .category {
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: capitalize;
            color: var(--primary);
            background: #eef2ff;
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* ============================================================
           LOADING / EMPTY
           ============================================================ */
        .loading-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .loading-state .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: fadeIn 0.25s ease;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            margin: 5% auto;
            padding: 32px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            border-radius: var(--radius);
            overflow-y: auto;
            animation: scaleIn 0.3s ease;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
        }

        .modal-content .close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
            line-height: 1;
            background: none;
            border: none;
        }

        .modal-content .close:hover {
            color: var(--text-primary);
        }

        .modal-content h3 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--text-primary);
            padding-right: 32px;
        }

        .modal-content .file-preview {
            text-align: center;
            padding: 12px 0;
        }

        .modal-content img,
        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: var(--radius-sm);
        }

        .modal-content img {
            max-height: 60vh;
            object-fit: contain;
        }

        .modal-content .file-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .modal-content .file-actions a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--transition);
        }

        .modal-content .file-actions a:hover {
            color: var(--primary-dark);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        @keyframes pulse-badge {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 24px 20px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-badge {
                align-self: flex-start;
            }

            .header-text h1 {
                font-size: 1.2rem;
            }

            .controls {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left {
                justify-content: space-between;
            }

            .controls-right {
                justify-content: flex-start;
            }

            .scrolling-wrapper {
                max-height: 420px;
                padding: 8px 12px 12px 12px;
            }

            .update-card {
                padding: 14px 16px;
            }

            .update-card .title {
                font-size: 0.92rem;
            }

            .modal-content {
                padding: 20px;
                margin: 10% auto;
            }
        }

        @media (max-width: 400px) {
            .controls-left {
                flex-wrap: wrap;
            }

            .controls-right {
                flex-wrap: wrap;
            }

            .btn {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
        }

        /* ============================================================
           SCROLL INDICATOR (optional)
           ============================================================ */
        .scroll-indicator {
            text-align: center;
            padding: 10px 0 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            border-top: 1px solid var(--border);
            background: #fafbfc;
            border-radius: 0 0 var(--radius) var(--radius);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .scroll-indicator .arrow {
            display: inline-block;
            animation: bounce-arrow 1.8s infinite;
        }

        @keyframes bounce-arrow {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-icon">📡</div>
                    <div class="header-text">
                        <h1>📢 <span>Recent</span> Updates</h1>
                        <p>Stay informed with the latest from school</p>
                    </div>
                </div>
                <div class="header-badge">
                    <span class="dot"></span>
                    <span>Live Updates</span>
                </div>
            </div>
        </header>

        <!-- ===== UPDATES BOX ===== -->
        <section class="updates-box">

            <!-- Controls -->
            <div class="controls">
                <div class="controls-left">
                    <span class="label">📋 Updates</span>
                    <span class="count" id="updateCount">0</span>
                    <span class="status">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Loading...</span>
                    </span>
                </div>
                <div class="controls-right">
                    <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">
                        <span id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause</span>
                    </button>
                    <button class="btn" onclick="scrollToTop()" title="Scroll to top">⬆️</button>
                    <button class="btn" onclick="scrollToBottom()" title="Scroll to bottom">⬇️</button>
                </div>
            </div>

            <!-- Scrolling Wrapper -->
            <div class="scrolling-wrapper" id="scrollingWrapper">
                <div id="updatesContainer">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading updates...</p>
                    </div>
                </div>
            </div>

            <!-- Scroll Indicator -->
            <div class="scroll-indicator" id="scrollIndicator">
                <span>⬇️</span>
                <span>Scroll</span>
                <span class="arrow">↓</span>
            </div>

        </section>

    </div>

    <!-- ===== FILE MODAL ===== -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_URL = 'https://gsssshilla.onrender.com';
        const SCROLL_STEP = 0.6;
        const SCROLL_INTERVAL_MS = 40;

        // ============================================================
        // STATE
        // ============================================================
        let isPaused = false;
        let scrollTimer = null;
        let updates = [];
        let currentPos = 0;

        // ============================================================
        // DOM REFS
        // ============================================================
        const wrapper = document.getElementById('scrollingWrapper');
        const container = document.getElementById('updatesContainer');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const pauseLabel = document.getElementById('pauseLabel');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const updateCount = document.getElementById('updateCount');
        const scrollIndicator = document.getElementById('scrollIndicator');

        // ============================================================
        // LOAD UPDATES
        // ============================================================
        async function loadUpdates() {
            try {
                const res = await fetch(`${API_URL}/recent-public?t=${Date.now()}`);
                const data = await res.json();

                if (data.success && data.data) {
                    updates = data.data;
                    updateCount.textContent = updates.length;
                    renderUpdates(updates);
                    startAutoScroll();
                    statusText.textContent = 'Scrolling';
                    statusDot.className = 'status-dot';
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>No updates available</p>
                            <p style="font-size:0.85rem;color:var(--text-muted);">Check back later</p>
                        </div>
                    `;
                    statusText.textContent = 'No updates';
                    statusDot.className = 'status-dot paused';
                }
            } catch (err) {
                console.error('Load error:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Failed to load updates</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${err.message}</p>
                        <button onclick="loadUpdates()" style="margin-top:12px;padding:8px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-family:inherit;font-weight:500;cursor:pointer;">🔄 Retry</button>
                    </div>
                `;
                statusText.textContent = 'Error';
                statusDot.className = 'status-dot paused';
            }
        }

        // ============================================================
        // RENDER UPDATES
        // ============================================================
        function renderUpdates(items) {
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No updates available</p>
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach((item, i) => {
                const isNew = item.is_new === 1 || item.is_new_dynamic === 1;
                const date = formatDate(item.created_at);
                const hasFile = !!item.file_url;
                const size = item.file_size ? formatSize(item.file_size) : '';
                const icon = getFileIcon(item.file_type);
                const desc = item.description || '';
                const isLong = desc.length > 120;

                html += `
                    <div class="update-card" style="animation-delay: ${i * 0.04}s">
                        <div class="card-top">
                            <div class="title" onclick="openFile('${item.id}','${item.file_url||''}','${item.file_type||''}','${escapeHtml(item.title)}')">
                                <span class="icon">${hasFile ? '📎' : '📄'}</span>
                                ${escapeHtml(item.title)}
                            </div>
                            <span class="badge ${isNew ? 'new' : 'old'}">
                                ${isNew ? '🆕 New' : '📌 Old'}
                            </span>
                        </div>

                        ${desc ? `
                            <div class="description" id="desc-${item.id}">
                                ${escapeHtml(desc.substring(0, 120))}${isLong ? '...' : ''}
                            </div>
                            ${isLong ? `<button class="read-more" onclick="toggleReadMore(${item.id})">Read more</button>` : ''}
                        ` : ''}

                        ${hasFile ? `
                            <button class="attachment" onclick="openFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                ${icon} Attachment ${size ? `<span class="size">(${size})</span>` : ''}
                            </button>
                        ` : ''}

                        <div class="card-footer">
                            <span class="date">📅 ${date}</span>
                            <span class="category">${escapeHtml(item.category || 'general')}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // READ MORE
        // ============================================================
        function toggleReadMore(id) {
            const el = document.getElementById(`desc-${id}`);
            if (!el) return;

            const full = updates.find(u => u.id === id)?.description || '';
            const isExpanded = el.classList.contains('expanded');

            if (isExpanded) {
                el.classList.remove('expanded');
                el.textContent = escapeHtml(full.substring(0, 120)) + '...';
                el.nextElementSibling.textContent = 'Read more';
            } else {
                el.classList.add('expanded');
                el.textContent = escapeHtml(full);
                el.nextElementSibling.textContent = 'Read less';
            }
        }

        // ============================================================
        // AUTO SCROLL
        // ============================================================
        function startAutoScroll() {
            stopAutoScroll();

            if (wrapper.scrollHeight <= wrapper.clientHeight) {
                statusText.textContent = 'All visible';
                statusDot.className = 'status-dot';
                scrollIndicator.style.opacity = '0';
                return;
            }

            scrollIndicator.style.opacity = '1';
            isPaused = false;
            updatePauseUI();
            currentPos = 0;

            scrollTimer = setInterval(() => {
                if (!isPaused) {
                    currentPos += SCROLL_STEP;
                    if (currentPos >= wrapper.scrollHeight - wrapper.clientHeight) {
                        currentPos = 0;
                    }
                    wrapper.scrollTop = currentPos;
                }
            }, SCROLL_INTERVAL_MS);
        }

        function stopAutoScroll() {
            if (scrollTimer) {
                clearInterval(scrollTimer);
                scrollTimer = null;
            }
        }

        // ============================================================
        // PAUSE / RESUME
        // ============================================================
        function togglePause() {
            isPaused = !isPaused;
            updatePauseUI();

            if (!isPaused) {
                // If at bottom, reset to top
                if (wrapper.scrollTop + wrapper.clientHeight >= wrapper.scrollHeight - 2) {
                    currentPos = 0;
                    wrapper.scrollTop = 0;
                }
            }
        }

        function updatePauseUI() {
            if (isPaused) {
                pauseIcon.textContent = '▶️';
                pauseLabel.textContent = 'Resume';
                pauseBtn.classList.add('active');
                statusText.textContent = 'Paused';
                statusDot.className = 'status-dot paused';
                // Show scrollbar on pause
                wrapper.style.scrollbarWidth = 'auto';
            } else {
                pauseIcon.textContent = '⏸️';
                pauseLabel.textContent = 'Pause';
                pauseBtn.classList.remove('active');
                statusText.textContent = 'Scrolling';
                statusDot.className = 'status-dot';
                wrapper.style.scrollbarWidth = 'thin';
            }
        }

        // ============================================================
        // SCROLL CONTROLS
        // ============================================================
        function scrollToTop() {
            wrapper.scrollTo({ top: 0, behavior: 'smooth' });
            currentPos = 0;
        }

        function scrollToBottom() {
            wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
            currentPos = wrapper.scrollHeight - wrapper.clientHeight;
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openFile(id, url, type, title) {
            const modal = document.getElementById('fileModal');
            const body = document.getElementById('modalBody');

            if (!url) {
                body.innerHTML = `
                    <div style="text-align:center;padding:32px 0;">
                        <div style="font-size:3rem;margin-bottom:12px;">📄</div>
                        <h3>${title}</h3>
                        <p style="color:var(--text-muted);">No attachment available</p>
                    </div>
                `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';
            if (type?.startsWith('image/')) {
                preview = `<img src="${url}" alt="${title}" style="max-width:100%;max-height:60vh;border-radius:var(--radius-sm);" />`;
            } else if (type?.startsWith('video/')) {
                preview = `<video controls style="max-width:100%;max-height:60vh;border-radius:var(--radius-sm);"><source src="${url}" type="${type}"></video>`;
            } else if (type?.startsWith('audio/')) {
                preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
            } else if (type === 'application/pdf') {
                preview = `<iframe src="${url}" style="width:100%;height:480px;border:none;border-radius:var(--radius-sm);"></iframe>`;
            } else {
                preview = `
                    <div style="text-align:center;padding:20px 0;">
                        <div style="font-size:3.6rem;margin-bottom:12px;">📎</div>
                        <p style="color:var(--text-secondary);margin-bottom:12px;">${type || 'File'}</p>
                        <a href="${url}" download class="btn btn-primary" style="display:inline-block;text-decoration:none;">📥 Download</a>
                    </div>
                `;
            }

            body.innerHTML = `
                <h3>${title}</h3>
                <div class="file-preview">${preview}</div>
                <div class="file-actions">
                    <a href="${url}" target="_blank">🔗 Open in new tab</a>
                    <a href="${url}" download>📥 Download</a>
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('fileModal')) closeModal();
        });

        // ============================================================
        // HELPERS
        // ============================================================
        function formatDate(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts);
            const now = Date.now();
            const diff = now - d.getTime();

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
            if (diff < 172800000) return 'Yesterday';

            return d.toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function getFileIcon(mime) {
            if (!mime) return '📄';
            if (mime.startsWith('image/')) return '🖼️';
            if (mime === 'application/pdf') return '📄';
            if (mime.startsWith('audio/')) return '🎵';
            if (mime.startsWith('video/')) return '🎬';
            return '📎';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // AUTO REFRESH (5 min)
        // ============================================================
        setInterval(loadUpdates, 300000);

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Public Page Loaded');
            console.log('📡 API_URL:', API_URL);
            loadUpdates();
        });
    </script>

</body>
</html>
