<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recent Updates Management</title>

    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a2332;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #1a2332;
        }

        .header .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header .admin-info span {
            font-size: 0.95rem;
            color: #4b5563;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #4b5563;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.75rem;
        }

        /* ============================================
           STATS CARDS
           ============================================ */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-card .icon {
            font-size: 2rem;
        }

        .stat-card .info h3 {
            font-size: 1.5rem;
            color: #1a2332;
        }

        .stat-card .info p {
            color: #6b7280;
            font-size: 0.8rem;
        }

        /* ============================================
           FORM
           ============================================ */
        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            margin-bottom: 20px;
            color: #1a2332;
            font-size: 1.2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #4b5563;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .form-text {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 4px;
            display: block;
        }

        /* ============================================
           FILTER BAR
           ============================================ */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-bar .search-box {
            flex: 1;
            min-width: 200px;
        }

        .filter-bar .search-box input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .filter-bar .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            font-size: 0.95rem;
        }

        /* ============================================
           TABLE
           ============================================ */
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f3f4f6;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: #4b5563;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .loading-text {
            text-align: center;
            color: #6b7280;
            padding: 40px !important;
        }

        /* ============================================
           BADGES
           ============================================ */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-new {
            background: #fef2f2;
            color: #ef4444;
        }

        .badge-old {
            background: #f3f4f6;
            color: #6b7280;
        }

        .badge-category {
            background: #eff6ff;
            color: #3b82f6;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            text-transform: capitalize;
        }

        /* ============================================
           ACTION BUTTONS
           ============================================ */
        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* ============================================
           PAGINATION
           ============================================ */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f3f4f6;
        }

        .pagination button {
            padding: 6px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination #pageInfo {
            color: #4b5563;
            font-size: 0.9rem;
        }

        /* ============================================
           CHECKBOX
           ============================================ */
        input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* ============================================
           MODAL
           ============================================ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            position: relative;
            background: white;
            margin: 5% auto;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }

        .modal-content .close {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 2rem;
            font-weight: bold;
            color: #6b7280;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-content .close:hover {
            color: #1a2332;
        }

        .modal-content img,
        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: 8px;
        }

        .modal-content .file-preview {
            text-align: center;
            padding: 20px;
        }

        .modal-content .file-preview .file-icon-big {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 15px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header .admin-info {
                justify-content: center;
                flex-wrap: wrap;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-wrap: wrap;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card {
                padding: 12px 15px;
            }

            th,
            td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }

            .modal-content {
                padding: 20px;
                margin: 10% auto;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .action-buttons .btn-sm {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📢 Recent Updates Management</h1>
            <div class="admin-info">
                <span>👋 Welcome, Admin</span>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats" id="statsGrid">
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="info">
                    <h3 id="totalCount">0</h3>
                    <p>Total Updates</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon">🆕</div>
                <div class="info">
                    <h3 id="newCount">0</h3>
                    <p>New</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon">📌</div>
                <div class="info">
                    <h3 id="oldCount">0</h3>
                    <p>Old</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon">📎</div>
                <div class="info">
                    <h3 id="fileCount">0</h3>
                    <p>With Files</p>
                </div>
            </div>
        </div>

        <!-- ===== ADD/EDIT FORM ===== -->
        <div class="form-card" id="formCard">
            <h2 id="formTitle">➕ Add New Update</h2>
            <form id="updateForm" enctype="multipart/form-data">
                <input type="hidden" id="updateId" value="">

                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter update title" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Enter description"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control">
                            <option value="general">General</option>
                            <option value="events">Events</option>
                            <option value="academic">Academic</option>
                            <option value="holiday">Holiday</option>
                            <option value="admission">Admission</option>
                            <option value="exam">Exam</option>
                            <option value="important">Important</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="isNew" class="form-control">
                            <option value="1">🆕 New</option>
                            <option value="0">📌 Old</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Link (optional)</label>
                    <input type="url" id="link" class="form-control" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label>Attachment (Image, PDF, Audio, Video)</label>
                    <input type="file" id="file" class="form-control" accept="image/*,.pdf,.doc,.docx,audio/*,video/*">
                    <small class="form-text">Max: 50MB | Allowed: Images, PDF, Word, Audio, Video</small>
                    <div id="currentFile" style="display:none; margin-top:8px; padding:8px 12px; background:#f0fdf4; border-radius:6px; border-left:3px solid #22c55e;">
                        📎 Current: <span id="currentFileName"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Update</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">✖ Cancel</button>
                </div>
            </form>
        </div>

        <!-- ===== FILTER BAR ===== -->
        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search updates..." onkeyup="loadUpdates()">
            </div>
            <div class="filter-group">
                <select id="categoryFilter" onchange="loadUpdates()">
                    <option value="all">All Categories</option>
                    <option value="general">General</option>
                    <option value="events">Events</option>
                    <option value="academic">Academic</option>
                    <option value="holiday">Holiday</option>
                    <option value="admission">Admission</option>
                    <option value="exam">Exam</option>
                    <option value="important">Important</option>
                </select>
                <select id="statusFilter" onchange="loadUpdates()">
                    <option value="all">All Status</option>
                    <option value="1">🆕 New</option>
                    <option value="0">📌 Old</option>
                </select>
                <button class="btn btn-danger" onclick="bulkDelete()">🗑️ Delete Selected</button>
            </div>
        </div>

        <!-- ===== TABLE ===== -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onchange="selectAllRows()"></th>
                        <th>#</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>File</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="updatesTableBody">
                    <tr>
                        <td colspan="8" class="loading-text">🔄 Loading updates...</td>
                    </tr>
                </tbody>
            </table>

            <!-- ===== PAGINATION ===== -->
            <div class="pagination">
                <button onclick="changePage('prev')" id="prevBtn">◀ Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button onclick="changePage('next')" id="nextBtn">Next ▶</button>
            </div>
        </div>

    </div>

    <!-- ===== FILE PREVIEW MODAL ===== -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ============================================
    JAVASCRIPT - WITHOUT AUTHENTICATION
    ============================================ -->
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const API_URL = 'https://gsssshilla.onrender.com'; // 🔴 CHANGE THIS
        let currentPage = 1;
        let totalPages = 1;
        let selectedIds = [];

        // ============================================
        // LOAD UPDATES (Without Auth Token)
        // ============================================
        function loadUpdates() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            // 🔴 NOTE: No authentication token required
            fetch(`${API_URL}/recent/admin/all?page=${currentPage}&limit=10&search=${search}&category=${category}&status=${status}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderTable(data.data);
                        renderPagination(data.pagination);
                        loadStats();
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('updatesTableBody').innerHTML =
                        `<tr><td colspan="8" class="loading-text">❌ Failed to load updates</td></tr>`;
                });
        }

        // ============================================
        // RENDER TABLE
        // ============================================
        function renderTable(updates) {
            const tbody = document.getElementById('updatesTableBody');

            if (!updates || updates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="loading-text">📭 No updates found</td></tr>`;
                return;
            }

            let html = '';
            updates.forEach((item, index) => {
                html += `
                        <tr>
                            <td><input type="checkbox" class="row-checkbox" value="${item.id}" onchange="updateSelected()"></td>
                            <td>${index + 1}</td>
                            <td><strong>${escapeHtml(item.title)}</strong></td>
                            <td><span class="badge-category">${item.category || 'general'}</span></td>
                            <td>${item.file_icon || '📄'} ${item.file_type_display || 'No File'}</td>
                            <td><span class="badge ${item.is_new_class}">${item.is_new_badge}</span></td>
                            <td style="font-size:0.8rem; white-space:nowrap;">${item.created_at_formatted}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-warning btn-sm" onclick="viewFile('${item.id}', '${item.file_url || ''}', '${item.file_type || ''}', '${escapeHtml(item.title)}')">👁️</button>
                                    <button class="btn btn-primary btn-sm" onclick="editUpdate(${item.id})">✏️</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteUpdate(${item.id})">🗑️</button>
                                </div>
                            </td>
                        </tr>
                    `;
            });
            tbody.innerHTML = html;
        }

        // ============================================
        // PAGINATION
        // ============================================
        function renderPagination(pagination) {
            if (!pagination) return;
            currentPage = pagination.page;
            totalPages = pagination.totalPages;
            document.getElementById('pageInfo').textContent = `Page ${pagination.page} of ${pagination.totalPages}`;
            document.getElementById('prevBtn').disabled = !pagination.hasPrev;
            document.getElementById('nextBtn').disabled = !pagination.hasNext;
        }

        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            }
            loadUpdates();
        }

        // ============================================
        // LOAD STATS (Without Auth)
        // ============================================
        function loadStats() {
            fetch(`${API_URL}/recent/admin/stats`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('totalCount').textContent = data.data.total?.[0]?.total || 0;
                        document.getElementById('newCount').textContent = data.data.new?.[0]?.new || 0;
                        document.getElementById('oldCount').textContent = data.data.old?.[0]?.old || 0;
                        document.getElementById('fileCount').textContent = data.data.withFile?.[0]?.withFile || 0;
                    }
                })
                .catch(err => console.error('Stats Error:', err));
        }

        // ============================================
        // ADD / UPDATE FORM (Without Auth)
        // ============================================
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('updateId').value;
            const formData = new FormData(this);

            const url = id ? `${API_URL}/recent/admin/update/${id}` : `${API_URL}/recent/admin/add`;

            fetch(url, {
                    method: 'POST', // 🔴 Using POST for both add and update
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        resetForm();
                        loadUpdates();
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(err => {
                    alert('Error: ' + err.message);
                });
        });

        // ============================================
        // EDIT UPDATE
        // ============================================
        function editUpdate(id) {
            fetch(`${API_URL}/recent/${id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const item = data.data;
                        document.getElementById('updateId').value = item.id;
                        document.getElementById('title').value = item.title;
                        document.getElementById('description').value = item.description || '';
                        document.getElementById('category').value = item.category || 'general';
                        document.getElementById('isNew').value = item.is_new ? 1 : 0;
                        document.getElementById('link').value = item.link || '';
                        document.getElementById('formTitle').textContent = '✏️ Edit Update';
                        document.getElementById('submitBtn').textContent = '💾 Update';

                        if (item.file_url) {
                            document.getElementById('currentFile').style.display = 'block';
                            document.getElementById('currentFileName').textContent = item.file_original_name || 'File attached';
                        } else {
                            document.getElementById('currentFile').style.display = 'none';
                        }

                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                })
                .catch(err => console.error('Error:', err));
        }

        // ============================================
        // DELETE UPDATE (Without Auth)
        // ============================================
        function deleteUpdate(id) {
            if (!confirm('Are you sure you want to delete this update?')) return;

            fetch(`${API_URL}/recent/admin/delete/${id}`, {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        loadUpdates();
                    }
                })
                .catch(err => console.error('Error:', err));
        }

        // ============================================
        // BULK DELETE (Without Auth)
        // ============================================
        function bulkDelete() {
            const ids = selectedIds;
            if (ids.length === 0) {
                alert('Please select at least one update to delete');
                return;
            }

            if (!confirm(`Are you sure you want to delete ${ids.length} updates?`)) return;

            fetch(`${API_URL}/recent/admin/bulk-delete`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ids: ids })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        selectedIds = [];
                        document.getElementById('selectAll').checked = false;
                        loadUpdates();
                    }
                })
                .catch(err => console.error('Error:', err));
        }

        // ============================================
        // SELECT ALL
        // ============================================
        function selectAllRows() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
            updateSelected();
        }

        function updateSelected() {
            selectedIds = [];
            document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
                selectedIds.push(parseInt(cb.value));
            });
        }

        // ============================================
        // VIEW FILE
        // ============================================
        function viewFile(id, fileUrl, fileType, title) {
            const modal = document.getElementById('fileModal');
            const modalBody = document.getElementById('modalBody');

            if (!fileUrl) {
                modalBody.innerHTML = `
                            <div style="text-align:center;padding:40px;">
                                <div style="font-size:4rem;margin-bottom:16px;">📄</div>
                                <h3>${title}</h3>
                                <p style="color:#6b7280;margin-top:8px;">No attachment available</p>
                            </div>
                        `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';

            if (fileType && fileType.startsWith('image/')) {
                preview = `
                            <img src="${fileUrl}" alt="${title}" style="max-width:100%;border-radius:8px;max-height:60vh;"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23f3f4f6%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236b7280%22%3EImage%20not%20found%3C/text%3E%3C/svg%3E'">
                        `;
            } else if (fileType && fileType.startsWith('video/')) {
                preview = `
                            <video controls style="max-width:100%;max-height:60vh;">
                                <source src="${fileUrl}" type="${fileType}">
                                Your browser does not support the video tag.
                            </video>
                        `;
            } else if (fileType && fileType.startsWith('audio/')) {
                preview = `
                            <audio controls style="width:100%;">
                                <source src="${fileUrl}" type="${fileType}">
                                Your browser does not support the audio tag.
                            </audio>
                        `;
            } else if (fileType === 'application/pdf') {
                preview = `
                            <iframe src="${fileUrl}" style="width:100%;height:500px;border:none;"></iframe>
                            <div style="margin-top:10px;">
                                <a href="${fileUrl}" download class="btn btn-primary btn-sm">📥 Download PDF</a>
                            </div>
                        `;
            } else {
                preview = `
                            <div style="text-align:center;padding:20px;">
                                <div style="font-size:4rem;">📎</div>
                                <p style="margin:12px 0;color:#4b5563;">${fileType || 'File'}</p>
                                <a href="${fileUrl}" download class="btn btn-primary">📥 Download File</a>
                            </div>
                        `;
            }

            modalBody.innerHTML = `
                        <h3 style="margin-bottom:16px;">${title}</h3>
                        <div class="file-preview">${preview}</div>
                        <div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;">
                            <a href="${fileUrl}" target="_blank" style="color:#3b82f6;text-decoration:none;">🔗 Open in new tab</a>
                            &nbsp;|&nbsp;
                            <a href="${fileUrl}" download style="color:#3b82f6;text-decoration:none;">📥 Download</a>
                        </div>
                    `;
            modal.style.display = 'block';
        }

        // ============================================
        // RESET FORM
        // ============================================
        function resetForm() {
            document.getElementById('updateForm').reset();
            document.getElementById('updateId').value = '';
            document.getElementById('formTitle').textContent = '➕ Add New Update';
            document.getElementById('submitBtn').textContent = '➕ Add Update';
            document.getElementById('category').value = 'general';
            document.getElementById('isNew').value = '1';
            document.getElementById('currentFile').style.display = 'none';
            document.getElementById('file').value = '';
        }

        // ============================================
        // MODAL
        // ============================================
        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('fileModal')) {
                closeModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================
        // HELPERS
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            if (API_URL === 'https://gsssshilla.onrender.com') {
                document.getElementById('updatesTableBody').innerHTML = `
                            <tr><td colspan="8" class="loading-text">⚙️ Please configure API_URL in JavaScript</td></tr>
                        `;
                return;
            }

            loadUpdates();
        });

        // Auto refresh every 30 seconds
        setInterval(loadUpdates, 30000);

        console.log('🚀 Admin Recent Updates Panel Loaded (No Auth)');
        console.log(`📡 API_URL: ${API_URL}`);
    </script>

</body>
</html>
