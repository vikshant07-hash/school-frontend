<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Recent Updates</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>

    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --primary: #1a3a6b;
            --primary-light: #2a5a9b;
            --primary-dark: #0f2a4b;
            --gold: #d4a843;
            --gold-light: #f0d68a;
            --bg: #f0f2f6;
            --card-bg: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #3d4a5c;
            --text-muted: #7a879a;
            --border: #dce1e8;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 40px rgba(26, 58, 107, 0.08);
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        /* ============================================================
           RESET
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--primary);
            padding: 18px 28px;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 3px solid var(--gold);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--gold);
        }

        .header-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .header-text p {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.7);
            margin-top: 1px;
        }

        .header-badge {
            background: rgba(255,255,255,0.08);
            color: #fff;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .header-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 1.8s infinite;
        }

        /* ============================================================
           MAIN BOX
           ============================================================ */
        .main-box {
            background: var(--card-bg);
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-top: none;
            overflow: hidden;
        }

        /* ============================================================
           FORM SECTION
           ============================================================ */
        .form-section {
            padding: 20px 24px;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
        }

        .form-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border var(--transition), box-shadow var(--transition);
            background: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.08);
        }

        .form-control-file {
            padding: 8px 0;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 58, 107, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.72rem;
            border-radius: 6px;
        }

        /* ============================================================
           TABLE SECTION
           ============================================================ */
        .table-section {
            padding: 16px 20px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .table-header .count {
            background: var(--primary);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
        }

        tr {
            transition: background var(--transition);
        }

        tr:hover {
            background: #f8fafc;
        }

        /* Table Badges */
        .badge-new {
            display: inline-block;
            background: #dcfce7;
            color: #16a34a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            text-transform: uppercase;
        }

        .badge-old {
            display: inline-block;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            text-transform: uppercase;
        }

        .badge-category {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary-light);
            font-size: 0.65rem;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: capitalize;
        }

        .file-icon-small {
            font-size: 0.85rem;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .btn-delete {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .btn-delete:hover {
            background: #fecaca;
            transform: scale(1.05);
        }

        .btn-view {
            background: #eff6ff;
            color: var(--primary-light);
            border: 1px solid #bfdbfe;
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .btn-view:hover {
            background: #bfdbfe;
            transform: scale(1.05);
        }

        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            backdrop-filter: blur(4px);
        }

        .toast-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .toast-info {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
        }

        .toast .toast-icon {
            font-size: 1.3rem;
        }

        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            transition: color var(--transition);
        }

        .toast .toast-close:hover {
            color: #fff;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-row td {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background: var(--card-bg);
            margin: 6% auto;
            padding: 28px 32px;
            max-width: 600px;
            max-height: 90vh;
            border-radius: var(--radius);
            overflow-y: auto;
            animation: scaleIn 0.3s ease;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
        }

        .modal-content .close {
            float: right;
            font-size: 1.6rem;
            font-weight: 300;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
            background: none;
            border: none;
            line-height: 1;
        }

        .modal-content .close:hover {
            color: var(--text-primary);
        }

        .modal-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .modal-content img,
        .modal-content video,
        .modal-content audio {
            max-width: 100%;
            border-radius: 8px;
        }

        .modal-content .file-preview {
            text-align: center;
            padding: 8px 0;
        }

        .modal-content .file-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .modal-content .file-actions a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .modal-content .file-actions a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-badge {
                align-self: flex-start;
            }

            .form-section {
                padding: 16px;
            }

            .table-section {
                padding: 12px 14px;
            }

            td, th {
                padding: 8px 10px;
                font-size: 0.78rem;
            }

            .toast {
                min-width: auto;
                width: 90%;
                font-size: 0.85rem;
                padding: 12px 18px;
            }

            .toast-container {
                right: 12px;
                left: 12px;
                top: 12px;
            }

            .modal-content {
                padding: 20px;
                margin: 10% auto;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }

            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .action-btns .btn-delete,
            .action-btns .btn-view {
                font-size: 0.65rem;
                padding: 2px 10px;
            }

            .header-text h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon">⚙️</div>
                <div class="header-text">
                    <h1>📢 Recent Updates — Admin</h1>
                    <p>Manage school updates & announcements</p>
                </div>
            </div>
            <div class="header-badge">
                <span class="dot"></span>
                <span>Admin Panel</span>
            </div>
        </header>

        <!-- ===== MAIN BOX ===== -->
        <div class="main-box">

            <!-- ===== FORM SECTION ===== -->
            <section class="form-section">
                <h2>➕ Add New Update</h2>
                <form id="updateForm" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Title *</label>
                            <input type="text" id="title" class="form-control" placeholder="Enter title" required />
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" class="form-control">
                                <option value="general">General</option>
                                <option value="events">Events</option>
                                <option value="academic">Academic</option>
                                <option value="holiday">Holiday</option>
                                <option value="admission">Admission</option>
                                <option value="exam">Exam</option>
                                <option value="important">Important</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" rows="2" placeholder="Enter description"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="link">Link (optional)</label>
                            <input type="url" id="link" class="form-control" placeholder="https://example.com" />
                        </div>
                        <div class="form-group">
                            <label for="isNew">Status</label>
                            <select id="isNew" class="form-control">
                                <option value="1">🆕 New</option>
                                <option value="0">📌 Old</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="file">Attachment (Image, PDF, Audio, Video)</label>
                        <input type="file" id="file" class="form-control form-control-file" accept="image/*,.pdf,.doc,.docx,audio/*,video/*" />
                        <small style="color:var(--text-muted);font-size:0.7rem;">Max: 50MB | Images, PDF, Word, Audio, Video</small>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Update</button>
                        <button type="reset" class="btn btn-danger" onclick="resetForm()">✖ Clear</button>
                    </div>
                </form>
            </section>

            <!-- ===== TABLE SECTION ===== -->
            <section class="table-section">
                <div class="table-header">
                    <h3>📋 All Updates <span class="count" id="updateCount">0</span></h3>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn btn-danger btn-sm" onclick="bulkDelete()">🗑️ Delete Selected</button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:32px;"><input type="checkbox" id="selectAll" onchange="selectAllRows()" /></th>
                                <th>#</th>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>File</th>
                                <th>Status</th>
                                <th style="text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="updatesTableBody">
                            <tr class="loading-row">
                                <td colspan="8">
                                    <div class="spinner"></div>
                                    <p>Loading updates...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>

    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== FILE MODAL ===== -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_URL = 'https://gsssshilla.onrender.com';
        let selectedIds = [];

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');

            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            // Auto remove after 4 seconds
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ============================================================
        // LOAD UPDATES
        // ============================================================
        function loadUpdates() {
            const tbody = document.getElementById('updatesTableBody');

            fetch(`${API_URL}/recent-admin-all`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data.success) {
                        renderTable(data.data);
                        document.getElementById('updateCount').textContent = data.data?.length || 0;
                    } else {
                        showToast('Failed to load updates', 'error');
                        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted);">❌ ${data.message || 'Error loading data'}</td></tr>`;
                    }
                })
                .catch(err => {
                    console.error('Load error:', err);
                    showToast('Failed to load updates: ' + err.message, 'error');
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted);">❌ Network error. Please refresh.</td></tr>`;
                });
        }

        // ============================================================
        // RENDER TABLE — India Date Format
        // ============================================================
        function renderTable(updates) {
            const tbody = document.getElementById('updatesTableBody');

            if (!updates || updates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted);">📭 No updates found</td></tr>`;
                return;
            }

            let html = '';
            updates.forEach((item, index) => {
                const date = formatDateIndia(item.created_at);
                const isNew = item.is_new ? 'badge-new' : 'badge-old';
                const isNewText = item.is_new ? '🆕 New' : '📌 Old';
                const fileIcon = getFileIcon(item.file_type);
                const fileType = item.file_type || 'No File';

                html += `
                    <tr>
                        <td><input type="checkbox" class="row-checkbox" value="${item.id}" onchange="updateSelected()" /></td>
                        <td>${index + 1}</td>
                        <td style="font-size:0.78rem;white-space:nowrap;">${date}</td>
                        <td><strong>${escapeHtml(item.title)}</strong></td>
                        <td><span class="badge-category">${item.category || 'general'}</span></td>
                        <td>
                            ${item.file_url ? `
                                <button class="btn-view" onclick="viewFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                    ${fileIcon} ${fileType}
                                </button>
                            ` : '—'}
                        </td>
                        <td><span class="${isNew}">${isNewText}</span></td>
                        <td style="text-align:center;">
                            <button class="btn-delete" onclick="deleteUpdate(${item.id})">🗑️ Delete</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // FORMAT DATE — India Region (DD/MM/YY HH:MM)
        // ============================================================
        function formatDateIndia(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts);

            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = String(d.getFullYear()).slice(-2);
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');

            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // ============================================================
        // FILE ICON
        // ============================================================
        function getFileIcon(mime) {
            if (!mime) return '📄';
            if (mime.startsWith('image/')) return '🖼️';
            if (mime === 'application/pdf') return '📄';
            if (mime.startsWith('audio/')) return '🎵';
            if (mime.startsWith('video/')) return '🎬';
            return '📎';
        }

        // ============================================================
        // ESCAPE HTML
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // SELECT ALL / UPDATE SELECTED
        // ============================================================
        function selectAllRows() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
            updateSelected();
        }

        function updateSelected() {
            selectedIds = [];
            document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
                selectedIds.push(parseInt(cb.value));
            });
        }

        // ============================================================
        // ADD UPDATE
        // ============================================================
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            if (!title) {
                showToast('Please enter a title', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('description', document.getElementById('description').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('isNew', document.getElementById('isNew').value);
            formData.append('link', document.getElementById('link').value);

            const fileInput = document.getElementById('file');
            if (fileInput.files && fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '⏳ Saving...';
            submitBtn.disabled = true;

            fetch(`${API_URL}/recent-admin-add`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '✅ Update added successfully!', 'success');
                    resetForm();
                    loadUpdates();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to add update'), 'error');
                }
            })
            .catch(err => {
                showToast('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                submitBtn.textContent = '➕ Add Update';
                submitBtn.disabled = false;
            });
        });

        // ============================================================
        // RESET FORM
        // ============================================================
        function resetForm() {
            document.getElementById('updateForm').reset();
            document.getElementById('category').value = 'general';
            document.getElementById('isNew').value = '1';
            document.getElementById('title').focus();
        }

        // ============================================================
        // DELETE UPDATE
        // ============================================================
        function deleteUpdate(id) {
            if (!confirm('Are you sure you want to delete this update?')) return;

            const btn = event?.target;
            if (btn) {
                btn.textContent = '⏳';
                btn.disabled = true;
            }

            fetch(`${API_URL}/recent-admin-delete/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showToast(data.message || '✅ Update deleted successfully!', 'success');
                        loadUpdates();
                    } else {
                        showToast('❌ ' + (data.message || 'Failed to delete'), 'error');
                    }
                })
                .catch(err => {
                    showToast('❌ Error: ' + err.message, 'error');
                })
                .finally(() => {
                    if (btn) {
                        btn.textContent = '🗑️ Delete';
                        btn.disabled = false;
                    }
                });
        }

        // ============================================================
        // BULK DELETE
        // ============================================================
        function bulkDelete() {
            if (selectedIds.length === 0) {
                showToast('Please select at least one update', 'info');
                return;
            }

            if (!confirm(`Delete ${selectedIds.length} selected updates?`)) return;

            fetch(`${API_URL}/recent-admin-bulk-delete`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: selectedIds })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || `✅ ${selectedIds.length} updates deleted successfully!`, 'success');
                    selectedIds = [];
                    document.getElementById('selectAll').checked = false;
                    loadUpdates();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to delete'), 'error');
                }
            })
            .catch(err => {
                showToast('❌ Error: ' + err.message, 'error');
            });
        }

        // ============================================================
        // VIEW FILE — MODAL
        // ============================================================
        function viewFile(id, url, type, title) {
            const modal = document.getElementById('fileModal');
            const body = document.getElementById('modalBody');

            if (!url) {
                body.innerHTML = `
                    <div style="text-align:center;padding:20px 0;">
                        <div style="font-size:2.8rem;margin-bottom:6px;">📄</div>
                        <h3>${title}</h3>
                        <p style="color:var(--text-muted);">No attachment</p>
                    </div>
                `;
                modal.style.display = 'block';
                return;
            }

            let preview = '';
            if (type?.startsWith('image/')) {
                preview = `<img src="${url}" alt="${title}" style="max-width:100%;max-height:55vh;border-radius:6px;" />`;
            } else if (type?.startsWith('video/')) {
                preview = `<video controls style="max-width:100%;max-height:55vh;border-radius:6px;"><source src="${url}" type="${type}"></video>`;
            } else if (type?.startsWith('audio/')) {
                preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
            } else if (type === 'application/pdf') {
                preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;border-radius:6px;"></iframe>`;
            } else {
                preview = `
                    <div style="text-align:center;padding:16px 0;">
                        <div style="font-size:3rem;margin-bottom:6px;">📎</div>
                        <p style="color:var(--text-secondary);margin-bottom:8px;">${type || 'File'}</p>
                        <a href="${url}" download style="padding:6px 20px;background:var(--primary);color:#fff;border-radius:6px;text-decoration:none;font-weight:500;">Download</a>
                    </div>
                `;
            }

            body.innerHTML = `
                <h3>${title}</h3>
                <div class="file-preview">${preview}</div>
                <div class="file-actions">
                    <a href="${url}" target="_blank">🔗 Open</a>
                    <a href="${url}" download>📥 Download</a>
                </div>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('⚙️ Admin Panel Loaded');
            console.log('📡 API:', API_URL);
            loadUpdates();
            showToast('👋 Admin Panel Ready', 'info');
        });

        // Auto refresh every 30 seconds
        setInterval(loadUpdates, 30000);
    </script>

</body>
</html>
