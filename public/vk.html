<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recent Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header h1 { font-size: 1.4rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .icon { font-size: 2rem; }
        .stat-card .info h3 { font-size: 1.5rem; }
        .stat-card .info p { color: #6b7280; font-size: 0.8rem; }
        .form-card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: #3b82f6; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.3s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #e5e7eb; color: #4b5563; }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-bar .search-box { flex: 1; min-width: 200px; }
        .filter-bar .search-box input { width: 100%; padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-group select { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: white; }
        .table-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f8fafc; font-weight: 600; color: #4b5563; font-size: 0.75rem; text-transform: uppercase; }
        tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .badge-new { background: #fef2f2; color: #ef4444; }
        .badge-old { background: #f3f4f6; color: #6b7280; }
        .badge-category { background: #eff6ff; color: #3b82f6; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; text-transform: capitalize; }
        .action-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f3f4f6; }
        .pagination button { padding: 6px 16px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; }
        .pagination button:hover:not(:disabled) { background: #3b82f6; color: white; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading-text { text-align: center; color: #6b7280; padding: 40px !important; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-weight: 500; z-index: 2000; animation: slideInRight 0.3s; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { position: relative; background: white; margin: 5% auto; padding: 30px; width: 90%; max-width: 700px; max-height: 90vh; border-radius: 12px; overflow-y: auto; }
        .modal-content .close { position: absolute; top: 15px; right: 25px; font-size: 2rem; font-weight: bold; color: #6b7280; cursor: pointer; }
        .modal-content img { max-width: 100%; border-radius: 8px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>📢 Recent Updates Management</h1>
            <div><span>👋 Admin Panel</span></div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsGrid">
            <div class="stat-card"><div class="icon">📊</div><div class="info"><h3 id="totalCount">0</h3><p>Total</p></div></div>
            <div class="stat-card"><div class="icon">🆕</div><div class="info"><h3 id="newCount">0</h3><p>New</p></div></div>
            <div class="stat-card"><div class="icon">📌</div><div class="info"><h3 id="oldCount">0</h3><p>Old</p></div></div>
            <div class="stat-card"><div class="icon">📎</div><div class="info"><h3 id="fileCount">0</h3><p>With Files</p></div></div>
        </div>

        <!-- Add/Edit Form -->
        <div class="form-card">
            <h2 id="formTitle">➕ Add New Update</h2>
            <form id="updateForm" enctype="multipart/form-data">
                <input type="hidden" id="updateId" value="">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="3" placeholder="Enter description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control">
                            <option value="general">General</option>
                            <option value="events">Events</option>
                            <option value="academic">Academic</option>
                            <option value="holiday">Holiday</option>
                            <option value="admission">Admission</option>
                            <option value="exam">Exam</option>
                            <option value="important">Important</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="isNew" class="form-control">
                            <option value="1">🆕 New</option>
                            <option value="0">📌 Old</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Link</label>
                    <input type="url" id="link" class="form-control" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>Attachment (Image, PDF, Audio, Video)</label>
                    <input type="file" id="file" class="form-control" accept="image/*,.pdf,.doc,.docx,audio/*,video/*">
                    <small style="color:#6b7280;font-size:0.8rem;">Max: 50MB | All: Images, PDF, Word, Audio, Video</small>
                    <div id="currentFile" style="display:none; margin-top:8px; padding:8px 12px; background:#f0fdf4; border-radius:6px;">📎 Current: <span id="currentFileName"></span></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Update</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">✖ Cancel</button>
                </div>
            </form>
        </div>

        <!-- Filter -->
        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search..." onkeyup="loadUpdates()">
            </div>
            <div class="filter-group">
                <select id="categoryFilter" onchange="loadUpdates()">
                    <option value="all">All Categories</option>
                    <option value="general">General</option>
                    <option value="events">Events</option>
                    <option value="academic">Academic</option>
                    <option value="holiday">Holiday</option>
                    <option value="admission">Admission</option>
                    <option value="exam">Exam</option>
                    <option value="important">Important</option>
                </select>
                <select id="statusFilter" onchange="loadUpdates()">
                    <option value="all">All Status</option>
                    <option value="1">🆕 New</option>
                    <option value="0">📌 Old</option>
                </select>
                <button class="btn btn-danger" onclick="bulkDelete()">🗑️ Delete Selected</button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onchange="selectAllRows()"></th>
                        <th>#</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>File</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="updatesTableBody">
                    <tr><td colspan="8" class="loading-text">🔄 Loading...</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <button onclick="changePage('prev')" id="prevBtn">◀ Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button onclick="changePage('next')" id="nextBtn">Next ▶</button>
            </div>
        </div>

    </div>

    <!-- File Preview Modal -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================
        // ✅ CONFIGURATION - YAHAN CHANGE KAREIN
        // ============================================
        const API_URL = 'https://gsssshilla.onrender.com';
        
        let currentPage = 1;
        let totalPages = 1;
        let selectedIds = [];

        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ============================================
        // LOAD UPDATES - WITH ERROR HANDLING
        // ============================================
        function loadUpdates() {
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            const url = `${API_URL}/recent/admin/all?page=${currentPage}&limit=10&search=${search}&category=${category}&status=${status}`;
            
            console.log('🔄 Fetching:', url);

            // Show loading state
            document.getElementById('updatesTableBody').innerHTML = 
                `<tr><td colspan="8" class="loading-text">🔄 Loading updates...</td></tr>`;

            fetch(url)
                .then(res => {
                    console.log('📡 Response Status:', res.status);
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log('📦 Data:', data);
                    
                    if (data.success) {
                        renderTable(data.data);
                        renderPagination(data.pagination);
                        loadStats();
                        showToast('Updates loaded successfully ✅', 'success');
                    } else {
                        showToast('Error: ' + (data.message || 'Unknown error'), 'error');
                        document.getElementById('updatesTableBody').innerHTML = 
                            `<tr><td colspan="8" class="loading-text">❌ ${data.message || 'No data'}</td></tr>`;
                    }
                })
                .catch(err => {
                    console.error('❌ Fetch Error:', err);
                    document.getElementById('updatesTableBody').innerHTML = 
                        `<tr><td colspan="8" class="loading-text">❌ Network Error: ${err.message}</td></tr>`;
                    showToast('Failed to load updates: ' + err.message, 'error');
                });
        }

        // ============================================
        // RENDER TABLE
        // ============================================
        function renderTable(updates) {
            const tbody = document.getElementById('updatesTableBody');

            if (!updates || updates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="loading-text">📭 No updates found</td></tr>`;
                return;
            }

            let html = '';
            updates.forEach((item, index) => {
                const num = (currentPage - 1) * 10 + index + 1;
                html += `
                    <tr>
                        <td><input type="checkbox" class="row-checkbox" value="${item.id}" onchange="updateSelected()"></td>
                        <td>${num}</td>
                        <td><strong>${escapeHtml(item.title)}</strong></td>
                        <td><span class="badge-category">${item.category || 'general'}</span></td>
                        <td>${item.file_icon || '📄'} ${item.file_type_display || 'No File'}</td>
                        <td><span class="badge ${item.is_new_class}">${item.is_new_badge}</span></td>
                        <td style="font-size:0.8rem; white-space:nowrap;">${item.created_at_formatted || formatDateTime(item.created_at)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-sm" onclick="viewFile('${item.id}', '${item.file_url || ''}', '${item.file_type || ''}', '${escapeHtml(item.title)}')">👁️</button>
                                <button class="btn btn-primary btn-sm" onclick="editUpdate(${item.id})">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUpdate(${item.id})">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ============================================
        // HELPER: formatDateTime
        // ============================================
        function formatDateTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('en-IN', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        // ============================================
        // PAGINATION
        // ============================================
        function renderPagination(pagination) {
            if (!pagination) return;
            currentPage = pagination.page;
            totalPages = pagination.totalPages;
            document.getElementById('pageInfo').textContent = `Page ${pagination.page} of ${pagination.totalPages}`;
            document.getElementById('prevBtn').disabled = !pagination.hasPrev;
            document.getElementById('nextBtn').disabled = !pagination.hasNext;
        }

        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) { currentPage--; }
            else if (direction === 'next' && currentPage < totalPages) { currentPage++; }
            loadUpdates();
        }

        // ============================================
        // LOAD STATS
        // ============================================
        function loadStats() {
            fetch(`${API_URL}/recent/admin/stats`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('totalCount').textContent = data.data.total?.[0]?.total || 0;
                        document.getElementById('newCount').textContent = data.data.new?.[0]?.new || 0;
                        document.getElementById('oldCount').textContent = data.data.old?.[0]?.old || 0;
                        document.getElementById('fileCount').textContent = data.data.withFile?.[0]?.withFile || 0;
                    }
                })
                .catch(err => console.error('Stats error:', err));
        }

        // ============================================
        // ADD / UPDATE FORM
        // ============================================
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const id = document.getElementById('updateId').value;
            const title = document.getElementById('title').value.trim();
            
            if (!title) {
                showToast('Please enter a title', 'error');
                document.getElementById('title').focus();
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('description', document.getElementById('description').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('isNew', document.getElementById('isNew').value);
            formData.append('link', document.getElementById('link').value);

            const fileInput = document.getElementById('file');
            if (fileInput.files && fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }

            const url = id ? `${API_URL}/recent/admin/update/${id}` : `${API_URL}/recent/admin/add`;
            console.log('📤 Sending to:', url);

            // Show loading
            document.getElementById('submitBtn').textContent = '⏳ Saving...';
            document.getElementById('submitBtn').disabled = true;

            fetch(url, { 
                method: 'POST', 
                body: formData 
            })
            .then(res => res.json())
            .then(data => {
                console.log('📥 Response:', data);
                if (data.success) {
                    showToast(data.message, 'success');
                    resetForm();
                    loadUpdates();
                } else {
                    showToast('Error: ' + data.message, 'error');
                }
            })
            .catch(err => {
                console.error('❌ Submit Error:', err);
                showToast('Error: ' + err.message, 'error');
            })
            .finally(() => {
                document.getElementById('submitBtn').textContent = id ? '💾 Update' : '➕ Add Update';
                document.getElementById('submitBtn').disabled = false;
            });
        });

        // ============================================
        // EDIT UPDATE
        // ============================================
        function editUpdate(id) {
            fetch(`${API_URL}/recent/${id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const item = data.data;
                        document.getElementById('updateId').value = item.id;
                        document.getElementById('title').value = item.title;
                        document.getElementById('description').value = item.description || '';
                        document.getElementById('category').value = item.category || 'general';
                        document.getElementById('isNew').value = item.is_new ? 1 : 0;
                        document.getElementById('link').value = item.link || '';
                        document.getElementById('formTitle').textContent = '✏️ Edit Update';
                        document.getElementById('submitBtn').textContent = '💾 Update';
                        
                        if (item.file_url) {
                            document.getElementById('currentFile').style.display = 'block';
                            document.getElementById('currentFileName').textContent = 'File attached';
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        showToast('Edit mode: Update and save', 'info');
                    }
                })
                .catch(err => showToast('Error: ' + err.message, 'error'));
        }

        // ============================================
        // DELETE UPDATE
        // ============================================
        function deleteUpdate(id) {
            if (!confirm('Delete this update?')) return;
            
            fetch(`${API_URL}/recent/admin/delete/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showToast(data.message, 'success');
                        loadUpdates();
                    } else {
                        showToast('Error: ' + data.message, 'error');
                    }
                })
                .catch(err => showToast('Error: ' + err.message, 'error'));
        }

        // ============================================
        // BULK DELETE
        // ============================================
        function bulkDelete() {
            if (selectedIds.length === 0) {
                showToast('Select at least one update', 'error');
                return;
            }
            if (!confirm(`Delete ${selectedIds.length} updates?`)) return;
            
            fetch(`${API_URL}/recent/admin/bulk-delete`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: selectedIds })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message, 'success');
                    selectedIds = [];
                    document.getElementById('selectAll').checked = false;
                    loadUpdates();
                }
            })
            .catch(err => showToast('Error: ' + err.message, 'error'));
        }

        // ============================================
        // SELECT ALL
        // ============================================
        function selectAllRows() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
            updateSelected();
        }

        function updateSelected() {
            selectedIds = [];
            document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
                selectedIds.push(parseInt(cb.value));
            });
        }

        // ============================================
        // VIEW FILE
        // ============================================
        function viewFile(id, fileUrl, fileType, title) {
            const modal = document.getElementById('fileModal');
            const modalBody = document.getElementById('modalBody');

            if (!fileUrl) {
                modalBody.innerHTML = `<div style="text-align:center;padding:40px;"><h3>${title}</h3><p>No attachment</p></div>`;
                modal.style.display = 'block';
                return;
            }

            let preview = '';
            if (fileType && fileType.startsWith('image/')) {
                preview = `<img src="${fileUrl}" style="max-width:100%;border-radius:8px;max-height:60vh;">`;
            } else if (fileType && fileType.startsWith('video/')) {
                preview = `<video controls style="max-width:100%;max-height:60vh;"><source src="${fileUrl}" type="${fileType}"></video>`;
            } else if (fileType && fileType.startsWith('audio/')) {
                preview = `<audio controls style="width:100%;"><source src="${fileUrl}" type="${fileType}"></audio>`;
            } else if (fileType === 'application/pdf') {
                preview = `<iframe src="${fileUrl}" style="width:100%;height:500px;border:none;"></iframe>`;
            } else {
                preview = `<div style="text-align:center;padding:20px;"><a href="${fileUrl}" download class="btn btn-primary">📥 Download</a></div>`;
            }

            modalBody.innerHTML = `<h3>${title}</h3><div class="file-preview">${preview}</div>`;
            modal.style.display = 'block';
        }

        function closeModal() { document.getElementById('fileModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target === document.getElementById('fileModal')) closeModal(); }

        // ============================================
        // RESET FORM
        // ============================================
        function resetForm() {
            document.getElementById('updateForm').reset();
            document.getElementById('updateId').value = '';
            document.getElementById('formTitle').textContent = '➕ Add New Update';
            document.getElementById('submitBtn').textContent = '➕ Add Update';
            document.getElementById('category').value = 'general';
            document.getElementById('isNew').value = '1';
            document.getElementById('currentFile').style.display = 'none';
            document.getElementById('file').value = '';
            showToast('Form reset', 'info');
        }

        // ============================================
        // HELPERS
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Admin Panel Loaded');
            console.log('📡 API_URL:', API_URL);
            showToast('Admin Panel Ready', 'info');
            loadUpdates();
        });

        // Auto refresh every 30 seconds
        setInterval(loadUpdates, 30000);
    </script>
</body>
</html>
