<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Recent Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            color: #1a2332;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: #1a3a6b;
            padding: 18px 28px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #d4a843;
        }
        .header h1 { color: #ffffff; font-size: 1.25rem; font-weight: 700; }
        .header h1 span { color: #d4a843; }
        .header p { color: rgba(255,255,255,0.7); font-size: 0.8rem; }
        .header-badge {
            background: #d4a843;
            color: #1a3a6b;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .main-box {
            background: #ffffff;
            border-radius: 0 0 10px 10px;
            border: 1px solid #e2e8f0;
            border-top: none;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(26, 58, 107, 0.06);
        }

        .form-section {
            padding: 22px 28px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .form-section h2 {
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a6b;
            margin-bottom: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #1a3a6b;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 9px 14px;
            border: 1.5px solid #dce1e8;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }
        .form-control:focus {
            outline: none;
            border-color: #d4a843;
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.15);
        }
        .btn {
            padding: 9px 24px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #1a3a6b;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #0f2a4b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 58, 107, 0.25);
        }
        .btn-danger {
            background: #ef4444;
            color: #ffffff;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: #1a3a6b;
            border: 1.5px solid #dce1e8;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #1a3a6b;
        }

        .table-section {
            padding: 18px 24px 24px 24px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a3a6b;
        }
        .count-badge {
            background: #1a3a6b;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
            margin-left: 8px;
        }

        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 11px 14px;
            color: #1a3a6b;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 2px solid #d4a843;
            background: #f8fafc;
        }
        td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tr:hover { background: #fafbfc; }

        .badge-new {
            background: #dcfce7;
            color: #16a34a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .badge-old {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .badge-category {
            background: #fef3c7;
            color: #92400e;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
            text-transform: capitalize;
        }

        .btn-delete {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 5px 16px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-delete:hover {
            background: #fecaca;
            transform: scale(1.04);
        }
        .btn-view {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 5px 16px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-view:hover {
            background: #bfdbfe;
            transform: scale(1.04);
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            display: none;
            animation: slideInRight 0.35s ease;
            min-width: 260px;
        }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #1a3a6b; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(26, 58, 107, 0.4);
            backdrop-filter: blur(4px);
            padding: 20px;
        }
        .modal-content {
            background: #ffffff;
            margin: 6% auto;
            padding: 28px 32px;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .modal-content .close {
            float: right;
            font-size: 1.8rem;
            font-weight: 300;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .modal-content .close:hover { color: #1a3a6b; }
        .modal-content h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a3a6b;
            margin-bottom: 16px;
        }
        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        .modal-content .file-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .modal-content .file-actions a {
            color: #1a3a6b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .modal-content .file-actions a:hover {
            text-decoration: underline;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            padding: 14px;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .form-row { grid-template-columns: 1fr; }
            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 20px;
            }
            .form-section { padding: 16px 18px; }
            .table-section { padding: 12px 14px; }
            th, td { padding: 8px 10px; font-size: 0.78rem; }
            .toast {
                right: 12px;
                left: 12px;
                min-width: auto;
                font-size: 0.82rem;
            }
            .modal-content { padding: 20px; margin: 10% auto; }
        }
        @media (max-width: 480px) {
            .btn { padding: 7px 16px; font-size: 0.78rem; }
            .btn-delete, .btn-view { padding: 3px 10px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div>
            <h1>📢 <span>Recent</span> Updates — Admin</h1>
            <p>Manage school announcements & updates</p>
        </div>
        <div class="header-badge">⚡ Admin Panel</div>
    </div>

    <div class="main-box">

        <section class="form-section">
            <h2>➕ Add New Update</h2>
            <form id="updateForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" class="form-control" placeholder="Enter title" required />
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" class="form-control">
                            <option value="general">General</option>
                            <option value="events">Events</option>
                            <option value="academic">Academic</option>
                            <option value="holiday">Holiday</option>
                            <option value="admission">Admission</option>
                            <option value="exam">Exam</option>
                            <option value="important">Important</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="2" placeholder="Enter description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="link">Link (optional)</label>
                        <input type="url" id="link" class="form-control" placeholder="https://example.com" />
                    </div>
                    <div class="form-group">
                        <label for="isNew">Status</label>
                        <select id="isNew" class="form-control">
                            <option value="1">🆕 New</option>
                            <option value="0">📌 Old</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="file">Attachment</label>
                    <input type="file" id="file" class="form-control" accept="image/*,.pdf,.doc,.docx,audio/*,video/*" />
                    <small style="color:#94a3b8;font-size:0.7rem;">Max: 50MB</small>
                </div>
                <div class="form-actions" style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Update</button>
                    <button type="reset" class="btn btn-outline" onclick="resetForm()">✖ Clear</button>
                </div>
            </form>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h3>📋 All Updates <span class="count-badge" id="updateCount">0</span></h3>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>File</th>
                            <th>Status</th>
                            <th style="text-align:center;">Action</th>
                        </tr>
                    </thead>
                    <!-- ✅ ID SAHI KAREIN -->
                    <tbody id="updatesTableBody">
                        <tr>
                            <td colspan="7" class="loading-text">Loading updates...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <div class="footer">© 2026 Govt. Sr. Sec. School, Shilla — All Rights Reserved</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div id="fileModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://gsssshilla.onrender.com';

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast toast-${type}`;
        toast.style.display = 'block';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.style.display = 'none';
        }, 3500);
    }

    // ============================================================
    // ✅ LOAD UPDATES - FIXED
    // ============================================================
    function loadUpdates() {
        const tbody = document.getElementById('updatesTableBody');

        fetch(`${API_URL}/recent/admin/all`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderTable(data.data);
                    document.getElementById('updateCount').textContent = data.data?.length || 0;
                } else {
                    showToast('Failed to load updates', 'error');
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#ef4444;">❌ ${data.message || 'Error loading data'}</td></tr>`;
                }
            })
            .catch(err => {
                console.error('Load error:', err);
                showToast('Error: ' + err.message, 'error');
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#ef4444;">❌ Network Error</td></tr>`;
            });
    }

    // ============================================================
    // ✅ RENDER TABLE - FIXED
    // ============================================================
    function renderTable(updates) {
        const tbody = document.getElementById('updatesTableBody');

        if (!updates || updates.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#94a3b8;">📭 No updates found</td></tr>`;
            return;
        }

        let html = '';
        updates.forEach((item, index) => {
            // ✅ Use created_at_ist if available
            const date = item.created_at_ist || formatDate(item.created_at);
            const isNew = item.is_new ? 'badge-new' : 'badge-old';
            const isNewText = item.is_new ? '🆕 New' : '📌 Old';
            const fileIcon = getFileIcon(item.file_type);
            const fileType = item.file_type || 'No File';

            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-size:0.75rem;white-space:nowrap;">${date}</td>
                    <td><strong>${escapeHtml(item.title)}</strong></td>
                    <td><span class="badge-category">${item.category || 'general'}</span></td>
                    <td>
                        ${item.file_url ? `
                            <button class="btn-view" onclick="viewFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                ${fileIcon} ${fileType}
                            </button>
                        ` : '—'}
                    </td>
                    <td><span class="${isNew}">${isNewText}</span></td>
                    <td style="text-align:center;">
                        <button class="btn-delete" onclick="deleteUpdate(${item.id})">🗑️ Delete</button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function formatDate(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2);
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function getFileIcon(mime) {
        if (!mime) return '📄';
        if (mime.startsWith('image/')) return '🖼️';
        if (mime === 'application/pdf') return '📄';
        if (mime.startsWith('audio/')) return '🎵';
        if (mime.startsWith('video/')) return '🎬';
        return '📎';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // DELETE UPDATE
    // ============================================================
    function deleteUpdate(id) {
        if (!confirm(`Delete update #${id}?`)) return;

        const btn = event?.target;
        if (btn) {
            btn.textContent = '⏳';
            btn.disabled = true;
        }

        fetch(`${API_URL}/recent/admin/delete/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '✅ Deleted successfully!', 'success');
                    loadUpdates();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to delete'), 'error');
                }
            })
            .catch(err => {
                console.error('Delete error:', err);
                showToast('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                if (btn) {
                    btn.textContent = '🗑️ Delete';
                    btn.disabled = false;
                }
            });
    }

    // ============================================================
    // ADD UPDATE
    // ============================================================
    document.getElementById('updateForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        if (!title) {
            showToast('Please enter a title', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('title', title);
        formData.append('description', document.getElementById('description').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('isNew', document.getElementById('isNew').value);
        formData.append('link', document.getElementById('link').value);

        const fileInput = document.getElementById('file');
        if (fileInput.files && fileInput.files.length > 0) {
            formData.append('file', fileInput.files[0]);
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.textContent = '⏳ Saving...';
        submitBtn.disabled = true;

        fetch(`${API_URL}/recent/admin/add`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast(data.message || '✅ Added successfully!', 'success');
                resetForm();
                loadUpdates();
            } else {
                showToast('❌ ' + (data.message || 'Failed to add'), 'error');
            }
        })
        .catch(err => {
            console.error('Add error:', err);
            showToast('❌ Error: ' + err.message, 'error');
        })
        .finally(() => {
            submitBtn.textContent = '➕ Add Update';
            submitBtn.disabled = false;
        });
    });

    // ============================================================
    // RESET
    // ============================================================
    function resetForm() {
        document.getElementById('updateForm').reset();
        document.getElementById('category').value = 'general';
        document.getElementById('isNew').value = '1';
        document.getElementById('title').focus();
        showToast('Form cleared', 'info');
    }

    // ============================================================
    // VIEW FILE
    // ============================================================
    function viewFile(id, url, type, title) {
        const modal = document.getElementById('fileModal');
        const body = document.getElementById('modalBody');

        if (!url) {
            body.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <h3>${title}</h3>
                    <p style="color:#94a3b8;">No attachment available</p>
                </div>
            `;
            modal.style.display = 'block';
            return;
        }

        let preview = '';
        if (type?.startsWith('image/')) {
            preview = `<img src="${url}" style="max-width:100%;max-height:55vh;border-radius:8px;" />`;
        } else if (type?.startsWith('video/')) {
            preview = `<video controls style="max-width:100%;max-height:55vh;border-radius:8px;"><source src="${url}" type="${type}"></video>`;
        } else if (type?.startsWith('audio/')) {
            preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
        } else if (type === 'application/pdf') {
            preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;border-radius:8px;"></iframe>`;
        } else {
            preview = `
                <div style="text-align:center;padding:16px;">
                    <p style="margin-bottom:10px;color:#475569;">${type || 'File'}</p>
                    <a href="${url}" download style="padding:8px 24px;background:#1a3a6b;color:#fff;border-radius:6px;text-decoration:none;display:inline-block;">📥 Download</a>
                </div>
            `;
        }

        body.innerHTML = `
            <h3>${title}</h3>
            <div class="file-preview">${preview}</div>
            <div class="file-actions">
                <a href="${url}" target="_blank">🔗 Open in new tab</a>
                <a href="${url}" download>📥 Download</a>
            </div>
        `;

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🏛️ Admin Panel Loaded');
        console.log('📡 API:', API_URL);
        loadUpdates();
        showToast('👋 Admin Panel Ready VIKSHANT', 'info');
    });

    setInterval(loadUpdates, 30000);
</script>

</body>
</html>
