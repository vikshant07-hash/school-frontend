<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            color: #1e293b;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Header - Government Style */
        .header {
            background: #1a3a6b;
            padding: 18px 24px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid #d4a843;
        }
        .header h1 { color: #fff; font-size: 1.2rem; }
        .header span { color: rgba(255,255,255,0.7); font-size: 0.8rem; }

        .main-box {
            background: #fff;
            border-radius: 0 0 8px 8px;
            border: 1px solid #e2e8f0;
            border-top: none;
            overflow: hidden;
        }

        /* Form */
        .form-section {
            padding: 20px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .form-section h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .form-control:focus { outline: none; border-color: #1a3a6b; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #1a3a6b; color: #fff; }
        .btn-primary:hover { background: #0f2a4b; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 4px 12px; font-size: 0.72rem; }

        /* Table */
        .table-section { padding: 16px 20px; }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .count-badge {
            background: #1a3a6b;
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 10px 12px;
            color: #64748b;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            border-bottom: 2px solid #e2e8f0;
            background: #f8fafc;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tr:hover { background: #f8fafc; }

        .badge-new {
            background: #dcfce7;
            color: #16a34a;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 30px;
        }
        .badge-old {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 30px;
        }
        .badge-category {
            background: #e0e7ff;
            color: #1a3a6b;
            font-size: 0.65rem;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .btn-delete {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-delete:hover { background: #fecaca; }

        .btn-view {
            background: #e0e7ff;
            color: #1a3a6b;
            border: 1px solid #bfdbfe;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-view:hover { background: #bfdbfe; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            font-size: 0.85rem;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 240px;
        }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #1a3a6b; }
        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            cursor: pointer;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(4px);
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            margin: 6% auto;
            padding: 24px 28px;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 8px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
        .modal-content .close {
            float: right;
            font-size: 1.6rem;
            font-weight: 300;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-content .close:hover { color: #1e293b; }
        .modal-content img { max-width: 100%; border-radius: 6px; }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #1a3a6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div><h1>📢 Recent Updates — Admin</h1></div>
        <span>Manage school announcements</span>
    </div>

    <div class="main-box">

        <!-- FORM -->
        <section class="form-section">
            <h2>➕ Add New Update</h2>
            <form id="updateForm" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" class="form-control" placeholder="Enter title" required />
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control">
                            <option value="general">General</option>
                            <option value="events">Events</option>
                            <option value="academic">Academic</option>
                            <option value="holiday">Holiday</option>
                            <option value="admission">Admission</option>
                            <option value="exam">Exam</option>
                            <option value="important">Important</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="2" placeholder="Enter description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Link (optional)</label>
                        <input type="url" id="link" class="form-control" placeholder="https://example.com" />
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="isNew" class="form-control">
                            <option value="1">🆕 New</option>
                            <option value="0">📌 Old</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Attachment</label>
                    <input type="file" id="file" class="form-control" accept="image/*,.pdf,.doc,.docx,audio/*,video/*" />
                    <small style="color:#94a3b8;font-size:0.7rem;">Max: 50MB</small>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Update</button>
                    <button type="reset" class="btn btn-danger" onclick="resetForm()">✖ Clear</button>
                </div>
            </form>
        </section>

        <!-- TABLE -->
        <section class="table-section">
            <div class="table-header">
                <h3>📋 All Updates <span class="count-badge" id="updateCount">0</span></h3>
                <button class="btn btn-danger btn-sm" onclick="bulkDelete()">🗑️ Delete Selected</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;"><input type="checkbox" id="selectAll" onchange="selectAllRows()" /></th>
                            <th>#</th>
                            <th>Date</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>File</th>
                            <th>Status</th>
                            <th style="text-align:center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="updatesTableBody">
                        <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;"><div class="spinner"></div><p>Loading updates...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <div class="footer">© 2026 Govt. Sr. Sec. School, Shilla — All Rights Reserved</div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL -->
<div id="fileModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = 'https://gsssshilla.onrender.com';
    let selectedIds = [];

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const icons = { success: '✅', error: '❌', info: 'ℹ️' };
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
            <span>${icons[type] || 'ℹ️'}</span>
            <span>${message}</span>
            <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        `;
        container.appendChild(toast);
        setTimeout(() => {
            if (toast.parentElement) {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }
        }, 4000);
    }

    // ============================================================
    // LOAD UPDATES
    // ============================================================
    function loadUpdates() {
        const tbody = document.getElementById('updatesTableBody');

        fetch(`${API_URL}/recent-admin-all`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderTable(data.data);
                    document.getElementById('updateCount').textContent = data.data?.length || 0;
                } else {
                    showToast('Failed to load updates', 'error');
                }
            })
            .catch(err => {
                console.error('Load error:', err);
                showToast('Failed to load updates', 'error');
            });
    }

    // ============================================================
    // RENDER TABLE
    // ============================================================
    function renderTable(updates) {
        const tbody = document.getElementById('updatesTableBody');

        if (!updates || updates.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:#94a3b8;">📭 No updates found</td></tr>`;
            return;
        }

        let html = '';
        updates.forEach((item, index) => {
            const date = formatDate(item.created_at);
            const isNew = item.is_new ? 'badge-new' : 'badge-old';
            const isNewText = item.is_new ? '🆕 New' : '📌 Old';
            const fileIcon = getFileIcon(item.file_type);
            const fileType = item.file_type || 'No File';

            html += `
                <tr>
                    <td><input type="checkbox" class="row-checkbox" value="${item.id}" onchange="updateSelected()" /></td>
                    <td>${index + 1}</td>
                    <td style="font-size:0.75rem;white-space:nowrap;">${date}</td>
                    <td><strong>${escapeHtml(item.title)}</strong></td>
                    <td><span class="badge-category">${item.category || 'general'}</span></td>
                    <td>
                        ${item.file_url ? `
                            <button class="btn-view" onclick="viewFile('${item.id}','${item.file_url}','${item.file_type}','${escapeHtml(item.title)}')">
                                ${fileIcon} ${fileType}
                            </button>
                        ` : '—'}
                    </td>
                    <td><span class="${isNew}">${isNewText}</span></td>
                    <td style="text-align:center;">
                        <button class="btn-delete" onclick="deleteUpdate(${item.id})">🗑️ Delete</button>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function formatDate(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2);
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function getFileIcon(mime) {
        if (!mime) return '📄';
        if (mime.startsWith('image/')) return '🖼️';
        if (mime === 'application/pdf') return '📄';
        if (mime.startsWith('audio/')) return '🎵';
        if (mime.startsWith('video/')) return '🎬';
        return '📎';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function selectAllRows() {
        const checked = document.getElementById('selectAll').checked;
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
        updateSelected();
    }

    function updateSelected() {
        selectedIds = [];
        document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
            selectedIds.push(parseInt(cb.value));
        });
    }

    // ============================================================
    // ✅ DELETE UPDATE - WORKING
    // ============================================================
    function deleteUpdate(id) {
        if (!confirm(`Delete update #${id}?`)) return;

        const btn = event?.target;
        if (btn) {
            btn.textContent = '⏳';
            btn.disabled = true;
        }

        fetch(`${API_URL}/recent-admin-delete/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '✅ Deleted successfully!', 'success');
                    loadUpdates();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to delete'), 'error');
                }
            })
            .catch(err => {
                console.error('Delete error:', err);
                showToast('❌ Error: ' + err.message, 'error');
            })
            .finally(() => {
                if (btn) {
                    btn.textContent = '🗑️ Delete';
                    btn.disabled = false;
                }
            });
    }

    // ============================================================
    // ADD UPDATE
    // ============================================================
    document.getElementById('updateForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const title = document.getElementById('title').value.trim();
        if (!title) {
            showToast('Please enter a title', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('title', title);
        formData.append('description', document.getElementById('description').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('isNew', document.getElementById('isNew').value);
        formData.append('link', document.getElementById('link').value);

        const fileInput = document.getElementById('file');
        if (fileInput.files && fileInput.files.length > 0) {
            formData.append('file', fileInput.files[0]);
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.textContent = '⏳ Saving...';
        submitBtn.disabled = true;

        fetch(`${API_URL}/recent-admin-add`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast(data.message || '✅ Added successfully!', 'success');
                resetForm();
                loadUpdates();
            } else {
                showToast('❌ ' + (data.message || 'Failed to add'), 'error');
            }
        })
        .catch(err => {
            showToast('❌ Error: ' + err.message, 'error');
        })
        .finally(() => {
            submitBtn.textContent = '➕ Add Update';
            submitBtn.disabled = false;
        });
    });

    // ============================================================
    // BULK DELETE
    // ============================================================
    function bulkDelete() {
        if (selectedIds.length === 0) {
            showToast('Select at least one update', 'info');
            return;
        }

        if (!confirm(`Delete ${selectedIds.length} selected updates?`)) return;

        fetch(`${API_URL}/recent-admin-bulk-delete`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: selectedIds })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast(data.message || `✅ ${selectedIds.length} deleted!`, 'success');
                selectedIds = [];
                document.getElementById('selectAll').checked = false;
                loadUpdates();
            } else {
                showToast('❌ ' + (data.message || 'Failed to delete'), 'error');
            }
        })
        .catch(err => {
            showToast('❌ Error: ' + err.message, 'error');
        });
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetForm() {
        document.getElementById('updateForm').reset();
        document.getElementById('category').value = 'general';
        document.getElementById('isNew').value = '1';
        document.getElementById('title').focus();
    }

    // ============================================================
    // VIEW FILE
    // ============================================================
    function viewFile(id, url, type, title) {
        const modal = document.getElementById('fileModal');
        const body = document.getElementById('modalBody');

        if (!url) {
            body.innerHTML = `<div style="text-align:center;padding:20px;"><h3>${title}</h3><p style="color:#94a3b8;">No attachment</p></div>`;
            modal.style.display = 'block';
            return;
        }

        let preview = '';
        if (type?.startsWith('image/')) {
            preview = `<img src="${url}" style="max-width:100%;max-height:55vh;border-radius:6px;" />`;
        } else if (type?.startsWith('video/')) {
            preview = `<video controls style="max-width:100%;max-height:55vh;"><source src="${url}" type="${type}"></video>`;
        } else if (type?.startsWith('audio/')) {
            preview = `<audio controls style="width:100%;"><source src="${url}" type="${type}"></audio>`;
        } else if (type === 'application/pdf') {
            preview = `<iframe src="${url}" style="width:100%;height:420px;border:none;"></iframe>`;
        } else {
            preview = `<div style="text-align:center;padding:16px;"><a href="${url}" download style="padding:6px 20px;background:#1a3a6b;color:#fff;border-radius:6px;text-decoration:none;">Download</a></div>`;
        }

        body.innerHTML = `
            <h3>${title}</h3>
            <div class="file-preview">${preview}</div>
            <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;display:flex;gap:16px;">
                <a href="${url}" target="_blank" style="color:#1a3a6b;">🔗 Open</a>
                <a href="${url}" download style="color:#1a3a6b;">📥 Download</a>
            </div>
        `;

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('fileModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('fileModal')) closeModal(); });

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🏛️ Admin Panel Loaded');
        console.log('📡 API:', API_URL);
        loadUpdates();
        showToast('👋 Admin Panel Ready', 'info');
    });

    setInterval(loadUpdates, 30000);
</script>

</body>
</html>
