<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Manager - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f0f4ff;
  color: #1a2332;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 1300px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding: 20px 28px;
  background: linear-gradient(135deg, #0a1628, #142a5c);
  border-radius: 16px;
  color: white;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header h1 i {
  color: #4a8af4;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, #4a8af4, #1a3a7a);
  color: white;
  box-shadow: 0 4px 20px rgba(74, 138, 244, 0.25);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(74, 138, 244, 0.35);
}

.btn-success {
  background: #22c55e;
  color: white;
}

.btn-success:hover {
  background: #16a34a;
  transform: translateY(-2px);
}

.btn-danger {
  background: #ef4444;
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
  transform: translateY(-2px);
}

.btn-warning {
  background: #f59e0b;
  color: white;
}

.btn-warning:hover {
  background: #d97706;
  transform: translateY(-2px);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
  border-radius: 8px;
}

.btn-outline {
  background: rgba(255, 255, 255, 0.06);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-outline:hover {
  background: rgba(255, 255, 255, 0.12);
  transform: translateY(-2px);
}

.btn-secondary {
  background: #64748b;
  color: white;
}

.btn-secondary:hover {
  background: #475569;
  transform: translateY(-2px);
}

/* Stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}

.stat-box {
  background: white;
  padding: 18px 22px;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
  border: 1px solid #e8edf8;
  display: flex;
  align-items: center;
  gap: 14px;
}

.stat-box .icon-box {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.stat-box .icon-box.blue { background: #dbeafe; color: #3b82f6; }
.stat-box .icon-box.green { background: #dcfce7; color: #22c55e; }
.stat-box .icon-box.yellow { background: #fef3c7; color: #f59e0b; }
.stat-box .icon-box.red { background: #fee2e2; color: #ef4444; }
.stat-box .icon-box.purple { background: #ede9fe; color: #8b5cf6; }

.stat-box .info .number {
  font-size: 22px;
  font-weight: 800;
  color: #0a1628;
  line-height: 1.2;
}

.stat-box .info .label {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
}

/* Form */
.form-section {
  background: white;
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid #e8edf8;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
}

.form-section h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  color: #0a1628;
  display: flex;
  align-items: center;
  gap: 10px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #1a2332;
  margin-bottom: 4px;
}

.form-group label .required {
  color: #ef4444;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #e8edf8;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: #4a8af4;
  box-shadow: 0 0 0 3px rgba(74, 138, 244, 0.1);
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

/* Table */
.table-wrapper {
  background: white;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #e8edf8;
  overflow-x: auto;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
}

.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

.table-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: #0a1628;
  display: flex;
  align-items: center;
  gap: 10px;
}

.table-header h2 span {
  background: #dbeafe;
  color: #3b82f6;
  padding: 2px 12px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
}

.table-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

table thead {
  background: #f8faff;
}

table th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  color: #1a2332;
  border-bottom: 2px solid #e8edf8;
  white-space: nowrap;
}

table td {
  padding: 12px 16px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}

table tr:hover {
  background: #f8faff;
}

table .title-cell {
  font-weight: 600;
  color: #0a1628;
  max-width: 200px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

table .desc-cell {
  max-width: 200px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #64748b;
}

table .status-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 600;
}

table .status-badge.active {
  background: #dcfce7;
  color: #16a34a;
}

table .status-badge.inactive {
  background: #fee2e2;
  color: #dc2626;
}

table .attendance-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 600;
  background: #dbeafe;
  color: #2563eb;
}

table .file-link {
  color: #4a8af4;
  text-decoration: none;
  font-size: 12px;
}

table .file-link:hover {
  text-decoration: underline;
}

table .file-size {
  font-size: 11px;
  color: #94a3b8;
}

.action-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.action-btns .btn-sm {
  font-size: 11px;
  padding: 4px 10px;
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 9998;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: white;
  border-radius: 16px;
  max-width: 600px;
  width: 100%;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
  animation: modalIn 0.3s ease;
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes modalIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
  color: #0a1628;
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-close {
  width: 36px;
  height: 36px;
  border: none;
  background: #f1f5f9;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  background: #fee2e2;
  color: #ef4444;
}

.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #f1f5f9;
}

/* Loading Spinner */
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: #0a1628;
  color: white;
  padding: 16px 24px;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.5s ease;
  z-index: 9999;
  max-width: 400px;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.success i { color: #22c55e; }
.toast.error i { color: #ef4444; }

.toast i {
  font-size: 20px;
  flex-shrink: 0;
}

/* Responsive */
@media (max-width: 768px) {
  .header { flex-direction: column; align-items: stretch; gap: 12px; }
  .header-actions { flex-wrap: wrap; }
  .header-actions .btn { flex: 1; justify-content: center; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .table-wrapper { padding: 12px; }
  table { font-size: 12px; }
  table th, table td { padding: 8px 10px; }
  .action-btns .btn-sm { font-size: 10px; padding: 3px 8px; }
  .modal { padding: 20px; }
  .table-header { flex-direction: column; align-items: stretch; }
}

@media (max-width: 480px) {
  .stats-row { grid-template-columns: 1fr; }
  .container { padding: 0 10px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <h1><i class="fas fa-bell"></i> Notification Manager</h1>
    <div class="header-actions">
      <a href="/" target="_blank" class="btn btn-outline">
        <i class="fas fa-eye"></i> View Website
      </a>
      <button class="btn btn-primary" onclick="refreshNotifications()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-box">
      <div class="icon-box blue"><i class="fas fa-bell"></i></div>
      <div class="info">
        <div class="number" id="totalCount">0</div>
        <div class="label">Total</div>
      </div>
    </div>
    <div class="stat-box">
      <div class="icon-box green"><i class="fas fa-check-circle"></i></div>
      <div class="info">
        <div class="number" id="activeCount">0</div>
        <div class="label">Active</div>
      </div>
    </div>
    <div class="stat-box">
      <div class="icon-box red"><i class="fas fa-times-circle"></i></div>
      <div class="info">
        <div class="number" id="inactiveCount">0</div>
        <div class="label">Inactive</div>
      </div>
    </div>
    <div class="stat-box">
      <div class="icon-box purple"><i class="fas fa-paperclip"></i></div>
      <div class="info">
        <div class="number" id="withFileCount">0</div>
        <div class="label">With Files</div>
      </div>
    </div>
  </div>

  <!-- ADD FORM -->
  <div class="form-section" id="formSection">
    <h2 id="formTitle"><i class="fas fa-plus-circle"></i> Add New Notification</h2>
    <form id="notificationForm">
      <input type="hidden" id="editId" value="">

      <div class="form-group">
        <label>Title <span class="required">*</span></label>
        <input type="text" id="title" placeholder="Enter notification title..." required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Enter notification description..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Attendance</label>
          <select id="attendance">
            <option value="all">All</option>
            <option value="staff">Staff Only</option>
            <option value="students">Students Only</option>
            <option value="parents">Parents Only</option>
          </select>
        </div>
        <div class="form-group">
          <label>File Attachment</label>
          <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx">
          <small style="color:#94a3b8;font-size:11px;display:block;margin-top:4px;">Max 10MB (Images, PDF, Word)</small>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success" id="submitBtn">
          <i class="fas fa-save"></i> Save Notification
        </button>
        <button type="button" class="btn btn-warning" onclick="cancelEdit()" style="display:none;" id="cancelBtn">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <div class="table-header">
      <h2>All Notifications <span id="notificationCount">0</span></h2>
      <div class="table-controls">
        <button class="btn btn-sm btn-warning" onclick="toggleAllNotifications()">
          <i class="fas fa-check-double"></i> Toggle All
        </button>
        <button class="btn btn-sm btn-danger" onclick="confirmBulkDelete()">
          <i class="fas fa-trash-alt"></i> Bulk Delete
        </button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:40px;"><input type="checkbox" id="selectAll" onchange="toggleAllCheckboxes(this)"></th>
          <th style="width:50px;">#</th>
          <th>Title</th>
          <th style="width:100px;">Attendance</th>
          <th style="width:80px;">File</th>
          <th style="width:90px;">Status</th>
          <th style="width:130px;">Date</th>
          <th style="width:150px;">Actions</th>
        </tr>
      </thead>
      <tbody id="notificationTableBody">
        <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;">
          <i class="fas fa-spinner fa-spin"></i> Loading notifications...
        </td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMessage">Success!</span>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = "https://gsssshilla.onrender.com";

// ============================================================
// DOM ELEMENTS
// ============================================================
const notificationTableBody = document.getElementById('notificationTableBody');
const notificationCount = document.getElementById('notificationCount');
const totalCount = document.getElementById('totalCount');
const activeCount = document.getElementById('activeCount');
const inactiveCount = document.getElementById('inactiveCount');
const withFileCount = document.getElementById('withFileCount');
const toast = document.getElementById('toast');
const toastMessage = document.getElementById('toastMessage');
const form = document.getElementById('notificationForm');
const editId = document.getElementById('editId');
const title = document.getElementById('title');
const description = document.getElementById('description');
const attendance = document.getElementById('attendance');
const fileInput = document.getElementById('fileInput');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const formTitle = document.getElementById('formTitle');

let currentNotifications = [];
let selectedIds = [];

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = 'success') {
  toast.className = 'toast ' + type;
  toastMessage.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

// ============================================================
// FETCH NOTIFICATIONS
// ============================================================
async function fetchNotifications() {
  try {
    const response = await fetch(`${API_BASE}/api/notifications/admin/all`);
    if (!response.ok) throw new Error('Failed to fetch');
    
    const data = await response.json();
    if (data.success) {
      currentNotifications = data.data || [];
      renderTable(currentNotifications);
      updateStats(currentNotifications);
      notificationCount.textContent = currentNotifications.length;
    }
  } catch (error) {
    console.error('Error fetching notifications:', error);
    notificationTableBody.innerHTML = `
      <tr><td colspan="8" style="text-align:center;padding:40px;color:#ef4444;">
        <i class="fas fa-exclamation-circle"></i> Failed to load notifications
      </td></tr>
    `;
  }
}

// ============================================================
// RENDER TABLE
// ============================================================
function renderTable(notifications) {
  if (!notifications || notifications.length === 0) {
    notificationTableBody.innerHTML = `
      <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;">
        <i class="fas fa-bell-slash"></i> No notifications found
      </td></tr>
    `;
    return;
  }

  notificationTableBody.innerHTML = notifications.map((item, index) => {
    const isActive = item.is_active == 1;
    const hasFile = item.file_url && item.file_url !== 'null';
    const fileSize = item.file_size ? formatFileSize(parseInt(item.file_size)) : '';
    const fileName = item.file_name || 'File';
    const fileUrl = item.file_url;

    return `
    <tr>
      <td><input type="checkbox" class="notification-checkbox" value="${item.id}" onchange="updateSelectedIds()"></td>
      <td>${index + 1}</td>
      <td>
        <div class="title-cell" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
        ${item.description ? `<div class="desc-cell" title="${escapeHtml(item.description)}">${escapeHtml(item.description.substring(0, 60))}${item.description.length > 60 ? '...' : ''}</div>` : ''}
      </td>
      <td><span class="attendance-badge">${escapeHtml(item.attendance || 'all')}</span></td>
      <td>
        ${hasFile ? `
          <a href="${fileUrl}" target="_blank" class="file-link" title="${escapeHtml(fileName)}">
            <i class="fas fa-paperclip"></i> ${escapeHtml(fileName.substring(0, 15))}
          </a>
          <div class="file-size">${fileSize}</div>
        ` : '<span style="color:#94a3b8;font-size:12px;">No file</span>'}
      </td>
      <td><span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span></td>
      <td style="font-size:12px;color:#64748b;">
        ${item.created_at_ist || item.created_at || 'N/A'}
      </td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm btn-primary" onclick="editNotification(${item.id})">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteNotification(${item.id})">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </td>
    </tr>
  `}).join('');
}

// ============================================================
// UPDATE STATS
// ============================================================
function updateStats(notifications) {
  const total = notifications.length;
  const active = notifications.filter(n => n.is_active == 1).length;
  const inactive = notifications.filter(n => n.is_active == 0).length;
  const withFile = notifications.filter(n => n.file_url && n.file_url !== 'null').length;

  totalCount.textContent = total;
  activeCount.textContent = active;
  inactiveCount.textContent = inactive;
  withFileCount.textContent = withFile;
}

// ============================================================
// FORMAT FILE SIZE
// ============================================================
function formatFileSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// ============================================================
// ESCAPE HTML
// ============================================================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// SELECT ALL CHECKBOXES
// ============================================================
function toggleAllCheckboxes(master) {
  document.querySelectorAll('.notification-checkbox').forEach(cb => {
    cb.checked = master.checked;
  });
  updateSelectedIds();
}

function updateSelectedIds() {
  selectedIds = [];
  document.querySelectorAll('.notification-checkbox:checked').forEach(cb => {
    selectedIds.push(parseInt(cb.value));
  });
}

// ============================================================
// TOGGLE ALL NOTIFICATIONS
// ============================================================
async function toggleAllNotifications() {
  if (currentNotifications.length === 0) {
    showToast('No notifications to toggle', 'error');
    return;
  }

  const allActive = currentNotifications.every(n => n.is_active == 1);
  const newStatus = allActive ? 0 : 1;

  if (!confirm(`Are you sure you want to ${newStatus ? 'activate' : 'deactivate'} all notifications?`)) return;

  let success = 0;
  for (const item of currentNotifications) {
    try {
      const response = await fetch(`${API_BASE}/api/notifications/admin/update/${item.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: item.title,
          description: item.description || '',
          attendance: item.attendance || 'all',
          is_active: newStatus
        })
      });
      if (response.ok) success++;
    } catch (e) {}
  }

  showToast(`✅ ${success} notifications ${newStatus ? 'activated' : 'deactivated'}!`, 'success');
  fetchNotifications();
}

// ============================================================
// ADD / EDIT NOTIFICATION
// ============================================================
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const id = editId.value;
  const titleVal = title.value.trim();
  const descriptionVal = description.value.trim();
  const attendanceVal = attendance.value;
  const file = fileInput.files[0];

  if (!titleVal) {
    showToast('Please enter a title', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('title', titleVal);
  formData.append('description', descriptionVal);
  formData.append('attendance', attendanceVal);
  if (file) formData.append('file', file);

  const isEdit = id !== '';
  const url = isEdit 
    ? `${API_BASE}/api/notifications/admin/update/${id}`
    : `${API_BASE}/api/notifications/admin/add`;
  const method = isEdit ? 'PUT' : 'POST';

  try {
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    submitBtn.disabled = true;

    const response = await fetch(url, {
      method: method,
      body: formData
    });

    const data = await response.json();
    if (data.success) {
      showToast(isEdit ? '✅ Notification updated!' : '✅ Notification added!', 'success');
      resetForm();
      fetchNotifications();
    } else {
      showToast(data.message || 'Failed to save', 'error');
    }
  } catch (error) {
    showToast('Error saving notification', 'error');
  } finally {
    submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Notification';
    submitBtn.disabled = false;
  }
});

// ============================================================
// EDIT NOTIFICATION
// ============================================================
function editNotification(id) {
  const item = currentNotifications.find(n => n.id === id);
  if (!item) return;

  editId.value = item.id;
  title.value = item.title;
  description.value = item.description || '';
  attendance.value = item.attendance || 'all';
  fileInput.value = '';

  formTitle.innerHTML = '<i class="fas fa-edit"></i> Edit Notification';
  submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Notification';
  cancelBtn.style.display = 'inline-flex';

  // Scroll to form
  document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
}

// ============================================================
// CANCEL EDIT
// ============================================================
function cancelEdit() {
  resetForm();
  showToast('Edit cancelled', 'warning');
}

function resetForm() {
  editId.value = '';
  title.value = '';
  description.value = '';
  attendance.value = 'all';
  fileInput.value = '';
  formTitle.innerHTML = '<i class="fas fa-plus-circle"></i> Add New Notification';
  submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Notification';
  cancelBtn.style.display = 'none';
}

// ============================================================
// DELETE NOTIFICATION
// ============================================================
async function deleteNotification(id) {
  if (!confirm('Are you sure you want to delete this notification?')) return;

  try {
    const response = await fetch(`${API_BASE}/api/notifications/admin/delete/${id}`, {
      method: 'DELETE'
    });
    const data = await response.json();
    if (data.success) {
      showToast('✅ Notification deleted!', 'success');
      fetchNotifications();
    } else {
      showToast(data.message || 'Failed to delete', 'error');
    }
  } catch (error) {
    showToast('Error deleting notification', 'error');
  }
}

// ============================================================
// BULK DELETE
// ============================================================
async function confirmBulkDelete() {
  updateSelectedIds();
  if (selectedIds.length === 0) {
    showToast('Please select notifications to delete', 'error');
    return;
  }

  if (!confirm(`Delete ${selectedIds.length} selected notifications?`)) return;

  try {
    const response = await fetch(`${API_BASE}/api/notifications/admin/bulk-delete`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: selectedIds })
    });
    const data = await response.json();
    if (data.success) {
      showToast(data.message, 'success');
      fetchNotifications();
    } else {
      showToast('Failed to delete', 'error');
    }
  } catch (error) {
    showToast('Error deleting notifications', 'error');
  }
}

// ============================================================
// REFRESH
// ============================================================
function refreshNotifications() {
  showToast('🔄 Refreshing...', 'success');
  fetchNotifications();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  fetchNotifications();
  // Auto refresh every 30 seconds
  setInterval(fetchNotifications, 30000);
});
</script>
