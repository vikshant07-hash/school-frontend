<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - GSS School Shilla</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f0f4ff;
  color: #1a2332;
  min-height: 100vh;
}

/* Header */
.page-header {
  background: linear-gradient(135deg, #0a1628, #142a5c);
  color: white;
  padding: 60px 20px 40px;
  text-align: center;
  border-bottom: 3px solid #4a8af4;
}

.page-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  font-weight: 800;
}

.page-header h1 i {
  color: #4a8af4;
}

.page-header p {
  color: rgba(255, 255, 255, 0.6);
  margin-top: 8px;
  font-size: 16px;
}

/* Container */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

/* Stats Bar */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-bottom: 30px;
  background: white;
  padding: 20px 30px;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
  border: 1px solid #e8edf8;
}

.stats-bar .stat-item {
  text-align: center;
}

.stats-bar .stat-item .number {
  font-size: 24px;
  font-weight: 800;
  color: #0a1628;
}

.stats-bar .stat-item .label {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
}

/* Notification Cards */
.notifications-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.notification-card {
  background: white;
  border-radius: 16px;
  padding: 24px 28px;
  border: 1px solid #e8edf8;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
}

.notification-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  border-color: #4a8af4;
}

.notification-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}

.notification-card .card-header .title {
  font-size: 18px;
  font-weight: 700;
  color: #0a1628;
  flex: 1;
}

.notification-card .card-header .date {
  font-size: 12px;
  color: #94a3b8;
  white-space: nowrap;
  background: #f8faff;
  padding: 4px 12px;
  border-radius: 50px;
}

.notification-card .card-body .description {
  color: #475569;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 14px;
}

.notification-card .card-body .attendance-tag {
  display: inline-block;
  background: #dbeafe;
  color: #2563eb;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 12px;
  border-radius: 50px;
  margin-bottom: 12px;
}

.notification-card .card-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1px solid #f1f5f9;
}

.notification-card .card-footer .file-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #4a8af4;
}

.notification-card .card-footer .file-info i {
  font-size: 16px;
}

.notification-card .card-footer .file-info .file-size {
  color: #94a3b8;
  font-size: 12px;
}

.notification-card .card-footer .download-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: #4a8af4;
  color: white;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
}

.notification-card .card-footer .download-btn:hover {
  background: #1a3a7a;
  transform: translateY(-2px);
}

.notification-card .card-footer .view-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: #f1f5f9;
  color: #1a2332;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
}

.notification-card .card-footer .view-btn:hover {
  background: #e2e8f0;
  transform: translateY(-2px);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  background: white;
  border-radius: 16px;
  border: 2px dashed #e8edf8;
}

.empty-state i {
  font-size: 48px;
  color: #dbeafe;
  margin-bottom: 16px;
}

.empty-state h3 {
  font-size: 20px;
  color: #0a1628;
  margin-bottom: 6px;
}

.empty-state p {
  color: #94a3b8;
}

/* Loading */
.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: #94a3b8;
}

.loading-state i {
  font-size: 36px;
  margin-bottom: 12px;
  color: #4a8af4;
}

/* Responsive */
@media (max-width: 768px) {
  .page-header { padding: 40px 20px 30px; }
  .page-header h1 { font-size: 26px; }
  .stats-bar { gap: 16px; padding: 16px 20px; }
  .stats-bar .stat-item .number { font-size: 18px; }
  .notification-card { padding: 18px 20px; }
  .notification-card .card-header { flex-direction: column; }
  .notification-card .card-header .date { align-self: flex-start; }
}

@media (max-width: 480px) {
  .page-header h1 { font-size: 22px; }
  .stats-bar { flex-wrap: wrap; gap: 12px; }
  .stats-bar .stat-item { flex: 1; min-width: 80px; }
  .notification-card .card-footer { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="page-header">
  <h1><i class="fas fa-bell"></i> Notifications</h1>
  <p>Stay updated with the latest announcements from GSS School Shilla</p>
</header>

<!-- Container -->
<div class="container">

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <div class="number" id="totalNotifs">0</div>
      <div class="label">Total Notifications</div>
    </div>
    <div class="stat-item">
      <div class="number" id="notifWithFiles">0</div>
      <div class="label">With Attachments</div>
    </div>
    <div class="stat-item">
      <div class="number" id="notifToday">0</div>
      <div class="label">New This Week</div>
    </div>
  </div>

  <!-- Notifications Grid -->
  <div class="notifications-grid" id="notificationsGrid">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading notifications...</p>
    </div>
  </div>

</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = "https://gsssshilla.onrender.com";

// ============================================================
// FETCH NOTIFICATIONS
// ============================================================
async function fetchNotifications() {
  const grid = document.getElementById('notificationsGrid');
  const totalEl = document.getElementById('totalNotifs');
  const withFilesEl = document.getElementById('notifWithFiles');
  const todayEl = document.getElementById('notifToday');

  try {
    const response = await fetch(`${API_BASE}/api/notifications/public`);
    if (!response.ok) throw new Error('Failed to fetch');

    const data = await response.json();
    const notifications = data.data || [];

    // Update stats
    totalEl.textContent = notifications.length;
    const withFiles = notifications.filter(n => n.file_url && n.file_url !== 'null').length;
    withFilesEl.textContent = withFiles;

    // Count this week
    const now = new Date();
    const weekAgo = new Date(now);
    weekAgo.setDate(weekAgo.getDate() - 7);
    const thisWeek = notifications.filter(n => {
      const date = new Date(n.created_at);
      return date >= weekAgo;
    });
    todayEl.textContent = thisWeek.length;

    // Render cards
    if (notifications.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-bell-slash"></i>
          <h3>No Notifications</h3>
          <p>There are no notifications available at this time.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = notifications.map(item => {
      const hasFile = item.file_url && item.file_url !== 'null';
      const fileSize = item.file_size ? formatFileSize(parseInt(item.file_size)) : '';
      const fileName = item.file_name || 'File';
      const fileUrl = item.file_url;
      const date = item.created_at_ist || formatDate(item.created_at);

      return `
        <div class="notification-card">
          <div class="card-header">
            <div class="title">${escapeHtml(item.title)}</div>
            <span class="date"><i class="far fa-calendar-alt"></i> ${date}</span>
          </div>
          <div class="card-body">
            ${item.attendance && item.attendance !== 'all' ? `<span class="attendance-tag">👥 ${escapeHtml(item.attendance)}</span>` : ''}
            ${item.description ? `<div class="description">${escapeHtml(item.description)}</div>` : ''}
          </div>
          ${hasFile ? `
            <div class="card-footer">
              <div class="file-info">
                <i class="fas fa-paperclip"></i>
                <span>${escapeHtml(fileName)}</span>
                <span class="file-size">(${fileSize})</span>
              </div>
              <a href="${fileUrl}" target="_blank" class="view-btn">
                <i class="fas fa-eye"></i> View
              </a>
              <a href="${fileUrl}" download="${escapeHtml(fileName)}" class="download-btn">
                <i class="fas fa-download"></i> Download
              </a>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');

  } catch (error) {
    console.error('Error fetching notifications:', error);
    grid.innerHTML = `
      <div class="empty-state" style="border-color:#fee2e2;">
        <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
        <h3>Failed to Load</h3>
        <p>Unable to load notifications. Please try again later.</p>
      </div>
    `;
  }
}

// ============================================================
// HELPERS
// ============================================================
function formatFileSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  const date = new Date(dateStr);
  return date.toLocaleDateString('en-IN', {
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  fetchNotifications();
  // Refresh every 60 seconds
  setInterval(fetchNotifications, 60000);
});
</script>

</body>
</html>
