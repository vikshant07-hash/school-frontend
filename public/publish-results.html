<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publish Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0a1628;
            --primary-light: #1a3a6b;
            --gold: #d4a843;
            --gold-hover: #c49a38;
            --bg: #f0f4f8;
            --white: #ffffff;
            --text: #1a2332;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            flex-shrink: 0;
        }
        .navbar .brand img { height: 36px; width: auto; border-radius: 6px; background: white; padding: 3px; }
        .navbar .brand .name { font-size: 16px; font-weight: 800; color: white; }
        .navbar .brand .name span { color: var(--gold); }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .navbar .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .navbar .nav-links a.active { background: var(--gold); color: var(--primary); }
        .navbar .nav-links a i { margin-right: 4px; }
        .navbar .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header h1 i { color: var(--gold); }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i { color: var(--gold); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-light);
        }
        .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            background: var(--white);
            width: 100%;
            max-width: 300px;
        }
        .form-group select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #f1f5f9; color: #475569; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        .publish-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .summary-item {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-item .number {
            font-size: 24px;
            font-weight: 700;
        }
        .summary-item .number.green { color: #059669; }
        .summary-item .number.blue { color: #2563eb; }
        .summary-item .number.orange { color: #d97706; }
        .summary-item .label { font-size: 13px; color: var(--text-light); }

        .success-msg {
            background: #d1fae5;
            color: #065f46;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            display: none;
        }
        .success-msg.show { display: block; }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }

        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table thead {
            background: #f8fafc;
        }
        table th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
        }
        table td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.pending { background: #fef3c7; color: #d97706; }
        .status-badge.uploaded { background: #dbeafe; color: #2563eb; }
        .status-badge.published { background: #d1fae5; color: #059669; }

        .loading {
            text-align: center;
            padding: 40px !important;
            color: var(--text-light);
        }
        .no-data {
            text-align: center;
            padding: 40px !important;
            color: var(--text-light);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        @media (max-width: 768px) {
            .navbar { padding: 0 12px; height: 54px; }
            .navbar .brand .name { font-size: 14px; }
            .navbar .brand img { height: 30px; }
            .navbar .nav-links {
                display: none;
                position: absolute;
                top: 54px;
                left: 0;
                right: 0;
                background: var(--primary);
                flex-direction: column;
                padding: 12px 16px;
                gap: 2px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            }
            .navbar .nav-links.open { display: flex; }
            .navbar .nav-links a { padding: 10px 14px; width: 100%; }
            .navbar .menu-toggle { display: block; }
            .container { padding: 12px 12px; }
            .page-header h1 { font-size: 18px; }
            .card { padding: 16px; }
            .summary-box { grid-template-columns: 1fr 1fr; }
            .publish-actions { flex-direction: column; }
            .publish-actions .btn { width: 100%; justify-content: center; }
            .toast { bottom: 12px; right: 12px; left: 12px; max-width: 100%; }
        }
        @media (max-width: 480px) {
            .navbar .brand .name { font-size: 12px; }
            .navbar .brand img { height: 26px; }
            .summary-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="../index.html" class="brand">
            <img src="../logo(1).png" alt="Logo" />
            <div class="name">GSSS<span> SHILLA</span></div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="upload-result.html"><i class="fas fa-upload"></i> Upload</a></li>
            <li><a href="#" class="active"><i class="fas fa-check-double"></i> Publish</a></li>
        </ul>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-check-double"></i> Publish Results</h1>
        </div>

        <!-- Select Class -->
        <div class="card">
            <h2><i class="fas fa-filter"></i> Select Class</h2>
            <div class="form-group">
                <label>Choose Class</label>
                <select id="classSelect" onchange="loadClassStudents()">
                    <option value="">-- Select Class --</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
            </div>

            <div class="summary-box" id="summaryBox" style="display:none;">
                <div class="summary-item">
                    <div class="number blue" id="totalCount">0</div>
                    <div class="label">Total Students</div>
                </div>
                <div class="summary-item">
                    <div class="number orange" id="uploadedCount">0</div>
                    <div class="label">Uploaded</div>
                </div>
                <div class="summary-item">
                    <div class="number green" id="publishedCount">0</div>
                    <div class="label">Published</div>
                </div>
                <div class="summary-item">
                    <div class="number" id="pendingCount" style="color:#d97706;">0</div>
                    <div class="label">Pending</div>
                </div>
            </div>

            <div class="publish-actions" id="publishActions" style="display:none;">
                <button class="btn btn-success" id="publishBtn" onclick="publishResults()">
                    <i class="fas fa-check-double"></i> Publish All
                </button>
                <button class="btn btn-danger" id="unpublishBtn" onclick="unpublishResults()">
                    <i class="fas fa-undo"></i> Unpublish All
                </button>
                <button class="btn btn-secondary" onclick="loadClassStudents()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>

            <div id="publishSuccess" class="success-msg"></div>
            <div id="publishError" class="error-msg"></div>
        </div>

        <!-- Students Table -->
        <div class="card">
            <h2><i class="fas fa-list"></i> Students List</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Student ID</th>
                            <th>Roll No</th>
                            <th>Status</th>
                            <th>Marksheet</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="6" class="loading">Select a class to view students</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://gsssshilla.onrender.com/api/result';
        let currentClass = '';

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }
        document.querySelectorAll('#navLinks a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('open');
            });
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        async function loadClassStudents() {
            const classValue = document.getElementById('classSelect').value;
            currentClass = classValue;

            if (!classValue) {
                document.getElementById('studentsTableBody').innerHTML =
                    '<tr><td colspan="6" class="loading">Select a class to view students</td></tr>';
                document.getElementById('summaryBox').style.display = 'none';
                document.getElementById('publishActions').style.display = 'none';
                return;
            }

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
            document.getElementById('publishSuccess').classList.remove('show');
            document.getElementById('publishError').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/class/${classValue}`);
                const result = await response.json();

                if (result.success) {
                    const students = result.data || [];
                    let total = students.length, uploaded = 0, published = 0, pending = 0;

                    students.forEach(s => {
                        if (s.result_status === 'published') published++;
                        else if (s.result_status === 'uploaded') uploaded++;
                        else pending++;
                    });

                    document.getElementById('totalCount').textContent = total;
                    document.getElementById('uploadedCount').textContent = uploaded;
                    document.getElementById('publishedCount').textContent = published;
                    document.getElementById('pendingCount').textContent = pending;
                    document.getElementById('summaryBox').style.display = 'grid';
                    document.getElementById('publishActions').style.display = 'flex';
                    document.getElementById('publishBtn').disabled = (uploaded === 0);
                    document.getElementById('unpublishBtn').disabled = (published === 0);

                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="no-data">No students in this class</td></tr>';
                        return;
                    }

                    tbody.innerHTML = students.map((s, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><strong>${s.student_name}</strong></td>
                            <td>${s.student_id}</td>
                            <td>${s.exam_roll_no}</td>
                            <td><span class="status-badge ${s.result_status || 'pending'}">${s.result_status || 'pending'}</span></td>
                            <td>
                                ${s.marksheet_url ? 
                                    `<a href="${s.marksheet_url}" target="_blank" class="btn btn-sm btn-success">
                                        <i class="fas fa-eye"></i> View
                                     </a>` : 
                                    `<span style="color:#94a3b8;">Not uploaded</span>`
                                }
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading class students:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">Error loading data</td></tr>';
            }
        }

        async function publishResults() {
            if (!currentClass) { alert('Please select a class first.'); return; }
            if (!confirm(`Are you sure you want to publish all uploaded results for Class ${currentClass}?`)) return;

            const btn = document.getElementById('publishBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
            btn.disabled = true;

            document.getElementById('publishSuccess').classList.remove('show');
            document.getElementById('publishError').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/publish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ class: currentClass })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('publishSuccess').textContent = '✅ ' + result.message;
                    document.getElementById('publishSuccess').classList.add('show');
                    showToast('✅ ' + result.message, 'success');
                    loadClassStudents();
                } else {
                    document.getElementById('publishError').textContent = '❌ ' + result.message;
                    document.getElementById('publishError').classList.add('show');
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Error publishing results:', error);
                document.getElementById('publishError').textContent = '❌ Failed to publish. Please try again.';
                document.getElementById('publishError').classList.add('show');
                showToast('❌ Failed to publish. Please try again.', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function unpublishResults() {
            if (!currentClass) { alert('Please select a class first.'); return; }
            if (!confirm(`Are you sure you want to unpublish all results for Class ${currentClass}?`)) return;

            const btn = document.getElementById('unpublishBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Unpublishing...';
            btn.disabled = true;

            document.getElementById('publishSuccess').classList.remove('show');
            document.getElementById('publishError').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/unpublish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ class: currentClass })
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('publishSuccess').textContent = '✅ ' + result.message;
                    document.getElementById('publishSuccess').classList.add('show');
                    showToast('✅ ' + result.message, 'success');
                    loadClassStudents();
                } else {
                    document.getElementById('publishError').textContent = '❌ ' + result.message;
                    document.getElementById('publishError').classList.add('show');
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Error unpublishing results:', error);
                document.getElementById('publishError').textContent = '❌ Failed to unpublish. Please try again.';
                document.getElementById('publishError').classList.add('show');
                showToast('❌ Failed to unpublish. Please try again.', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('classSelect').value) {
                loadClassStudents();
            }
        });
    </script>
</body>
</html>
