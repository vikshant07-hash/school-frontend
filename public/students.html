<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students - Result Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            color: #1a2332;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #0a1628, #1a3a6b);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand img {
            height: 44px;
            width: auto;
            border-radius: 8px;
            background: white;
            padding: 4px;
        }
        .navbar .brand .name {
            font-size: 18px;
            font-weight: 800;
            color: white;
        }
        .navbar .brand .name span {
            color: #d4a843;
        }
        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .navbar .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .navbar .nav-links a.active {
            background: #d4a843;
            color: #0a1628;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 32px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        .page-header h1 i {
            color: #d4a843;
            margin-right: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-primary {
            background: #d4a843;
            color: #0a1628;
        }
        .btn-primary:hover {
            background: #c49a38;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-edit {
            background: #dbeafe;
            color: #2563eb;
        }
        .btn-edit:hover {
            background: #bfdbfe;
        }
        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-delete:hover {
            background: #fecaca;
        }
        .btn-upload {
            background: #d1fae5;
            color: #059669;
        }
        .btn-upload:hover {
            background: #a7f3d0;
        }
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select,
        .filters input {
            padding: 8px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: 0.3s;
        }
        .filters select:focus,
        .filters input:focus {
            border-color: #d4a843;
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.1);
        }
        .table-container {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table thead {
            background: #f8fafc;
        }
        table th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        table tr:hover {
            background: #f8fafc;
        }
        .student-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-badge.uploaded {
            background: #dbeafe;
            color: #2563eb;
        }
        .status-badge.published {
            background: #d1fae5;
            color: #059669;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 40px !important;
            color: #94a3b8;
        }
        .no-data {
            text-align: center;
            padding: 40px !important;
            color: #94a3b8;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 720px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        .modal-header h2 {
            font-size: 22px;
        }
        .modal-header h2 i {
            color: #d4a843;
            margin-right: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.3s;
        }
        .close-btn:hover {
            color: #1a2332;
            transform: rotate(90deg);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full {
            grid-column: span 2;
        }
        .form-group label {
            font-weight: 500;
            font-size: 13px;
            color: #475569;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #d4a843;
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.1);
        }
        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
            }
            .navbar .nav-links {
                display: none;
            }
            .container {
                padding: 16px;
            }
            .page-header h1 {
                font-size: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: span 1;
            }
            .form-actions {
                grid-column: span 1;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 480px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="../index.html" class="brand">
            <img src="../logo(1).png" alt="Logo" />
            <div class="name">GSSS<span> SHILLA</span></div>
        </a>
        <ul class="nav-links">
            <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="#" class="active"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="upload-result.html"><i class="fas fa-upload"></i> Upload</a></li>
            <li><a href="publish-results.html"><i class="fas fa-check-double"></i> Publish</a></li>
        </ul>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-users"></i> Students Management</h1>
            <button class="btn btn-primary" onclick="showAddModal()">
                <i class="fas fa-plus"></i> Add Student
            </button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <select id="classFilter" onchange="loadStudents()">
                <option value="">All Classes</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>
            <select id="statusFilter" onchange="loadStudents()">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="uploaded">Uploaded</option>
                <option value="published">Published</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search by name or ID..." oninput="loadStudents()" />
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Class</th>
                        <th>Roll No</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== ADD MODAL ===== -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Add New Student</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="studentForm" onsubmit="addStudent(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Student Name *</label>
                        <input type="text" id="studentName" required />
                    </div>
                    <div class="form-group">
                        <label>Father Name *</label>
                        <input type="text" id="fatherName" required />
                    </div>
                    <div class="form-group">
                        <label>Mother Name *</label>
                        <input type="text" id="motherName" required />
                    </div>
                    <div class="form-group">
                        <label>Student ID *</label>
                        <input type="text" id="studentId" required />
                    </div>
                    <div class="form-group">
                        <label>APAAR ID *</label>
                        <input type="text" id="apaarId" required />
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <select id="classSelect" required>
                            <option value="">Select</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aahar Number *</label>
                        <input type="text" id="aaharNumber" required />
                    </div>
                    <div class="form-group">
                        <label>Exam Roll No *</label>
                        <input type="text" id="examRollNo" required />
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" id="dateOfBirth" required />
                    </div>
                    <div class="form-group">
                        <label>Session *</label>
                        <input type="text" id="session" placeholder="e.g. 2025-26" required />
                    </div>
                    <div class="form-group">
                        <label>Exam Type *</label>
                        <select id="examType" required>
                            <option value="">Select</option>
                            <option value="midterm">Mid Term</option>
                            <option value="final">Final</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stream</label>
                        <select id="streamSelect">
                            <option value="">N/A</option>
                            <option value="science">Science</option>
                            <option value="arts">Arts</option>
                            <option value="commerce">Commerce</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Student Photo URL *</label>
                        <input type="text" id="studentPhoto" placeholder="Paste image URL here" required />
                        <small style="color:#64748b;font-size:12px;">Upload image to any hosting and paste the URL here</small>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Student</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://gsssshilla.onrender.com/api/result';

        async function loadStudents() {
            const classFilter = document.getElementById('classFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

            try {
                let url = `${API_URL}/students`;
                if (classFilter) url += `?class=${classFilter}`;

                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    let students = result.data || [];

                    if (statusFilter) {
                        students = students.filter(s => s.result_status === statusFilter);
                    }
                    if (search) {
                        students = students.filter(s =>
                            s.student_name.toLowerCase().includes(search) ||
                            s.student_id.toLowerCase().includes(search)
                        );
                    }

                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="no-data">No students found</td></tr>';
                        return;
                    }

                    tbody.innerHTML = students.map((s, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <img src="${s.student_photo || 'https://via.placeholder.com/40'}" 
                                     alt="${s.student_name}" class="student-photo" 
                                     onerror="this.src='https://via.placeholder.com/40'" />
                            </td>
                            <td><strong>${s.student_name}</strong></td>
                            <td>${s.student_id}</td>
                            <td>${s.class}</td>
                            <td>${s.exam_roll_no}</td>
                            <td><span class="status-badge ${s.result_status || 'pending'}">${s.result_status || 'pending'}</span></td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-sm btn-edit" onclick="editStudent(${s.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-delete" onclick="deleteStudent(${s.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    <a href="upload-result.html?id=${s.id}" class="btn btn-sm btn-upload">
                                        <i class="fas fa-upload"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading students:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">Error loading students</td></tr>';
            }
        }

        function showAddModal() {
            document.getElementById('addStudentModal').classList.add('show');
            document.getElementById('studentForm').reset();
        }

        function closeModal() {
            document.getElementById('addStudentModal').classList.remove('show');
        }

        async function addStudent(e) {
            e.preventDefault();

            const data = {
                studentName: document.getElementById('studentName').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                motherName: document.getElementById('motherName').value.trim(),
                studentId: document.getElementById('studentId').value.trim(),
                apaarId: document.getElementById('apaarId').value.trim(),
                class: document.getElementById('classSelect').value,
                aaharNumber: document.getElementById('aaharNumber').value.trim(),
                examRollNo: document.getElementById('examRollNo').value.trim(),
                dateOfBirth: document.getElementById('dateOfBirth').value,
                session: document.getElementById('session').value.trim(),
                examType: document.getElementById('examType').value,
                stream: document.getElementById('streamSelect').value || '',
                studentPhoto: document.getElementById('studentPhoto').value.trim()
            };

            for (const [key, value] of Object.entries(data)) {
                if (!value && key !== 'stream') {
                    alert(`Please fill ${key.replace(/([A-Z])/g, ' $1').trim()}`);
                    return;
                }
            }

            try {
                const response = await fetch(`${API_URL}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Student added successfully!');
                    closeModal();
                    loadStudents();
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error adding student:', error);
                alert('❌ Failed to add student. Please try again.');
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                const response = await fetch(`${API_URL}/students/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.success) {
                    alert('✅ Student deleted successfully!');
                    loadStudents();
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                alert('❌ Failed to delete student.');
            }
        }

        function editStudent(id) {
            alert('Edit functionality coming soon! Student ID: ' + id);
        }

        document.addEventListener('DOMContentLoaded', loadStudents);

        document.getElementById('addStudentModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
