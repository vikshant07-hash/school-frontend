<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #F3F4F6;
            color: #1F2937;
        }
        .dashboard {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #1F2937;
            color: white;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px 32px;
            font-size: 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar .logo i {
            color: #818CF8;
            font-size: 28px;
        }
        .sidebar .nav {
            padding: 20px 12px;
        }
        .sidebar .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #9CA3AF;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            font-size: 15px;
        }
        .sidebar .nav a:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .sidebar .nav a.active {
            background: #4F46E5;
            color: white;
        }
        .sidebar .nav a i {
            width: 20px;
            text-align: center;
        }
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 24px 32px;
        }
        .main-content header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .main-content header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        .main-content header h1 i {
            color: #4F46E5;
            margin-right: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-primary {
            background: #4F46E5;
            color: white;
        }
        .btn-primary:hover {
            background: #4338CA;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-edit {
            background: #DBEAFE;
            color: #2563EB;
        }
        .btn-edit:hover {
            background: #BFDBFE;
        }
        .btn-delete {
            background: #FEE2E2;
            color: #DC2626;
        }
        .btn-delete:hover {
            background: #FECACA;
        }
        .btn-upload {
            background: #D1FAE5;
            color: #059669;
        }
        .btn-upload:hover {
            background: #A7F3D0;
        }
        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            font-weight: 500;
            font-size: 14px;
            color: #4B5563;
        }
        .filter-group select,
        .filter-group input {
            padding: 8px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .table-container {
            background: white;
            border-radius: 14px;
            border: 1px solid #E5E7EB;
            overflow-x: auto;
            padding: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table thead {
            background: #F9FAFB;
        }
        table th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #4B5563;
            border-bottom: 1px solid #E5E7EB;
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid #F3F4F6;
            vertical-align: middle;
        }
        table tr:hover {
            background: #F9FAFB;
        }
        .student-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #E5E7EB;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending {
            background: #FEF3C7;
            color: #D97706;
        }
        .status-badge.uploaded {
            background: #DBEAFE;
            color: #2563EB;
        }
        .status-badge.published {
            background: #D1FAE5;
            color: #059669;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 40px !important;
            color: #9CA3AF;
        }
        .no-data {
            text-align: center;
            padding: 40px !important;
            color: #9CA3AF;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 700px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E5E7EB;
        }
        .modal-header h2 {
            font-size: 22px;
        }
        .modal-header h2 i {
            color: #4F46E5;
            margin-right: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #9CA3AF;
            transition: all 0.3s ease;
        }
        .close-btn:hover {
            color: #1F2937;
            transform: rotate(90deg);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full {
            grid-column: span 2;
        }
        .form-group label {
            font-weight: 500;
            font-size: 13px;
            color: #4B5563;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .btn-secondary {
            background: #E5E7EB;
            color: #4B5563;
        }
        .btn-secondary:hover {
            background: #D1D5DB;
        }
        .btn-success {
            background: #10B981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            .main-content {
                margin-left: 200px;
                padding: 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: span 1;
            }
            .form-actions {
                grid-column: span 1;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 60px;
            }
            .sidebar .logo span,
            .sidebar .nav a span {
                display: none;
            }
            .sidebar .nav a {
                justify-content: center;
                padding: 12px;
            }
            .main-content {
                margin-left: 60px;
                padding: 12px;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>Result System</span>
            </div>
            <nav class="nav">
                <a href="dashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
                <a href="students.html" class="active"><i class="fas fa-users"></i> <span>Students</span></a>
                <a href="upload-result.html"><i class="fas fa-upload"></i> <span>Upload Result</span></a>
                <a href="publish-results.html"><i class="fas fa-check-double"></i> <span>Publish Results</span></a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <header>
                <h1><i class="fas fa-users"></i> Students Management</h1>
                <button class="btn btn-primary" onclick="showAddModal()">
                    <i class="fas fa-plus"></i> Add Student
                </button>
            </header>

            <!-- Filters -->
            <div class="filters">
                <div class="filter-group">
                    <label>Class</label>
                    <select id="classFilter" onchange="loadStudents()">
                        <option value="">All Classes</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select id="statusFilter" onchange="loadStudents()">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="uploaded">Uploaded</option>
                        <option value="published">Published</option>
                    </select>
                </div>
                <div class="filter-group">
                    <input type="text" id="searchInput" placeholder="Search by name or ID..." oninput="loadStudents()" />
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Student ID</th>
                            <th>Class</th>
                            <th>Roll No</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Add New Student</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="studentForm" onsubmit="addStudent(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Student Name *</label>
                        <input type="text" id="studentName" required />
                    </div>
                    <div class="form-group">
                        <label>Father Name *</label>
                        <input type="text" id="fatherName" required />
                    </div>
                    <div class="form-group">
                        <label>Mother Name *</label>
                        <input type="text" id="motherName" required />
                    </div>
                    <div class="form-group">
                        <label>Student ID *</label>
                        <input type="text" id="studentId" required />
                    </div>
                    <div class="form-group">
                        <label>APAAR ID *</label>
                        <input type="text" id="apaarId" required />
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <select id="classSelect" required>
                            <option value="">Select</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aahar Number *</label>
                        <input type="text" id="aaharNumber" required />
                    </div>
                    <div class="form-group">
                        <label>Exam Roll No *</label>
                        <input type="text" id="examRollNo" required />
                    </div>
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" id="dateOfBirth" required />
                    </div>
                    <div class="form-group">
                        <label>Session *</label>
                        <input type="text" id="session" placeholder="e.g. 2025-26" required />
                    </div>
                    <div class="form-group">
                        <label>Exam Type *</label>
                        <select id="examType" required>
                            <option value="">Select</option>
                            <option value="midterm">Mid Term</option>
                            <option value="final">Final</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stream</label>
                        <select id="streamSelect">
                            <option value="">N/A</option>
                            <option value="science">Science</option>
                            <option value="arts">Arts</option>
                            <option value="commerce">Commerce</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Student Photo URL *</label>
                        <input type="text" id="studentPhoto" placeholder="Paste image URL here" required />
                        <small style="color:#6B7280;font-size:12px;">Upload image to any hosting and paste the URL here</small>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Student</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/result';

        // Load students
        async function loadStudents() {
            const classFilter = document.getElementById('classFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

            try {
                let url = `${API_URL}/students`;
                if (classFilter) url += `?class=${classFilter}`;

                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    let students = result.data || [];

                    // Filter by status
                    if (statusFilter) {
                        students = students.filter(s => s.result_status === statusFilter);
                    }

                    // Filter by search
                    if (search) {
                        students = students.filter(s =>
                            s.student_name.toLowerCase().includes(search) ||
                            s.student_id.toLowerCase().includes(search)
                        );
                    }

                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="no-data">No students found</td></tr>';
                        return;
                    }

                    tbody.innerHTML = students.map((s, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <img src="${s.student_photo || 'https://via.placeholder.com/40'}" 
                                     alt="${s.student_name}" class="student-photo" 
                                     onerror="this.src='https://via.placeholder.com/40'" />
                            </td>
                            <td><strong>${s.student_name}</strong></td>
                            <td>${s.student_id}</td>
                            <td>${s.class}</td>
                            <td>${s.exam_roll_no}</td>
                            <td><span class="status-badge ${s.result_status || 'pending'}">${s.result_status || 'pending'}</span></td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-sm btn-edit" onclick="editStudent(${s.id})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-delete" onclick="deleteStudent(${s.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    <a href="upload-result.html?id=${s.id}" class="btn btn-sm btn-upload">
                                        <i class="fas fa-upload"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading students:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">Error loading students</td></tr>';
            }
        }

        // Show Add Modal
        function showAddModal() {
            document.getElementById('addStudentModal').classList.add('show');
            document.getElementById('studentForm').reset();
        }

        // Close Modal
        function closeModal() {
            document.getElementById('addStudentModal').classList.remove('show');
        }

        // Add Student
        async function addStudent(e) {
            e.preventDefault();

            const data = {
                studentName: document.getElementById('studentName').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                motherName: document.getElementById('motherName').value.trim(),
                studentId: document.getElementById('studentId').value.trim(),
                apaarId: document.getElementById('apaarId').value.trim(),
                class: document.getElementById('classSelect').value,
                aaharNumber: document.getElementById('aaharNumber').value.trim(),
                examRollNo: document.getElementById('examRollNo').value.trim(),
                dateOfBirth: document.getElementById('dateOfBirth').value,
                session: document.getElementById('session').value.trim(),
                examType: document.getElementById('examType').value,
                stream: document.getElementById('streamSelect').value || '',
                studentPhoto: document.getElementById('studentPhoto').value.trim()
            };

            // Validation
            for (const [key, value] of Object.entries(data)) {
                if (!value && key !== 'stream') {
                    alert(`Please fill ${key.replace(/([A-Z])/g, ' $1').trim()}`);
                    return;
                }
            }

            try {
                const response = await fetch(`${API_URL}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Student added successfully!');
                    closeModal();
                    loadStudents();
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error adding student:', error);
                alert('❌ Failed to add student. Please try again.');
            }
        }

        // Delete Student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student? This will also delete their result if any.')) return;

            try {
                const response = await fetch(`${API_URL}/students/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.success) {
                    alert('✅ Student deleted successfully!');
                    loadStudents();
                } else {
                    alert('❌ Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                alert('❌ Failed to delete student.');
            }
        }

        // Edit Student (placeholder - you can implement full edit later)
        function editStudent(id) {
            alert('Edit functionality: You can update student with ID: ' + id + '\n\nTip: You can implement a separate edit modal or form.');
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadStudents);

        // Close modal on outside click
        document.getElementById('addStudentModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
