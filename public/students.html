<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students - Result Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1a2332; min-height: 100vh; overflow-x: hidden; }
        :root {
            --primary: #0a1628; --primary-light: #1a3a6b; --gold: #d4a843;
            --gold-hover: #c49a38; --bg: #f0f4f8; --white: #ffffff;
            --text: #1a2332; --text-light: #64748b; --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0,0,0,0.06); --radius: 14px;
            --radius-sm: 8px; --transition: all 0.3s ease;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 0 20px; height: 60px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .navbar .brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: white; flex-shrink: 0;
        }
        .navbar .brand img { height: 36px; width: auto; border-radius: 6px; background: white; padding: 3px; }
        .navbar .brand .name { font-size: 16px; font-weight: 800; color: white; }
        .navbar .brand .name span { color: var(--gold); }
        .navbar .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
        .navbar .nav-links a {
            text-decoration: none; color: rgba(255,255,255,0.7); padding: 6px 12px;
            border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
            transition: var(--transition); white-space: nowrap;
        }
        .navbar .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .navbar .nav-links a.active { background: var(--gold); color: var(--primary); }
        .navbar .nav-links a i { margin-right: 4px; }
        .navbar .menu-toggle {
            display: none; background: none; border: none; color: white;
            font-size: 22px; cursor: pointer; padding: 4px 8px;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 16px 20px; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .page-header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-header h1 i { color: var(--gold); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
            border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
            border: none; cursor: pointer; transition: var(--transition);
            text-decoration: none; white-space: nowrap;
        }
        .btn-primary { background: var(--gold); color: var(--primary); }
        .btn-primary:hover { background: var(--gold-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212,168,67,0.3); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-edit { background: #dbeafe; color: #2563eb; }
        .btn-edit:hover { background: #bfdbfe; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-delete:hover { background: #fecaca; }
        .btn-upload { background: #d1fae5; color: #059669; }
        .btn-upload:hover { background: #a7f3d0; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-secondary { background: #f1f5f9; color: #475569; }
        .btn-secondary:hover { background: #e2e8f0; }

        .filters {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
            align-items: center; background: var(--white); padding: 12px 16px;
            border-radius: var(--radius); border: 1px solid var(--border);
        }
        .filters .filter-group {
            display: flex; align-items: center; gap: 6px; flex: 1 1 180px;
        }
        .filters .filter-group label {
            font-size: 13px; font-weight: 500; color: var(--text-light); white-space: nowrap;
        }
        .filters select, .filters input {
            padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 13px; background: var(--white); outline: none; transition: var(--transition);
            width: 100%; min-width: 100px;
        }
        .filters select:focus, .filters input:focus {
            border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
        }

        .table-container {
            background: var(--white); border-radius: var(--radius); border: 1px solid var(--border);
            overflow: hidden; box-shadow: var(--shadow);
        }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
        table thead { background: #f8fafc; }
        table th {
            padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-light);
            border-bottom: 2px solid var(--border); white-space: nowrap; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        table tbody tr:hover { background: #f8fafc; }
        .status-badge {
            display: inline-block; padding: 2px 12px; border-radius: 50px; font-size: 11px; font-weight: 600;
        }
        .status-badge.pending { background: #fef3c7; color: #d97706; }
        .status-badge.uploaded { background: #dbeafe; color: #2563eb; }
        .status-badge.published { background: #d1fae5; color: #059669; }
        .class-badge {
            display: inline-block; background: #f1f5f9; padding: 2px 10px; border-radius: 50px; font-size: 11px; color: #475569;
        }
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .loading { text-align: center; padding: 40px !important; color: var(--text-light); }
        .no-data { text-align: center; padding: 40px !important; color: var(--text-light); }

        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
            border-radius: var(--radius); color: white; font-weight: 500; font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 9999;
            transform: translateY(100px); opacity: 0; transition: all 0.4s ease; max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9998; align-items: center; justify-content: center;
            padding: 16px; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--white); border-radius: var(--radius); max-width: 720px;
            width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        @keyframes slideUp {
            from { transform: translateY(30px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px; border-bottom: 1px solid var(--border); position: sticky;
            top: 0; background: var(--white); z-index: 5; border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .modal-header h2 i { color: var(--gold); }
        .modal-close {
            background: none; border: none; font-size: 28px; cursor: pointer;
            color: var(--text-light); transition: var(--transition); padding: 0 4px; line-height: 1;
        }
        .modal-close:hover { color: var(--text); transform: rotate(90deg); }
        .modal-body { padding: 20px 24px 24px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-weight: 500; font-size: 13px; color: var(--text-light); }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group select {
            padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; outline: none; transition: var(--transition); background: var(--white); width: 100%;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
        }
        .form-group input[type="date"] { min-height: 42px; }
        .form-group .helper-text { font-size: 12px; color: var(--text-light); margin-top: 2px; }

        .form-actions {
            grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 8px;
            justify-content: flex-end; flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .navbar { padding: 0 12px; height: 54px; }
            .navbar .brand .name { font-size: 14px; }
            .navbar .brand img { height: 30px; }
            .navbar .nav-links {
                display: none; position: absolute; top: 54px; left: 0; right: 0;
                background: var(--primary); flex-direction: column; padding: 12px 16px;
                gap: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                border-radius: 0 0 var(--radius) var(--radius);
            }
            .navbar .nav-links.open { display: flex; }
            .navbar .nav-links a { padding: 10px 14px; width: 100%; }
            .navbar .menu-toggle { display: block; }
            .container { padding: 12px 12px; }
            .page-header { flex-direction: column; align-items: stretch; gap: 10px; }
            .page-header h1 { font-size: 18px; }
            .page-header .btn { width: 100%; justify-content: center; }
            .filters { flex-direction: column; padding: 10px 12px; }
            .filters .filter-group { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .form-actions .btn { width: 100%; justify-content: center; }
            .modal { max-width: 100%; margin: 0 8px; max-height: 95vh; }
            .modal-header { padding: 14px 16px; }
            .modal-header h2 { font-size: 17px; }
            .modal-body { padding: 14px 16px 20px; }
            table { font-size: 12px; min-width: 600px; }
            table th, table td { padding: 8px 10px; }
            .actions { gap: 3px; }
            .btn-sm { padding: 4px 8px; font-size: 11px; }
            .toast { bottom: 12px; right: 12px; left: 12px; max-width: 100%; }
        }
        @media (max-width: 480px) {
            .navbar .brand .name { font-size: 12px; }
            .navbar .brand img { height: 26px; }
            .page-header h1 { font-size: 16px; }
            .btn { font-size: 12px; padding: 6px 12px; }
            table { font-size: 11px; min-width: 500px; }
            table th, table td { padding: 6px 8px; }
            .status-badge { font-size: 10px; padding: 1px 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="../index.html" class="brand">
            <img src="../logo(1).png" alt="Logo" />
            <div class="name">GSSS<span> SHILLA</span></div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="#" class="active"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="upload-result.html"><i class="fas fa-upload"></i> Upload</a></li>
            <li><a href="publish-results.html"><i class="fas fa-check-double"></i> Publish</a></li>
        </ul>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-users"></i> Students Management</h1>
            <button class="btn btn-primary" onclick="openModal('add')">
                <i class="fas fa-plus"></i> Add Student
            </button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Class</label>
                <select id="classFilter" onchange="loadStudents()">
                    <option value="">All</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-tag"></i> Status</label>
                <select id="statusFilter" onchange="loadStudents()">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="uploaded">Uploaded</option>
                    <option value="published">Published</option>
                </select>
            </div>
            <div class="filter-group" style="flex:2;">
                <label><i class="fas fa-search"></i> Search</label>
                <input type="text" id="searchInput" placeholder="Name or ID..." oninput="loadStudents()" />
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>Name</th>
                            <th>Student ID</th>
                            <th>Class</th>
                            <th>Roll</th>
                            <th>Status</th>
                            <th style="min-width:140px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Add Student</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="studentForm" onsubmit="saveStudent(event)">
                    <input type="hidden" id="editId" value="" />
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student Name <span class="required">*</span></label>
                            <input type="text" id="studentName" required placeholder="e.g. Rahul Sharma" />
                        </div>
                        <div class="form-group">
                            <label>Father Name <span class="required">*</span></label>
                            <input type="text" id="fatherName" required placeholder="e.g. Rajesh Sharma" />
                        </div>
                        <div class="form-group">
                            <label>Mother Name <span class="required">*</span></label>
                            <input type="text" id="motherName" required placeholder="e.g. Sunita Sharma" />
                        </div>
                        <div class="form-group">
                            <label>Student ID <span class="required">*</span></label>
                            <input type="text" id="studentId" required placeholder="e.g. STU001" />
                            <div class="helper-text">Unique ID for the student</div>
                        </div>
                        <div class="form-group">
                            <label>APAAR ID <span class="required">*</span></label>
                            <input type="text" id="apaarId" required placeholder="e.g. 210051204734" />
                        </div>
                        <div class="form-group">
                            <label>Class <span class="required">*</span></label>
                            <select id="classSelect" required>
                                <option value="">Select</option>
                                <option value="6">Class 6</option>
                                <option value="7">Class 7</option>
                                <option value="8">Class 8</option>
                                <option value="9">Class 9</option>
                                <option value="10">Class 10</option>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Aahar Number <span class="required">*</span></label>
                            <input type="text" id="aaharNumber" required placeholder="e.g. 3213456789" />
                        </div>
                        <div class="form-group">
                            <label>Exam Roll No <span class="required">*</span></label>
                            <input type="text" id="examRollNo" required placeholder="e.g. 102" />
                        </div>
                        <div class="form-group">
                            <label>Date of Birth <span class="required">*</span></label>
                            <input type="date" id="dateOfBirth" required />
                            <div class="helper-text">Select date from calendar</div>
                        </div>
                        <div class="form-group">
                            <label>Session <span class="required">*</span></label>
                            <input type="text" id="session" required placeholder="e.g. 2026" />
                        </div>
                        <div class="form-group">
                            <label>Exam Type <span class="required">*</span></label>
                            <select id="examType" required>
                                <option value="">Select</option>
                                <option value="midterm">Mid Term</option>
                                <option value="final">Final</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Stream</label>
                            <select id="streamSelect">
                                <option value="">N/A</option>
                                <option value="science">Science</option>
                                <option value="arts">Arts</option>
                                <option value="commerce">Commerce</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                            <button type="submit" class="btn btn-success" id="submitBtn">
                                <i class="fas fa-save"></i> Save Student
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://gsssshilla.onrender.com/api/result';

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }
        document.querySelectorAll('#navLinks a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('open');
            });
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        async function loadStudents() {
            const classFilter = document.getElementById('classFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';

            try {
                let url = `${API_URL}/students`;
                if (classFilter) url += `?class=${classFilter}`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    let students = result.data || [];
                    if (statusFilter) {
                        students = students.filter(s => s.result_status === statusFilter);
                    }
                    if (search) {
                        students = students.filter(s =>
                            s.student_name.toLowerCase().includes(search) ||
                            s.student_id.toLowerCase().includes(search)
                        );
                    }

                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="no-data"><i class="fas fa-inbox"></i> No students found</td></tr>';
                        return;
                    }

                    tbody.innerHTML = students.map((s, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><strong>${s.student_name}</strong></td>
                            <td>${s.student_id}</td>
                            <td><span class="class-badge">${s.class}</span></td>
                            <td>${s.exam_roll_no}</td>
                            <td><span class="status-badge ${s.result_status || 'pending'}">${s.result_status || 'pending'}</span></td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-sm btn-edit" onclick="editStudent(${s.id})" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-delete" onclick="deleteStudent(${s.id})" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    <a href="upload-result.html?id=${s.id}" class="btn btn-sm btn-upload" title="Upload Result">
                                        <i class="fas fa-upload"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    throw new Error(result.message || 'Failed to fetch data');
                }
            } catch (error) {
                console.error('Error loading students:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="no-data"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> ${error.message}</td></tr>`;
                showToast('Failed to load students: ' + error.message, 'error');
            }
        }

        function openModal(mode, data = null) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('studentForm').reset();
            document.getElementById('editId').value = '';

            if (mode === 'edit' && data) {
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Student';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Student';
                document.getElementById('editId').value = data.id;
                document.getElementById('studentName').value = data.student_name || '';
                document.getElementById('fatherName').value = data.father_name || '';
                document.getElementById('motherName').value = data.mother_name || '';
                document.getElementById('studentId').value = data.student_id || '';
                document.getElementById('apaarId').value = data.apaar_id || '';
                document.getElementById('classSelect').value = data.class || '';
                document.getElementById('aaharNumber').value = data.aahar_number || '';
                document.getElementById('examRollNo').value = data.exam_roll_no || '';
                document.getElementById('dateOfBirth').value = data.date_of_birth ? new Date(data.date_of_birth).toISOString().split('T')[0] : '';
                document.getElementById('session').value = data.session || '';
                document.getElementById('examType').value = data.exam_type || '';
                document.getElementById('streamSelect').value = data.stream || '';
            } else {
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> Add Student';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Save Student';
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('studentForm').reset();
            document.getElementById('editId').value = '';
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        async function saveStudent(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const isEdit = !!editId;

            const data = {
                studentName: document.getElementById('studentName').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                motherName: document.getElementById('motherName').value.trim(),
                studentId: document.getElementById('studentId').value.trim(),
                apaarId: document.getElementById('apaarId').value.trim(),
                class: document.getElementById('classSelect').value,
                aaharNumber: document.getElementById('aaharNumber').value.trim(),
                examRollNo: document.getElementById('examRollNo').value.trim(),
                dateOfBirth: document.getElementById('dateOfBirth').value,
                session: document.getElementById('session').value.trim(),
                examType: document.getElementById('examType').value,
                stream: document.getElementById('streamSelect').value || ''
            };

            for (const [key, value] of Object.entries(data)) {
                if (!value && key !== 'stream') {
                    showToast(`Please fill ${key.replace(/([A-Z])/g, ' $1').trim()}`, 'error');
                    return;
                }
            }

            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            try {
                const url = isEdit ? `${API_URL}/students/${editId}` : `${API_URL}/students`;
                const method = isEdit ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    showToast(isEdit ? '✅ Student updated successfully!' : '✅ Student added successfully!', 'success');
                    closeModal();
                    loadStudents();
                } else {
                    showToast('❌ ' + (result.message || 'Failed to save'), 'error');
                }
            } catch (error) {
                console.error('Error saving student:', error);
                showToast('❌ Failed to save student: ' + error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function editStudent(id) {
            try {
                const response = await fetch(`${API_URL}/students/${id}`);
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                const result = await response.json();
                if (result.success) {
                    openModal('edit', result.data);
                } else {
                    showToast('❌ Failed to load student data', 'error');
                }
            } catch (error) {
                console.error('Error fetching student:', error);
                showToast('❌ Failed to load student data: ' + error.message, 'error');
            }
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;
            try {
                const response = await fetch(`${API_URL}/students/${id}`, { method: 'DELETE' });
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                const result = await response.json();
                if (result.success) {
                    showToast('✅ Student deleted successfully!', 'success');
                    loadStudents();
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                showToast('❌ Failed to delete student: ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>
</html>
