<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Attempt | GSSS Shilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root { --bg:#f5f7fb;--bg-white:#fff;--text-primary:#1a2332;--text-secondary:#5a6a7e;--text-muted:#94a3b8;--gold:#c9972b;--gold-light:#e8b84b;--gold-bg:#fef8ed;--blue:#4a8af4;--blue-bg:#eef4ff;--green:#10b981;--green-bg:#ecfdf5;--orange:#f59e0b;--orange-bg:#fffbeb;--red:#ef4444;--border:#e8edf8;--shadow:0 2px 12px rgba(0,0,0,0.04);--shadow-hover:0 8px 30px rgba(0,0,0,0.08);--radius:16px;--radius-sm:10px; }
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh; }

.quiz-header { background:linear-gradient(135deg,#1a2332 0%,#2c3e50 100%);color:#fff;padding:20px 32px;box-shadow:0 4px 20px rgba(0,0,0,0.15);position:sticky;top:0;z-index:100; }
.quiz-header .row { max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px; }
.quiz-header h1 { font-size:20px;font-weight:800; }
.quiz-header .meta { font-size:12px;color:rgba(255,255,255,0.7);margin-top:2px; }
.timer-box { background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#fff;padding:10px 22px;border-radius:12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(201,151,43,0.4); }
.timer-box i { font-size:20px; }
.timer-box .time { font-size:20px;font-weight:800;font-variant-numeric:tabular-nums; }
.timer-box.danger { background:linear-gradient(135deg,#dc2626,#ef4444); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

.main-container { max-width:1000px;margin:0 auto;padding:24px 32px 100px; }

.progress-bar { background:var(--bg-white);border-radius:12px;padding:14px 20px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px; }
.progress-bar .bar-track { flex:1;height:8px;background:var(--border);border-radius:8px;overflow:hidden; }
.progress-bar .bar-fill { height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width 0.3s; }
.progress-bar .info { font-size:12px;font-weight:700;color:var(--text-secondary);white-space:nowrap; }

.question-card { background:var(--bg-white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px; }
.question-card .q-num { display:inline-block;background:var(--gold-bg);color:var(--gold);font-weight:800;font-size:11px;padding:4px 12px;border-radius:8px;margin-bottom:12px;letter-spacing:0.5px; }
.question-card .q-text { font-size:17px;font-weight:700;line-height:1.5;margin-bottom:20px;color:var(--text-primary); }
.question-card .q-text-hi { font-size:15px;color:var(--text-secondary);margin-bottom:20px;padding-top:8px;border-top:1px dashed var(--border); }

.option { display:flex;align-items:center;gap:12px;padding:14px 18px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;margin-bottom:10px;background:var(--bg-white); }
.option:hover { border-color:var(--gold);background:var(--gold-bg); }
.option.selected { border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 0 3px rgba(201,151,43,0.15); }
.option .opt-label { width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-secondary);flex-shrink:0;transition:all 0.2s; }
.option.selected .opt-label { background:var(--gold);color:#fff; }
.option .opt-text { font-size:14px;font-weight:500;color:var(--text-primary); }

.sticky-footer { position:fixed;bottom:0;left:0;right:0;background:var(--bg-white);border-top:1px solid var(--border);padding:16px 32px;box-shadow:0 -4px 20px rgba(0,0,0,0.08);z-index:50; }
.sticky-footer .row { max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap; }

.btn { display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s; }
.btn:disabled { opacity:0.6;cursor:not-allowed; }
.btn-primary { background:var(--gold);color:#fff; } .btn-primary:hover:not(:disabled) { background:var(--gold-light); }
.btn-success { background:var(--green);color:#fff; } .btn-success:hover:not(:disabled) { background:#059669; }
.btn-outline { background:var(--bg);color:var(--text-secondary);border:1px solid var(--border); } .btn-outline:hover:not(:disabled) { background:var(--border); }
.btn-danger { background:var(--red);color:#fff; }

.overlay { position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:20px; }
.modal { background:var(--bg-white);border-radius:var(--radius);max-width:500px;width:100%;padding:32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.modal h2 { font-size:22px;font-weight:800;margin-bottom:12px; }
.modal p { color:var(--text-secondary);margin-bottom:20px;line-height:1.6; }
.hidden { display:none !important; }

.result-box { text-align:center;padding:40px 20px; }
.result-box .icon { font-size:72px;margin-bottom:20px; }
.result-box h1 { font-size:32px;font-weight:800;margin-bottom:12px; }
.result-box .score { font-size:48px;font-weight:800;color:var(--gold);margin:20px 0; }
.result-box .stats { display:flex;justify-content:center;gap:30px;margin:30px 0;flex-wrap:wrap; }
.result-box .stat { text-align:center; }
.result-box .stat .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px; }
.result-box .stat .val { font-size:22px;font-weight:800;color:var(--text-primary); }
</style>
</head>
<body>

<div id="appContainer">
    <div style="text-align:center;padding:80px 20px;">
        <i class="fas fa-spinner fa-spin" style="font-size:40px;color:var(--gold);"></i>
        <p style="margin-top:14px;color:var(--text-muted);">Loading quiz…</p>
    </div>
</div>

<div class="overlay hidden" id="confirmSubmitOverlay" style="display:none;">
    <div class="modal">
        <div style="font-size:48px;color:var(--orange);margin-bottom:12px;"><i class="fas fa-question-circle"></i></div>
        <h2>Submit Quiz?</h2>
        <p>You've answered <b id="answeredCount">0</b> out of <b id="totalCount">0</b> questions.<br>Once submitted, you cannot change your answers.</p>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button class="btn btn-outline" onclick="closeConfirmModal()">Cancel</button>
            <button class="btn btn-success" onclick="submitQuiz()">Yes, Submit</button>
        </div>
    </div>
</div>

<script>
const QUIZ_API = "https://gsssshilla.onrender.com/api/quiz";

const params = new URLSearchParams(location.search);
const eventId = params.get("event");

const state = {
    student: null,
    attemptId: null,
    event: null,
    questions: [],
    answers: {},
    currentIdx: 0,
    startTime: null,
    timerInterval: null,
    timeRemaining: 0,
    submitting: false
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function esc(v) { return v === null || v === undefined ? "" : String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

async function init() {
    if (!eventId) { alert("Quiz ID missing"); window.location.href = "student-dashboard.html"; return; }

    // Get student data from sessionStorage
    try {
        const data = sessionStorage.getItem("studentData");
        if (!data) { window.location.href = "student-login.html"; return; }
        state.student = JSON.parse(data);
    } catch (e) { window.location.href = "student-login.html"; return; }

    // Start attempt
    try {
        const res = await fetch(`${QUIZ_API}/student/start/${eventId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studentId: state.student.student_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to start");

        state.attemptId = data.attempt_id;
        state.event = data.event;
        state.questions = data.questions;
        state.timeRemaining = data.event.duration_minutes * 60;

        // Populate answers from resumed attempt
        data.answered.forEach(a => { state.answers[a.question_id] = a.selected_answer; });

        renderQuiz();
        startTimer();
    } catch (err) {
        $("#appContainer").innerHTML = `
            <div style="text-align:center;padding:80px 20px;max-width:500px;margin:0 auto;">
                <div style="font-size:64px;color:var(--red);margin-bottom:16px;"><i class="fas fa-exclamation-triangle"></i></div>
                <h2 style="font-size:22px;font-weight:800;margin-bottom:12px;">Cannot Start Quiz</h2>
                <p style="color:var(--text-secondary);margin-bottom:24px;">${esc(err.message)}</p>
                <a href="student-dashboard.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>`;
    }
}

function renderQuiz() {
    const q = state.questions[state.currentIdx];
    const total = state.questions.length;
    const answered = Object.keys(state.answers).length;

    $("#appContainer").innerHTML = `
        <div class="quiz-header">
            <div class="row">
                <div>
                    <h1>${esc(state.event.title)}</h1>
                    <div class="meta">Question ${state.currentIdx + 1} of ${total} · ${esc(state.student.name)}</div>
                </div>
                <div class="timer-box" id="timerBox">
                    <i class="fas fa-clock"></i>
                    <div class="time" id="timerDisplay">--:--</div>
                </div>
            </div>
        </div>

        <div class="main-container">
            <div class="progress-bar">
                <div class="info">${answered} / ${total} answered</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(answered/total)*100}%"></div></div>
                <div class="info">${Math.round((answered/total)*100)}%</div>
            </div>

            <div class="question-card">
                <span class="q-num">QUESTION ${state.currentIdx + 1}</span>
                <div class="q-text">${esc(q.question_en || "")}</div>
                ${q.question_hi ? `<div class="q-text-hi">${esc(q.question_hi)}</div>` : ""}

                <div class="options-list" id="optionsList">
                    ${["A","B","C","D"].map((opt, i) => {
                        const enKey = `option_${opt.toLowerCase()}_en`;
                        const hiKey = `option_${opt.toLowerCase()}_hi`;
                        const textEn = q[enKey] || "";
                        const textHi = q[hiKey] || "";
                        const selected = state.answers[q.id] === opt;
                        return `
                        <div class="option ${selected ? "selected" : ""}" data-opt="${opt}" onclick="selectOption('${opt}')">
                            <div class="opt-label">${opt}</div>
                            <div class="opt-text">${esc(textEn)}${textHi ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">${esc(textHi)}</div>` : ""}</div>
                        </div>`;
                    }).join("")}
                </div>
            </div>

            <div style="display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;">
                ${state.questions.map((_, i) => `<button class="btn btn-outline btn-sm" onclick="jumpTo(${i})" style="width:38px;height:38px;padding:0;justify-content:center;${state.answers[state.questions[i].id] ? "background:var(--gold);color:#fff;border-color:var(--gold);" : ""}${i === state.currentIdx ? "box-shadow:0 0 0 3px rgba(201,151,43,0.3);" : ""}">${i + 1}</button>`).join("")}
            </div>
        </div>

        <div class="sticky-footer">
            <div class="row">
                <button class="btn btn-outline" onclick="prevQuestion()" ${state.currentIdx === 0 ? "disabled" : ""}>
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <div style="display:flex;gap:10px;">
                    ${state.currentIdx < total - 1 ? `<button class="btn btn-primary" onclick="nextQuestion()">Next <i class="fas fa-arrow-right"></i></button>` : ""}
                    <button class="btn btn-success" onclick="openConfirmModal()"><i class="fas fa-check"></i> Submit Quiz</button>
                </div>
            </div>
        </div>
    `;
}

async function selectOption(opt) {
    const q = state.questions[state.currentIdx];
    state.answers[q.id] = opt;

    // UI update
    $$("#optionsList .option").forEach(el => {
        el.classList.toggle("selected", el.dataset.opt === opt);
    });

    // Save to server
    try {
        await fetch(`${QUIZ_API}/student/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                attemptId: state.attemptId,
                questionId: q.id,
                selectedAnswer: opt
            })
        });
    } catch (e) { console.warn("Autosave failed"); }

    // Update progress
    const total = state.questions.length;
    const answered = Object.keys(state.answers).length;
    document.querySelector(".bar-fill").style.width = `${(answered/total)*100}%`;
    document.querySelectorAll(".progress-bar .info")[0].textContent = `${answered} / ${total} answered`;
    document.querySelectorAll(".progress-bar .info")[1].textContent = `${Math.round((answered/total)*100)}%`;
}

function nextQuestion() {
    if (state.currentIdx < state.questions.length - 1) {
        state.currentIdx++;
        renderQuiz();
        window.scrollTo(0, 0);
    }
}

function prevQuestion() {
    if (state.currentIdx > 0) {
        state.currentIdx--;
        renderQuiz();
        window.scrollTo(0, 0);
    }
}

function jumpTo(idx) {
    state.currentIdx = idx;
    renderQuiz();
    window.scrollTo(0, 0);
}

function startTimer() {
    state.startTime = Date.now();

    state.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        const remaining = state.timeRemaining - elapsed;

        if (remaining <= 0) {
            clearInterval(state.timerInterval);
            autoSubmit();
            return;
        }

        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        const display = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;

        const timerDisplay = document.getElementById("timerDisplay");
        if (timerDisplay) timerDisplay.textContent = display;

        const timerBox = document.getElementById("timerBox");
        if (timerBox) timerBox.classList.toggle("danger", remaining <= 60);
    }, 1000);
}

async function autoSubmit() {
    alert("⏰ Time's up! Your quiz will be submitted automatically.");
    await submitQuiz(true);
}

function openConfirmModal() {
    const total = state.questions.length;
    const answered = Object.keys(state.answers).length;
    $("#answeredCount").textContent = answered;
    $("#totalCount").textContent = total;

    const overlay = $("#confirmSubmitOverlay");
    overlay.classList.remove("hidden");
    overlay.style.display = "flex";
}

function closeConfirmModal() {
    const overlay = $("#confirmSubmitOverlay");
    overlay.classList.add("hidden");
    overlay.style.display = "none";
}

async function submitQuiz(auto = false) {
    if (state.submitting) return;
    state.submitting = true;

    try {
        clearInterval(state.timerInterval);

        const res = await fetch(`${QUIZ_API}/student/submit/${state.attemptId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        renderResult(data.attempt);
    } catch (err) {
        alert("Submit failed: " + err.message);
        state.submitting = false;
    }
}

function renderResult(attempt) {
    const passed = Number(attempt.percentage) >= 40;
    const timeMin = Math.floor(attempt.time_taken_seconds / 60);
    const timeSec = attempt.time_taken_seconds % 60;

    $("#appContainer").innerHTML = `
        <div class="quiz-header">
            <div class="row">
                <div>
                    <h1>Quiz Completed! 🎉</h1>
                    <div class="meta">${esc(state.event.title)}</div>
                </div>
            </div>
        </div>

        <div class="main-container">
            <div class="question-card" style="text-align:center;padding:50px 30px;">
                <div class="icon" style="font-size:72px;margin-bottom:16px;">${passed ? "🎉" : "📝"}</div>
                <h1 style="font-size:30px;font-weight:800;margin-bottom:8px;">${passed ? "Congratulations!" : "Good Attempt!"}</h1>
                <p style="color:var(--text-secondary);margin-bottom:20px;">${esc(state.student.name)} · ${esc(state.student.class)}</p>

                <div class="score">${attempt.marks_obtained} / ${attempt.total_marks}</div>
                <div style="font-size:20px;font-weight:700;color:${passed ? "var(--green)" : "var(--orange)"};margin-bottom:24px;">
                    ${Number(attempt.percentage).toFixed(1)}% · ${passed ? "PASSED" : "NEEDS IMPROVEMENT"}
                </div>

                <div class="stats" style="display:flex;justify-content:center;gap:30px;margin:30px 0;flex-wrap:wrap;">
                    <div class="stat"><div class="lbl">Correct</div><div class="val" style="color:var(--green);">${attempt.correct_answers}</div></div>
                    <div class="stat"><div class="lbl">Wrong</div><div class="val" style="color:var(--red);">${attempt.wrong_answers}</div></div>
                    <div class="stat"><div class="lbl">Unanswered</div><div class="val" style="color:var(--text-muted);">${attempt.unanswered}</div></div>
                    <div class="stat"><div class="lbl">Time Taken</div><div class="val">${timeMin}m ${timeSec}s</div></div>
                </div>

                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px;">
                    <a href="${QUIZ_API}/certificate/${attempt.id}/pdf" target="_blank" class="btn btn-primary">
                        <i class="fas fa-certificate"></i> Download Certificate
                    </a>
                    <a href="student-dashboard.html" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    `;
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
