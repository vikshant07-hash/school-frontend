<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Attempt | GSSS Shilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
    --bg: #f1f5f9;
    --bg-white: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;

    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-bg: #eff6ff;

    --teal: #0d9488;
    --teal-bg: #f0fdfa;

    --amber: #f59e0b;
    --amber-bg: #fffbeb;

    --green: #16a34a;
    --green-bg: #f0fdf4;

    --red: #dc2626;
    --red-bg: #fef2f2;

    --purple: #7c3aed;
    --purple-bg: #f5f3ff;

    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
    --shadow: 0 4px 12px rgba(15,23,42,0.08);
    --shadow-lg: 0 20px 50px rgba(15,23,42,0.15);

    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ==================== ANIMATIONS ==================== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes pulseDanger { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); } 50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); } }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
}

/* ==================== INSTRUCTIONS SCREEN ==================== */
.instructions-screen {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1e40af 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
}
.instructions-screen::before {
    content: '';
    position: absolute;
    top: -30%; right: -15%;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.2), transparent 70%);
}
.instructions-screen::after {
    content: '';
    position: absolute;
    bottom: -30%; left: -15%;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13,148,136,0.2), transparent 70%);
}

.instr-card {
    max-width: 900px;
    width: 100%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 40px;
    position: relative;
    z-index: 1;
    animation: bounceIn 0.6s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.instr-header {
    display: flex; align-items: center; gap: 18px;
    margin-bottom: 26px; padding-bottom: 22px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}
.instr-header .icon-box {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, var(--amber), #ea580c);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #fff;
    box-shadow: 0 8px 24px rgba(245,158,11,0.4);
    flex-shrink: 0;
}
.instr-header h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px; }
.instr-header p { font-size: 14px; color: rgba(255,255,255,0.7); font-weight: 500; }

.instr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
.instr-info-item {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 18px;
}
.instr-info-item .lbl {
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--amber);
    font-weight: 800; margin-bottom: 5px;
}
.instr-info-item .val { font-size: 16px; font-weight: 800; color: #fff; }

.instr-rules {
    background: rgba(255,255,255,0.05);
    border-left: 4px solid var(--amber);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 26px;
}
.instr-rules h3 {
    font-size: 14px; font-weight: 800; color: var(--amber);
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.instr-rules ul { list-style: none; font-size: 13px; line-height: 1.9; color: rgba(255,255,255,0.85); }
.instr-rules li::before { content: '✓'; color: var(--teal); font-weight: 900; margin-right: 10px; }
.instr-rules li.warning::before { content: '⚠'; color: var(--red); }
.instr-rules li.warning { color: #fca5a5; }

.instr-countdown {
    text-align: center; padding: 24px;
    background: rgba(245,158,11,0.1);
    border: 2px dashed var(--amber);
    border-radius: 16px; margin-bottom: 20px;
}
.instr-countdown .cd-label {
    font-size: 12px; color: var(--amber);
    text-transform: uppercase; letter-spacing: 2px;
    font-weight: 800; margin-bottom: 8px;
}
.instr-countdown .cd-number {
    font-size: 54px; font-weight: 900; color: #fff;
    line-height: 1; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(245,158,11,0.6);
}
.instr-countdown .cd-sub { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 8px; }

.instr-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn-start {
    background: linear-gradient(135deg, var(--green), #15803d);
    color: #fff; border: none;
    padding: 16px 44px; border-radius: 12px;
    font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: 'Inter', sans-serif;
    display: inline-flex; align-items: center; gap: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 30px rgba(22,163,74,0.4);
    transition: var(--transition);
}
.btn-start:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(22,163,74,0.5); }
.btn-start:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

/* ==================== QUIZ SCREEN ==================== */
.quiz-topbar {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff; padding: 14px 24px;
    box-shadow: 0 4px 20px rgba(15,23,42,0.2);
    position: sticky; top: 0; z-index: 200;
}
.quiz-topbar .row {
    max-width: 1400px; margin: 0 auto;
    display: flex; justify-content: space-between;
    align-items: center; gap: 16px; flex-wrap: wrap;
}
.quiz-topbar .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.quiz-topbar .exam-logo {
    width: 42px; height: 42px; border-radius: 10px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; border: 2px solid rgba(255,255,255,0.25);
}
.quiz-topbar h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }
.quiz-topbar .meta { font-size: 11.5px; color: rgba(255,255,255,0.7); margin-top: 2px; font-weight: 500; }

.timer-box {
    background: linear-gradient(135deg, var(--amber), #ea580c);
    color: #fff; padding: 10px 22px;
    border-radius: 12px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 20px rgba(245,158,11,0.4);
    transition: var(--transition);
}
.timer-box i { font-size: 20px; }
.timer-box .time { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.timer-box.danger { background: linear-gradient(135deg, var(--red), #991b1b); animation: pulseDanger 1.2s infinite; }

.quiz-layout {
    max-width: 1400px; margin: 0 auto;
    padding: 20px 24px 100px;
    display: grid; grid-template-columns: 1fr 320px;
    gap: 20px; align-items: start;
}

.question-area {
    background: var(--bg-white);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    min-height: 400px;
}
.q-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 12px;
}
.q-badge {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; font-weight: 800; font-size: 12px;
    padding: 7px 16px; border-radius: 20px;
    letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 7px;
}
.q-marks { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.q-marks b { color: var(--teal); font-size: 14px; }

.q-text {
    font-size: 18px; font-weight: 700;
    line-height: 1.55; color: var(--text-primary);
    margin-bottom: 16px;
}
.q-text-hi {
    font-size: 16px; color: var(--text-secondary);
    font-weight: 500; padding: 12px 16px;
    background: var(--primary-bg);
    border-left: 4px solid var(--primary);
    border-radius: 8px; margin-bottom: 22px;
    line-height: 1.6;
}

.options-list { display: flex; flex-direction: column; gap: 12px; }
.option {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px; border: 2px solid var(--border);
    border-radius: 12px; cursor: pointer;
    transition: var(--transition);
    background: var(--bg-white);
    position: relative; overflow: hidden;
}
.option::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--primary);
    transform: scaleY(0); transition: transform 0.25s;
}
.option:hover {
    border-color: var(--primary-light);
    background: var(--primary-bg);
    transform: translateX(3px);
}
.option:hover::before { transform: scaleY(1); }
.option.selected {
    border-color: var(--primary);
    background: var(--primary-bg);
    box-shadow: 0 0 0 3px rgba(30,64,175,0.12);
}
.option.selected::before { transform: scaleY(1); }
.option .opt-label {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
    color: var(--text-secondary); flex-shrink: 0;
    transition: var(--transition);
}
.option.selected .opt-label {
    background: var(--primary); color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(30,64,175,0.35);
}
.option .opt-text {
    font-size: 15px; font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5; flex: 1;
}
.option .opt-text-hi {
    font-size: 13px; color: var(--text-secondary);
    margin-top: 4px; font-weight: 400;
}

/* ==================== SIDEBAR PALETTE ==================== */
.palette-sidebar {
    background: var(--bg-white);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: sticky; top: 88px;
}
.palette-sidebar h3 {
    font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-primary); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
}
.palette-sidebar h3 i { color: var(--primary); }

.palette-legend {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px 12px; margin-bottom: 18px;
    padding-bottom: 16px; border-bottom: 1px dashed var(--border);
}
.legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600;
    color: var(--text-secondary);
}
.legend-dot {
    width: 18px; height: 18px; border-radius: 5px;
    flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; color: #fff;
    border: 2px solid;
}
.legend-dot.answered { background: var(--green); border-color: var(--green); }
.legend-dot.not-answered { background: var(--red); border-color: var(--red); }
.legend-dot.marked { background: var(--purple); border-color: var(--purple); }
.legend-dot.not-visited { background: #f1f5f9; border-color: var(--border); color: var(--text-muted); }
.legend-dot.current { background: var(--amber); border-color: var(--amber); }

.palette-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 8px; max-height: 340px;
    overflow-y: auto; padding-right: 4px;
    margin-bottom: 16px;
}
.palette-grid::-webkit-scrollbar { width: 6px; }
.palette-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

.palette-btn {
    aspect-ratio: 1; border-radius: 8px;
    border: 2px solid var(--border);
    background: #f1f5f9;
    font-family: 'Inter', sans-serif;
    font-weight: 800; font-size: 12px;
    color: var(--text-muted); cursor: pointer;
    transition: var(--transition);
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.palette-btn:hover { transform: scale(1.08); }
.palette-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
.palette-btn.not-answered { background: var(--red); color: #fff; border-color: var(--red); }
.palette-btn.marked { background: var(--purple); color: #fff; border-color: var(--purple); }
.palette-btn.marked-answered { background: linear-gradient(135deg, var(--purple) 50%, var(--green) 50%); color: #fff; border-color: var(--purple); }
.palette-btn.current {
    box-shadow: 0 0 0 3px var(--amber), 0 0 0 5px rgba(245,158,11,0.25);
    transform: scale(1.05);
}
.palette-btn .mark-flag {
    position: absolute; top: -3px; right: -3px;
    width: 12px; height: 12px;
    background: var(--amber); border-radius: 50%;
    border: 2px solid #fff;
}

.palette-summary {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700;
    padding: 6px 0; border-top: 1px dashed var(--border);
}
.palette-summary span:first-child { color: var(--text-muted); }
.palette-summary span:last-child { color: var(--text-primary); }

/* ==================== ACTION BAR ==================== */
.action-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-white);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    box-shadow: 0 -4px 20px rgba(15,23,42,0.08);
    z-index: 100;
}
.action-bar .row {
    max-width: 1400px; margin: 0 auto;
    display: flex; justify-content: space-between;
    align-items: center; gap: 12px; flex-wrap: wrap;
}
.action-bar .left-group,
.action-bar .right-group { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border: none;
    border-radius: 10px; font-size: 13.5px;
    font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: var(--transition);
    letter-spacing: 0.2px;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; box-shadow: 0 4px 12px rgba(30,64,175,0.25);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,64,175,0.35); }
.btn-success {
    background: linear-gradient(135deg, var(--green), #15803d);
    color: #fff; box-shadow: 0 4px 12px rgba(22,163,74,0.25);
}
.btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(22,163,74,0.35); }
.btn-purple {
    background: linear-gradient(135deg, var(--purple), #6d28d9);
    color: #fff; box-shadow: 0 4px 12px rgba(124,58,237,0.25);
}
.btn-purple:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.35); }
.btn-outline {
    background: var(--bg-white);
    color: var(--text-secondary);
    border: 2px solid var(--border);
}
.btn-outline:hover:not(:disabled) {
    background: var(--bg);
    color: var(--text-primary);
    border-color: var(--text-muted);
}
.btn-danger { background: linear-gradient(135deg, var(--red), #991b1b); color: #fff; }
.btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(220,38,38,0.35); }

/* ==================== MODALS ==================== */
.overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.7);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex; justify-content: center; align-items: center;
    padding: 20px; animation: fadeIn 0.25s ease;
}
.overlay.hidden { display: none; }
.modal {
    background: var(--bg-white);
    border-radius: 20px;
    max-width: 540px; width: 100%;
    padding: 32px;
    box-shadow: var(--shadow-lg);
    animation: bounceIn 0.35s ease;
    text-align: center;
}
.modal.shake { animation: shake 0.5s; }
.modal .modal-icon {
    width: 72px; height: 72px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; margin: 0 auto 18px;
}
.modal .modal-icon.warn { background: linear-gradient(135deg, var(--amber), #ea580c); color: #fff; }
.modal .modal-icon.danger { background: linear-gradient(135deg, var(--red), #991b1b); color: #fff; }
.modal .modal-icon.success { background: linear-gradient(135deg, var(--green), #15803d); color: #fff; }
.modal h2 { font-size: 22px; font-weight: 900; margin-bottom: 10px; letter-spacing: -0.3px; }
.modal p { color: var(--text-secondary); font-size: 14px; line-height: 1.65; margin-bottom: 22px; }
.modal .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
.summary-item {
    background: var(--bg); border-radius: 10px;
    padding: 12px 14px; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 600;
}
.summary-item .lbl { color: var(--text-secondary); }
.summary-item .val { color: var(--text-primary); font-weight: 900; font-size: 16px; }
.summary-item .val.green { color: var(--green); }
.summary-item .val.red { color: var(--red); }
.summary-item .val.purple { color: var(--purple); }
.summary-item .val.muted { color: var(--text-muted); }

.warning-counter {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--red-bg);
    color: var(--red);
    padding: 8px 16px; border-radius: 50px;
    font-size: 12px; font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
}

/* ==================== RESULT SCREEN ==================== */
.result-screen {
    min-height: 100vh;
    background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
    padding: 40px 24px;
    display: flex; align-items: center; justify-content: center;
}
.result-card {
    max-width: 720px; width: 100%;
    background: var(--bg-white);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: var(--shadow-lg);
    text-align: center;
    animation: bounceIn 0.5s ease;
    border: 1px solid var(--border);
}
.result-icon {
    width: 96px; height: 96px;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; margin: 0 auto 22px;
    animation: bounceIn 0.6s ease;
}
.result-icon.pass { background: linear-gradient(135deg, var(--green), #15803d); color: #fff; box-shadow: 0 12px 32px rgba(22,163,74,0.35); }
.result-icon.fail { background: linear-gradient(135deg, var(--amber), #ea580c); color: #fff; box-shadow: 0 12px 32px rgba(245,158,11,0.35); }

.result-card h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.8px; }
.result-card .subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 26px; }

.score-big { font-size: 62px; font-weight: 900; line-height: 1; letter-spacing: -2px; margin-bottom: 8px; }
.score-big.pass { color: var(--green); }
.score-big.fail { color: var(--amber); }

.score-pct {
    font-size: 18px; font-weight: 800; margin-bottom: 30px;
    display: inline-block; padding: 6px 18px; border-radius: 50px;
}
.score-pct.pass { background: var(--green-bg); color: var(--green); }
.score-pct.fail { background: var(--amber-bg); color: #b45309; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
.stat-box { background: var(--bg); border-radius: 12px; padding: 16px 12px; transition: var(--transition); }
.stat-box:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-box .lbl {
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted);
    font-weight: 800; margin-bottom: 6px;
}
.stat-box .val { font-size: 24px; font-weight: 900; color: var(--text-primary); }
.stat-box .val.green { color: var(--green); }
.stat-box .val.red { color: var(--red); }
.stat-box .val.muted { color: var(--text-muted); }

.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ==================== TOAST ==================== */
.toast-container {
    position: fixed; top: 24px; right: 24px;
    z-index: 3000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
    background: var(--text-primary); color: #fff;
    padding: 14px 22px; border-radius: 12px;
    font-weight: 700; font-size: 13px;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.35s ease;
    min-width: 240px;
    display: flex; align-items: center; gap: 10px;
}
.toast.success { background: linear-gradient(135deg, var(--green), #15803d); }
.toast.error { background: linear-gradient(135deg, var(--red), #991b1b); }
.toast.warn { background: linear-gradient(135deg, var(--amber), #ea580c); }
.toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }

/* ==================== MOBILE ==================== */
.mobile-toggle-palette {
    display: none;
    position: fixed; bottom: 82px; right: 20px;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; border: none; font-size: 20px;
    cursor: pointer; box-shadow: 0 10px 24px rgba(30,64,175,0.4);
    z-index: 150;
    align-items: center; justify-content: center;
}

@media (max-width: 900px) {
    .quiz-layout { grid-template-columns: 1fr; }
    .palette-sidebar {
        position: fixed; top: 0; right: -100%;
        width: 300px; height: 100vh; z-index: 500;
        border-radius: 0; overflow-y: auto;
        transition: right 0.3s;
        box-shadow: -10px 0 40px rgba(0,0,0,0.2);
    }
    .palette-sidebar.open { right: 0; }
    .mobile-toggle-palette { display: flex; }
    .instr-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .instr-card { padding: 26px 20px; }
    .instr-header h1 { font-size: 20px; }
    .instr-countdown .cd-number { font-size: 42px; }
    .question-area { padding: 20px; }
    .q-text { font-size: 16px; }
    .action-bar .row { flex-direction: column; align-items: stretch; }
    .action-bar .left-group, .action-bar .right-group { justify-content: center; }
    .btn { padding: 11px 18px; font-size: 13px; }
}
</style>
</head>
<body>

<div id="appContainer">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
        <div style="text-align:center;">
            <i class="fas fa-spinner fa-spin" style="font-size:44px;color:#1e40af;"></i>
            <p style="margin-top:14px;color:#94a3b8;font-weight:600;">Loading quiz…</p>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ==================== CONFIG ==================== */
const QUIZ_API = "https://gsssshilla.onrender.com/api/quiz";

const params = new URLSearchParams(location.search);
const eventId = params.get("event");

const state = {
    student: null,
    attemptId: null,
    event: null,
    questions: [],
    answers: {},
    markedForReview: new Set(),
    visited: new Set(),
    currentIdx: 0,
    startTime: null,
    timerInterval: null,
    timeRemaining: 0,
    submitting: false,
    quizStarted: false,
    // Security
    violationCount: 0,
    maxViolations: 3,
    warningActive: false,
    autoSubmitTriggered: false
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

/* ==================== HELPERS ==================== */
function esc(v) {
    return v === null || v === undefined ? "" : String(v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function fmtTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function showToast(msg, type = "info") {
    const c = document.getElementById("toastContainer");
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    const icons = { success: "check-circle", error: "exclamation-circle", warn: "exclamation-triangle", info: "info-circle" };
    t.innerHTML = `<i class="fas fa-${icons[type] || "info-circle"}"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateX(40px)"; setTimeout(() => t.remove(), 400); }, 4000);
}

/* ==================== INIT ==================== */
async function init() {
    if (!eventId) { alert("Quiz ID missing"); window.location.href = "student-dashboard.html"; return; }

    try {
        const data = sessionStorage.getItem("studentData");
        if (!data) { window.location.href = "student-login.html"; return; }
        state.student = JSON.parse(data);
    } catch (e) { window.location.href = "student-login.html"; return; }

    try {
        const res = await fetch(`${QUIZ_API}/student/start/${eventId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studentId: state.student.student_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to start");

        state.attemptId = data.attempt_id;
        state.event = data.event;
        state.questions = data.questions;
        state.timeRemaining = data.event.duration_minutes * 60;

        data.answered.forEach(a => { state.answers[a.question_id] = a.selected_answer; });

        renderInstructions();
    } catch (err) {
        $("#appContainer").innerHTML = `
            <div style="text-align:center;padding:80px 20px;max-width:500px;margin:0 auto;">
                <div style="font-size:64px;color:#dc2626;margin-bottom:16px;"><i class="fas fa-exclamation-triangle"></i></div>
                <h2 style="font-size:22px;font-weight:800;margin-bottom:12px;">Cannot Start Quiz</h2>
                <p style="color:#475569;margin-bottom:24px;">${esc(err.message)}</p>
                <a href="student-dashboard.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;text-decoration:none;border-radius:10px;font-weight:700;font-family:Inter;">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>`;
    }
}

/* ==================== INSTRUCTIONS SCREEN ==================== */
function renderInstructions() {
    const totalQ = state.questions.length;
    const duration = state.event.duration_minutes;
    const marks = state.event.total_marks || totalQ;
    const passPct = state.event.pass_percentage || 40;

    $("#appContainer").innerHTML = `
        <div class="instructions-screen">
            <div class="instr-card">
                <div class="instr-header">
                    <div class="icon-box"><i class="fas fa-clipboard-list"></i></div>
                    <div>
                        <h1>${esc(state.event.title || "Online Quiz")}</h1>
                        <p>Read all instructions carefully before starting</p>
                    </div>
                </div>

                <div class="instr-grid">
                    <div class="instr-info-item">
                        <div class="lbl">Duration</div>
                        <div class="val">${duration} Minutes</div>
                    </div>
                    <div class="instr-info-item">
                        <div class="lbl">Total Questions</div>
                        <div class="val">${totalQ}</div>
                    </div>
                    <div class="instr-info-item">
                        <div class="lbl">Maximum Marks</div>
                        <div class="val">${marks}</div>
                    </div>
                    <div class="instr-info-item">
                        <div class="lbl">Pass Percentage</div>
                        <div class="val">${passPct}%</div>
                    </div>
                </div>

                <div class="instr-rules">
                    <h3><i class="fas fa-gavel"></i> Instructions</h3>
                    <ul>
                        <li>The exam timer will start once you click "Start Exam".</li>
                        <li>Each question has 4 options, choose the correct one.</li>
                        <li>Answers auto-save — no need to save manually.</li>
                        <li>Use the question palette to navigate quickly.</li>
                        <li>Mark questions for review if unsure.</li>
                        <li>You can review and change answers before final submit.</li>
                        <li class="warning"><b>Warning:</b> Do NOT switch tabs or windows — 3 violations will auto-submit your exam.</li>
                        <li class="warning"><b>Warning:</b> Do NOT close or reload the browser during the exam.</li>
                        <li class="warning"><b>Warning:</b> Right-click, copy, paste, and F12 are disabled.</li>
                    </ul>
                </div>

                <div class="instr-countdown">
                    <div class="cd-label"><i class="fas fa-clock"></i> Exam auto-starts in</div>
                    <div class="cd-number" id="instrCountdown">30</div>
                    <div class="cd-sub">seconds</div>
                </div>

                <div class="instr-actions">
                    <button class="btn-start" id="btnStartNow" onclick="startQuizNow()">
                        <i class="fas fa-play-circle"></i> Start Exam Now
                    </button>
                </div>
            </div>
        </div>
    `;

    let cd = 30;
    const cdEl = document.getElementById("instrCountdown");
    const cdInterval = setInterval(() => {
        cd--;
        if (cdEl) cdEl.textContent = cd;
        if (cd <= 0) {
            clearInterval(cdInterval);
            startQuizNow();
        }
    }, 1000);

    // Store so we can clear on manual start
    window._cdInterval = cdInterval;
}

function startQuizNow() {
    if (state.quizStarted) return;
    state.quizStarted = true;
    if (window._cdInterval) clearInterval(window._cdInterval);

    // Attempt full-screen
    try {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) {}

    // Enable security
    enableSecurity();

    state.startTime = Date.now();
    renderQuiz();
    startTimer();
}

/* ==================== SECURITY LAYER ==================== */
function enableSecurity() {
    // Block right-click
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // Block copy/paste/cut
    document.addEventListener("copy", (e) => e.preventDefault());
    document.addEventListener("paste", (e) => e.preventDefault());
    document.addEventListener("cut", (e) => e.preventDefault());

    // Block common shortcuts (F12, Ctrl+Shift+I/J/C, Ctrl+U, Ctrl+P)
    document.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (k === "i" || k === "j" || k === "c")) ||
            (e.ctrlKey && (k === "u" || k === "p" || k === "s"))
        ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    });

    // Block back button during quiz
    history.pushState(null, null, location.href);
    window.addEventListener("popstate", () => {
        history.pushState(null, null, location.href);
        showToast("Back button is disabled during exam", "warn");
    });

    // Detect tab switch / window blur (3 warnings → auto-submit)
    document.addEventListener("visibilitychange", () => {
        if (document.hidden && state.quizStarted && !state.submitting && !state.autoSubmitTriggered) {
            registerViolation("Tab switching detected");
        }
    });

    window.addEventListener("blur", () => {
        if (state.quizStarted && !state.submitting && !state.autoSubmitTriggered) {
            // Small delay to avoid double-counting with visibilitychange
            setTimeout(() => {
                if (document.hidden || document.hasFocus() === false) {
                    registerViolation("Window focus lost");
                }
            }, 200);
        }
    });

    // Warn before browser close / reload
    window.addEventListener("beforeunload", (e) => {
        if (state.quizStarted && !state.submitting && !state.autoSubmitTriggered) {
            e.preventDefault();
            e.returnValue = "If you leave, your exam will be submitted automatically. Are you sure?";
            return e.returnValue;
        }
    });
}

function registerViolation(reason) {
    if (state.warningActive) return;
    state.violationCount++;

    // Blur screen
    state.warningActive = true;

    const remaining = state.maxViolations - state.violationCount;

    if (state.violationCount >= state.maxViolations) {
        // Auto-submit
        state.autoSubmitTriggered = true;
        showViolationModal(
            "danger",
            "Exam Auto-Submitted",
            `You have exceeded the maximum number of violations (${state.maxViolations}).
             <br><br><b>Reason:</b> ${esc(reason)}
             <br><br>Your answers have been submitted automatically.`,
            true
        );
        setTimeout(() => { closeViolationModal(); autoSubmitExam(); }, 3500);
    } else {
        showViolationModal(
            "warn",
            `⚠️ Warning ${state.violationCount} of ${state.maxViolations}`,
            `A suspicious activity was detected during the exam.
             <br><br><b>Reason:</b> ${esc(reason)}
             <br><br>You have <b style="color:var(--red);font-size:16px;">${remaining}</b> more warning${remaining > 1 ? "s" : ""} before your exam is <b>auto-submitted</b>.`,
            false
        );
    }
}

function showViolationModal(type, title, message, isFinal = false) {
    let overlay = document.getElementById("violationModal");
    if (overlay) overlay.remove();

    overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "violationModal";
    overlay.innerHTML = `
        <div class="modal ${isFinal ? 'shake' : ''}">
            <div class="modal-icon ${type}">
                <i class="fas fa-${isFinal ? 'ban' : 'exclamation-triangle'}"></i>
            </div>
            <div class="warning-counter">
                <i class="fas fa-shield-alt"></i> ${state.violationCount} / ${state.maxViolations} Violations
            </div>
            <h2>${title}</h2>
            <p>${message}</p>
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="closeViolationModal()">
                    <i class="fas fa-check"></i> ${isFinal ? "OK" : "I Understand, Continue Exam"}
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
}

function closeViolationModal() {
    const el = document.getElementById("violationModal");
    if (el) el.remove();
    state.warningActive = false;
}

/* ==================== QUIZ SCREEN ==================== */
function renderQuiz() {
    const q = state.questions[state.currentIdx];
    const total = state.questions.length;
    const answered = Object.keys(state.answers).length;

    // Track visited
    state.visited.add(q.id);

    // Detect mobile
    const isMobile = window.innerWidth <= 900;

    $("#appContainer").innerHTML = `
        <div class="quiz-topbar">
            <div class="row">
                <div class="left">
                    <div class="exam-logo"><i class="fas fa-graduation-cap"></i></div>
                    <div>
                        <h1>${esc(state.event.title)}</h1>
                        <div class="meta">${esc(state.student.name)} · Class ${esc(state.student.class)} · Q ${state.currentIdx + 1}/${total}</div>
                    </div>
                </div>
                <div class="timer-box" id="timerBox">
                    <i class="fas fa-clock"></i>
                    <div class="time" id="timerDisplay">${fmtTime(state.timeRemaining)}</div>
                </div>
            </div>
        </div>

        <div class="quiz-layout">
            <div class="question-area">
                <div class="q-header">
                    <span class="q-badge">
                        <i class="fas fa-hashtag"></i> Question ${state.currentIdx + 1} of ${total}
                    </span>
                    <span class="q-marks">Marks: <b>+${q.marks || 1}</b></span>
                </div>

                <div class="q-text">${esc(q.question_en || "")}</div>
                ${q.question_hi ? `<div class="q-text-hi">${esc(q.question_hi)}</div>` : ""}

                <div class="options-list" id="optionsList">
                    ${["A", "B", "C", "D"].map(opt => {
                        const enKey = `option_${opt.toLowerCase()}_en`;
                        const hiKey = `option_${opt.toLowerCase()}_hi`;
                        const textEn = q[enKey] || "";
                        const textHi = q[hiKey] || "";
                        const selected = state.answers[q.id] === opt;
                        return `
                            <div class="option ${selected ? "selected" : ""}" data-opt="${opt}" onclick="selectOption('${opt}')">
                                <div class="opt-label">${opt}</div>
                                <div class="opt-text">
                                    ${esc(textEn)}
                                    ${textHi ? `<div class="opt-text-hi">${esc(textHi)}</div>` : ""}
                                </div>
                            </div>
                        `;
                    }).join("")}
                </div>
            </div>

            <aside class="palette-sidebar" id="paletteSidebar">
                <h3><i class="fas fa-th"></i> Question Palette</h3>

                <div class="palette-legend">
                    <div class="legend-item"><span class="legend-dot answered">${answered}</span> Answered</div>
                    <div class="legend-item"><span class="legend-dot not-answered">${total - answered}</span> Not Answered</div>
                    <div class="legend-item"><span class="legend-dot marked">M</span> Marked</div>
                    <div class="legend-item"><span class="legend-dot not-visited"></span> Not Visited</div>
                </div>

                <div class="palette-grid" id="paletteGrid">
                    ${renderPaletteButtons()}
                </div>

                <div class="palette-summary">
                    <span>Progress</span>
                    <span>${answered} / ${total}</span>
                </div>
            </aside>
        </div>

        ${isMobile ? `
            <button class="mobile-toggle-palette" onclick="document.getElementById('paletteSidebar').classList.toggle('open')">
                <i class="fas fa-th"></i>
            </button>
        ` : ""}

        <div class="action-bar">
            <div class="row">
                <div class="left-group">
                    <button class="btn btn-outline" onclick="prevQuestion()" ${state.currentIdx === 0 ? "disabled" : ""}>
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <button class="btn btn-outline" onclick="clearResponse()" ${!state.answers[q.id] ? "disabled" : ""}>
                        <i class="fas fa-eraser"></i> Clear
                    </button>
                </div>
                <div class="right-group">
                    <button class="btn btn-purple" onclick="toggleMarkReview()">
                        <i class="fas fa-bookmark"></i> ${state.markedForReview.has(q.id) ? "Unmark" : "Mark for Review"}
                    </button>
                    ${state.currentIdx < total - 1
                        ? `<button class="btn btn-primary" onclick="nextQuestion()">Save & Next <i class="fas fa-arrow-right"></i></button>`
                        : `<button class="btn btn-success" onclick="openSubmitSummary()"><i class="fas fa-paper-plane"></i> Submit Exam</button>`}
                </div>
            </div>
        </div>
    `;
}

function renderPaletteButtons() {
    return state.questions.map((q, i) => {
        const isCurrent = i === state.currentIdx;
        const isAnswered = state.answers[q.id] !== undefined;
        const isMarked = state.markedForReview.has(q.id);
        const isVisited = state.visited.has(q.id);

        let cls = "palette-btn";
        if (isAnswered && isMarked) cls += " marked-answered";
        else if (isMarked) cls += " marked";
        else if (isAnswered) cls += " answered";
        else if (isVisited) cls += " not-answered";
        if (isCurrent) cls += " current";

        return `<button class="${cls}" onclick="jumpTo(${i})" title="Question ${i + 1}">
            ${i + 1}
            ${isMarked ? '<span class="mark-flag"></span>' : ""}
        </button>`;
    }).join("");
}

async function selectOption(opt) {
    const q = state.questions[state.currentIdx];
    state.answers[q.id] = opt;

    $$("#optionsList .option").forEach(el => {
        el.classList.toggle("selected", el.dataset.opt === opt);
    });

    // Update palette button
    const paletteBtn = document.querySelectorAll(".palette-btn")[state.currentIdx];
    if (paletteBtn) {
        paletteBtn.classList.remove("not-answered");
        paletteBtn.classList.add("answered");
    }

    try {
        await fetch(`${QUIZ_API}/student/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                attemptId: state.attemptId,
                questionId: q.id,
                selectedAnswer: opt
            })
        });
    } catch (e) { console.warn("Autosave failed"); }

    // Refresh palette counts
    updatePaletteLegend();
}

function clearResponse() {
    const q = state.questions[state.currentIdx];
    delete state.answers[q.id];

    $$("#optionsList .option").forEach(el => el.classList.remove("selected"));

    const paletteBtn = document.querySelectorAll(".palette-btn")[state.currentIdx];
    if (paletteBtn) {
        paletteBtn.classList.remove("answered");
        paletteBtn.classList.add("not-answered");
    }

    // Send empty to server
    fetch(`${QUIZ_API}/student/answer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            attemptId: state.attemptId,
            questionId: q.id,
            selectedAnswer: null
        })
    }).catch(() => {});

    showToast("Response cleared", "info");
    updatePaletteLegend();
}

function toggleMarkReview() {
    const q = state.questions[state.currentIdx];
    if (state.markedForReview.has(q.id)) {
        state.markedForReview.delete(q.id);
        showToast("Unmarked", "info");
    } else {
        state.markedForReview.add(q.id);
        showToast("Marked for review", "info");
    }
    renderQuiz();
}

function nextQuestion() {
    if (state.currentIdx < state.questions.length - 1) {
        state.currentIdx++;
        renderQuiz();
        window.scrollTo(0, 0);
    }
}

function prevQuestion() {
    if (state.currentIdx > 0) {
        state.currentIdx--;
        renderQuiz();
        window.scrollTo(0, 0);
    }
}

function jumpTo(idx) {
    state.currentIdx = idx;
    renderQuiz();
    window.scrollTo(0, 0);
    document.getElementById("paletteSidebar")?.classList.remove("open");
}

function updatePaletteLegend() {
    const answered = Object.keys(state.answers).length;
    const total = state.questions.length;
    const legendDots = document.querySelectorAll(".palette-legend .legend-dot.answered");
    const notAnsweredDots = document.querySelectorAll(".palette-legend .legend-dot.not-answered");
    if (legendDots[0]) legendDots[0].textContent = answered;
    if (notAnsweredDots[0]) notAnsweredDots[0].textContent = total - answered;

    const summary = document.querySelector(".palette-summary span:last-child");
    if (summary) summary.textContent = `${answered} / ${total}`;
}

/* ==================== TIMER ==================== */
function startTimer() {
    state.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        const remaining = Math.max(0, state.timeRemaining - elapsed);

        const timerDisplay = document.getElementById("timerDisplay");
        if (timerDisplay) timerDisplay.textContent = fmtTime(remaining);

        const timerBox = document.getElementById("timerBox");
        if (timerBox) timerBox.classList.toggle("danger", remaining <= 60);

        // Warning at 5 min
        if (remaining === 300 && !state._warned5min) {
            state._warned5min = true;
            showToast("⏰ 5 minutes remaining", "warn");
        }

        // Warning at 1 min
        if (remaining === 60 && !state._warned1min) {
            state._warned1min = true;
            showToast("⚠️ 1 minute remaining!", "error");
        }

        if (remaining <= 0) {
            clearInterval(state.timerInterval);
            if (!state.submitting && !state.autoSubmitTriggered) {
                state.autoSubmitTriggered = true;
                showViolationModal("danger", "Time's Up!", "Your time is over. The exam will be submitted automatically.", true);
                setTimeout(() => { closeViolationModal(); autoSubmitExam(); }, 2500);
            }
        }
    }, 1000);
}

/* ==================== SUBMIT ==================== */
function openSubmitSummary() {
    const total = state.questions.length;
    const answered = Object.keys(state.answers).length;
    const notAnswered = total - answered;
    const marked = state.markedForReview.size;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "submitSummaryModal";
    overlay.innerHTML = `
        <div class="modal">
            <div class="modal-icon warn"><i class="fas fa-paper-plane"></i></div>
            <h2>Submit Exam?</h2>
            <p>Please review your progress before final submission.</p>

            <div class="summary-grid">
                <div class="summary-item"><span class="lbl">Total Questions</span><span class="val">${total}</span></div>
                <div class="summary-item"><span class="lbl">Answered</span><span class="val green">${answered}</span></div>
                <div class="summary-item"><span class="lbl">Not Answered</span><span class="val red">${notAnswered}</span></div>
                <div class="summary-item"><span class="lbl">Marked for Review</span><span class="val purple">${marked}</span></div>
            </div>

            <p style="font-size:12.5px;color:var(--text-muted);">Once submitted, you cannot change your answers.</p>

            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeSubmitSummary()"><i class="fas fa-times"></i> Cancel</button>
                <button class="btn btn-success" onclick="closeSubmitSummary(); finalSubmit();"><i class="fas fa-check"></i> Confirm Submit</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
}

function closeSubmitSummary() {
    document.getElementById("submitSummaryModal")?.remove();
}

async function finalSubmit() {
    if (state.submitting) return;
    state.submitting = true;
    clearInterval(state.timerInterval);

    try {
        const res = await fetch(`${QUIZ_API}/student/submit/${state.attemptId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        renderResult(data.attempt);
    } catch (err) {
        state.submitting = false;
        showToast("Submit failed: " + err.message, "error");
    }
}

async function autoSubmitExam() {
    if (state.submitting) return;
    state.submitting = true;
    clearInterval(state.timerInterval);
    try {
        const res = await fetch(`${QUIZ_API}/student/submit/${state.attemptId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        renderResult(data.attempt);
    } catch (e) {
        state.submitting = false;
    }
}

/* ==================== RESULT SCREEN ==================== */
function renderResult(attempt) {
    const pct = Number(attempt.percentage || 0);
    const passPct = Number(state.event.pass_percentage || 40);
    const passed = pct >= passPct;
    const timeMin = Math.floor(attempt.time_taken_seconds / 60);
    const timeSec = attempt.time_taken_seconds % 60;

    $("#appContainer").innerHTML = `
        <div class="result-screen">
            <div class="result-card">
                <div class="result-icon ${passed ? 'pass' : 'fail'}">
                    <i class="fas fa-${passed ? 'trophy' : 'medal'}"></i>
                </div>

                <h1>${passed ? "Congratulations! 🎉" : "Good Attempt!"}</h1>
                <p class="subtitle">${esc(state.student.name)} · Class ${esc(state.student.class)}</p>

                <div class="score-big ${passed ? 'pass' : 'fail'}">
                    ${attempt.marks_obtained} <span style="font-size:32px;color:var(--text-muted);">/</span> ${attempt.total_marks}
                </div>
                <div class="score-pct ${passed ? 'pass' : 'fail'}">
                    ${pct.toFixed(1)}% · ${passed ? "PASSED" : "NEEDS IMPROVEMENT"}
                </div>

                <div class="stats-row">
                    <div class="stat-box">
                        <div class="lbl">Correct</div>
                        <div class="val green">${attempt.correct_answers}</div>
                    </div>
                    <div class="stat-box">
                        <div class="lbl">Wrong</div>
                        <div class="val red">${attempt.wrong_answers}</div>
                    </div>
                    <div class="stat-box">
                        <div class="lbl">Unanswered</div>
                        <div class="val muted">${attempt.unanswered}</div>
                    </div>
                    <div class="stat-box">
                        <div class="lbl">Time Taken</div>
                        <div class="val">${timeMin}m ${timeSec}s</div>
                    </div>
                </div>

                <div class="result-actions">
                    <a href="${QUIZ_API}/certificate/${attempt.id}/pdf" target="_blank" class="btn btn-primary" style="text-decoration:none;">
                        <i class="fas fa-certificate"></i> Download Certificate
                    </a>
                    <a href="student-dashboard.html" class="btn btn-outline" style="text-decoration:none;">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    `;

    showToast(passed ? "🎉 You passed!" : "📝 Keep practicing!", passed ? "success" : "warn");
}

/* ==================== INIT ==================== */
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
