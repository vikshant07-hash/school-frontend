<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Login | GSSS Shilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
    --bg: #f5f7fb; --bg-white: #ffffff; --text-primary: #1a2332; --text-secondary: #5a6a7e;
    --text-muted: #94a3b8; --gold: #c9972b; --gold-light: #e8b84b; --gold-bg: #fef8ed;
    --blue: #4a8af4; --green: #10b981; --red: #ef4444; --border: #e8edf8;
    --shadow: 0 2px 12px rgba(0,0,0,0.04); --shadow-hover: 0 8px 30px rgba(0,0,0,0.08);
    --radius: 16px; --radius-sm: 10px; --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a2332 0%, #2c3e50 50%, #1a2332 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background-attachment: fixed;
}
body::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(201,151,43,0.15) 0%, transparent 50%),
                      radial-gradient(circle at 80% 70%, rgba(74,138,244,0.15) 0%, transparent 50%);
    pointer-events: none;
}

.login-container {
    background: var(--bg-white); border-radius: 24px; padding: 40px 36px;
    width: 100%; max-width: 480px; box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    border: 1px solid rgba(201,151,43,0.15); position: relative; z-index: 1;
    animation: fadeUp 0.5s ease-out;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.login-header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 3px solid #c9972b; }
.login-header .logo {
    width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--gold);
    padding: 5px; background: #fff; margin: 0 auto 12px; display: block;
    box-shadow: 0 4px 20px rgba(201,151,43,0.25);
}
.login-header .school-name {
    font-family: 'Georgia', serif; font-size: 22px; font-weight: 900;
    color: #0d1b2a; text-transform: uppercase; letter-spacing: 1.5px;
}
.login-header .school-tagline {
    font-size: 11px; color: #5a6a7e; letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
}
.login-header .portal-name {
    display: inline-block; background: #0d1b2a; color: #fff;
    padding: 7px 26px; border-radius: 25px; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; border: 2px solid var(--gold);
    margin-top: 12px;
}

.form-group { margin-bottom: 18px; }
.form-group label {
    display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
}
.form-group label i { color: var(--gold); margin-right: 6px; }
.form-group input, .form-group select {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 14px;
    background: var(--bg); color: var(--text-primary); outline: none; transition: var(--transition);
}
.form-group input:focus, .form-group select:focus {
    border-color: var(--gold); background: #fff;
    box-shadow: 0 0 0 4px rgba(201,151,43,0.1);
}

.captcha-box {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
}
.captcha-code {
    flex: 1; padding: 13px 16px; background: linear-gradient(135deg, #1a2332, #2c3e50);
    color: #fff; border-radius: var(--radius-sm); font-family: 'Courier New', monospace;
    font-size: 22px; font-weight: 900; letter-spacing: 6px; text-align: center;
    user-select: none; position: relative; overflow: hidden;
    font-style: italic; text-shadow: 2px 2px 4px rgba(201,151,43,0.5);
}
.captcha-code::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(201,151,43,0.1) 10px, rgba(201,151,43,0.1) 11px);
}
.captcha-refresh {
    width: 48px; height: 48px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--bg); cursor: pointer; font-size: 18px; color: var(--gold);
    transition: var(--transition); display: flex; align-items: center; justify-content: center;
}
.captcha-refresh:hover { background: var(--gold-bg); border-color: var(--gold); transform: rotate(180deg); }

.login-btn {
    width: 100%; padding: 15px; background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    letter-spacing: 1px; text-transform: uppercase; margin-top: 8px;
    box-shadow: 0 6px 20px rgba(201,151,43,0.35);
}
.login-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(201,151,43,0.45); }
.login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

.alert {
    padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 18px;
    font-size: 13px; font-weight: 600; display: flex; align-items: flex-start; gap: 10px;
    animation: shake 0.4s;
}
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid var(--red); }
.alert-info { background: #eef4ff; color: #1e40af; border-left: 4px solid var(--blue); }
.hidden { display: none !important; }

.help-text {
    text-align: center; margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
}
.help-text i { color: var(--gold); margin-right: 4px; }
.help-text a { color: var(--gold); text-decoration: none; font-weight: 700; }
.help-text a:hover { text-decoration: underline; }

@media (max-width: 480px) {
    .login-container { padding: 30px 22px; }
    .login-header .school-name { font-size: 18px; }
    .captcha-code { font-size: 18px; letter-spacing: 4px; }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <img src="logo(1).png" class="logo" alt="Logo" onerror="this.style.display='none'">
        <div class="school-name">Govt. Sr. Sec. School Shilla</div>
        <div class="school-tagline">Shilla • Nerwa • District Shimla • HP - 171210</div>
        <div class="portal-name">Student Portal</div>
    </div>

    <div id="alertBox" class="alert alert-error hidden"></div>

    <form id="loginForm" autocomplete="off">
        <div class="form-group">
            <label><i class="fas fa-school"></i> Select Your Class</label>
            <select id="studentClass" required>
                <option value="">-- Select Class --</option>
                <option>Nursery</option><option>LKG</option><option>UKG</option>
                <option>1</option><option>2</option><option>3</option><option>4</option>
                <option>5</option><option>6</option><option>7</option><option>8</option>
                <option>9</option><option>10</option><option>11</option><option>12</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-id-card"></i> Student ID</label>
            <input type="text" id="studentId" placeholder="Enter your Student ID" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-fingerprint"></i> APAAR ID</label>
            <input type="text" id="apaarId" placeholder="Enter 11-digit APAAR ID" maxlength="11" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-calendar-alt"></i> Date of Birth</label>
            <input type="date" id="studentDob" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-shield-alt"></i> Captcha Verification</label>
            <div class="captcha-box">
                <div class="captcha-code" id="captchaCode">----</div>
                <button type="button" class="captcha-refresh" onclick="refreshCaptcha()" title="Refresh Captcha">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <input type="text" id="captchaInput" placeholder="Enter captcha code above" required
                   style="margin-top:10px;text-transform:uppercase;letter-spacing:3px;font-weight:700;text-align:center;">
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Login to Dashboard
        </button>
    </form>

    <div class="help-text">
        <i class="fas fa-info-circle"></i> Enter the details exactly as on your admission form.<br>
        <i class="fas fa-phone-alt"></i> Facing issues? Contact school office.
    </div>
</div>

<script>
const STUDENT_API = "https://gsssshilla.onrender.com/api/students";
let currentCaptcha = "";

/* ============ CAPTCHA ============ */
function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
}

function refreshCaptcha() {
    currentCaptcha = generateCaptcha();
    document.getElementById("captchaCode").textContent = currentCaptcha;
    document.getElementById("captchaInput").value = "";
}

/* ============ ALERT ============ */
function showAlert(msg, type = "error") {
    const box = document.getElementById("alertBox");
    box.className = `alert alert-${type}`;
    box.innerHTML = `<i class="fas fa-${type === "error" ? "exclamation-circle" : "info-circle"}"></i> <span>${msg}</span>`;
    box.classList.remove("hidden");
}

function hideAlert() {
    document.getElementById("alertBox").classList.add("hidden");
}

/* ============ LOGIN ============ */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert();

    const studentClass = document.getElementById("studentClass").value.trim();
    const studentId = document.getElementById("studentId").value.trim();
    const apaarId = document.getElementById("apaarId").value.trim();
    const studentDob = document.getElementById("studentDob").value.trim();
    const captchaInput = document.getElementById("captchaInput").value.trim().toUpperCase();

    // Validations
    if (!studentClass) return showAlert("Please select your class");
    if (!studentId) return showAlert("Please enter your Student ID");
    if (!/^\d{11}$/.test(apaarId)) return showAlert("APAAR ID must be exactly 11 digits");
    if (!studentDob) return showAlert("Please enter your Date of Birth");
    if (!captchaInput) return showAlert("Please enter the captcha code");
    if (captchaInput !== currentCaptcha) {
        refreshCaptcha();
        return showAlert("❌ Invalid captcha. Please try again.");
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

    try {
        const res = await fetch(`${STUDENT_API}/verify-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ class: studentClass, studentId, apaarId, dob: studentDob })
        });

        const text = await res.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; }
        catch (e) { throw new Error("Server error. Please try again."); }

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Login failed. Please check your details.");
        }

        // Save student data locally
        try {
            sessionStorage.setItem("studentData", JSON.stringify(data.student));
            sessionStorage.setItem("studentToken", data.token || "verified");
            sessionStorage.setItem("studentLoginTime", Date.now().toString());
        } catch (e) {}

        showAlert("✅ Login successful! Redirecting…", "info");

        setTimeout(() => {
            window.location.href = "student-dashboard.html";
        }, 900);

    } catch (err) {
        refreshCaptcha();
        showAlert("❌ " + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
    }
});

/* ============ INIT ============ */
document.addEventListener("DOMContentLoaded", () => {
    refreshCaptcha();
    // Set DOB max to today
    document.getElementById("studentDob").max = new Date().toISOString().split("T")[0];
});
</script>
</body>
</html>
