<style>.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

#updateForm{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

#updateForm input{
  padding:12px;
}

#updateForm button{
  padding:12px 20px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:12px;
}

th{
  background:#0A1F44;
  color:#fff;
}

.delete-btn{
  background:red;
  color:white;
  border:none;
  padding:8px 12px;
  cursor:pointer;
}





@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{

  /* ================= THEME COLORS ================= */
  --primary:#1E3A8A;        /* deep navy */
  --secondary:#879225;      /* blue */
  --accent:#af912f;         /* sky cyan */

  --bg-dark:#fafafa;        /* dark base */
  --bg-mid:#e9f0ff;

  --glass:rgba(131, 102, 102, 0.06);
  --border:rgba(255,255,255,0.12);

  --text:#ffffff;
  --muted:#cbd5e1;

  --success:#22c55e;
  --danger:#ef4444;

  --shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(135deg,var(--bg-dark),var(--bg-mid));
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ================= DASHBOARD ================= */
.dashboard{
  padding:40px 16px;
  text-align:center;
}

/* TITLE */
.dashboard h2{
  font-size:30px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:25px;
  text-shadow:0 0 18px rgba(56,189,248,0.25);
}

/* ================= TIME BOX ================= */
.time-box{
  max-width:300px;
  margin:20px auto;

  padding:16px;
  border-radius:16px;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(14px);

  color:var(--accent);

  box-shadow:var(--shadow);

  font-size:14px;
  line-height:1.8;
}

/* ================= CARDS ================= */
.cards{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:30px;
}

/* CARD STYLE */
.card{
  width:240px;
  padding:22px;

  border-radius:18px;

  background:linear-gradient(135deg,var(--primary),var(--secondary));

  box-shadow:var(--shadow);

  transition:0.3s ease;

  position:relative;
  overflow:hidden;
}

/* LIGHT GLOW */
.card::before{
  content:"";
  position:absolute;
  top:-60%;
  left:-60%;
  width:200%;
  height:200%;

  background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 60%);
  transform:rotate(25deg);
}

.card:hover{
  transform:translateY(-6px) scale(1.03);
}

.card h3{
  font-size:16px;
  margin-bottom:10px;
  color:white;
}

.card p{
  font-size:40px;
  font-weight:700;
  color:white;
}

/* ================= RESET BUTTON ================= */
.reset-btn{
  margin-top:25px;
  padding:12px 22px;

  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,var(--danger),#b91c1c);
  color:white;

  font-weight:600;

  cursor:pointer;
  transition:0.3s ease;

  box-shadow:0 8px 20px rgba(239,68,68,0.3);
}

.reset-btn:hover{
  transform:scale(1.05);
}

/* ================= CHART BOX ================= */
.chart-box{
  max-width:800px;
  margin:40px auto;

  background:var(--glass);
  border:1px solid var(--border);
  border-radius:18px;

  padding:20px;

  backdrop-filter:blur(14px);

  box-shadow:var(--shadow);
}

canvas{
  width:100% !important;
  height:360px !important;

  background:white;
  border-radius:12px;
  padding:10px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){

  .dashboard h2{
    font-size:22px;
  }

  .card{
    width:100%;
    max-width:320px;
  }

  .time-box{
    width:100%;
    max-width:320px;
  }

  canvas{
    height:250px !important;
  }

  .cards{
    gap:12px;
  }
}


/* ===================================
   PROFESSIONAL ADMIN NAVBAR
=================================== */

.navbar{
    width:100%;
    position:sticky;
    top:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:linear-gradient(
        135deg,
        #081C45,
        #123A7A
    );

    padding:14px 25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);

    margin-bottom:25px;
}

/* Logo */

.logo-section{
    display:flex;
    align-items:center;
    gap:14px;
}

.school-logo{
    width:55px;
    height:55px;

    border-radius:50%;
    object-fit:cover;

    border:3px solid #D4AF37;

    background:#fff;
}

.school-info{
    display:flex;
    flex-direction:column;
}

.school-info h2{
    color:#fff;
    font-size:18px;
    font-weight:700;
    line-height:1.2;
}

.school-info span{
    color:#D4AF37;
    font-size:12px;
    font-weight:500;
}

/* Nav */

.nav-menu{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-menu a{
    text-decoration:none;

    color:#dbeafe;

    padding:11px 15px;

    border-radius:10px;

    font-size:14px;
    font-weight:600;

    transition:.3s;
}

.nav-menu a:hover{
    background:rgba(212,175,55,.15);
    color:#fff;
}

.nav-menu a.active{
    background:#D4AF37;
    color:#081C45;
}

/* Logout */

.logout-btn{
    margin-left:10px;

    border:none;

    background:linear-gradient(
        135deg,
        #1c3e7e,
        #F5D76E
    );

    color:#081C45;

    padding:11px 22px;

    border-radius:50px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

.logout-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 8px 20px rgba(212,175,55,.35);
}

/* Mobile Menu Button */

.mobile-menu-btn{
    display:none;

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

/* ===================================
   TABLET
=================================== */

@media(max-width:1200px){

    .school-info h2{
        font-size:16px;
    }

    .nav-menu a{
        padding:10px 12px;
        font-size:13px;
    }

}

/* ===================================
   MOBILE
=================================== */

@media(max-width:950px){

    .mobile-menu-btn{
        display:block;
    }

    .nav-menu{

        position:absolute;

        top:100%;

        left:0;
        right:0;

        background:#081C45;

        flex-direction:column;

        padding:15px;

        gap:5px;

        display:none;

        box-shadow:
        0 15px 30px rgba(0,0,0,.2);
    }

    .nav-menu.active{
        display:flex;
    }

    .nav-menu a{
        width:100%;
        text-align:left;
    }

    .logout-btn{
        width:100%;
        margin:10px 0 0;
    }

}

/* ===================================
   SMALL MOBILE
=================================== */

@media(max-width:600px){

    .navbar{
        padding:12px 15px;
    }

    .school-logo{
        width:45px;
        height:45px;
    }

    .school-info h2{
        font-size:14px;
    }

    .school-info span{
        font-size:11px;
    }

}

/* ===================================
   EXTRA SMALL
=================================== */

@media(max-width:450px){

    .school-info h2{
        font-size:13px;
    }

    .school-info span{
        display:none;
    }

}</style>

<div class="container">

<h2>Recent Updates</h2>

<form id="updateForm">

  <input
    type="text"
    id="title"
    placeholder="Enter Update Title"
    required
  >

  <input
    type="file"
    id="file"
    accept=".pdf,image/*"
  >

  <button type="submit">
    Publish Update
  </button>

</form>

<table>

<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="updateTable">
</tbody>

</table>

</div>

    <script>


// ✅ Token globally define karo, localStorage se
const token = localStorage.getItem("token");

if (!token) {
  window.location.replace("login.html");
}

// Auth verify (optional double-check)
fetch("https://gsssshilla.onrender.com/verify-admin", {
  headers: { Authorization: `Bearer ${token}` }
})
.then(res => res.json())
.then(data => {
  if (!data.success) {
    localStorage.removeItem("token");
    window.location.replace("login.html");
  }
})
.catch(() => {
  localStorage.removeItem("token");
  window.location.replace("login.html");
});


const API =
"https://gsssshilla.onrender.com/recent";


loadUpdates();

async function loadUpdates(){

  const res =
  await fetch(API);

  const data =
  await res.json();

  let html = "";

  data.forEach(item=>{

    html += `
    <tr>
      <td>${item.id}</td>

      <td>${item.title}</td>

      <td>
      ${new Date(
      item.created_at
      ).toLocaleDateString()}
      </td>

      <td>

      <button
      class="delete-btn"
      onclick="deleteUpdate(${item.id})">
      Delete
      </button>

      </td>

    </tr>
    `;

  });

  document.getElementById(
  "updateTable"
  ).innerHTML = html;

}

document
.getElementById("updateForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const formData =
new FormData();

formData.append(
"title",
document.getElementById(
"title"
).value
);

const file =
document.getElementById(
"file"
).files[0];

if(file){
  formData.append(
  "file",
  file
  );
}

await fetch(API,{
  method:"POST",
  headers:{
    Authorization:
    `Bearer ${token}`
  },
  body:formData
});

alert("Update Added");

e.target.reset();

loadUpdates();

});

async function deleteUpdate(id){

if(!confirm(
"Delete this update?"
)) return;

await fetch(
`${API}/${id}`,
{
method:"DELETE",
headers:{
Authorization:
`Bearer ${token}`
}
}
);

loadUpdates();

}

</script>
