<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Attempts - Admin | GSSS Shilla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root { --bg:#f5f7fb;--bg-white:#fff;--text-primary:#1a2332;--text-secondary:#5a6a7e;--text-muted:#94a3b8;--gold:#c9972b;--gold-light:#e8b84b;--gold-bg:#fef8ed;--blue:#4a8af4;--blue-bg:#eef4ff;--green:#10b981;--green-bg:#ecfdf5;--orange:#f59e0b;--orange-bg:#fffbeb;--red:#ef4444;--border:#e8edf8;--shadow:0 2px 12px rgba(0,0,0,0.04);--radius:16px;--radius-sm:10px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1); }
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;padding:24px; }
.wrap { max-width:1400px;margin:0 auto; }
.head { background:var(--bg-white);border-radius:var(--radius);padding:20px 26px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px; }
.head h1 { font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px; }
.head h1 i { color:var(--gold); }
.btn { display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter';transition:var(--transition); }
.btn-outline { background:var(--bg);color:var(--text-secondary);border:1px solid var(--border); }
.btn-primary { background:var(--gold);color:#fff; }
.btn-success { background:var(--green);color:#fff; }
.btn-sm { padding:6px 12px;font-size:11px;border-radius:6px; }
.panel { background:var(--bg-white);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow);border:1px solid var(--border); }
.stats { display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px; }
.stat { background:var(--bg);border-radius:10px;padding:14px;text-align:center; }
.stat h4 { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px; }
.stat .num { font-size:22px;font-weight:800;color:var(--gold); }
table { width:100%;border-collapse:collapse;font-size:13px;margin-top:12px; }
table thead th { background:var(--bg);padding:11px 12px;text-align:left;font-weight:700;color:var(--text-secondary);border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.5px; }
table tbody td { padding:11px 12px;border-bottom:1px solid var(--border); }
table tbody tr:hover td { background:#f8fafc; }
.badge { display:inline-block;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700; }
.badge-pass { background:var(--green-bg);color:var(--green); }
.badge-fail { background:#fee2e2;color:var(--red); }
.badge-progress { background:var(--orange-bg);color:var(--orange); }
</style>
</head>
<body>

<div class="wrap">
    <div class="head">
        <h1><i class="fas fa-users"></i> <span id="headTitle">Quiz Attempts</span></h1>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-outline" onclick="window.location.href='admin-quiz.html'"><i class="fas fa-arrow-left"></i> Back</button>
            <button class="btn btn-primary" onclick="loadAttempts()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
    </div>

    <div class="panel">
        <div class="stats">
            <div class="stat"><h4>Total Attempts</h4><div class="num" id="statTotal">0</div></div>
            <div class="stat"><h4>Completed</h4><div class="num" id="statCompleted">0</div></div>
            <div class="stat"><h4>Passed</h4><div class="num" id="statPassed">0</div></div>
            <div class="stat"><h4>Avg Score</h4><div class="num" id="statAvg">0%</div></div>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student</th>
                        <th>Student ID</th>
                        <th>Class</th>
                        <th>Marks</th>
                        <th>%</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="attemptsBody"><tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted);">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const QUIZ_API = "https://gsssshilla.onrender.com/api/quiz";
const params = new URLSearchParams(location.search);
const eventId = params.get("id");

function esc(v) { return v === null || v === undefined ? "" : String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function getAuthHeaders() { const t = localStorage.getItem("adminToken"); if (!t) { alert("Login required"); window.location.href="login.html"; return null; } return { "Authorization": `Bearer ${t}`, "Content-Type": "application/json" }; }
async function apiCall(url) { const h = getAuthHeaders(); if (!h) throw new Error("No auth"); const r = await fetch(url, { headers: h }); const d = await r.json(); if (!r.ok) throw new Error(d.message || "Failed"); return d; }

async function loadAttempts() {
    if (!eventId) { alert("Event ID missing"); window.location.href = "admin-quiz.html"; return; }
    try {
        const data = await apiCall(`${QUIZ_API}/events/${eventId}/attempts`);
        const attempts = data.data || [];

        // Stats
        const completed = attempts.filter(a => a.status !== "InProgress").length;
        const passed = attempts.filter(a => Number(a.percentage) >= 40).length;
        const avg = completed > 0 ? (attempts.reduce((s,a) => s + Number(a.percentage || 0), 0) / completed).toFixed(1) : 0;

        document.getElementById("statTotal").textContent = attempts.length;
        document.getElementById("statCompleted").textContent = completed;
        document.getElementById("statPassed").textContent = passed;
        document.getElementById("statAvg").textContent = avg + "%";

        const tbody = document.getElementById("attemptsBody");
        if (!attempts.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted);">No attempts yet.</td></tr>';
            return;
        }

        tbody.innerHTML = attempts.map((a, i) => {
            const pct = Number(a.percentage || 0);
            const statusBadge = a.status === "InProgress" ? '<span class="badge badge-progress">In Progress</span>' :
                pct >= 40 ? '<span class="badge badge-pass">Passed</span>' : '<span class="badge badge-fail">Failed</span>';
            const timeStr = a.time_taken_seconds > 0 ? `${Math.floor(a.time_taken_seconds / 60)}m ${a.time_taken_seconds % 60}s` : "—";
            return `
            <tr>
                <td>${i + 1}</td>
                <td><b>${esc(a.student_name)}</b></td>
                <td>${esc(a.student_id)}</td>
                <td>${esc(a.student_class)}</td>
                <td><b>${a.marks_obtained || 0}/${a.total_marks || 0}</b></td>
                <td>${pct.toFixed(1)}%</td>
                <td>${timeStr}</td>
                <td>${statusBadge}</td>
                <td>
                    ${a.status !== "InProgress" ? `<a href="${QUIZ_API}/certificate/${a.id}/pdf" target="_blank" class="btn btn-success btn-sm"><i class="fas fa-certificate"></i> Certificate</a>` : ""}
                </td>
            </tr>`;
        }).join("");
    } catch (err) {
        document.getElementById("attemptsBody").innerHTML = `<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--red);">${esc(err.message)}</td></tr>`;
    }
}

document.addEventListener("DOMContentLoaded", loadAttempts);
</script>
</body>
</html>
