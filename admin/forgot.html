<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - GSS School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a1628;
  padding: 20px;
}

.forgot-card {
  width: 100%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(201, 151, 43, 0.22);
  border-radius: 26px;
  padding: 40px 36px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: cardIn 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo { text-align: center; margin-bottom: 28px; }
.logo .icon { font-size: 48px; display: block; margin-bottom: 6px; }
.logo h2 { color: #ffffff; font-size: 22px; font-weight: 700; font-family: 'Playfair Display', serif; }
.logo p { color: rgba(255, 255, 255, 0.4); font-size: 13px; margin-top: 4px; }

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201, 151, 43, 0.3), transparent);
  margin: 0 0 24px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  color: rgba(255, 255, 255, 0.5);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group .input-wrap { position: relative; }
.form-group .input-wrap i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255, 255, 255, 0.3);
  font-size: 16px;
}
.form-group .input-wrap input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: #ffffff;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
}
.form-group .input-wrap input:focus {
  outline: none;
  border-color: rgba(201, 151, 43, 0.55);
  background: rgba(255, 255, 255, 0.08);
}
.form-group .input-wrap input::placeholder {
  color: rgba(255, 255, 255, 0.25);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #c9972b, #e8b84b);
  border: none;
  border-radius: 12px;
  color: #0a1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 6px;
  box-shadow: 0 8px 24px rgba(201, 151, 43, 0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(201, 151, 43, 0.4);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

.message {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  display: none;
}
.message.success {
  display: block;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #34d399;
}
.message.error {
  display: block;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
}
.message.info {
  display: block;
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.3);
  color: #60a5fa;
}

.loader {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top: 2px solid #0a1628;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.links-row {
  display: flex;
  justify-content: center;
  margin-top: 14px;
}
.links-row a {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.4);
  text-decoration: none;
  transition: 0.2s;
}
.links-row a:hover {
  color: #fff;
}

#otpSection { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.07); }

@media (max-width: 480px) {
  .forgot-card { padding: 28px 20px; }
  .logo h2 { font-size: 18px; }
}
</style>
</head>
<body>

<div class="forgot-card">
  <div class="logo">
    <span class="icon">🔐</span>
    <h2>Forgot Password</h2>
    <p>Enter your email to reset password</p>
  </div>

  <div class="divider"></div>

  <!-- Step 1: Email -->
  <div id="stepEmail">
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Registered Email</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="resetEmail" placeholder="Enter registered email" required>
      </div>
    </div>
    <button class="btn-primary" onclick="sendResetOTP()">
      <i class="fas fa-paper-plane"></i> Send Reset OTP
    </button>
  </div>

  <!-- Step 2: OTP + New Password -->
  <div id="otpSection">
    <div class="form-group">
      <label><i class="fas fa-key"></i> Enter OTP</label>
      <div class="input-wrap">
        <i class="fas fa-key"></i>
        <input type="text" id="resetOTP" placeholder="6-digit OTP" maxlength="6" required>
      </div>
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="newPassword" placeholder="New password (min 6 chars)" required>
      </div>
    </div>
    <div class="form-group">
      <label><i class="fas fa-check"></i> Confirm Password</label>
      <div class="input-wrap">
        <i class="fas fa-check"></i>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
      </div>
    </div>
    <button class="btn-primary" onclick="resetPassword()">
      <i class="fas fa-save"></i> Reset Password
    </button>
  </div>

  <div id="message" class="message"></div>

  <div class="links-row">
    <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<script>
// ============================================================
// BACKEND URL
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com/api/admin';

// ============================================================
// SEND RESET OTP
// ============================================================
async function sendResetOTP() {
  const email = document.getElementById('resetEmail').value.trim();
  const btn = document.querySelector('#stepEmail .btn-primary');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (!email) {
    showMessage('Please enter your registered email', 'error');
    return;
  }

  if (!email.includes('@') || !email.includes('.')) {
    showMessage('Please enter a valid email address', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending...';

  try {
    const response = await fetch(`${API_BASE}/send-reset-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    const data = await response.json();

    if (data.success) {
      showMessage('✅ Reset OTP sent to your email!', 'success');
      document.getElementById('stepEmail').style.display = 'none';
      document.getElementById('otpSection').style.display = 'block';
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset OTP';
  }
}

// ============================================================
// RESET PASSWORD
// ============================================================
async function resetPassword() {
  const email = document.getElementById('resetEmail').value.trim();
  const otp = document.getElementById('resetOTP').value.trim().toUpperCase();
  const newPassword = document.getElementById('newPassword').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();
  const btn = document.querySelector('#otpSection .btn-primary');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (otp.length !== 6) {
    showMessage('Please enter valid 6-digit OTP', 'error');
    return;
  }

  if (newPassword.length < 6) {
    showMessage('Password must be at least 6 characters', 'error');
    return;
  }

  if (newPassword !== confirmPassword) {
    showMessage('Passwords do not match', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Resetting...';

  try {
    const response = await fetch(`${API_BASE}/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, newPassword, confirmPassword })
    });

    const data = await response.json();

    if (data.success) {
      showMessage('✅ Password reset successfully! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
  }
}

// ============================================================
// SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
  const message = document.getElementById('message');
  message.textContent = text;
  message.className = 'message ' + type;
}
</script>
</body>
</html>
