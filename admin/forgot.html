<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Govt. School</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Same styles as index.html - copy from above */
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:#0a1628;padding:24px 16px;position:relative;overflow-x:hidden;}
/* ... Copy all styles from index.html ... */
</style>
</head>
<body>

<!-- Same background orbs and grid as index.html -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-bg"></div>

<div class="card">
  <div class="logo-row">
    <div class="logo-ring">🔐</div>
    <div>
      <div class="brand-name">Govt. Sr. Sec. School Shilla</div>
      <div class="brand-tagline">Reset Password</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="page-title">
    <h2>Forgot Password?</h2>
    <p>Enter your email to receive OTP</p>
  </div>

  <!-- STEP 1: Email -->
  <div id="stepEmail">
    <label class="field-label">Registered Email</label>
    <div class="input-wrap">
      <span class="input-icon">📧</span>
      <input type="email" id="resetEmail" placeholder="Enter registered email">
    </div>

    <button class="btn-primary" onclick="sendResetOTP()">
      Send Reset OTP →
    </button>
  </div>

  <!-- STEP 2: OTP & New Password -->
  <div id="stepOTP" style="display:none;">
    <div class="info-badge badge-green">
      ✅ OTP sent — check your email
    </div>

    <div class="info-badge badge-gold" id="resetTimerBadge">
      ⏱️ OTP expires in: <span id="resetTimerDisplay">05:00</span>
    </div>

    <label class="field-label">Enter OTP</label>
    <div class="input-wrap">
      <span class="input-icon">🔑</span>
      <input type="text" id="resetOTP" placeholder="6-digit OTP" maxlength="6">
    </div>

    <label class="field-label">New Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="newPassword" placeholder="New password (min 6 chars)">
    </div>

    <label class="field-label">Confirm Password</label>
    <div class="input-wrap">
      <span class="input-icon">✅</span>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
    </div>

    <button class="btn-primary" onclick="resetPassword()">
      Reset Password →
    </button>
  </div>

  <div class="loader-box" id="loader">
    <div class="loader"></div>
    <p>Please wait...</p>
  </div>

  <div id="msg"></div>

  <div class="links-row">
    <a href="index.html" class="forgot-link">← Back to Login</a>
  </div>
</div>

<script>
// ============================================================
// BACKEND CONFIGURATION
// ============================================================
const API_BASE_URL = 'https://gsssshilla.onrender.com/api/admin';

// ============================================================
// HELPERS
// ============================================================
function showMessage(text, type) {
  const msg = document.getElementById("msg");
  msg.innerText = text;
  msg.className = type === "success" ? "success" : "error";
}

function showLoader() {
  document.getElementById("loader").style.display = "block";
}

function hideLoader() {
  document.getElementById("loader").style.display = "none";
}

// ============================================================
// TIMER
// ============================================================
let resetTimer = null,
  resetTimeLeft = 300;

function startResetTimer() {
  resetTimeLeft = 300;
  document.getElementById("resetTimerBadge").style.display = "flex";

  resetTimer = setInterval(() => {
    resetTimeLeft--;
    const m = String(Math.floor(resetTimeLeft / 60)).padStart(2, "0");
    const s = String(resetTimeLeft % 60).padStart(2, "0");
    document.getElementById("resetTimerDisplay").innerText = `${m}:${s}`;
    if (resetTimeLeft <= 0) {
      clearInterval(resetTimer);
      showMessage("OTP expired. Request a new one.", "error");
      document.getElementById("stepOTP").style.display = "none";
      document.getElementById("stepEmail").style.display = "block";
    }
  }, 1000);
}

// ============================================================
// SEND RESET OTP
// ============================================================
async function sendResetOTP() {
  const email = document.getElementById("resetEmail").value.trim();

  if (!email) {
    return showMessage("Enter your registered email", "error");
  }

  showLoader();

  try {
    const res = await fetch(`${API_BASE_URL}/send-reset-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
      signal: AbortSignal.timeout(10000)
    });
    const data = await res.json();
    hideLoader();

    if (data.success) {
      showMessage("OTP sent successfully to your email!", "success");
      document.getElementById("stepEmail").style.display = "none";
      document.getElementById("stepOTP").style.display = "block";
      startResetTimer();
    } else {
      showMessage(data.message || "Failed to send OTP", "error");
    }
  } catch {
    hideLoader();
    showMessage("Server error. Please try again.", "error");
  }
}

// ============================================================
// RESET PASSWORD
// ============================================================
async function resetPassword() {
  const email = document.getElementById("resetEmail").value.trim();
  const otp = document.getElementById("resetOTP").value.trim().toUpperCase();
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!otp || otp.length !== 6) {
    return showMessage("Enter valid 6-digit OTP", "error");
  }

  if (newPassword.length < 6) {
    return showMessage("Password must be at least 6 characters", "error");
  }

  if (newPassword !== confirmPassword) {
    return showMessage("Passwords do not match", "error");
  }

  showLoader();

  try {
    const res = await fetch(`${API_BASE_URL}/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, otp, newPassword, confirmPassword }),
      signal: AbortSignal.timeout(10000)
    });
    const data = await res.json();
    hideLoader();

    if (data.success) {
      clearInterval(resetTimer);
      showMessage("Password reset successfully! Redirecting to login...", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    } else {
      showMessage(data.message || "Failed to reset password", "error");
    }
  } catch {
    hideLoader();
    showMessage("Server error. Please try again.", "error");
  }
}

// Enter key support
document.addEventListener("keydown", function(e) {
  if (e.key !== "Enter") return;
  const stepOTP = document.getElementById("stepOTP");
  if (stepOTP.style.display === "block") {
    resetPassword();
  } else {
    sendResetOTP();
  }
});
</script>
</body>
</html>
