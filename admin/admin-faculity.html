<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Manager - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ============================================================
           ROOT VARIABLES - CLEAN THEME
        ============================================================ */
        :root {
            --bg: #f5f7fb;
            --bg-white: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #5a6a7e;
            --text-muted: #94a3b8;
            --gold: #c9972b;
            --gold-light: #e8b84b;
            --gold-bg: #fef8ed;
            --blue: #4a8af4;
            --blue-bg: #eef4ff;
            --green: #10b981;
            --green-bg: #ecfdf5;
            --purple: #8b5cf6;
            --purple-bg: #f5f0ff;
            --pink: #ec4899;
            --pink-bg: #fdf2f8;
            --orange: #f59e0b;
            --orange-bg: #fffbeb;
            --red: #ef4444;
            --border: #e8edf8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
           RESET
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           NAVBAR - CLEAN WHITE
        ============================================================ */
        .navbar {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar .brand .logo-placeholder {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .navbar .brand .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .navbar .brand .name span {
            color: var(--gold);
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }

        .navbar .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .navbar .nav-links a:hover {
            background: var(--bg);
            color: var(--text-primary);
        }

        .navbar .nav-links a.active {
            background: var(--gold-bg);
            color: var(--gold);
        }

        .navbar .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar .nav-right .admin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 10px;
            background: var(--bg);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .navbar .nav-right .admin-badge .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .navbar .nav-right .admin-badge .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-left: 4px;
        }

        .navbar .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
        }

        /* ============================================================
           MAIN CONTAINER
        ============================================================ */
        .main-container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px 40px;
            width: 100%;
        }

        /* ============================================================
           PAGE HEADER
        ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding: 20px 28px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 i {
            color: var(--gold);
        }

        .page-header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ============================================================
           BUTTONS
        ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--gold);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 151, 43, 0.3);
        }

        .btn-success {
            background: var(--green);
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--orange);
            color: #fff;
        }
        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--text-muted);
            color: #fff;
        }
        .btn-secondary:hover {
            background: #64748b;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: var(--border);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        /* ============================================================
           CARDS
        ============================================================ */
        .card {
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: var(--gold);
        }

        /* ============================================================
           FORM
        ============================================================ */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group label .required {
            color: var(--red);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 151, 43, 0.1);
            background: var(--bg-white);
        }

        select.form-control {
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 20px;
        }

        .form-group .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .form-group .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        /* ============================================================
           TABLE
        ============================================================ */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table thead {
            background: var(--bg);
        }

        table th {
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        table tr:hover {
            background: var(--bg);
        }

        /* ============================================================
           BADGES
        ============================================================ */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-principal {
            background: var(--gold-bg);
            color: var(--gold);
        }

        .badge-teaching {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .badge-nonteaching {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge-admin {
            background: var(--purple-bg);
            color: var(--purple);
        }

        .badge-active {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge-inactive {
            background: #fef2f2;
            color: var(--red);
        }

        /* ============================================================
           THUMBNAIL
        ============================================================ */
        .thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .thumb-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-muted);
            border: 2px solid var(--border);
        }

        /* ============================================================
           ACTION BUTTONS
        ============================================================ */
        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btns .btn-sm {
            font-size: 11px;
            padding: 4px 10px;
        }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        .toast-success { background: var(--green); }
        .toast-error { background: var(--red); }
        .toast-info { background: var(--text-primary); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================================
           FOOTER
        ============================================================ */
        .footer {
            background: var(--bg-white);
            border-top: 1px solid var(--border);
            padding: 20px 32px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer .footer-content a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        .footer .footer-content a:hover {
            text-decoration: underline;
        }

        .footer .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
        }

        .footer .footer-links a:hover {
            color: var(--gold);
            text-decoration: none;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 1024px) {
            .main-container { padding: 20px; }
            .navbar { padding: 0 20px; }
            .footer { padding: 16px 20px; }
            .form-row { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 768px) {
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 0;
                right: 0;
                background: var(--bg-white);
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow);
            }
            .navbar .nav-links.open { display: flex; }
            .navbar .hamburger { display: block; }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .page-header .header-actions { flex-wrap: wrap; }
            .page-header .header-actions .btn { flex: 1; justify-content: center; }

            .form-row { grid-template-columns: 1fr; }

            .card { padding: 16px; }

            table { font-size: 12px; }
            table th, table td { padding: 8px 10px; }
            .action-btns .btn-sm { font-size: 10px; padding: 3px 8px; }

            .footer .footer-content {
                flex-direction: column;
                text-align: center;
            }
            .footer .footer-links {
                justify-content: center;
                flex-wrap: wrap;
            }

            .toast {
                left: 16px;
                right: 16px;
                bottom: 16px;
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .main-container { padding: 12px; }
            .navbar { padding: 0 12px; }
            .page-header { padding: 16px; }
            .card { padding: 12px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>

<nav class="navbar">
<a href="#" class="brand">

      <img src="logo(1).png" alt="Logo"

    <div class="nav-right">
        <div class="admin-badge">
            <span class="avatar" id="adminAvatar">A</span>

            <i class="fas fa-bars"></i>
        </button>

<!-- ============================================================
   MAIN CONTAINER
============================================================ -->
<div class="main-container">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-users"></i> Faculty Manager</h1>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="window.open('https://gsssshilla07.pages.dev/','_blank')">
                <i class="fas fa-eye"></i> View Public Page
            </button>
            <button class="btn btn-primary" onclick="refreshFaculty()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>

    <!-- ADD FORM -->
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> <span id="formTitle">Add Faculty Member</span></h2>
        <form id="facultyForm" enctype="multipart/form-data">
            <input type="hidden" id="editId">

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label>Designation <span class="required">*</span></label>
                    <select id="designation" class="form-control" required>
                        <option value="">Select</option>
                        <option value="Principal">Principal</option>
                        <option value="Vice Principal">Vice Principal</option>
                        <option value="PGT">PGT</option>
                        <option value="TGT">TGT</option>
                        <option value="PRT">PRT</option>
                        <option value="Librarian">Librarian</option>
                        <option value="Clerk">Clerk</option>
                        <option value="Peon">Peon</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Staff Type</label>
                    <select id="staffType" class="form-control">
                        <option value="teaching">Teaching</option>
                        <option value="non-teaching">Non-Teaching</option>
                        <option value="administrative">Administrative</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <select id="department" class="form-control">
                        <option value="">Select</option>
                        <option value="Science">Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Social Science">Social Science</option>
                        <option value="Computer">Computer</option>
                        <option value="Library">Library</option>
                        <option value="Office">Office</option>
                        <option value="Administration">Administration</option>
                        <option value="Political Science">Political Science</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g., Physics">
                </div>
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" id="qualification" class="form-control" placeholder="e.g., M.Sc., B.Ed.">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="experience" class="form-control" placeholder="e.g., 15 Years">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="email@school.edu.in">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control" placeholder="+91 9876543210">
                </div>
            </div>

            <div class="form-group">
                <label>Message/Quote</label>
                <input type="text" id="message" class="form-control" placeholder="A short message or quote...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Photo (Square, max 3MB)</label>
                    <input type="file" id="photo" class="form-control" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="joiningDate" class="form-control">
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="isPrincipal">
                        <label for="isPrincipal"><i class="fas fa-crown" style="color:var(--gold);"></i> Is Principal</label>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success" id="submitBtn">
                    <i class="fas fa-save"></i> Save
                </button>
                <button type="button" class="btn btn-warning" id="cancelBtn" style="display:none;" onclick="cancelEdit()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card">
        <h2><i class="fas fa-list"></i> All Faculty (<span id="totalCount">0</span>)</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Department</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th style="width:110px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted);">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

   FOOTER

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com';

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast toast-${type}`;
    toast.style.display = 'block';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.style.display = 'none';
    }, 4000);
}

// ============================================================
// NAVBAR TOGGLE
// ============================================================
function toggleNav() {
    document.getElementById('navLinks').classList.toggle('open');
}

document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
    });
});

// ============================================================
// LOAD FACULTY
// ============================================================
async function loadFaculty() {
    try {
        const response = await fetch(`${API_BASE}/admin/faculty`);
        const data = await response.json();

        if (data.success) {
            document.getElementById('totalCount').textContent = data.data.length;

            if (data.data.length === 0) {
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-muted);">
                        <i class="fas fa-user-slash"></i> No faculty members found
                    </td></tr>
                `;
                return;
            }

            document.getElementById('tableBody').innerHTML = data.data.map((f, i) => {
                const typeBadge = {
                    'teaching': 'badge-teaching',
                    'non-teaching': 'badge-nonteaching',
                    'administrative': 'badge-admin'
                }[f.staff_type] || 'badge-teaching';

                const statusBadge = f.is_active == 1 ? 'badge-active' : 'badge-inactive';
                const statusText = f.is_active == 1 ? 'Active' : 'Inactive';

                return `
                    <tr>
                        <td>${i + 1}</td>
                        <td>
                            ${f.photo_url ? 
                                `<img src="${f.photo_url}" class="thumb" onerror="this.style.display='none'">` :
                                `<div class="thumb-placeholder"><i class="fas fa-user"></i></div>`
                            }
                        </td>
                        <td>
                            <strong>${escapeHtml(f.name)}</strong>
                            ${f.is_principal == 1 ? '<span class="badge badge-principal">👑 Principal</span>' : ''}
                        </td>
                        <td>${escapeHtml(f.designation)}</td>
                        <td>${escapeHtml(f.department) || '-'}</td>
                        <td><span class="badge ${typeBadge}">${escapeHtml(f.staff_type)}</span></td>
                        <td><span class="badge ${statusBadge}">${statusText}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-primary btn-sm" onclick="editFaculty(${f.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteFaculty(${f.id})">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    } catch (error) {
        console.error('Error loading faculty:', error);
        document.getElementById('tableBody').innerHTML = `
            <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--red);">
                <i class="fas fa-exclamation-circle"></i> Failed to load faculty
            </td></tr>
        `;
    }
}

// ============================================================
// ESCAPE HTML
// ============================================================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// FORM SUBMIT
// ============================================================
document.getElementById('facultyForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const editId = document.getElementById('editId').value;
    const formData = new FormData();

    formData.append('name', document.getElementById('name').value.trim());
    formData.append('designation', document.getElementById('designation').value);
    formData.append('staff_type', document.getElementById('staffType').value);
    formData.append('department', document.getElementById('department').value);
    formData.append('subject', document.getElementById('subject').value.trim());
    formData.append('qualification', document.getElementById('qualification').value.trim());
    formData.append('experience', document.getElementById('experience').value.trim());
    formData.append('email', document.getElementById('email').value.trim());
    formData.append('phone', document.getElementById('phone').value.trim());
    formData.append('message', document.getElementById('message').value.trim());
    formData.append('is_principal', document.getElementById('isPrincipal').checked ? 1 : 0);
    formData.append('joining_date', document.getElementById('joiningDate').value);

    const photo = document.getElementById('photo').files[0];
    if (photo) formData.append('photo', photo);

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    btn.disabled = true;

    try {
        const url = editId ? `${API_BASE}/admin/faculty/update/${editId}` : `${API_BASE}/admin/faculty/add`;
        const method = editId ? 'PUT' : 'POST';

        const response = await fetch(url, { method, body: formData });
        const data = await response.json();

        if (data.success) {
            showToast(editId ? '✅ Faculty updated!' : '✅ Faculty added!', 'success');
            cancelEdit();
            loadFaculty();
        } else {
            showToast(data.message || 'Failed to save', 'error');
        }
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    } finally {
        btn.innerHTML = '<i class="fas fa-save"></i> Save';
        btn.disabled = false;
    }
});

// ============================================================
// EDIT FACULTY
// ============================================================
async function editFaculty(id) {
    try {
        const response = await fetch(`${API_BASE}/admin/faculty/${id}`);
        const data = await response.json();

        if (data.success) {
            const f = data.data;

            document.getElementById('editId').value = f.id;
            document.getElementById('name').value = f.name;
            document.getElementById('designation').value = f.designation;
            document.getElementById('staffType').value = f.staff_type || 'teaching';
            document.getElementById('department').value = f.department || '';
            document.getElementById('subject').value = f.subject || '';
            document.getElementById('qualification').value = f.qualification || '';
            document.getElementById('experience').value = f.experience || '';
            document.getElementById('email').value = f.email || '';
            document.getElementById('phone').value = f.phone || '';
            document.getElementById('message').value = f.message || '';
            document.getElementById('isPrincipal').checked = f.is_principal == 1;
            document.getElementById('joiningDate').value = f.joining_date || '';

            document.getElementById('formTitle').textContent = 'Edit Faculty Member';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update';
            document.getElementById('cancelBtn').style.display = 'inline-flex';

            // Scroll to form
            document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
        }
    } catch (error) {
        showToast('Error loading faculty data', 'error');
    }
}

// ============================================================
// CANCEL EDIT
// ============================================================
function cancelEdit() {
    document.getElementById('editId').value = '';
    document.getElementById('facultyForm').reset();
    document.getElementById('formTitle').textContent = 'Add Faculty Member';
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Save';
    document.getElementById('cancelBtn').style.display = 'none';
    showToast('Edit cancelled', 'info');
}

// ============================================================
// DELETE FACULTY
// ============================================================
async function deleteFaculty(id) {
    if (!confirm('Delete this faculty member?')) return;

    try {
        const response = await fetch(`${API_BASE}/admin/faculty/delete/${id}`, {
            method: 'DELETE'
        });
        const data = await response.json();

        if (data.success) {
            showToast('✅ Deleted!', 'success');
            loadFaculty();
        } else {
            showToast(data.message || 'Failed to delete', 'error');
        }
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    }
}

// ============================================================
// REFRESH
// ============================================================
function refreshFaculty() {
    showToast('🔄 Refreshing...', 'info');
    loadFaculty();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    // Admin name from localStorage
    const adminData = localStorage.getItem('adminData');
    if (adminData) {
        try {
            const data = JSON.parse(adminData);
            const name = data.name || data.username || 'Admin';
            document.getElementById('adminName').textContent = name;
            document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
        } catch (e) {}
    }

    loadFaculty();
    // Auto refresh every 60 seconds
    setInterval(loadFaculty, 60000);
});
</script>
