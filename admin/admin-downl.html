<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads Manager - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ============================================================
           ROOT VARIABLES - CLEAN THEME
        ============================================================ */
        :root {
            --bg: #f5f7fb;
            --bg-white: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #5a6a7e;
            --text-muted: #94a3b8;
            --gold: #c9972b;
            --gold-light: #e8b84b;
            --gold-bg: #fef8ed;
            --blue: #4a8af4;
            --blue-bg: #eef4ff;
            --green: #10b981;
            --green-bg: #ecfdf5;
            --purple: #8b5cf6;
            --purple-bg: #f5f0ff;
            --pink: #ec4899;
            --pink-bg: #fdf2f8;
            --orange: #f59e0b;
            --orange-bg: #fffbeb;
            --red: #ef4444;
            --border: #e8edf8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
           RESET
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           NAVBAR - CLEAN WHITE
        ============================================================ */
        .navbar {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar .brand .logo-placeholder {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            background: #fff;
        }

        .navbar .brand .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            padding: 4px;
        }

        .navbar .brand .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .navbar .brand .name span { color: var(--gold); }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }
        .navbar .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }
        .navbar .nav-links a:hover {
            background: var(--bg);
            color: var(--text-primary);
        }
        .navbar .nav-links a.active {
            background: var(--gold-bg);
            color: var(--gold);
        }
        .navbar .nav-links a i { margin-right: 6px; }

        .navbar .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar .nav-right .admin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 10px;
            background: var(--bg);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .navbar .nav-right .admin-badge .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .navbar .nav-right .admin-badge .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-left: 4px;
        }
        .navbar .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
        }

        /* ============================================================
           MAIN CONTAINER
        ============================================================ */
        .main-container {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px 40px;
            width: 100%;
        }

        /* ============================================================
           PAGE HEADER
        ============================================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding: 20px 28px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header h1 i { color: var(--gold); }
        .page-header .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ============================================================
           BUTTONS
        ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: inherit;
        }
        .btn-primary { background: var(--gold); color: #fff; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201, 151, 43, 0.3); }
        .btn-success { background: var(--green); color: #fff; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-warning { background: var(--orange); color: #fff; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .btn-secondary { background: var(--text-muted); color: #fff; }
        .btn-secondary:hover { background: #64748b; transform: translateY(-2px); }
        .btn-outline { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--border); transform: translateY(-2px); }
        .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }

        /* ============================================================
           CARDS
        ============================================================ */
        .card {
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .card h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i { color: var(--gold); }

        /* ============================================================
           FORM
        ============================================================ */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-group label .required { color: var(--red); }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text-primary);
            transition: var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201, 151, 43, 0.1);
            background: var(--bg-white);
        }
        select.form-control { cursor: pointer; }
        textarea.form-control { resize: vertical; min-height: 60px; }
        .form-actions { display: flex; gap: 10px; margin-top: 6px; }

        /* ============================================================
           TABLE
        ============================================================ */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table thead { background: var(--bg); }
        table th {
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table tr:hover { background: var(--bg); }

        /* ============================================================
           BADGES
        ============================================================ */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: var(--green-bg); color: var(--green); }
        .badge-primary { background: var(--blue-bg); color: var(--blue); }
        .badge-warning { background: var(--orange-bg); color: var(--orange); }
        .badge-purple { background: var(--purple-bg); color: var(--purple); }
        .badge-gold { background: var(--gold-bg); color: var(--gold); }

        /* ============================================================
           ACTION BUTTONS
        ============================================================ */
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-btns .btn-sm { font-size: 11px; padding: 4px 10px; }

        /* ============================================================
           TOAST
        ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }
        .toast-success { background: var(--green); }
        .toast-error { background: var(--red); }
        .toast-info { background: var(--text-primary); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================================
           FOOTER
        ============================================================ */
        .footer {
            background: var(--bg-white);
            border-top: 1px solid var(--border);
            padding: 20px 32px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer .footer-content a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }
        .footer .footer-content a:hover { text-decoration: underline; }
        .footer .footer-links { display: flex; gap: 20px; }
        .footer .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
        }
        .footer .footer-links a:hover {
            color: var(--gold);
            text-decoration: none;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 1024px) {
            .main-container { padding: 20px; }
            .navbar { padding: 0 20px; }
            .footer { padding: 16px 20px; }
        }
        @media (max-width: 768px) {
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 0;
                right: 0;
                background: var(--bg-white);
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow);
            }
            .navbar .nav-links.open { display: flex; }
            .navbar .hamburger { display: block; }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .page-header .header-actions { flex-wrap: wrap; }
            .page-header .header-actions .btn { flex: 1; justify-content: center; }

            .form-row { grid-template-columns: 1fr; }
            .card { padding: 16px; }

            table { font-size: 12px; }
            table th, table td { padding: 8px 10px; }
            .action-btns .btn-sm { font-size: 10px; padding: 3px 8px; }

            .footer .footer-content {
                flex-direction: column;
                text-align: center;
            }
            .footer .footer-links { justify-content: center; flex-wrap: wrap; }

            .toast {
                left: 16px;
                right: 16px;
                bottom: 16px;
                max-width: none;
            }
        }
        @media (max-width: 480px) {
            .main-container { padding: 12px; }
            .navbar { padding: 0 12px; }
            .page-header { padding: 16px; }
        }
    </style>
</head>
<body>

<!-- ============================================================
   NAVBAR
============================================================ -->
<nav class="navbar">
    <a href="#" class="brand">
        <div class="logo-placeholder">
            <img src="logo(1).png" alt="Logo" 
                 style="width:46px; height:46px; border-radius:10px; object-fit:contain; background:#fff; padding:4px;">
        </div>
        <div class="name">GSSS<span> SHILLA</span></div>
    </a>

    <ul class="nav-links" id="navLinks">
        <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="admin-downl.html" class="active"><i class="fas fa-download"></i> Downloads</a></li>
    </ul>

    <div class="nav-right">
        <div class="admin-badge">
            <span class="avatar" id="adminAvatar">A</span>
            <span id="adminName">Admin</span>
            <span class="online-dot"></span>
        </div>
        <button class="hamburger" onclick="toggleNav()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>

<!-- ============================================================
   MAIN CONTAINER
============================================================ -->
<div class="main-container">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-download"></i> Downloads Manager</h1>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="window.open('https://gsssshilla07.pages.dev', '_blank')">
                <i class="fas fa-eye"></i> View Public Page
            </button>
            <button class="btn btn-primary" onclick="loadDownloads()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>

    <!-- ADD FORM -->
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> <span id="formTitle">Add New Download</span></h2>
        <form id="downloadForm" enctype="multipart/form-data">
            <input type="hidden" id="editId" value="">

            <div class="form-row">
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="title" class="form-control" placeholder="eg. Maths" required>
                </div>
                <div class="form-group">
                    <label>Class <span class="required">*</span></label>
                    <select id="class" class="form-control" required>
                        <option value="">Select Class</option>
                        <option value="1">Class 1</option><option value="2">Class 2</option>
                        <option value="3">Class 3</option><option value="4">Class 4</option>
                        <option value="5">Class 5</option><option value="6">Class 6</option>
                        <option value="7">Class 7</option><option value="8">Class 8</option>
                        <option value="9">Class 9</option><option value="10">Class 10</option>
                        <option value="11">Class 11</option><option value="12">Class 12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Session/Year <span class="required">*</span></label>
                    <select id="session" class="form-control" required>
                        <option value="">Select Session</option>
                        <option value="2024-2025">2024-2025</option>
                        <option value="2025-2026">2025-2026</option>
                        <option value="2026-2027">2026-2027</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category <span class="required">*</span></label>
                    <select id="category" class="form-control" required>
                        <option value="">Select Category</option>
                        <option value="model-paper">Model Paper</option>
                        <option value="previous-year">Previous Year Question Paper</option>
                        <option value="syllabus">Syllabus</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Series (Optional)</label>
                    <select id="series" class="form-control">
                        <option value="">None</option>
                        <option value="A">Set A</option>
                        <option value="B">Set B</option>
                        <option value="C">Set C</option>
                        <option value="D">Set D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject (Optional)</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g., Mathematics">
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" class="form-control" rows="2" placeholder="Short description..."></textarea>
            </div>

            <div class="form-group">
                <label>File (PDF/Image - Max 15MB) <span class="required">*</span></label>
                <input type="file" id="file" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp">
                <small style="color:var(--text-muted);font-size:11px;display:block;margin-top:4px;">Allowed: PDF, Word, Images (Max 15MB)</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success" id="submitBtn">
                    <i class="fas fa-upload"></i> Upload
                </button>
                <button type="button" class="btn btn-warning" id="cancelBtn" style="display:none;" onclick="cancelEdit()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card">
        <h2><i class="fas fa-list"></i> All Downloads (<span id="totalCount">0</span>)</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Class</th>
                        <th>Session</th>
                        <th>Category</th>
                        <th>Series</th>
                        <th>Subject</th>
                        <th>Downloads</th>
                        <th style="width:110px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- ============================================================
   FOOTER
============================================================ -->
<footer class="footer">
    <div class="footer-content">
        <span>&copy; 2026 <a href="#">GSS School Shilla</a>. All rights reserved.</span>
        
    </div>
</footer>

<!-- ============================================================
   TOAST
============================================================ -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com';

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast toast-${type}`;
    t.style.display = 'block';
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.style.display = 'none', 4000);
}

// ============================================================
// NAVBAR TOGGLE
// ============================================================
function toggleNav() {
    document.getElementById('navLinks').classList.toggle('open');
}

document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
    });
});

// ============================================================
// LOAD DOWNLOADS
// ============================================================
async function loadDownloads() {
    const tbody = document.getElementById('tableBody');
    try {
        const res = await fetch(`${API_BASE}/admin/downloads`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('totalCount').textContent = data.data.length;
            if (data.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">
                    <i class="fas fa-inbox"></i> No downloads found
                </td></tr>`;
                return;
            }
            tbody.innerHTML = data.data.map((item, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${escapeHtml(item.title)}</strong></td>
                    <td><span class="badge badge-primary">Class ${item.class}</span></td>
                    <td>${escapeHtml(item.session_year)}</td>
                    <td><span class="badge ${item.category === 'model-paper' ? 'badge-success' : item.category === 'previous-year' ? 'badge-warning' : 'badge-purple'}">${escapeHtml(item.category)}</span></td>
                    <td>${item.series ? `<span class="badge badge-gold">${escapeHtml(item.series)}</span>` : '-'}</td>
                    <td>${escapeHtml(item.subject) || '-'}</td>
                    <td>${item.download_count || 0}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-primary btn-sm" onclick="editDownload(${item.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDownload(${item.id})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
    } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--red);padding:30px;">Failed to load</td></tr>';
    }
}

// ============================================================
// ESCAPE HTML
// ============================================================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// FORM SUBMIT
// ============================================================
document.getElementById('downloadForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const editId = document.getElementById('editId').value;
    const fileInput = document.getElementById('file');

    if (!editId && !fileInput.files.length) {
        return showToast('Please select a file', 'error');
    }

    const formData = new FormData();
    formData.append('title', document.getElementById('title').value);
    formData.append('class', document.getElementById('class').value);
    formData.append('session_year', document.getElementById('session').value);
    formData.append('category', document.getElementById('category').value);
    formData.append('series', document.getElementById('series').value);
    formData.append('subject', document.getElementById('subject').value);
    formData.append('description', document.getElementById('description').value);

    if (fileInput.files.length) {
        formData.append('file', fileInput.files[0]);
    }

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    btn.disabled = true;

    try {
        const url = editId ? `${API_BASE}/admin/downloads/update/${editId}` : `${API_BASE}/admin/downloads/add`;
        const method = editId ? 'PUT' : 'POST';

        const res = await fetch(url, { method, body: formData });
        const data = await res.json();

        if (data.success) {
            showToast(editId ? '✅ Updated!' : '✅ Uploaded!', 'success');
            cancelEdit();
            loadDownloads();
        } else {
            showToast(data.message || 'Failed', 'error');
        }
    } catch (err) {
        showToast('Error: ' + err.message, 'error');
    } finally {
        btn.innerHTML = '<i class="fas fa-upload"></i> Upload';
        btn.disabled = false;
    }
});

// ============================================================
// EDIT DOWNLOAD
// ============================================================
async function editDownload(id) {
    try {
        const res = await fetch(`${API_BASE}/api/downloads/${id}`);
        const data = await res.json();
        if (data.success) {
            const item = data.data;
            document.getElementById('editId').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('class').value = item.class;
            document.getElementById('session').value = item.session_year;
            document.getElementById('category').value = item.category;
            document.getElementById('series').value = item.series || '';
            document.getElementById('subject').value = item.subject || '';
            document.getElementById('description').value = item.description || '';

            document.getElementById('formTitle').textContent = 'Edit Download';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update';
            document.getElementById('cancelBtn').style.display = 'inline-flex';

            document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
        }
    } catch (err) {
        console.error(err);
        showToast('Error loading download', 'error');
    }
}

// ============================================================
// CANCEL EDIT
// ============================================================
function cancelEdit() {
    document.getElementById('editId').value = '';
    document.getElementById('downloadForm').reset();
    document.getElementById('formTitle').textContent = 'Add New Download';
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-upload"></i> Upload';
    document.getElementById('cancelBtn').style.display = 'none';
    showToast('Edit cancelled', 'info');
}

// ============================================================
// DELETE DOWNLOAD
// ============================================================
async function deleteDownload(id) {
    if (!confirm('Delete this download?')) return;
    try {
        const res = await fetch(`${API_BASE}/admin/downloads/delete/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            showToast('✅ Deleted!');
            loadDownloads();
        } else {
            showToast(data.message || 'Failed', 'error');
        }
    } catch (err) {
        showToast('Error: ' + err.message, 'error');
    }
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', function() {
    const adminData = localStorage.getItem('adminData');
    if (adminData) {
        try {
            const data = JSON.parse(adminData);
            const name = data.name || data.username || 'Admin';
            document.getElementById('adminName').textContent = name;
            document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
        } catch (e) {}
    }

    loadDownloads();
    setInterval(loadDownloads, 60000);
});
</script>
