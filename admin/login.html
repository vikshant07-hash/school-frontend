<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - GSS School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a1628;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Background Orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(90px);
}
.orb-1 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(201, 151, 43, 0.18), transparent 70%);
  top: -200px;
  right: -160px;
  animation: orbFloat 14s ease-in-out infinite alternate;
}
.orb-2 {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(37, 99, 235, 0.14), transparent 70%);
  bottom: -160px;
  left: -120px;
  animation: orbFloat 18s ease-in-out infinite alternate-reverse;
}
@keyframes orbFloat {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(50px) scale(1.06); }
}

.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(28px);
  border: 1px solid rgba(201, 151, 43, 0.22);
  border-radius: 26px;
  padding: 40px 36px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: cardIn 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo {
  text-align: center;
  margin-bottom: 28px;
}
.logo .icon {
  font-size: 48px;
  display: block;
  margin-bottom: 6px;
}
.logo h2 {
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
}
.logo p {
  color: rgba(255, 255, 255, 0.4);
  font-size: 13px;
  margin-top: 4px;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201, 151, 43, 0.3), transparent);
  margin: 0 0 24px;
}

.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  color: rgba(255, 255, 255, 0.5);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group .input-wrap {
  position: relative;
}
.form-group .input-wrap i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255, 255, 255, 0.3);
  font-size: 16px;
}
.form-group .input-wrap input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: #ffffff;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
}
.form-group .input-wrap input:focus {
  outline: none;
  border-color: rgba(201, 151, 43, 0.55);
  background: rgba(255, 255, 255, 0.08);
}
.form-group .input-wrap input::placeholder {
  color: rgba(255, 255, 255, 0.25);
}
.form-group .input-wrap input:read-only {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #c9972b, #e8b84b);
  border: none;
  border-radius: 12px;
  color: #0a1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 6px;
  box-shadow: 0 8px 24px rgba(201, 151, 43, 0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(201, 151, 43, 0.4);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

.message {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  display: none;
}
.message.success {
  display: block;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #34d399;
}
.message.error {
  display: block;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
}
.message.info {
  display: block;
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.3);
  color: #60a5fa;
}

.loader {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top: 2px solid #0a1628;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.links-row {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}
.links-row a {
  font-size: 13px;
  font-weight: 600;
  color: rgba(201, 151, 43, 0.75);
  text-decoration: none;
  transition: 0.2s;
}
.links-row a:hover {
  color: #e8b84b;
  text-decoration: underline;
}

/* OTP Section */
#otpSection {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
}

.timer-badge {
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(201, 151, 43, 0.1);
  border: 1px solid rgba(201, 151, 43, 0.25);
  color: rgba(201, 151, 43, 0.9);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
}

@media (max-width: 480px) {
  .login-card { padding: 28px 20px; }
  .logo h2 { font-size: 18px; }
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-card">
  <div class="logo">
    <span class="icon">🏫</span>
    <h2>Admin Login</h2>
    <p>Secure access with OTP verification</p>
  </div>

  <div class="divider"></div>

  <!-- Login Form -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Username</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>

  <!-- OTP Section -->
  <div id="otpSection">
    <div class="timer-badge" id="timerBadge">
      ⏱️ OTP expires in: <span id="timerDisplay">05:00</span>
    </div>
    <div class="form-group">
      <label><i class="fas fa-key"></i> Enter OTP</label>
      <div class="input-wrap">
        <i class="fas fa-key"></i>
        <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required>
      </div>
    </div>
    <button class="btn-primary" id="verifyBtn" onclick="verifyOTP()">
      <i class="fas fa-check-circle"></i> Verify & Login
    </button>
    <button class="btn-secondary" onclick="resendOTP()">
      <i class="fas fa-redo"></i> Resend OTP
    </button>
  </div>

  <div id="message" class="message"></div>

  <div class="links-row">
    <a href="forgot.html">Forgot Password?</a>
  </div>
</div>

<script>
// ============================================================
// BACKEND URL
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com/api/admin';

// ============================================================
// CHECK IF ALREADY LOGGED IN
// ============================================================
const token = localStorage.getItem('adminToken');
if (token) {
  fetch(`${API_BASE}/verify`, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.href = 'admin-dashboard.html';
    }
  })
  .catch(() => {});
}

// ============================================================
// VARIABLES
// ============================================================
let otpTimer = null;
let otpTimeLeft = 300;

// ============================================================
// HANDLE LOGIN - SEND OTP
// ============================================================
async function handleLogin(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (!username || !password) {
    showMessage('Please enter username and password', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending OTP...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      // Store data
      localStorage.setItem('tempUsername', username);
      localStorage.setItem('tempPassword', password);
      
      showMessage('✅ OTP sent to your registered email!', 'success');
      
      // Show OTP section
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('otpSection').style.display = 'block';
      startOtpTimer();
      
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    } else {
      showMessage('❌ ' + data.message, 'error');
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// VERIFY OTP
// ============================================================
async function verifyOTP() {
  const otp = document.getElementById('otp').value.trim().toUpperCase();
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.getElementById('verifyBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (otp.length !== 6) {
    showMessage('Please enter valid 6-digit OTP', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Verifying...';

  try {
    const response = await fetch(`${API_BASE}/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, otp })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminData', JSON.stringify(data.data));
      
      // Clear temp data
      localStorage.removeItem('tempUsername');
      localStorage.removeItem('tempPassword');
      
      clearInterval(otpTimer);
      showMessage('✅ Login successful! Redirecting...', 'success');
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1000);
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Login';
  }
}

// ============================================================
// RESEND OTP
// ============================================================
async function resendOTP() {
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.querySelector('.btn-secondary');
  const message = document.getElementById('message');

  if (!username || !password) {
    showMessage('Please login again', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      showMessage('✅ OTP resent successfully!', 'success');
      startOtpTimer();
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
  }
}

// ============================================================
// OTP TIMER
// ============================================================
function startOtpTimer() {
  clearInterval(otpTimer);
  otpTimeLeft = 300;
  const badge = document.getElementById('timerBadge');
  badge.style.display = 'flex';

  otpTimer = setInterval(() => {
    otpTimeLeft--;
    const m = String(Math.floor(otpTimeLeft / 60)).padStart(2, '0');
    const s = String(otpTimeLeft % 60).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    
    if (otpTimeLeft <= 0) {
      clearInterval(otpTimer);
      badge.style.display = 'none';
      showMessage('⏰ OTP expired. Please resend.', 'error');
    }
  }, 1000);
}

// ============================================================
// SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
  const message = document.getElementById('message');
  message.textContent = text;
  message.className = 'message ' + type;
}

// ============================================================
// ENTER KEY SUPPORT
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const otpVisible = document.getElementById('otpSection').style.display;
    if (otpVisible === 'block') {
      verifyOTP();
    } else {
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  }
});
</script>
</body>
</html>
