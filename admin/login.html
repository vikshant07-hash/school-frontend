<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - GSS School Shilla</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="logo(1).png" type="image/x-icon">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #eef4fb 0%, #dce8f5 50%, #f0e6d8 100%);
  padding: 30px;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   ANIMATED BACKGROUND - IMPROVED
============================================================ */
.bg-blobs {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.35;
  animation: blobFloat 20s ease-in-out infinite alternate;
}
.blob-1 {
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(52, 152, 219, 0.25), transparent 70%);
  top: -250px;
  right: -150px;
  animation-duration: 22s;
}
.blob-2 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(243, 156, 18, 0.2), transparent 70%);
  bottom: -200px;
  left: -120px;
  animation-duration: 26s;
  animation-delay: -5s;
}
.blob-3 {
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, rgba(46, 204, 113, 0.12), transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation-duration: 30s;
  animation-delay: -10s;
}
@keyframes blobFloat {
  0% { transform: translateY(0) scale(1) rotate(0deg); }
  33% { transform: translateY(-40px) scale(1.05) rotate(3deg); }
  66% { transform: translateY(40px) scale(0.95) rotate(-3deg); }
  100% { transform: translateY(0) scale(1) rotate(0deg); }
}

/* Floating Particles */
.particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  opacity: 0.15;
  animation: particleFloat 15s infinite linear;
}
.particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; background: #3498db; }
.particle:nth-child(2) { left: 85%; top: 15%; animation-delay: 2s; background: #e67e22; }
.particle:nth-child(3) { left: 20%; top: 80%; animation-delay: 4s; background: #27ae60; }
.particle:nth-child(4) { left: 75%; top: 70%; animation-delay: 1s; background: #8e44ad; }
.particle:nth-child(5) { left: 50%; top: 90%; animation-delay: 3s; background: #f39c12; }
.particle:nth-child(6) { left: 5%; top: 50%; animation-delay: 5s; background: #3498db; }
.particle:nth-child(7) { left: 95%; top: 45%; animation-delay: 2.5s; background: #e74c3c; }
.particle:nth-child(8) { left: 40%; top: 10%; animation-delay: 4.5s; background: #1abc9c; }

@keyframes particleFloat {
  0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
  25% { transform: translateY(-60px) translateX(30px) scale(1.3); opacity: 0.3; }
  50% { transform: translateY(40px) translateX(-20px) scale(0.7); opacity: 0.15; }
  75% { transform: translateY(-30px) translateX(50px) scale(1.1); opacity: 0.25; }
  100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
}

/* ============================================================
   SOFT WAVES
============================================================ */
.wave-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  height: 150px;
  overflow: hidden;
  pointer-events: none;
}

.wave {
  position: absolute;
  bottom: -20px;
  left: -50%;
  width: 200%;
  height: 120%;
  border-radius: 50% 50% 0 0;
  opacity: 0.15;
  animation: waveMove 10s ease-in-out infinite;
}
.wave:nth-child(1) {
  background: rgba(52, 152, 219, 0.2);
  animation-duration: 14s;
}
.wave:nth-child(2) {
  background: rgba(243, 156, 18, 0.12);
  animation-duration: 18s;
  animation-delay: -4s;
  bottom: -30px;
}
.wave:nth-child(3) {
  background: rgba(46, 204, 113, 0.08);
  animation-duration: 22s;
  animation-delay: -8s;
  bottom: -10px;
}

@keyframes waveMove {
  0%, 100% { transform: translateX(0) scaleY(0.6); }
  25% { transform: translateX(25%) scaleY(1); }
  50% { transform: translateX(50%) scaleY(0.7); }
  75% { transform: translateX(25%) scaleY(0.9); }
}

/* ============================================================
   TOP BAR - Home Button
============================================================ */
.top-bar {
  position: fixed;
  top: 30px;
  left: 30px;
  right: 30px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.btn-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 50px;
  color: #4a6a8b;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  text-decoration: none;
  box-shadow: 0 4px 20px rgba(52, 152, 219, 0.08);
}

.btn-home:hover {
  background: #ffffff;
  border-color: #3498db;
  color: #2c6b9e;
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 30px rgba(52, 152, 219, 0.15);
}

.btn-home i { font-size: 14px; color: #e67e22; transition: transform 0.3s; }
.btn-home:hover i { transform: translateX(-3px); }

.status-dot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 50px;
  color: #4a6a8b;
  font-size: 11px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(52, 152, 219, 0.06);
}

.status-dot .dot {
  width: 7px;
  height: 7px;
  background: #27ae60;
  border-radius: 50%;
  animation: dotPulse 2s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.3); }
  50% { opacity: 0.5; transform: scale(0.7); box-shadow: 0 0 0 6px rgba(39, 174, 96, 0); }
}

/* ============================================================
   LOGIN CARD
============================================================ */
.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(40px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 30px;
  padding: 46px 40px 40px;
  box-shadow: 
    0 25px 80px rgba(52, 152, 219, 0.08),
    0 10px 40px rgba(0, 0, 0, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
  animation: cardIn 0.8s cubic-bezier(0.34, 1.2, 0.64, 1) both;
  margin-top: 75px;
}

@keyframes cardIn {
  0% { opacity: 0; transform: translateY(50px) scale(0.92) rotate(-1deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
}

/* ============================================================
   SECURITY BADGE
============================================================ */
.security-badge {
  position: absolute;
  top: -14px;
  right: 28px;
  background: linear-gradient(135deg, #e67e22, #f39c12);
  color: #ffffff;
  padding: 6px 20px;
  border-radius: 50px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  box-shadow: 0 6px 25px rgba(243, 156, 18, 0.35);
  display: flex;
  align-items: center;
  gap: 6px;
  animation: badgeFloat 3s ease-in-out infinite;
}

@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); box-shadow: 0 6px 25px rgba(243, 156, 18, 0.35); }
  50% { transform: translateY(-4px); box-shadow: 0 10px 40px rgba(243, 156, 18, 0.5); }
}

.security-badge i { font-size: 12px; }

/* ============================================================
   LOGO
============================================================ */
.logo {
  text-align: center;
  margin-bottom: 26px;
}

.logo .logo-img {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(52, 152, 219, 0.15);
  box-shadow: 0 8px 35px rgba(52, 152, 219, 0.1);
  margin-bottom: 14px;
  transition: all 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
  background: #ffffff;
  padding: 4px;
  animation: logoPulse 4s ease-in-out infinite;
}

@keyframes logoPulse {
  0%, 100% { box-shadow: 0 8px 35px rgba(52, 152, 219, 0.1); }
  50% { box-shadow: 0 8px 50px rgba(52, 152, 219, 0.2); }
}

.logo .logo-img:hover {
  transform: scale(1.06) rotate(-4deg);
  border-color: #3498db;
  box-shadow: 0 8px 50px rgba(52, 152, 219, 0.2);
}

.logo h2 {
  color: #2c3e50;
  font-size: 24px;
  font-weight: 800;
  font-family: 'Playfair Display', serif;
  letter-spacing: -0.3px;
  line-height: 1.3;
}

.logo h2 .highlight {
  background: linear-gradient(135deg, #2980b9, #3498db, #5dade2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% 200%;
  animation: gradientMove 4s ease-in-out infinite;
}

@keyframes gradientMove {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.logo .school-tagline {
  color: #7f8c8d;
  font-size: 11px;
  margin-top: 2px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.logo p {
  color: #95a5a6;
  font-size: 13px;
  margin-top: 6px;
  font-weight: 400;
}

.logo .secure-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  background: rgba(243, 156, 18, 0.08);
  border: 1px solid rgba(243, 156, 18, 0.15);
  padding: 5px 16px;
  border-radius: 50px;
  font-size: 11px;
  color: #e67e22;
  font-weight: 600;
  animation: tagPulse 3s ease-in-out infinite;
}

@keyframes tagPulse {
  0%, 100% { border-color: rgba(243, 156, 18, 0.15); }
  50% { border-color: rgba(243, 156, 18, 0.3); }
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.15), transparent);
  margin: 0 0 26px;
  position: relative;
}

.divider::after {
  content: '✦';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  padding: 0 12px;
  color: #bdc3c7;
  font-size: 10px;
}

/* ============================================================
   STEPS INDICATOR - IMPROVED
============================================================ */
.steps-indicator {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-bottom: 30px;
}

.step-dot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
}

.step-dot .circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #bdc3c7;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  transition: all 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
  position: relative;
}

.step-dot .circle.active {
  background: linear-gradient(135deg, #3498db, #2980b9);
  color: #ffffff;
  border-color: #3498db;
  box-shadow: 0 0 40px rgba(52, 152, 219, 0.25);
  transform: scale(1.12);
}

.step-dot .circle.done {
  background: #27ae60;
  color: #ffffff;
  border-color: #27ae60;
  box-shadow: 0 0 30px rgba(39, 174, 96, 0.2);
  transform: scale(1.05);
}

.step-dot .circle.done i { font-size: 16px; }

.step-dot .circle::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px dashed transparent;
  transition: all 0.6s ease;
}

.step-dot .circle.active::after {
  border-color: rgba(52, 152, 219, 0.2);
  animation: spinBorder 4s linear infinite;
}

@keyframes spinBorder {
  to { transform: rotate(360deg); }
}

.step-line {
  width: 45px;
  height: 2.5px;
  background: #ecf0f1;
  transition: all 0.8s ease;
  flex-shrink: 0;
  border-radius: 2px;
  position: relative;
}

.step-line.done {
  background: linear-gradient(90deg, #27ae60, #3498db);
}

.step-line.done::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
  animation: lineShine 2s ease-in-out infinite;
}

@keyframes lineShine {
  0%, 100% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
}

.step-label {
  font-size: 9px;
  color: #bdc3c7;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  transition: all 0.4s ease;
}

.step-label.active {
  color: #3498db;
  font-weight: 700;
}

/* ============================================================
   FORM
============================================================ */
.form-group {
  margin-bottom: 18px;
  animation: slideUp 0.6s ease both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }

.form-group label {
  display: block;
  color: #7f8c8d;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 6px;
}

.form-group .input-wrap {
  position: relative;
}

.form-group .input-wrap i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #bdc3c7;
  font-size: 16px;
  transition: all 0.4s ease;
  z-index: 2;
}

.form-group .input-wrap input {
  width: 100%;
  padding: 14px 16px 14px 48px;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  border-radius: 14px;
  color: #2c3e50;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  transition: all 0.4s ease;
  position: relative;
  z-index: 1;
}

.form-group .input-wrap input:focus {
  outline: none;
  border-color: #3498db;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.08);
  transform: translateY(-1px);
}

.form-group .input-wrap input:focus + i,
.form-group .input-wrap input:focus ~ i {
  color: #3498db;
  transform: translateY(-50%) scale(1.1);
}

.form-group .input-wrap input::placeholder {
  color: #bdc3c7;
  font-weight: 400;
}

/* ============================================================
   BUTTONS
============================================================ */
.btn-primary {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #e67e22, #f39c12);
  border: none;
  border-radius: 14px;
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  margin-top: 8px;
  box-shadow: 0 8px 35px rgba(243, 156, 18, 0.25);
  position: relative;
  overflow: hidden;
}

.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.8s ease;
}

.btn-primary:hover::before {
  transform: translateX(100%);
}

.btn-primary:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 14px 45px rgba(243, 156, 18, 0.35);
}

.btn-primary:active {
  transform: translateY(0) scale(0.98);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn-secondary {
  width: 100%;
  padding: 14px;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  border-radius: 14px;
  color: #7f8c8d;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.4s ease;
  margin-top: 10px;
}

.btn-secondary:hover {
  background: #ffffff;
  color: #2c3e50;
  border-color: #3498db;
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(52, 152, 219, 0.08);
}

/* ============================================================
   OTP SECTION - FIXED
============================================================ */
#otpSection {
  display: none;
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid #ecf0f1;
  animation: slideDown 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-25px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.timer-badge {
  display: none;
  align-items: center;
  gap: 10px;
  background: #fef9e7;
  border: 1px solid #f9e79f;
  color: #e67e22;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 18px;
  animation: timerPulse 2s ease-in-out infinite;
}

@keyframes timerPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.01); }
}

.timer-badge i { font-size: 16px; color: #e67e22; }

#otpSection .form-group {
  animation: slideUp 0.6s ease 0.15s both;
}

#otpSection .btn-primary {
  animation: slideUp 0.6s ease 0.25s both;
}

#otpSection .btn-secondary {
  animation: slideUp 0.6s ease 0.35s both;
}

/* OTP Input - FIXED */
#otp {
  font-size: 18px !important;
  letter-spacing: 4px;
  text-align: center;
  font-weight: 700 !important;
}

#otp:focus {
  letter-spacing: 6px;
}

/* ============================================================
   MESSAGE
============================================================ */
.message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  display: none;
  animation: slideUp 0.4s ease both;
}

.message.success {
  display: block;
  background: #eafaf1;
  border: 1px solid #82e0aa;
  color: #27ae60;
}
.message.error {
  display: block;
  background: #fdedec;
  border: 1px solid #f5b7b1;
  color: #e74c3c;
}
.message.info {
  display: block;
  background: #ebf5fb;
  border: 1px solid #85c1e9;
  color: #2980b9;
}

/* ============================================================
   LINKS
============================================================ */
.links-row {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  flex-wrap: wrap;
  gap: 8px;
}

.links-row a {
  font-size: 13px;
  font-weight: 500;
  color: #95a5a6;
  text-decoration: none;
  transition: all 0.3s ease;
  padding: 4px 0;
}

.links-row a:hover {
  color: #3498db;
  transform: translateX(3px);
}

.links-row a i { margin-right: 4px; font-size: 12px; }

/* ============================================================
   LOADER
============================================================ */
.loader {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  border-top: 2.5px solid #ffffff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 768px) {
  body { padding: 16px; }
  .top-bar {
    top: 16px;
    left: 16px;
    right: 16px;
  }
  .btn-home { padding: 8px 16px; font-size: 12px; }
  .status-dot { padding: 6px 14px; font-size: 10px; }
  .login-card {
    padding: 32px 24px 28px;
    border-radius: 22px;
    max-width: 100%;
    margin-top: 60px;
  }
  .security-badge {
    top: -10px;
    right: 18px;
    font-size: 9px;
    padding: 4px 14px;
  }
  .logo .logo-img { width: 70px; height: 70px; }
  .logo h2 { font-size: 20px; }
  .logo .school-tagline { font-size: 10px; }
  .step-dot .circle { width: 34px; height: 34px; font-size: 12px; }
  .step-line { width: 30px; }
  .step-label { font-size: 8px; }
  .form-group .input-wrap input { padding: 12px 14px 12px 42px; font-size: 14px; }
  .btn-primary { padding: 14px; font-size: 14px; }
  .btn-secondary { padding: 12px; font-size: 13px; }
  .links-row { flex-direction: column; align-items: center; gap: 6px; }
  .links-row a { font-size: 12px; }
}

@media (max-width: 400px) {
  .login-card { padding: 24px 16px 20px; }
  .logo .logo-img { width: 60px; height: 60px; }
  .logo h2 { font-size: 17px; }
  .step-dot .circle { width: 30px; height: 30px; font-size: 11px; }
  .step-line { width: 20px; }
  .form-group .input-wrap input { padding: 10px 12px 10px 36px; font-size: 13px; }
  .form-group .input-wrap i { left: 12px; font-size: 14px; }
  .security-badge { font-size: 8px; padding: 3px 10px; }
}
</style>
</head>
<body>

<!-- Background Blobs -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- Floating Particles -->
<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<!-- Soft Waves -->
<div class="wave-container">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<!-- ============================================================
     TOP BAR - Home Button
============================================================ -->
<div class="top-bar">
  <a href="../index.html" class="btn-home">
    <i class="fas fa-arrow-left"></i> Home
  </a>
  <div class="status-dot">
    <span class="dot"></span>
    Secure Connection
  </div>
</div>

<!-- ============================================================
     LOGIN CARD
============================================================ -->
<div class="login-card">

  <!-- Security Badge -->
  <div class="security-badge">
    <i class="fas fa-shield-alt"></i> Secure
  </div>

  <!-- Logo with School Logo Image -->
  <div class="logo">
    <img src="logo(1).png" alt="GSS School Shilla Logo" class="logo-img" 
         onerror="this.src='https://ui-avatars.com/api/?name=GSS&size=85&background=3498db&color=fff&bold=true'">
    <h2>Govt. Sr. Sec.  <span class="highlight">School Shilla</span></h2>
    <div class="school-tagline">EST.HIMACHAL PRADESH</div>
    <p>Admin Portal · Secure Access</p>
    <div class="secure-tag">
      <i class="fas fa-lock"></i> Secure & Encrypted
    </div>
  </div>

  <div class="divider"></div>

  <!-- ===== STEPS INDICATOR ===== -->
  <div class="steps-indicator">
    <div class="step-dot" id="step1">
      <div class="circle active" id="stepCircle1">1</div>
      <div class="step-label active" id="stepLabel1">Login</div>
    </div>
    <div class="step-line" id="stepLine"></div>
    <div class="step-dot" id="step2">
      <div class="circle" id="stepCircle2">2</div>
      <div class="step-label" id="stepLabel2">Verify</div>
    </div>
  </div>

  <!-- ===== LOGIN FORM ===== -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Username</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>

  <!-- ===== OTP SECTION ===== -->
  <div id="otpSection">
    <div class="timer-badge" id="timerBadge">
      <i class="fas fa-clock"></i> OTP expires in: <span id="timerDisplay">05:00</span>
    </div>
    <div class="form-group">
      <label><i class="fas fa-key"></i> Enter OTP</label>
      <div class="input-wrap">
        <i class="fas fa-key"></i>
        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
      </div>
    </div>
    <button class="btn-primary" id="verifyBtn" onclick="verifyOTP()">
      <i class="fas fa-check-circle"></i> Verify & Login
    </button>
    <button class="btn-secondary" onclick="resendOTP()">
      <i class="fas fa-redo"></i> Resend OTP
    </button>
  </div>

  <!-- Message -->
  <div id="message" class="message"></div>

  <!-- Links -->
  <div class="links-row">
    <a href="forgot.html"><i class="fas fa-key"></i> Forgot Password?</a>
    <a href="#"><i class="fas fa-shield-alt"></i> Secure Login</a>
  </div>
</div>

<script>
// ============================================================
// BACKEND URL
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com/api/admin';

// ============================================================
// CHECK IF ALREADY LOGGED IN
// ============================================================
const token = localStorage.getItem('adminToken');
if (token) {
  fetch(`${API_BASE}/verify`, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.href = 'admin-dashboard.html';
    }
  })
  .catch(() => {});
}

// ============================================================
// VARIABLES
// ============================================================
let otpTimer = null;
let otpTimeLeft = 300;

// ============================================================
// UPDATE STEPS
// ============================================================
function updateSteps(step) {
  const circle1 = document.getElementById('stepCircle1');
  const circle2 = document.getElementById('stepCircle2');
  const label1 = document.getElementById('stepLabel1');
  const label2 = document.getElementById('stepLabel2');
  const line = document.getElementById('stepLine');

  if (step === 1) {
    circle1.className = 'circle active';
    circle1.innerHTML = '1';
    circle2.className = 'circle';
    circle2.innerHTML = '2';
    label1.className = 'step-label active';
    label2.className = 'step-label';
    line.className = 'step-line';
  } else if (step === 2) {
    circle1.className = 'circle done';
    circle1.innerHTML = '<i class="fas fa-check"></i>';
    circle2.className = 'circle active';
    circle2.innerHTML = '2';
    label1.className = 'step-label';
    label2.className = 'step-label active';
    line.className = 'step-line done';
  }
}

// ============================================================
// HANDLE LOGIN - SEND OTP
// ============================================================
async function handleLogin(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (!username || !password) {
    showMessage('Please enter username and password', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending OTP...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('tempUsername', username);
      localStorage.setItem('tempPassword', password);
      
      showMessage('✅ OTP sent to your registered email!', 'success');
      
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('otpSection').style.display = 'block';
      
      updateSteps(2);
      
      startOtpTimer();
      
      // Focus OTP input after a small delay
      setTimeout(() => {
        document.getElementById('otp').focus();
      }, 300);
      
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    } else {
      showMessage('❌ ' + data.message, 'error');
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// VERIFY OTP
// ============================================================
async function verifyOTP() {
  const otpInput = document.getElementById('otp');
  const otp = otpInput.value.trim();
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.getElementById('verifyBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (otp.length !== 6) {
    showMessage('Please enter valid 6-digit OTP', 'error');
    otpInput.focus();
    otpInput.select();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Verifying...';

  try {
    const response = await fetch(`${API_BASE}/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, otp: otp.toUpperCase() })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminData', JSON.stringify(data.data));
      
      localStorage.removeItem('tempUsername');
      localStorage.removeItem('tempPassword');
      
      clearInterval(otpTimer);
      showMessage('✅ Login successful! Redirecting...', 'success');
      
      document.getElementById('stepCircle2').className = 'circle done';
      document.getElementById('stepCircle2').innerHTML = '<i class="fas fa-check"></i>';
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1200);
    } else {
      showMessage('❌ ' + data.message, 'error');
      document.getElementById('otp').value = '';
      document.getElementById('otp').focus();
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Login';
  }
}

// ============================================================
// RESEND OTP
// ============================================================
async function resendOTP() {
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.querySelector('.btn-secondary');
  const message = document.getElementById('message');

  if (!username || !password) {
    showMessage('Please login again', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      showMessage('✅ OTP resent successfully!', 'success');
      startOtpTimer();
      document.getElementById('otp').value = '';
      document.getElementById('otp').focus();
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
  }
}

// ============================================================
// OTP TIMER
// ============================================================
function startOtpTimer() {
  clearInterval(otpTimer);
  otpTimeLeft = 300;
  const badge = document.getElementById('timerBadge');
  badge.style.display = 'flex';

  otpTimer = setInterval(() => {
    otpTimeLeft--;
    const m = String(Math.floor(otpTimeLeft / 60)).padStart(2, '0');
    const s = String(otpTimeLeft % 60).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    
    if (otpTimeLeft <= 0) {
      clearInterval(otpTimer);
      badge.style.display = 'none';
      showMessage('⏰ OTP expired. Please resend.', 'error');
    }
  }, 1000);
}

// ============================================================
// SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
  const message = document.getElementById('message');
  message.textContent = text;
  message.className = 'message ' + type;
}

// ============================================================
// OTP INPUT HANDLING - FIXED
// ============================================================
const otpInput = document.getElementById('otp');
otpInput.addEventListener('input', function(e) {
  // Only allow numbers
  this.value = this.value.replace(/[^0-9]/g, '');
  
  // Auto-submit when 6 digits entered
  if (this.value.length === 6) {
    verifyOTP();
  }
});

// ============================================================
// ENTER KEY SUPPORT
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const otpSection = document.getElementById('otpSection');
    if (otpSection.style.display === 'block') {
      const otp = document.getElementById('otp').value.trim();
      if (otp.length === 6) {
        verifyOTP();
      } else {
        document.getElementById('otp').focus();
      }
    } else {
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  }
});

// ============================================================
// INIT
// ============================================================
updateSteps(1);
</script>

</body>
</html>
