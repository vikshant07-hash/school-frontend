<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - GSS School Shilla</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="logo(1).png" type="image/x-icon">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #eef4fb 0%, #dce8f5 50%, #f0e6d8 100%);
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   ANIMATED BACKGROUND
============================================================ */
.bg-blobs {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
}
.blob-1 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(52, 152, 219, 0.2), transparent 70%);
  top: -200px;
  right: -100px;
  animation: blobFloat 18s ease-in-out infinite alternate;
}
.blob-2 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(243, 156, 18, 0.15), transparent 70%);
  bottom: -150px;
  left: -80px;
  animation: blobFloat 22s ease-in-out infinite alternate-reverse;
}
.blob-3 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(46, 204, 113, 0.1), transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: blobFloat 26s ease-in-out infinite alternate;
}
@keyframes blobFloat {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(60px) scale(1.1); }
}

/* ============================================================
   SOFT WAVES
============================================================ */
.wave-container {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  height: 120px;
  overflow: hidden;
  pointer-events: none;
}

.wave {
  position: absolute;
  bottom: 0;
  left: -50%;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 50%,
    rgba(52, 152, 219, 0.04) 50%,
    rgba(52, 152, 219, 0.04) 100%
  );
  background-size: 200% 100%;
  animation: waveMove 12s linear infinite;
}

.wave:nth-child(2) {
  animation-duration: 18s;
  animation-delay: -4s;
  opacity: 0.6;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 30%,
    rgba(243, 156, 18, 0.03) 30%,
    rgba(243, 156, 18, 0.03) 100%
  );
  background-size: 300% 100%;
}

@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(50%); }
}

/* ============================================================
   TOP BAR - Home Button
============================================================ */
.top-bar {
  position: fixed;
  top: 24px;
  left: 24px;
  right: 24px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 440px;
  margin: 0 auto;
  width: 100%;
}

.btn-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50px;
  color: #4a6a8b;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(52, 152, 219, 0.08);
}

.btn-home:hover {
  background: #ffffff;
  border-color: rgba(52, 152, 219, 0.3);
  color: #2c6b9e;
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(52, 152, 219, 0.15);
}

.btn-home i { font-size: 14px; color: #e67e22; }

.status-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50px;
  color: #4a6a8b;
  font-size: 11px;
  font-weight: 500;
  box-shadow: 0 4px 15px rgba(52, 152, 219, 0.06);
}

.status-dot .dot {
  width: 6px;
  height: 6px;
  background: #27ae60;
  border-radius: 50%;
  animation: dotPulse 2s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* ============================================================
   LOGIN CARD
============================================================ */
.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(32px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 28px;
  padding: 44px 38px 38px;
  box-shadow: 
    0 20px 60px rgba(52, 152, 219, 0.08),
    0 8px 30px rgba(0, 0, 0, 0.04),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  animation: cardIn 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) both;
  margin-top: 70px;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(40px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ============================================================
   SECURITY BADGE
============================================================ */
.security-badge {
  position: absolute;
  top: -12px;
  right: 24px;
  background: linear-gradient(135deg, #e67e22, #f39c12);
  color: #ffffff;
  padding: 5px 18px;
  border-radius: 50px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  box-shadow: 0 4px 20px rgba(243, 156, 18, 0.3);
  display: flex;
  align-items: center;
  gap: 6px;
  animation: badgeGlow 3s ease-in-out infinite;
}

@keyframes badgeGlow {
  0%, 100% { box-shadow: 0 4px 20px rgba(243, 156, 18, 0.3); }
  50% { box-shadow: 0 4px 35px rgba(243, 156, 18, 0.45); }
}

.security-badge i { font-size: 12px; }

/* ============================================================
   LOGO
============================================================ */
.logo {
  text-align: center;
  margin-bottom: 24px;
}

.logo .logo-img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(52, 152, 219, 0.15);
  box-shadow: 0 8px 30px rgba(52, 152, 219, 0.08);
  margin-bottom: 12px;
  transition: all 0.4s ease;
  background: #ffffff;
  padding: 3px;
}

.logo .logo-img:hover {
  transform: scale(1.05) rotate(-3deg);
  border-color: rgba(52, 152, 219, 0.3);
  box-shadow: 0 8px 40px rgba(52, 152, 219, 0.15);
}

.logo h2 {
  color: #2c3e50;
  font-size: 22px;
  font-weight: 800;
  font-family: 'Playfair Display', serif;
  letter-spacing: -0.3px;
  line-height: 1.3;
}

.logo h2 .highlight {
  background: linear-gradient(135deg, #2980b9, #3498db);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo .school-tagline {
  color: #7f8c8d;
  font-size: 11px;
  margin-top: 2px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.logo p {
  color: #95a5a6;
  font-size: 13px;
  margin-top: 6px;
  font-weight: 400;
}

.logo .secure-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  background: rgba(243, 156, 18, 0.08);
  border: 1px solid rgba(243, 156, 18, 0.12);
  padding: 4px 14px;
  border-radius: 50px;
  font-size: 11px;
  color: #e67e22;
  font-weight: 600;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.12), transparent);
  margin: 0 0 24px;
}

/* ============================================================
   STEPS INDICATOR
============================================================ */
.steps-indicator {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.step-dot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.step-dot .circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #bdc3c7;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  transition: all 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}

.step-dot .circle.active {
  background: linear-gradient(135deg, #3498db, #2980b9);
  color: #ffffff;
  border-color: #3498db;
  box-shadow: 0 0 30px rgba(52, 152, 219, 0.2);
  transform: scale(1.1);
}

.step-dot .circle.done {
  background: #27ae60;
  color: #ffffff;
  border-color: #27ae60;
}

.step-dot .circle i { font-size: 14px; }

.step-line {
  width: 40px;
  height: 2px;
  background: #ecf0f1;
  transition: all 0.6s ease;
  flex-shrink: 0;
}

.step-line.done {
  background: linear-gradient(90deg, #27ae60, #3498db);
}

.step-label {
  font-size: 9px;
  color: #bdc3c7;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.4s ease;
}

.step-label.active {
  color: #3498db;
}

/* ============================================================
   FORM
============================================================ */
.form-group {
  margin-bottom: 18px;
  animation: slideUp 0.5s ease both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-group label {
  display: block;
  color: #7f8c8d;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.form-group .input-wrap {
  position: relative;
}

.form-group .input-wrap i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #bdc3c7;
  font-size: 16px;
  transition: all 0.3s ease;
}

.form-group .input-wrap input {
  width: 100%;
  padding: 14px 16px 14px 48px;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  border-radius: 14px;
  color: #2c3e50;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
}

.form-group .input-wrap input:focus {
  outline: none;
  border-color: #3498db;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.06);
}

.form-group .input-wrap input:focus + i,
.form-group .input-wrap input:focus ~ i {
  color: #3498db;
}

.form-group .input-wrap input::placeholder {
  color: #bdc3c7;
}

/* ============================================================
   BUTTONS
============================================================ */
.btn-primary {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #e67e22, #f39c12);
  border: none;
  border-radius: 14px;
  color: #ffffff;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 6px;
  box-shadow: 0 8px 30px rgba(243, 156, 18, 0.2);
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
}

.btn-primary:hover::after {
  transform: translateX(100%);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(243, 156, 18, 0.3);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn-secondary {
  width: 100%;
  padding: 13px;
  background: #f8f9fa;
  border: 2px solid #ecf0f1;
  border-radius: 14px;
  color: #7f8c8d;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
}

.btn-secondary:hover {
  background: #ffffff;
  color: #2c3e50;
  border-color: #3498db;
}

/* ============================================================
   OTP SECTION
============================================================ */
#otpSection {
  display: none;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #ecf0f1;
  animation: slideDown 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.timer-badge {
  display: none;
  align-items: center;
  gap: 10px;
  background: #fef9e7;
  border: 1px solid #f9e79f;
  color: #e67e22;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.timer-badge i { font-size: 16px; }

#otpSection .form-group {
  animation: slideUp 0.5s ease 0.2s both;
}

#otpSection .btn-primary {
  animation: slideUp 0.5s ease 0.3s both;
}

#otpSection .btn-secondary {
  animation: slideUp 0.5s ease 0.4s both;
}

/* ============================================================
   MESSAGE
============================================================ */
.message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  display: none;
  animation: slideUp 0.4s ease both;
}

.message.success {
  display: block;
  background: #eafaf1;
  border: 1px solid #82e0aa;
  color: #27ae60;
}
.message.error {
  display: block;
  background: #fdedec;
  border: 1px solid #f5b7b1;
  color: #e74c3c;
}
.message.info {
  display: block;
  background: #ebf5fb;
  border: 1px solid #85c1e9;
  color: #2980b9;
}

/* ============================================================
   LINKS
============================================================ */
.links-row {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  flex-wrap: wrap;
  gap: 8px;
}

.links-row a {
  font-size: 13px;
  font-weight: 500;
  color: #95a5a6;
  text-decoration: none;
  transition: all 0.2s ease;
}

.links-row a:hover {
  color: #3498db;
}

.links-row a i { margin-right: 4px; }

/* ============================================================
   LOADER
============================================================ */
.loader {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  border-top: 2.5px solid #ffffff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 520px) {
  .top-bar {
    top: 16px;
    left: 16px;
    right: 16px;
  }
  
  .btn-home {
    padding: 8px 14px;
    font-size: 11px;
  }
  
  .status-dot {
    padding: 6px 12px;
    font-size: 10px;
  }
  .status-dot .dot { width: 5px; height: 5px; }
  
  .login-card {
    padding: 30px 20px 28px;
    border-radius: 20px;
    max-width: 100%;
    margin-top: 60px;
  }
  
  .security-badge {
    top: -10px;
    right: 16px;
    font-size: 9px;
    padding: 3px 12px;
  }
  
  .logo .logo-img {
    width: 65px;
    height: 65px;
  }
  
  .logo h2 { font-size: 18px; }
  .logo .school-tagline { font-size: 10px; }
  
  .steps-indicator { gap: 8px; }
  .step-dot .circle { width: 32px; height: 32px; font-size: 12px; }
  .step-line { width: 25px; }
  .step-label { font-size: 8px; }
  
  .form-group .input-wrap input { padding: 12px 14px 12px 42px; font-size: 14px; }
  .btn-primary { padding: 13px; font-size: 14px; }
  .btn-secondary { padding: 11px; font-size: 13px; }
  
  .links-row { flex-direction: column; align-items: center; gap: 6px; }
  .links-row a { font-size: 12px; }
}

@media (max-width: 380px) {
  .login-card { padding: 22px 14px; }
  .logo .logo-img { width: 55px; height: 55px; }
  .logo h2 { font-size: 15px; }
  .step-dot .circle { width: 28px; height: 28px; font-size: 10px; }
  .step-line { width: 18px; }
  .form-group .input-wrap input { padding: 10px 12px 10px 36px; font-size: 13px; }
  .form-group .input-wrap i { left: 12px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- Background Blobs -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- Soft Waves -->
<div class="wave-container">
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<!-- ============================================================
     TOP BAR - Home Button
============================================================ -->
<div class="top-bar">
  <a href="../index.html" class="btn-home">
    <i class="fas fa-arrow-left"></i> Home
  </a>
  <div class="status-dot">
    <span class="dot"></span>
    Secure Connection
  </div>
</div>

<!-- ============================================================
     LOGIN CARD
============================================================ -->
<div class="login-card">

  <!-- Security Badge -->
  <div class="security-badge">
    <i class="fas fa-shield-alt"></i> Secure
  </div>

  <!-- Logo with School Logo Image -->
  <div class="logo">
    <img src="logo(1).png" alt="GSS School Shilla Logo" class="logo-img" 
         onerror="this.src='https://ui-avatars.com/api/?name=GSS&size=80&background=3498db&color=fff&bold=true'">
    <h2>GSS <span class="highlight">School Shilla</span></h2>
    <div class="school-tagline">Govt. Sr. Sec. School</div>
    <p>Admin Portal · Secure Access</p>
    <div class="secure-tag">
      <i class="fas fa-lock"></i> Secure & Encrypted
    </div>
  </div>

  <div class="divider"></div>

  <!-- ===== STEPS INDICATOR ===== -->
  <div class="steps-indicator">
    <div class="step-dot" id="step1">
      <div class="circle active" id="stepCircle1">1</div>
      <div class="step-label active" id="stepLabel1">Login</div>
    </div>
    <div class="step-line" id="stepLine"></div>
    <div class="step-dot" id="step2">
      <div class="circle" id="stepCircle2">2</div>
      <div class="step-label" id="stepLabel2">Verify</div>
    </div>
  </div>

  <!-- ===== LOGIN FORM ===== -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Username</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>

  <!-- ===== OTP SECTION ===== -->
  <div id="otpSection">
    <div class="timer-badge" id="timerBadge">
      <i class="fas fa-clock"></i> OTP expires in: <span id="timerDisplay">05:00</span>
    </div>
    <div class="form-group">
      <label><i class="fas fa-key"></i> Enter OTP</label>
      <div class="input-wrap">
        <i class="fas fa-key"></i>
        <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" autocomplete="off" required>
      </div>
    </div>
    <button class="btn-primary" id="verifyBtn" onclick="verifyOTP()">
      <i class="fas fa-check-circle"></i> Verify & Login
    </button>
    <button class="btn-secondary" onclick="resendOTP()">
      <i class="fas fa-redo"></i> Resend OTP
    </button>
  </div>

  <!-- Message -->
  <div id="message" class="message"></div>

  <!-- Links -->
  <div class="links-row">
    <a href="forgot.html"><i class="fas fa-key"></i> Forgot Password?</a>
    <a href="#"><i class="fas fa-shield-alt"></i> Secure Login</a>
  </div>
</div>

<script>
// ============================================================
// BACKEND URL
// ============================================================
const API_BASE = 'https://gsssshilla.onrender.com/api/admin';

// ============================================================
// CHECK IF ALREADY LOGGED IN
// ============================================================
const token = localStorage.getItem('adminToken');
if (token) {
  fetch(`${API_BASE}/verify`, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.href = 'admin-dashboard.html';
    }
  })
  .catch(() => {});
}

// ============================================================
// VARIABLES
// ============================================================
let otpTimer = null;
let otpTimeLeft = 300;

// ============================================================
// UPDATE STEPS
// ============================================================
function updateSteps(step) {
  const circle1 = document.getElementById('stepCircle1');
  const circle2 = document.getElementById('stepCircle2');
  const label1 = document.getElementById('stepLabel1');
  const label2 = document.getElementById('stepLabel2');
  const line = document.getElementById('stepLine');

  if (step === 1) {
    circle1.className = 'circle active';
    circle2.className = 'circle';
    label1.className = 'step-label active';
    label2.className = 'step-label';
    line.className = 'step-line';
  } else if (step === 2) {
    circle1.className = 'circle done';
    circle1.innerHTML = '<i class="fas fa-check"></i>';
    circle2.className = 'circle active';
    label1.className = 'step-label';
    label2.className = 'step-label active';
    line.className = 'step-line done';
  }
}

// ============================================================
// HANDLE LOGIN - SEND OTP
// ============================================================
async function handleLogin(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (!username || !password) {
    showMessage('Please enter username and password', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending OTP...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('tempUsername', username);
      localStorage.setItem('tempPassword', password);
      
      showMessage('✅ OTP sent to your registered email!', 'success');
      
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('otpSection').style.display = 'block';
      
      updateSteps(2);
      
      startOtpTimer();
      document.getElementById('otp').focus();
      
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    } else {
      showMessage('❌ ' + data.message, 'error');
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// VERIFY OTP
// ============================================================
async function verifyOTP() {
  const otp = document.getElementById('otp').value.trim().toUpperCase();
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.getElementById('verifyBtn');
  const message = document.getElementById('message');

  message.className = 'message';
  message.textContent = '';

  if (otp.length !== 6) {
    showMessage('Please enter valid 6-digit OTP', 'error');
    document.getElementById('otp').focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Verifying...';

  try {
    const response = await fetch(`${API_BASE}/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, otp })
    });

    const data = await response.json();

    if (data.success) {
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminData', JSON.stringify(data.data));
      
      localStorage.removeItem('tempUsername');
      localStorage.removeItem('tempPassword');
      
      clearInterval(otpTimer);
      showMessage('✅ Login successful! Redirecting...', 'success');
      
      document.getElementById('stepCircle2').className = 'circle done';
      document.getElementById('stepCircle2').innerHTML = '<i class="fas fa-check"></i>';
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1200);
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Login';
  }
}

// ============================================================
// RESEND OTP
// ============================================================
async function resendOTP() {
  const username = localStorage.getItem('tempUsername');
  const password = localStorage.getItem('tempPassword');
  const btn = document.querySelector('.btn-secondary');
  const message = document.getElementById('message');

  if (!username || !password) {
    showMessage('Please login again', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Sending...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
      showMessage('✅ OTP resent successfully!', 'success');
      startOtpTimer();
    } else {
      showMessage('❌ ' + data.message, 'error');
    }

  } catch (error) {
    showMessage('❌ Server error. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
  }
}

// ============================================================
// OTP TIMER
// ============================================================
function startOtpTimer() {
  clearInterval(otpTimer);
  otpTimeLeft = 300;
  const badge = document.getElementById('timerBadge');
  badge.style.display = 'flex';

  otpTimer = setInterval(() => {
    otpTimeLeft--;
    const m = String(Math.floor(otpTimeLeft / 60)).padStart(2, '0');
    const s = String(otpTimeLeft % 60).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    
    if (otpTimeLeft <= 0) {
      clearInterval(otpTimer);
      badge.style.display = 'none';
      showMessage('⏰ OTP expired. Please resend.', 'error');
    }
  }, 1000);
}

// ============================================================
// SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
  const message = document.getElementById('message');
  message.textContent = text;
  message.className = 'message ' + type;
}

// ============================================================
// AUTO FOCUS OTP INPUT
// ============================================================
document.getElementById('otp').addEventListener('input', function(e) {
  this.value = this.value.replace(/[^0-9]/g, '');
  if (this.value.length === 6) {
    verifyOTP();
  }
});

// ============================================================
// ENTER KEY SUPPORT
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const otpVisible = document.getElementById('otpSection').style.display;
    if (otpVisible === 'block') {
      const otp = document.getElementById('otp').value.trim();
      if (otp.length === 6) {
        verifyOTP();
      }
    } else {
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  }
});

// ============================================================
// INIT
// ============================================================
updateSteps(1);
</script>
