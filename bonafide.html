<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonafide Certificate - GSSS Shilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Georgia:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --white: #ffffff;
            --text-primary: #0d1b2a;
            --text-secondary: #1a2332;
            --text-muted: #5a6a7e;
            --gold: #c9972b;
            --gold-light: #e8b84b;
            --gold-bg: #fef8ed;
            --border: #d1d5db;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--white);
            border-bottom: 1px solid #e5e7eb;
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .navbar .brand .logo-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .navbar .brand .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        .navbar .brand .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .navbar .brand .name span { color: var(--gold); }
        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--bg);
            color: var(--text-primary);
        }
        .nav-links a.active {
            background: var(--gold-bg);
            color: var(--gold);
        }
        .nav-links a i { margin-right: 6px; }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 10px;
            background: var(--bg);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-primary);
        }

        /* ===== MAIN ===== */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding: 20px 28px;
            background: var(--white);
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header h1 i { color: var(--gold); }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: var(--gold);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid #e5e7eb;
        }
        .btn-outline:hover {
            background: #e5e7eb;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        /* ===== FORM ===== */
        .form-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid #e5e7eb;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .form-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        .form-card-header h3 {
            font-size: 16px;
            font-weight: 700;
        }
        .form-card-header h3 i {
            color: var(--gold);
            margin-right: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        .form-group {
            margin-bottom: 4px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #ef4444;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 151, 43, 0.1);
            background: white;
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-row .form-control {
            flex: 1;
            min-width: 200px;
        }

        /* ===== ALERT ===== */
        .alert-box {
            padding: 14px 18px;
            border-radius: 10px;
            margin: 12px 0;
            font-size: 14px;
        }
        .alert-box.error {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fecaca;
        }
        .alert-box.success {
            background: #ecfdf5;
            color: #10b981;
            border: 1px solid #bbf7d0;
        }
        .alert-box.info {
            background: #eef4ff;
            color: #4a8af4;
            border: 1px solid #bfdbfe;
        }

        /* ================================================================
           CERTIFICATE - PROFESSIONAL (Like Marksheet)
           ================================================================ */
        #certificatePreview {
            display: none;
            margin-top: 30px;
        }

        .certificate-wrapper {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            border: 1px solid #e5e7eb;
            max-width: 900px;
            margin: 0 auto;
        }

        .certificate-wrapper h2 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 20px;
        }
        .certificate-wrapper h2 i {
            color: var(--gold);
        }

        .certificate-actions {
            text-align: center;
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== CERTIFICATE BOX (Professional - Like Marksheet) ===== */
        .certificate-box {
            background: white;
            padding: 30px 35px 20px;
            font-family: 'Georgia', 'Times New Roman', serif;
            border: 3px solid #0d1b2a;
            border-radius: 8px;
            position: relative;
            max-width: 850px;
            margin: 0 auto;
        }

        /* Watermark */
        .certificate-box .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            opacity: 0.06;
            background: url('logo(1).png') center/contain no-repeat;
            filter: grayscale(100%);
            pointer-events: none;
            border-radius: 50%;
        }

        /* Header */
        .certificate-box .school-header {
            text-align: center;
            border-bottom: 3px solid #0d1b2a;
            padding-bottom: 12px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .certificate-box .school-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            padding: 4px;
            background: white;
            margin: 0 auto 4px;
            display: block;
            object-fit: contain;
        }
        .certificate-box .school-name {
            font-family: 'Georgia', serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #0d1b2a;
        }
        .certificate-box .school-tagline {
            font-size: 10px;
            color: #5a6a7e;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .cert-title-box {
            display: inline-block;
            background: #0d1b2a;
            color: #fff;
            padding: 4px 24px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid var(--gold);
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        /* Student Info Table */
        .certificate-box .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 10px;
            border: 2px solid #0d1b2a;
            position: relative;
            z-index: 1;
            font-size: 13px;
        }
        .certificate-box .info-table td {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            vertical-align: middle;
        }
        .certificate-box .info-table .label-cell {
            font-weight: 700;
            background: #fef8ed;
            color: #0d1b2a;
            width: 16%;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .certificate-box .info-table .value-cell {
            font-weight: 500;
            color: #1a2332;
            font-size: 13px;
        }
        .certificate-box .info-table .photo-cell {
            width: 70px;
            text-align: center;
            vertical-align: middle;
            background: #f8fafc;
        }
        .certificate-box .info-table .photo-box {
            width: 58px;
            height: 70px;
            border: 3px solid var(--gold);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            margin: 0 auto;
        }
        .certificate-box .info-table .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .certificate-box .info-table .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #cbd5e1;
        }

        /* Declaration */
        .certificate-box .declaration {
            background: #fef8ed;
            border-left: 4px solid var(--gold);
            border-right: 4px solid var(--gold);
            padding: 8px 14px;
            margin: 12px 0 14px;
            border-radius: 4px;
            font-size: 12px;
            color: #1a2332;
            font-style: italic;
            text-align: center;
            position: relative;
            z-index: 1;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .declaration i {
            color: #10b981;
            margin-right: 6px;
        }
        .certificate-box .declaration strong {
            color: #0d1b2a;
        }

        /* Marks Table */
        .certificate-box .marks-heading {
            font-size: 12px;
            font-weight: 700;
            margin: 10px 0 6px;
            padding: 4px 12px;
            background: #fef8ed;
            border-left: 4px solid var(--gold);
            letter-spacing: 1px;
            font-family: 'Inter', sans-serif;
            position: relative;
            z-index: 1;
        }
        .certificate-box .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 8px;
            border: 2px solid #0d1b2a;
            position: relative;
            z-index: 1;
            font-size: 11px;
        }
        .certificate-box .marks-table th {
            background: #0d1b2a;
            color: #fff;
            padding: 5px 8px;
            border: 1px solid #0d1b2a;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .marks-table td {
            padding: 5px 8px;
            border: 1px solid #d1d5db;
            text-align: center;
            font-size: 11px;
        }
        .certificate-box .marks-table .highlight {
            font-weight: 700;
            color: var(--gold);
        }

        /* QR & Verification */
        .certificate-box .verify-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 16px 0 12px;
            padding: 10px 16px;
            border: 2px solid var(--gold);
            background: #fef8ed;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }
        .certificate-box .verify-section .qr-box {
            width: 70px;
            height: 70px;
            border: 2px solid #0d1b2a;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .certificate-box .verify-section .qr-box img {
            width: 65px;
            height: 65px;
        }
        .certificate-box .verify-section .verify-text {
            flex: 1;
            font-size: 10px;
            color: #0d1b2a;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .verify-section .verify-text strong {
            display: block;
            font-size: 12px;
            margin-bottom: 2px;
            color: var(--gold);
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .verify-section .verify-text .code {
            font-size: 13px;
            font-weight: 700;
            color: #0d1b2a;
            letter-spacing: 1.5px;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .verify-section .verify-text p {
            font-size: 9px;
            color: #5a6a7e;
            margin: 2px 0;
        }

        /* Signature */
        .certificate-box .signature-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            padding-top: 10px;
            position: relative;
            z-index: 1;
        }
        .certificate-box .signature-box {
            text-align: center;
            font-size: 11px;
            min-width: 160px;
        }
        .certificate-box .signature-box .line {
            width: 140px;
            height: 1px;
            border-top: 1px dashed #94a3b8;
            margin: 14px auto 3px;
        }
        .certificate-box .signature-box .sig-name {
            font-weight: 700;
            font-size: 13px;
            font-family: 'Georgia', serif;
        }
        .certificate-box .signature-box .sig-title {
            font-size: 10px;
            color: #5a6a7e;
            font-family: 'Inter', sans-serif;
        }

        /* Footer */
        .certificate-box .footer-line {
            text-align: center;
            font-size: 7px;
            color: rgba(13, 27, 42, 0.15);
            letter-spacing: 2px;
            padding: 6px 0 2px;
            border-top: 1px dashed #d1d5db;
            border-bottom: 1px dashed #d1d5db;
            text-transform: uppercase;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }
        .certificate-box .page-footer {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #94a3b8;
            padding-top: 6px;
            font-family: 'Inter', sans-serif;
            position: relative;
            z-index: 1;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            min-width: 250px;
            animation: slideIn 0.3s ease;
        }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-warning { background: #f59e0b; }
        .toast-info { background: #0d1b2a; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 68px;
                left: 0;
                right: 0;
                background: var(--white);
                padding: 16px;
                border-bottom: 1px solid #e5e7eb;
            }
            .nav-links.open { display: flex; }
            .hamburger { display: block; }
            .main-container { padding: 16px; }
            .page-header { padding: 16px; flex-direction: column; align-items: stretch; }
            .form-grid { grid-template-columns: 1fr; }
            .certificate-box { padding: 16px; }
            .certificate-box .info-table { font-size: 11px; }
            .certificate-box .info-table .label-cell { font-size: 9px; width: 22%; }
            .certificate-box .info-table .photo-cell { width: 50px; }
            .certificate-box .info-table .photo-box { width: 44px; height: 56px; }
            .certificate-box .verify-section { flex-direction: column; text-align: center; }
            .certificate-box .signature-area { justify-content: center; }
            .certificate-box .school-name { font-size: 16px; }
            .certificate-wrapper { padding: 16px; }
        }

        @media print {
            body { background: white; }
            .navbar, .page-header, .form-card, .certificate-actions, .btn, .toast-container { display: none !important; }
            #certificatePreview { display: block !important; margin-top: 0; }
            .certificate-wrapper { box-shadow: none; padding: 0; border: none; }
            .certificate-box { border: 2px solid #000; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="#" class="brand">
            <div class="logo-placeholder">
                <img src="logo(1).png" alt="Logo">
            </div>
            <div class="name">GSSS<span> SHILLA</span></div>
        </a>
        <ul class="nav-links" id="navLinks">
            <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="admin-result.html"><i class="fas fa-graduation-cap"></i> Results</a></li>
            <li><a href="bonafide.html" class="active"><i class="fas fa-certificate"></i> Bonafide</a></li>
        </ul>
        <div class="nav-right">
            <div class="admin-badge">
                <span class="avatar" id="adminAvatar">🛡️</span>
                <span id="adminName">Admin</span>
                <span class="online-dot"></span>
            </div>
            <button class="hamburger" onclick="toggleNav()"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="main-container">

        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-certificate"></i> Bonafide Certificate</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="generateCertificate()"><i class="fas fa-file-pdf"></i> Generate Certificate</button>
                <button class="btn btn-outline" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
            </div>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <div class="form-card-header">
                <h3><i class="fas fa-user-edit"></i> Student Details</h3>
                <span style="font-size:12px;color:var(--text-muted);">Fields with <span style="color:#ef4444;">*</span> required</span>
            </div>

            <!-- Search -->
            <div class="search-row" style="margin-bottom:16px;">
                <input type="text" id="searchStudentId" class="form-control" placeholder="Enter Student ID to fetch (e.g., HP10A001)">
                <button class="btn btn-primary" onclick="fetchStudent()"><i class="fas fa-user-check"></i> Fetch</button>
            </div>
            <div id="fetchStatus" class="alert-box info"><i class="fas fa-info-circle"></i> Enter Student ID and click Fetch</div>

            <!-- Form Grid -->
            <div class="form-grid" style="margin-top:16px;">
                <div class="form-group">
                    <label>Student ID <span class="required">*</span></label>
                    <input type="text" id="studentId" class="form-control" placeholder="e.g., HP10A001">
                </div>
                <div class="form-group">
                    <label>APAAR ID</label>
                    <input type="text" id="apaarId" class="form-control" placeholder="11-digit APAAR ID">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Student Name <span class="required">*</span></label>
                    <input type="text" id="studentName" class="form-control" placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Father's Name <span class="required">*</span></label>
                    <input type="text" id="fatherName" class="form-control" placeholder="Father's Name">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Mother's Name</label>
                    <input type="text" id="motherName" class="form-control" placeholder="Mother's Name">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" class="form-control">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Class <span class="required">*</span></label>
                    <select id="className" class="form-control">
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10" selected>Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section" class="form-control" placeholder="A, B, C">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Admission Number <span class="required">*</span></label>
                    <input type="text" id="admissionNo" class="form-control" placeholder="e.g., 2024-010">
                </div>
                <div class="form-group">
                    <label>Academic Session</label>
                    <select id="session" class="form-control">
                        <option value="2025-26">2025-26</option>
                        <option value="2024-25">2024-25</option>
                        <option value="2023-24">2023-24</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Exam Roll No</label>
                    <input type="text" id="examRollNo" class="form-control" placeholder="Roll Number">
                </div>
                <div class="form-group">
                    <label>Purpose <span class="required">*</span></label>
                    <select id="purpose" class="form-control">
                        <option value="Passport Application">Passport Application</option>
                        <option value="Educational Loan">Educational Loan</option>
                        <option value="Scholarship">Scholarship</option>
                        <option value="Visa Processing">Visa Processing</option>
                        <option value="Transfer Certificate">Transfer Certificate</option>
                        <option value="Police Verification">Police Verification</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control" placeholder="Residential Address">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control" placeholder="Contact Number">
                </div>
            </div>

            <div class="form-group">
                <label>Student Photo</label>
                <input type="file" id="photo" class="form-control" accept="image/*">
                <div id="photoPreview" style="margin-top:8px;"></div>
            </div>
        </div>

        <!-- ===== CERTIFICATE PREVIEW ===== -->
        <div id="certificatePreview">
            <div class="certificate-wrapper">
                <h2><i class="fas fa-certificate"></i> Bonafide Certificate</h2>
                <div id="certificateContent"></div>
                <div class="certificate-actions">
                    <button class="btn btn-success" onclick="downloadPDF()"><i class="fas fa-download"></i> Download PDF</button>
                    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ================================================================
        // CONFIG
        // ================================================================
        const API_BASE = 'https://gsssshilla.onrender.com/api';
        let currentCertificateData = null;

        // ================================================================
        // AUTH
        // ================================================================
        function getAuthHeaders() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                showToast('Please login first', 'error');
                window.location.href = 'login.html';
                return null;
            }
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        // ================================================================
        // TOAST
        // ================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ================================================================
        // NAV
        // ================================================================
        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('open');
        }

        // ================================================================
        // PHOTO PREVIEW
        // ================================================================
        document.getElementById('photo').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('photoPreview');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.innerHTML =
                        `<img src="${event.target.result}" style="width:80px;height:100px;object-fit:cover;border:3px solid #c9972b;border-radius:6px;">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        });

        // ================================================================
        // FETCH STUDENT
        // ================================================================
        async function fetchStudent() {
            const studentId = document.getElementById('searchStudentId').value.trim();
            if (!studentId) {
                showToast('Please enter Student ID', 'warning');
                return;
            }

            const status = document.getElementById('fetchStatus');
            status.className = 'alert-box info';
            status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching student...';

            try {
                const response = await fetch(`${API_BASE}/admin/results/students/${encodeURIComponent(studentId)}`, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Student not found');
                }

                const data = await response.json();
                const student = data.data?.student || data.data;

                if (student) {
                    document.getElementById('studentId').value = student.student_id || studentId;
                    document.getElementById('apaarId').value = student.apaar_id || '';
                    document.getElementById('studentName').value = student.name || '';
                    document.getElementById('fatherName').value = student.father_name || '';
                    document.getElementById('motherName').value = student.mother_name || '';
                    document.getElementById('dob').value = student.dob || '';
                    document.getElementById('className').value = student.class || '10';
                    document.getElementById('section').value = student.section || '';
                    document.getElementById('admissionNo').value = student.admission_no || student.admission || student
                    .student_id;
                    document.getElementById('session').value = student.session || '2025-26';
                    document.getElementById('examRollNo').value = student.exam_roll_no || '';

                    status.className = 'alert-box success';
                    status.innerHTML = `<i class="fas fa-check-circle"></i> Student found: ${student.name}`;
                    showToast('Student loaded successfully', 'success');
                } else {
                    throw new Error('No data found');
                }
            } catch (error) {
                status.className = 'alert-box error';
                status.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                showToast(error.message, 'error');
            }
        }

        // ================================================================
        // COMPRESS IMAGE
        // ================================================================
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width,
                            height = img.height;
                        const maxWidth = 200,
                            maxHeight = 250;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width;
                                width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height;
                                height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ================================================================
        // GENERATE CERTIFICATE
        // ================================================================
        async function generateCertificate() {
            const data = {
                studentId: document.getElementById('studentId').value.trim(),
                apaarId: document.getElementById('apaarId').value.trim(),
                studentName: document.getElementById('studentName').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                motherName: document.getElementById('motherName').value.trim(),
                dob: document.getElementById('dob').value,
                className: document.getElementById('className').value,
                section: document.getElementById('section').value.trim(),
                admissionNo: document.getElementById('admissionNo').value.trim(),
                session: document.getElementById('session').value,
                examRollNo: document.getElementById('examRollNo').value.trim(),
                purpose: document.getElementById('purpose').value,
                address: document.getElementById('address').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            // Validate
            if (!data.studentId) { showToast('Student ID is required', 'error'); return; }
            if (!data.studentName) { showToast('Student Name is required', 'error'); return; }
            if (!data.fatherName) { showToast('Father\'s Name is required', 'error'); return; }
            if (!data.admissionNo) { showToast('Admission Number is required', 'error'); return; }

            // Handle photo
            const photoInput = document.getElementById('photo');
            if (photoInput.files && photoInput.files[0]) {
                const file = photoInput.files[0];
                if (file.size > 1 * 1024 * 1024) {
                    showToast('Photo must be under 1MB', 'warning');
                    return;
                }
                data.photo = await compressImage(file);
            }

            try {
                showToast('Generating certificate...', 'info');

                const response = await fetch(`${API_BASE}/bonafide/generate`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to generate');
                }

                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || 'Generation failed');
                }

                currentCertificateData = result.data;
                renderCertificate(result.data);
                document.getElementById('certificatePreview').style.display = 'block';
                showToast('Certificate generated successfully!', 'success');

                // Scroll to preview
                document.getElementById('certificatePreview').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // ================================================================
        // RENDER CERTIFICATE (Professional - Like Marksheet)
        // ================================================================
        function renderCertificate(data) {
            const c = data.certificate || data;
            const qrCode = c.qrCode || data.qrCode || '';
            const verificationCode = c.verificationCode || data.verificationCode || 'BC-XXXX-XXXX-XXXX';
            const issueDate = c.issueDate ? new Date(c.issueDate).toLocaleDateString('en-IN', { day: '2-digit', month: 'short',
                    year: 'numeric' }) : new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short',
                    year: 'numeric' });

            const studentPhoto = c.photo || '';

            const html = `
                <div class="certificate-box" id="certToPrint">
                    <!-- Watermark -->
                    <div class="watermark"></div>

                    <!-- Header -->
                    <div class="school-header">
                        <img src="logo(1).png" class="school-logo" onerror="this.style.display='none'">
                        <div class="school-name">Govt. Sr. Sec. School Shilla</div>
                        <div class="school-tagline">Shilla • Nerwa • District Shimla • Himachal Pradesh - 171210</div>
                        <div class="cert-title-box">Bonafide Certificate</div>
                    </div>

                    <!-- Student Info Table -->
                    <table class="info-table">
                        <tr>
                            <td class="label-cell">Student ID</td>
                            <td class="value-cell"><strong>${c.studentId}</strong></td>
                            <td class="label-cell">APAAR ID</td>
                            <td class="value-cell">${c.apaarId || '-'}</td>
                            <td class="photo-cell" rowspan="5">
                                <div class="photo-box">
                                    ${studentPhoto ? `<img src="${studentPhoto}" onerror="this.parentElement.innerHTML='<div class=&quot;photo-placeholder&quot;><i class=&quot;fas fa-user&quot;></i></div>'">` : `<div class="photo-placeholder"><i class="fas fa-user"></i></div>`}
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="label-cell">Student Name</td>
                            <td class="value-cell" style="font-weight:700;font-size:14px;">${c.studentName}</td>
                            <td class="label-cell">Father's Name</td>
                            <td class="value-cell">${c.fatherName}</td>
                        </tr>
                        <tr>
                            <td class="label-cell">Mother's Name</td>
                            <td class="value-cell">${c.motherName || '-'}</td>
                            <td class="label-cell">Date of Birth</td>
                            <td class="value-cell">${c.dob ? new Date(c.dob).toLocaleDateString('en-IN', {day:'2-digit', month:'2-digit', year:'numeric'}) : '-'}</td>
                        </tr>
                        <tr>
                            <td class="label-cell">Academic Session</td>
                            <td class="value-cell">${c.session || '2025-26'}</td>
                            <td class="label-cell">Class</td>
                            <td class="value-cell">${c.className}${c.section ? ' - ' + c.section : ''}</td>
                        </tr>
                        <tr>
                            <td class="label-cell">Admission No</td>
                            <td class="value-cell">${c.admissionNo}</td>
                            <td class="label-cell">Exam Roll No</td>
                            <td class="value-cell">${c.examRollNo || '-'}</td>
                        </tr>
                    </table>

                    <!-- Declaration -->
                    <div class="declaration">
                        <i class="fas fa-check-circle"></i> 
                        This is to certify that <strong>${c.studentName}</strong> (Student ID: ${c.studentId}) 
                        is a bonafide student of our institution and has successfully completed the 
                        <strong>${c.session || '2025-26'}</strong> academic session.
                    </div>

                    <!-- Purpose -->
                    <div style="text-align:center;margin:6px 0;font-size:13px;font-family:'Inter',sans-serif;position:relative;z-index:1;">
                        Certificate issued for: <strong style="color:var(--gold);">${c.purpose || 'General'}</strong>
                    </div>

                    <!-- QR & Verification -->
                    <div class="verify-section">
                        <div class="qr-box">
                            ${qrCode ? `<img src="${qrCode}" alt="QR Code">` : '<div style="font-size:8px;color:#94a3b8;text-align:center;">QR N/A</div>'}
                        </div>
                        <div class="verify-text">
                            <strong><i class="fas fa-shield-alt"></i> Scan to Verify</strong>
                            <span class="code">${verificationCode}</span>
                            <p>Scan this QR code to verify the authenticity of this certificate.</p>
                            <p style="font-size:8px;color:#94a3b8;">Verification ID: ${c.studentId}-${Date.now().toString().substring(8)}</p>
                        </div>
                    </div>

                    <!-- Signature -->
                    <div class="signature-area">
                        <div class="signature-box">
                            <div class="line"></div>
                            <div class="sig-name">(Dr. S.K. Mehta)</div>
                            <div class="sig-title">Principal</div>
                            <div style="font-size:8px;color:#94a3b8;">Govt. Sr. Sec. School Shilla</div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="footer-line">GSSS SHILLA OFFICIAL DOCUMENT &nbsp;|&nbsp; GSSS SHILLA OFFICIAL DOCUMENT</div>
                    <div class="page-footer">
                        <span><strong>Issue Date:</strong> ${issueDate}</span>
                        <span><strong>Issued by:</strong> Administrator</span>
                        <span><strong>Page 1 of 1</strong></span>
                    </div>
                </div>
            `;

            document.getElementById('certificateContent').innerHTML = html;
        }

        // ================================================================
        // DOWNLOAD PDF
        // ================================================================
        function downloadPDF() {
            const element = document.getElementById('certToPrint');
            if (!element) {
                showToast('Please generate certificate first', 'warning');
                return;
            }

            const opt = {
                margin: [0.4, 0.4, 0.4, 0.4],
                filename: `Bonafide_Certificate_${currentCertificateData?.verificationCode || 'cert'}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    letterRendering: true,
                    width: 850
                },
                jsPDF: {
                    unit: 'in',
                    format: 'a4',
                    orientation: 'portrait'
                }
            };

            showToast('Generating PDF...', 'info');
            html2pdf().set(opt).from(element).save()
                .then(() => {
                    showToast('PDF downloaded successfully!', 'success');
                })
                .catch((error) => {
                    showToast('Error generating PDF: ' + error.message, 'error');
                });
        }

        // ================================================================
        // RESET FORM
        // ================================================================
        function resetForm() {
            document.getElementById('searchStudentId').value = '';
            document.getElementById('studentId').value = '';
            document.getElementById('apaarId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('fatherName').value = '';
            document.getElementById('motherName').value = '';
            document.getElementById('dob').value = '';
            document.getElementById('className').value = '10';
            document.getElementById('section').value = '';
            document.getElementById('admissionNo').value = '';
            document.getElementById('session').value = '2025-26';
            document.getElementById('examRollNo').value = '';
            document.getElementById('purpose').value = 'Passport Application';
            document.getElementById('address').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('photo').value = '';
            document.getElementById('photoPreview').innerHTML = '';
            document.getElementById('fetchStatus').className = 'alert-box info';
            document.getElementById('fetchStatus').innerHTML =
                '<i class="fas fa-info-circle"></i> Enter Student ID and click Fetch';
            document.getElementById('certificatePreview').style.display = 'none';
            currentCertificateData = null;
        }
    </script>

</body>
</html>
